function reportPL(from, to, upto){
  const revs = revenueAccounts();
  const exps = expenseAccounts();
  const cogs = exps.filter(a => a.subtype === 'cogs');
  const opex = exps.filter(a => a.subtype === 'opex');
  const other = exps.filter(a => a.subtype === 'other_expense');

  const sum = arr => round2(arr.reduce((s,a) => s + accountBalance(a.id, upto), 0));
  const totalRev = sum(revs);
  const totalCogs = sum(cogs);
  const grossProfit = round2(totalRev - totalCogs);
  const totalOpex = sum(opex);
  const totalOther = sum(other);
  const netProfit = round2(grossProfit - totalOpex - totalOther);

  const row = (a) => {
    const b = accountBalance(a.id, upto);
    if (b === 0) return '';
    return `<div class="rep-row"><span class="lbl">${esc(a.code)} &nbsp; ${esc(a.name)}</span><span>${plainNum(b)}</span></div>`;
  };

  return `${reportHeader('Profit & Loss Statement' + (from || to ? ` — ${from ? fmtDate(from) : 'Start'} to ${to ? fmtDate(to) : 'Today'}` : ' — All Periods'))}
  <div class="rep-section"><h4>Revenue</h4>
    ${revs.map(row).join('') || '<div class="rep-row"><span class="lbl text-muted">No revenue recorded</span><span>—</span></div>'}
    <div class="rep-row total"><span class="lbl">TOTAL REVENUE</span><span>${plainNum(totalRev)}</span></div>
  </div>
  <div class="rep-section"><h4>Cost of Sales</h4>
    ${cogs.map(row).join('') || '<div class="rep-row"><span class="lbl text-muted">None</span><span>—</span></div>'}
    <div class="rep-row sub"><span class="lbl">Total Cost of Sales</span><span>${plainNum(totalCogs)}</span></div>
    <div class="rep-row total"><span class="lbl">GROSS PROFIT</span><span class="${grossProfit >= 0 ? 'pos' : 'neg'}">${plainNum(grossProfit)}</span></div>
  </div>
  <div class="rep-section"><h4>Operating Expenses</h4>
    ${opex.map(row).join('') || '<div class="rep-row"><span class="lbl text-muted">None</span><span>—</span></div>'}
    <div class="rep-row sub"><span class="lbl">Total Operating Expenses</span><span>${plainNum(totalOpex)}</span></div>
  </div>
  ${totalOther ? `<div class="rep-section"><h4>Other Expenses</h4>
    ${other.map(row).join('')}
    <div class="rep-row sub"><span class="lbl">Total Other Expenses</span><span>${plainNum(totalOther)}</span></div>
  </div>` : ''}
  <div class="rep-section">
    <div class="rep-row total"><span class="lbl">NET ${netProfit >= 0 ? 'PROFIT' : 'LOSS'}</span><span class="${netProfit >= 0 ? 'pos' : 'neg'}">${plainNum(netProfit)}</span></div>
    <div class="rep-row"><span class="lbl">Gross Margin</span><span>${totalRev ? ((grossProfit / totalRev) * 100).toFixed(1) : '0.0'}%</span></div>
    <div class="rep-row"><span class="lbl">Net Margin</span><span>${totalRev ? ((netProfit / totalRev) * 100).toFixed(1) : '0.0'}%</span></div>
  </div>`;
}

function reportBS(upto){
  const assets = toArr(S.accounts).filter(a => a.type === 'asset');
  const liabilities = toArr(S.accounts).filter(a => a.type === 'liability');
  const equity = toArr(S.accounts).filter(a => a.type === 'equity');

  const currentAssets = assets.filter(a => a.subtype === 'current_asset');
  const fixedAssets = assets.filter(a => a.subtype === 'fixed_asset');
  const currentLiab = liabilities.filter(a => a.subtype === 'current_liability');
  const longLiab = liabilities.filter(a => a.subtype === 'long_term_liability');

  const sum = arr => round2(arr.reduce((s,a) => s + accountBalance(a.id, upto), 0));
  const tCA = sum(currentAssets), tFA = sum(fixedAssets);
  const tA = round2(tCA + tFA);
  const tCL = sum(currentLiab), tLL = sum(longLiab);
  const tL = round2(tCL + tLL);
  const tE = sum(equity);
  const profit = netProfit(upto);
  const totalEquity = round2(tE + profit);

  const row = a => {
    const b = accountBalance(a.id, upto);
    if (b === 0 && !a.flags) return '';
    return `<div class="rep-row"><span class="lbl">${esc(a.code)} &nbsp; ${esc(a.name)}</span><span>${plainNum(b)}</span></div>`;
  };

  return `${reportHeader('Statement of Financial Position (Balance Sheet) — as at ' + fmtDate(upto || todayISO()))}
  <div class="rep-section"><h4>Assets</h4>
    <div class="rep-row sub"><span class="lbl">Current Assets</span><span></span></div>
    ${currentAssets.map(row).join('')}
    <div class="rep-row sub"><span class="lbl">Total Current Assets</span><span>${plainNum(tCA)}</span></div>
    <div class="rep-row sub"><span class="lbl">Fixed Assets</span><span></span></div>
    ${fixedAssets.map(row).join('')}
    <div class="rep-row sub"><span class="lbl">Total Fixed Assets</span><span>${plainNum(tFA)}</span></div>
    <div class="rep-row total"><span class="lbl">TOTAL ASSETS</span><span>${plainNum(tA)}</span></div>
  </div>
  <div class="rep-section"><h4>Liabilities</h4>
    ${currentLiab.map(row).join('')}
    <div class="rep-row sub"><span class="lbl">Total Current Liabilities</span><span>${plainNum(tCL)}</span></div>
    ${longLiab.map(row).join('')}
    <div class="rep-row sub"><span class="lbl">Total Long-Term Liabilities</span><span>${plainNum(tLL)}</span></div>
    <div class="rep-row total"><span class="lbl">TOTAL LIABILITIES</span><span>${plainNum(tL)}</span></div>
  </div>
  <div class="rep-section"><h4>Equity</h4>
    ${equity.map(row).join('')}
    <div class="rep-row"><span class="lbl">Current Period Result</span><span class="${profit >= 0 ? 'pos' : 'neg'}">${plainNum(profit)}</span></div>
    <div class="rep-row total"><span class="lbl">TOTAL EQUITY</span><span>${plainNum(totalEquity)}</span></div>
  </div>
  <div class="rep-section">
    <div class="rep-row total"><span class="lbl">LIABILITIES + EQUITY</span><span>${plainNum(tL + totalEquity)}</span></div>
    <div class="rep-row"><span class="lbl">Check (Assets − L&E)</span><span class="${Math.abs(tA - (tL + totalEquity)) < 1 ? 'pos' : 'neg'}">${plainNum(tA - (tL + totalEquity))}</span></div>
  </div>`;
}

function reportTB(upto){
  const accs = sortBy(toArr(S.accounts), 'code');
  let td = 0, tc = 0;
  const rows = accs.map(a => {
    const bal = accountBalance(a.id, upto);
    const dn = isDebitNormal(a);
    const debit = (dn && bal > 0) || (!dn && bal < 0) ? Math.abs(bal) : 0;
    const credit = (dn && bal < 0) || (!dn && bal > 0) ? Math.abs(bal) : 0;
    td += debit; tc += credit;
    if (bal === 0) return '';
    return `<div class="rep-row"><span class="lbl">${esc(a.code)} &nbsp; ${esc(a.name)}</span>
      <span style="display:flex;gap:2.5rem"><span style="min-width:120px;text-align:right">${debit ? plainNum(debit) : '—'}</span>
      <span style="min-width:120px;text-align:right">${credit ? plainNum(credit) : '—'}</span></span></div>`;
  }).join('');

  return `${reportHeader('Trial Balance — as at ' + fmtDate(upto || todayISO()))}
  <div class="rep-row" style="font-weight:800;border-bottom:2px solid var(--line-2);padding-bottom:.5rem">
    <span class="lbl">Account</span>
    <span style="display:flex;gap:2.5rem"><span style="min-width:120px;text-align:right">DEBIT</span><span style="min-width:120px;text-align:right">CREDIT</span></span>
  </div>
  ${rows || '<div class="empty">No balances to report.</div>'}
  <div class="rep-row total"><span class="lbl">TOTALS</span>
    <span style="display:flex;gap:2.5rem"><span style="min-width:120px;text-align:right">${plainNum(td)}</span><span style="min-width:120px;text-align:right">${plainNum(tc)}</span></span></div>
  <div class="rep-row"><span class="lbl">Difference</span><span class="${Math.abs(td - tc) < 1 ? 'pos' : 'neg'}">${plainNum(td - tc)}</span></div>`;
}

function reportCF(from, to){
  const cashAccs = toArr(S.accounts).filter(a => a.flags && (a.flags.cash || a.flags.mpesa || a.flags.bank));
  const lines = allJournalLines().filter(l => cashAccs.some(a => a.id === l.accountId));
  const filtered = lines.filter(l => (!from || l.date >= from) && (!to || l.date <= to));

  const inflowBySource = {}, outflowBySource = {};
  filtered.forEach(l => {
    const src = cap(l.source || 'Other');
    if (l.debit > 0) inflowBySource[src] = (inflowBySource[src] || 0) + l.debit;
    if (l.credit > 0) outflowBySource[src] = (outflowBySource[src] || 0) + l.credit;
  });

  const tIn = round2(Object.values(inflowBySource).reduce((s,v) => s + v, 0));
  const tOut = round2(Object.values(outflowBySource).reduce((s,v) => s + v, 0));
  const opening = round2(cashAccs.reduce((s,a) => s + num(a.openingBalance), 0));

  return `${reportHeader('Cash Flow Statement' + (from || to ? ` — ${from ? fmtDate(from) : 'Start'} to ${to ? fmtDate(to) : 'Today'}` : ' — All Periods'))}
  <div class="rep-section"><h4>Cash Inflows</h4>
    ${Object.entries(inflowBySource).sort((a,b) => b[1] - a[1]).map(([k,v]) =>
      `<div class="rep-row"><span class="lbl">${esc(k)}</span><span class="pos">${plainNum(v)}</span></div>`).join('') || '<div class="rep-row"><span class="lbl text-muted">None</span><span>—</span></div>'}
    <div class="rep-row sub"><span class="lbl">Total Inflows</span><span class="pos">${plainNum(tIn)}</span></div>
  </div>
  <div class="rep-section"><h4>Cash Outflows</h4>
    ${Object.entries(outflowBySource).sort((a,b) => b[1] - a[1]).map(([k,v]) =>
      `<div class="rep-row"><span class="lbl">${esc(k)}</span><span class="neg">${plainNum(v)}</span></div>`).join('') || '<div class="rep-row"><span class="lbl text-muted">None</span><span>—</span></div>'}
    <div class="rep-row sub"><span class="lbl">Total Outflows</span><span class="neg">${plainNum(tOut)}</span></div>
  </div>
  <div class="rep-section">
    <div class="rep-row"><span class="lbl">Opening Cash Balance</span><span>${plainNum(opening)}</span></div>
    <div class="rep-row"><span class="lbl">Net Cash Movement</span><span class="${(tIn - tOut) >= 0 ? 'pos' : 'neg'}">${plainNum(tIn - tOut)}</span></div>
    <div class="rep-row total"><span class="lbl">CLOSING CASH BALANCE</span><span>${plainNum(opening + tIn - tOut)}</span></div>
    <div class="rep-row text-xs"><span class="lbl">Cross-check — Live Account Balances</span><span>${plainNum(cashAccs.reduce((s,a) => s + accountBalance(a.id), 0))}</span></div>
  </div>`;
}

function reportGLSummary(from, to){
  const accs = sortBy(toArr(S.accounts), 'code');

  lines.forEach(l => {
    if (!map[l.accountId]) map[l.accountId] = { d:0, c:0, n:0 };
    map[l.accountId].d += l.debit;

    map[l.accountId].n++;

  return `${reportHeader('General Ledger Summary' + (from || to ? ` — ${from ? fmtDate(from) : 'Start'} to ${to ? fmtDate(to) : 'Today'}` : ' — All Periods'))}

    <thead><tr><th>Code</th><th>Account</th><th>Type</th><th class="num">Entries</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>

      ${accs.filter(a => map[a.id]).map(a => {

    </tbody>
  </table></div>`;
}

   --------------------------------------------------------------------------- */
function viewProfitability(){
  // Division profitability
  const divMap = {};
  DIVISIONS.forEach(d => divMap[d] = { rev:0, cost:0, count:0 });
  toArr(S.invoices).filter(i => i.status !== 'cancelled' && i.status !== 'draft').forEach(i => {
    const d = i.division || 'General';
    if (!divMap[d]) divMap[d] = { rev:0, cost:0, count:0 };
    divMap[d].rev += num(i.total); divMap[d].count++;
  });
  toArr(S.expenses).forEach(e => {
    const d = e.division || 'General';
    if (!divMap[d]) divMap[d] = { rev:0, cost:0, count:0 };
    divMap[d].cost += num(e.amount);
  });

  const divRows = Object.entries(divMap)
    .filter(([,v]) => v.rev !== 0 || v.cost !== 0)
    .sort((a,b) => (b[1].rev - b[1].cost) - (a[1].rev - a[1].cost));

  // Project profitability
  const projRows = toArr(S.projects).map(p => {
    const rev = projectRevenue(p.id) || num(p.quotedValue);
    const cost = projectCost(p.id);
    return { p, rev, cost, profit: round2(rev - cost), margin: rev > 0 ? ((rev - cost) / rev * 100) : 0 };
  }).filter(r => r.rev > 0 || r.cost > 0).sort((a,b) => b.profit - a.profit);

  // Customer profitability
  const custMap = {};
  toArr(S.invoices).filter(i => i.status !== 'cancelled' && i.status !== 'draft').forEach(i => {
    const k = i.customerName || 'Unknown';
    custMap[k] = (custMap[k] || 0) + num(i.total);
  });
  const custRows = Object.entries(custMap).sort((a,b) => b[1] - a[1]).slice(0, 12);

  return `
  <div class="grid g3 mb2">
    <div class="kpi accent"><div class="k-label">Total Revenue</div><div class="k-value sm">${money(totalRevenue(), 0)}</div></div>
    <div class="kpi danger"><div class="k-label">Total Costs</div><div class="k-value sm">${money(totalExpenses(), 0)}</div></div>
    <div class="kpi ${netProfit() >= 0 ? 'ok' : 'danger'}"><div class="k-label">Net Profit</div><div class="k-value sm">${money(netProfit(), 0)}</div><div class="k-foot">${totalRevenue() > 0 ? ((netProfit() / totalRevenue()) * 100).toFixed(1) : '0.0'}% margin</div></div>
  </div>

  <div class="card mb2">
    <div class="card-head"><h3><i class="fa-solid fa-layer-group"></i> Business Division Profitability</h3></div>
    ${divRows.length ? `
    <div class="table-wrap"><table>
      <thead><tr><th>Division</th><th class="num">Revenue</th><th class="num">Costs</th><th class="num">Profit</th><th class="num">Margin</th><th>Share</th></tr></thead>
      <tbody>
        ${divRows.map(([name, v]) => {
          const profit = round2(v.rev - v.cost);
          const margin = v.rev > 0 ? ((profit / v.rev) * 100) : 0;
          const share = totalRevenue() > 0 ? (v.rev / totalRevenue() * 100) : 0;
          return `<tr>
            <td><strong>${esc(name)}</strong></td>
            <td class="num">${plainNum(v.rev)}</td>
            <td class="num">${plainNum(v.cost)}</td>
            <td class="num ${profit >= 0 ? 'pos' : 'neg'}"><strong>${plainNum(profit)}</strong></td>
            <td class="num">${margin.toFixed(1)}%</td>
            <td style="min-width:110px"><div class="mini-bar-track" style="height:6px"><div class="mini-bar-fill" style="width:${Math.max(2, share)}%"></div></div></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>` : '<div class="empty"><i class="fa-solid fa-chart-pie"></i>No divisional data yet. Assign a division to your invoices and expenses.</div>'}
  </div>

  <div class="card mb2">
    <div class="card-head"><h3><i class="fa-solid fa-diagram-project"></i> Project Profitability</h3></div>
    ${projRows.length ? `
    <div class="table-wrap"><table>
      <thead><tr><th>Project</th><th>Customer</th><th class="num">Revenue</th><th class="num">Cost</th><th class="num">Profit</th><th class="num">Margin</th><th>Status</th></tr></thead>
      <tbody>${projRows.map(r => `
        <tr>
          <td><strong>${esc(r.p.name)}</strong><br><span class="text-xs text-muted">${esc(r.p.code || '')}</span></td>
          <td>${esc((S.customers[r.p.customerId] || {}).name || '—')}</td>
          <td class="num">${plainNum(r.rev)}</td>
          <td class="num">${plainNum(r.cost)}</td>
          <td class="num ${r.profit >= 0 ? 'pos' : 'neg'}"><strong>${plainNum(r.profit)}</strong></td>
          <td class="num">${r.margin.toFixed(1)}%</td>
          <td>${statusBadge(r.p.status)}</td>
        </tr>`).join('')}</tbody>
    </table></div>` : '<div class="empty"><i class="fa-solid fa-diagram-project"></i>No project data yet.</div>'}
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-crown"></i> Top Customers by Revenue</h3></div>
    ${custRows.length ? `<div class="mini-bars">${(() => {
      const max = Math.max(...custRows.map(c => c[1]), 1);
      return custRows.map(([n,v]) => `
      <div class="mini-bar-row">
        <div class="mini-bar-top"><span>${esc(n)}</span><strong>${money(v, 0)}</strong></div>
        <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${Math.max(2,(v/max)*100)}%"></div></div>
      </div>`).join('');
    })()}</div>` : '<div class="empty"><i class="fa-solid fa-users"></i>No customer revenue recorded yet.</div>'}
  </div>`;
}

function viewNetWorth(){
  const assets = toArr(S.accounts).filter(a => a.type === 'asset');
  const liabilities = toArr(S.accounts).filter(a => a.type === 'liability');
  const equity = toArr(S.accounts).filter(a => a.type === 'equity');

  const currentAssets = assets.filter(a => a.subtype === 'current_asset');
  const fixedAssets = assets.filter(a => a.subtype === 'fixed_asset');
  const currentLiab = liabilities.filter(a => a.subtype === 'current_liability');
  const longLiab = liabilities.filter(a => a.subtype === 'long_term_liability');

  const sum = arr => round2(arr.reduce((s,a) => s + accountBalance(a.id), 0));
  const tCA = sum(currentAssets), tFA = sum(fixedAssets);
  const tA = round2(tCA + tFA);
  const tCL = sum(currentLiab), tLL = sum(longLiab);
  const tL = round2(tCL + tLL);
  const tEquity = sum(equity);
  const profit = netProfit();
  const ownerEquity = round2(tEquity + profit);
  const nw = round2(tA - tL);

  const row = a => {
    const b = accountBalance(a.id);
    if (b === 0) return '';
    return `<div class="rep-row"><span class="lbl">${esc(a.code)} &nbsp; ${esc(a.name)}</span><span>${plainNum(b)}</span></div>`;
  };

  return `
  <div class="grid g4 mb2">
    <div class="kpi accent"><div class="k-label">Total Assets</div><div class="k-value sm">${money(tA, 0)}</div></div>
    <div class="kpi danger"><div class="k-label">Total Liabilities</div><div class="k-value sm">${money(tL, 0)}</div></div>
    <div class="kpi ok"><div class="k-label">Company Net Worth</div><div class="k-value">${money(nw, 0)}</div><div class="k-foot">Assets − Liabilities</div></div>
    <div class="kpi purple"><div class="k-label">Owner's Equity (Book)</div><div class="k-value sm">${money(ownerEquity, 0)}</div><div class="k-foot">Capital + Results</div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-building"></i> Net Worth Statement</h3>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i></button>
      </div>
      <div class="rep-section"><h4>Assets</h4>
        <div class="rep-row sub"><span class="lbl">Current Assets</span><span>${plainNum(tCA)}</span></div>
        ${currentAssets.map(row).join('')}
        <div class="rep-row sub"><span class="lbl">Fixed Assets</span><span>${plainNum(tFA)}</span></div>
        ${fixedAssets.map(row).join('')}
        <div class="rep-row total"><span class="lbl">TOTAL ASSETS</span><span>${plainNum(tA)}</span></div>
      </div>
      <div class="rep-section"><h4>Liabilities</h4>

  </div>

        <tbody>
          ${rows.slice(0, 250).map(r => {

            } catch(e){}
            return `<tr>
              <td class="nowrap">${fmtDateTime(r.ts)}</td>
              <td>${esc(r.user || '—')}</td>
              <td><span class="badge ${r.action === 'DELETE' || r.action === 'REVERSE' ? 'red' : (r.action === 'CREATE' ? 'green' : 'blue')}">${esc(r.action)}</span></td>

function exportAudit(){
  const rows = [['Timestamp','User','Action','Entity','Entity ID','Reason']];
  sortBy(toArr(S.audit), 'ts', 'desc').forEach(r => rows.push([r.ts, r.user, r.action, r.entity, r.entityId, r.reason]));
  downloadCSV('NGT_AuditTrail_' + todayISO() + '.csv', rows);
}

async function loadDefaultCOA(mergeOnly){
  const existing = toArr(S.accounts);
  const existingCodes = new Set(existing.map(a => a.code));

  const toCreate = DEFAULT_COA.filter(a => !existingCodes.has(a.code));
  if (!toCreate.length) { toast('All default accounts already exist.', 'info'); return; }

  const confirmMsg = mergeOnly
    ? `Add ${toCreate.length} missing default account(s) to your existing chart?`
    : `Install ${toCreate.length} standard accounts? Existing accounts will not be modified.`;

  confirmDialog('Load Chart of Accounts', confirmMsg, async () => {
    try {
      toast('Installing accounts…', 'info', 2000);
      for (const a of toCreate) {
        const rec = {
          code: a.code, name: a.name, type: a.type, subtype: a.subtype,
          flags: a.flags || {}, contra: !!a.contra,
          openingBalance: 0, active: true,
          createdAt: nowISO(), createdBy: currentUser()
        };
        await Store.save('accounts', null, rec);
      }
      await auditLog('CREATE', 'accounts', 'default-coa', null, { count: toCreate.length });
      toast(toCreate.length + ' accounts installed.', 'ok');
      renderRoute();
    } catch(err){ toast('Failed: ' + err.message, 'err'); }
  }, 'Install Accounts');
}
window.loadDefaultCOA = loadDefaultCOA;

          </tr>`).join('')}

}

async function setCounter(prefix){
  const cur = num((S.settings.counters || {})[prefix]);
  const v = prompt('Set the last used number for ' + prefix + '.\nNext document will be ' + prefix + '-' + String(cur + 2).padStart(5,'0'), cur);
  if (v === null) return;
  const n = parseInt(v, 10);
  if (isNaN(n) || n < 0) { toast('Invalid number.', 'err'); return; }
  try {
    await FB.set('settings/counters/' + prefix, n);
    S.settings.counters = S.settings.counters || {};
    S.settings.counters[prefix] = n;
    toast(prefix + ' counter updated.', 'ok');
    renderRoute();
  } catch(err){ toast('Failed: ' + err.message, 'err'); }
}
window.setCounter = setCounter;

function resetCounters(){
  confirmDialog('Reset Numbering', 'Reset all document counters to zero? Future documents will restart at 00001. Existing documents are unaffected.', async () => {
    try {

      toast('Counters reset.', 'ok');

function settingsPeriods(){

  return `

    <p class="text-sm text-muted mb2">Locking a period prevents further postings into it, protecting historical financial statements from accidental modification.</p>
    <div class="table-wrap"><table style="min-width:auto">
      <thead><tr><th>Period</th><th>Status</th><th class="num">Transactions</th><th class="no-print">Action</th></tr></thead>
      <tbody>
        ${months.map(mk => {
          const st = (periods[mk] && periods[mk].status) || 'open';
          const count = allJournalLines().filter(l => (l.date || '').slice(0,7) === mk).length;
          return `<tr>
            <td>${esc(monthName(mk))}</td>
            <td>${statusBadge(st === 'open' ? 'open' : st)}</td>
            <td class="num">${count}</td>
            <td class="no-print">
              <button class="btn btn-ghost btn-xs" onclick="togglePeriod('${mk}','${st}')">
                ${st === 'open' ? 'Lock' : 'Unlock'}

            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

async function togglePeriod(mk, current){
  const next = current === 'open' ? 'closed' : 'open';
  try {
    await FB.set('periods/' + mk, { status: next, changedAt: nowISO(), changedBy: currentUser() });
    S.periods[mk] = { status: next };
    await auditLog('UPDATE', 'periods', mk, { status: current }, { status: next });
    toast(monthName(mk) + ' is now ' + next + '.', 'ok');
    renderRoute();
  } catch(err){ toast('Failed: ' + err.message, 'err'); }
}
window.togglePeriod = togglePeriod;

async function fullBackup(){
  try {
    toast('Preparing backup…', 'info', 2000);
    const all = {};
    for (const k of Store.keys) {
      all[k] = await FB.get(k);
    }
    all.__exportedAt = nowISO();
    all.__system = 'NGT Financial ERP v1.0';
    const blob = new Blob([JSON.stringify(all, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'NGT_ERP_Backup_' + todayISO() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Backup downloaded.', 'ok');
  } catch(err){ toast('Backup failed: ' + err.message, 'err'); }
}
window.fullBackup = fullBackup;

      toast(cap(mod) + ' wiped.', 'ok');
      renderRoute();
    } catch(err){ toast('Failed: ' + err.message, 'err'); }
  }, 'Wipe Permanently', true);
}
window.wipeModule = wipeModule;

function wipeAll(){
  confirmDialog('WIPE ENTIRE DATABASE',
    'This will permanently delete <strong>every record</strong> in the Ngure Gacheru Technologies ERP — accounts, customers, invoices, journal entries, audit trail and all settings. This cannot be undone. Have you downloaded a backup?',
    async () => {
      try {
        for (const k of Store.keys) {

async function convertQuoteToInvoice(quoteId){
  const q = S.quotations[quoteId];
  if (!q) { toast('Quotation not found.', 'err'); return; }

  confirmDialog('Convert to Invoice',
    'Create a tax invoice from quotation <strong>' + esc(q.number) + '</strong>? The quotation will be marked as converted.',
    async () => {
      try {
        const number = await nextNumber('INV');
        const inv = {
          number,
          date: todayISO(),
          dueDate: '',
          customerId: q.customerId,
          customerName: q.customerName,
          division: q.division,
          projectId: q.projectId || '',
          lines: q.lines || [],
          subtotal: q.subtotal, discount: q.discount, taxRate: q.taxRate,
          tax: q.tax, total: q.total,
          amountPaid: 0, status: 'unpaid',
          notes: q.notes || '',
          agentId: q.agentId || '', commissionRate: q.commissionRate || 0,
          fromQuotation: q.number,
          createdAt: nowISO()
        };
        const iid = await Store.save('invoices', null, inv);
        const jid = await postDocumentJournal('invoices', iid, inv);
        await FB.set('invoices/' + iid + '/journalId', jid);
        S.invoices[iid].journalId = jid;

        q.status = 'converted';
        q.convertedTo = number;
        await FB.set('quotations/' + quoteId, q);

        await auditLog('CONVERT', 'quotations', quoteId, { number: q.number }, { invoice: number });
        toast('Invoice ' + number + ' created from quotation.', 'ok');
        closeModal();
        renderRoute();
        updateTopChips();
      } catch(err){ toast('Conversion failed: ' + err.message, 'err', 6000); }
    }, 'Convert', false);
}
window.convertQuoteToInvoice = convertQuoteToInvoice;

function bindViewEvents(){
  // Sidebar close on mobile
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('open');

  // Entity search
  const entSearch = $('#entSearch');
  if (entSearch) {
    const key = CURRENT_ROUTE === 'inventory' ? 'items' : CURRENT_ROUTE;
    entSearch.addEventListener('input', e => {
      const st = ENTITY_STATE[key] || (ENTITY_STATE[key] = { q:'', sort:null, dir:'asc' });
      st.q = e.target.value;
      const view = $('#view');
      const pos = e.target.selectionStart;
      view.innerHTML = viewEntity(key);
      bindViewEvents();
      const ns = $('#entSearch');
      if (ns) { ns.focus(); ns.setSelectionRange(pos, pos); }
    });
    // Column sorting
    $$('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const st = ENTITY_STATE[key] || (ENTITY_STATE[key] = { q:'', sort:null, dir:'asc' });
        if (st.sort === th.dataset.sort) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
        else { st.sort = th.dataset.sort; st.dir = 'asc'; }
        $('#view').innerHTML = viewEntity(key);
        bindViewEvents();
      });
    });
  }

  // Payment search
  const paySearch = $('#paySearch');
  if (paySearch) {
    paySearch.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      const rows = sortBy(toArr(S.payments), 'date', 'desc')
        .filter(p => JSON.stringify(p).toLowerCase().includes(q));

            <button class="btn btn-ghost btn-xs" onclick="reversePayment('${p.id}')"><i class="fa-solid fa-rotate-left"></i></button>
          </td>
        </tr>`).join('');
    });
  }

  // Expense search
  const expSearch = $('#expSearch');
  if (expSearch) {
    expSearch.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      $$('#view tbody tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
  }

  // Journal search
  const jSearch = $('#jSearch');
  if (jSearch) {
    jSearch.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      $$('#view tbody tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
  }

  // Audit search
  const aSearch = $('#auditSearch');
  if (aSearch) {
    aSearch.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      $$('#view tbody tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
  }

  // Ledger account selector
  const ledgerSel = $('#ledgerAccount');
  if (ledgerSel) {
    ledgerSel.addEventListener('change', e => { navigate('ledger', e.target.value); });

function setConn(ok){
  const dot = $('#connDot'), txt = $('#connTxt');
  if (!dot) return;
  dot.className = 'conn-dot' + (ok ? ' on' : '');
  txt.textContent = ok ? 'Firebase connected' : 'Connection lost';
}

async function checkConnection(){
  const dot = $('#connDot'), txt = $('#connTxt');
  dot.className = 'conn-dot loading';
  txt.textContent = 'Connecting…';
  try {
    await FB.get('company');
    setConn(true);
    return true;
  } catch(err){
    setConn(false);
    console.warn('Firebase connection error:', err);
    return false;
  }
}

  setInterval(checkConnection, 60000);

  // Hash change
  window.addEventListener('hashchange', renderRoute);
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngure Gacheru Technologies — Financial ERP</title>
<meta name="description" content="Integrated Financial ERP for Ngure Gacheru Technologies">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   NGT ERP — THEME (base provided style.css, adapted for ERP)
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0b1117;
  --bg-2:#0e1623;
  --bg-3:#0d1520;
  --panel:#151f2e;
  --panel-2:#1a2536;
  --panel-3:#1e2c40;
  --line:#22303f;
  --line-2:#2a374b;
  --txt:#e0e7ff;
  --txt-2:#9ab3d8;
  --txt-3:#7c8fa8;
  --accent:#38bdf8;
  --accent-2:#7dd3fc;
  --accent-dim:#38bdf830;
  --ok:#34d399;
  --warn:#fbbf24;
  --danger:#f87171;
  --purple:#a78bfa;
  --pink:#f472b6;
  --radius:14px;
  --radius-lg:20px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}

html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background-color:var(--bg);
  color:var(--txt);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a1017}
::-webkit-scrollbar-thumb{background:#22303f;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#2f4256}

a{color:var(--accent);text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:inherit}

/* ================= APP SHELL ================= */
.app{display:flex;min-height:100vh}

.sidebar{
  width:264px;flex:0 0 264px;
  background:linear-gradient(180deg,#0c141e 0%,#0a1017 100%);
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  overflow-y:auto;z-index:80;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.brand{
  display:flex;gap:.75rem;align-items:center;
  padding:1.15rem 1.1rem;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#0c141e;z-index:5;
}
.logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(135deg,#38bdf8,#2563eb);
  display:grid;place-items:center;font-weight:800;font-size:.92rem;color:#06121c;
  box-shadow:0 6px 18px #38bdf840;
}
.brand-name{font-size:.95rem;font-weight:700;letter-spacing:-.2px;color:#eaf4ff;line-height:1.2}
.brand-sub{font-size:.7rem;color:var(--txt-3);text-transform:uppercase;letter-spacing:1.4px}

.nav{padding:.6rem .55rem 1.5rem;flex:1}
.nav-section{
  font-size:.62rem;text-transform:uppercase;letter-spacing:1.6px;
  color:#54677e;padding:1rem .8rem .4rem;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.55rem .8rem;border-radius:10px;
  color:#a8bcd6;font-size:.845rem;font-weight:500;
  cursor:pointer;transition:all .16s;margin-bottom:1px;position:relative;
  user-select:none;
}
.nav-item i{width:17px;text-align:center;font-size:.86rem;opacity:.85}
.nav-item:hover{background:#16222f;color:#dceaff}
.nav-item.active{
  background:linear-gradient(90deg,#38bdf81f,#38bdf805);
  color:#7dd3fc;font-weight:600;
  box-shadow:inset 2px 0 0 var(--accent);
}
.nav-badge{
  margin-left:auto;background:#22303f;color:#8fa8c4;
  font-size:.66rem;padding:.08rem .42rem;border-radius:20px;font-weight:700;
}
.sidebar-foot{
  padding:.85rem 1rem;border-top:1px solid var(--line);
  font-size:.68rem;color:#54677e;text-align:center;
}
.conn{display:flex;align-items:center;gap:.45rem;justify-content:center;margin-bottom:.3rem}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px currentColor}
.conn-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.conn-dot.loading{background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.main{flex:1;margin-left:264px;min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:70;
  background:rgba(11,17,23,.93);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:.7rem 1.4rem;display:flex;align-items:center;gap:1rem;
}
.hamburger{display:none;background:none;border:1px solid var(--line-2);color:#cfe2f7;width:38px;height:38px;border-radius:10px;cursor:pointer}
.page-title{font-size:1.05rem;font-weight:700;letter-spacing:-.2px}
.page-title span{display:block;font-size:.7rem;font-weight:400;color:var(--txt-3);letter-spacing:.4px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;
  background:#141f2d;border:1px solid var(--line-2);
  padding:.32rem .7rem;border-radius:30px;font-size:.74rem;color:#b7cbe4;
}
.chip strong{color:#eaf4ff}

.view{padding:1.4rem;flex:1;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================= COMPONENTS ================= */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:1.15rem 1.25rem;
  box-shadow:0 4px 14px rgba(0,0,0,.28);
}
.card+.card{margin-top:1.1rem}
.card-head{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--line);
}
.card-head h3{font-size:.95rem;font-weight:700;color:#dbeafe;letter-spacing:-.1px}
.card-head h3 i{color:var(--accent);margin-right:.4rem}
.card-head .spacer{margin-left:auto}
.card-sub{font-size:.76rem;color:var(--txt-3);margin-top:.15rem}

.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}

.kpi{
  background:linear-gradient(150deg,#16222f 0%,#131c28 100%);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:1rem 1.05rem;position:relative;overflow:hidden;
  transition:transform .2s,border-color .2s;
}
.kpi:hover{transform:translateY(-3px);border-color:#2f4a63}
.kpi::after{
  content:'';position:absolute;right:-28px;top:-28px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,#38bdf81f,transparent 70%);
}
.kpi .k-label{font-size:.68rem;text-transform:uppercase;letter-spacing:1.1px;color:var(--txt-3);font-weight:600;display:flex;align-items:center;gap:.4rem}
.kpi .k-value{font-size:1.42rem;font-weight:800;letter-spacing:-.6px;margin-top:.35rem;color:#f0f9ff}
.kpi .k-value.sm{font-size:1.12rem}
.kpi .k-foot{font-size:.7rem;color:var(--txt-3);margin-top:.3rem}
.kpi.accent{border-color:#1d4d68}
.kpi.accent .k-value{color:var(--accent-2)}
.kpi.ok .k-value{color:var(--ok)}
.kpi.warn .k-value{color:var(--warn)}
.kpi.danger .k-value{color:var(--danger)}
.kpi.purple .k-value{color:var(--purple)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.52rem 1.05rem;border-radius:10px;border:1px solid transparent;
  font-size:.8rem;font-weight:600;cursor:pointer;transition:all .18s;
  white-space:nowrap;background:#22303f;color:#cfe2f7;
}
.btn:hover{background:#2b3d50;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#06121c;box-shadow:0 6px 16px #38bdf830}
.btn-primary:hover{background:linear-gradient(135deg,#7dd3fc,#38bdf8);box-shadow:0 10px 22px #38bdf850}
.btn-ok{background:linear-gradient(135deg,#34d399,#10b981);color:#04150f}
.btn-warn{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1206}
.btn-danger{background:linear-gradient(135deg,#f87171,#ef4444);color:#1a0606}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:#b7cbe4}
.btn-ghost:hover{background:#18242f;border-color:#38bdf860}
.btn-sm{padding:.32rem .65rem;font-size:.72rem;border-radius:8px}
.btn-xs{padding:.2rem .48rem;font-size:.68rem;border-radius:7px}
.btn-icon{padding:.4rem;width:32px;height:32px;border-radius:9px}

.toolbar{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.toolbar .spacer{margin-left:auto}

.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem}
.field label{font-size:.72rem;font-weight:600;color:#93a9c2;text-transform:uppercase;letter-spacing:.6px}
.field label .req{color:var(--danger)}
.input,input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  background:#0f1824;border:1px solid var(--line-2);border-radius:10px;
  padding:.55rem .75rem;color:#e6efff;font-size:.83rem;width:100%;
  transition:border-color .18s,box-shadow .18s;outline:none;
}
.input:focus,input:focus,select:focus,textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px #38bdf822;
}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237c8fa8'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .5rem center;background-size:18px;padding-right:2rem}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.search{position:relative;max-width:290px;width:100%}
.search i{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:#54677e;font-size:.8rem}
.search input{padding-left:2rem}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.815rem;min-width:520px}
thead th{
  background:#121c28;color:#8ba3bf;font-size:.67rem;text-transform:uppercase;
  letter-spacing:1px;font-weight:700;padding:.7rem .8rem;text-align:left;
  border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:.62rem .8rem;border-bottom:1px solid #17222e;color:#c8d9ee;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#141f2c}
tbody tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.empty{padding:2.6rem 1rem;text-align:center;color:var(--txt-3);font-size:.85rem}
.empty i{display:block;font-size:2.1rem;margin-bottom:.7rem;opacity:.35}

.badge{
  display:inline-flex;align-items:center;gap:.28rem;
  padding:.16rem .55rem;border-radius:20px;font-size:.67rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;
}
.badge.gray{background:#22303f;color:#9ab3d8}
.badge.blue{background:#0e3a52;color:#7dd3fc}
.badge.green{background:#0d3b2e;color:#6ee7b7}
.badge.amber{background:#3d2f0d;color:#fcd34d}
.badge.red{background:#3d1616;color:#fca5a5}
.badge.purple{background:#2a1d4d;color:#c4b5fd}

.tabs{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:1.1rem}
.tab{
  padding:.55rem .95rem;font-size:.8rem;font-weight:600;color:#8ba3bf;
  cursor:pointer;border-bottom:2px solid transparent;transition:all .16s;white-space:nowrap;
}
.tab:hover{color:#cfe2f7}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.alert{padding:.7rem .9rem;border-radius:10px;font-size:.8rem;display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.9rem}
.alert i{margin-top:.15rem}
.alert.info{background:#0e2a3d;border:1px solid #1d4d68;color:#a5dcf7}
.alert.warn{background:#3a2c0a;border:1px solid #5c4711;color:#fcd34d}
.alert.err{background:#3a1414;border:1px solid #5c1f1f;color:#fca5a5}
.alert.ok{background:#0d2f24;border:1px solid #14503c;color:#6ee7b7}

/* ================= MODAL ================= */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(4,9,14,.78);backdrop-filter:blur(5px);
  z-index:200;display:none;align-items:flex-start;justify-content:center;
  padding:2rem 1rem;overflow-y:auto;
}
.modal-backdrop.open{display:flex;animation:fade .2s}
.modal{
  background:var(--panel);border:1px solid var(--line-2);
  border-radius:var(--radius-lg);width:100%;max-width:720px;
  box-shadow:0 30px 70px rgba(0,0,0,.65);
  animation:pop .24s cubic-bezier(.2,.9,.3,1.2);margin:auto 0;
}
.modal.wide{max-width:1020px}
.modal.narrow{max-width:470px}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(14px)}to{opacity:1;transform:none}}
.modal-head{
  padding:1rem 1.25rem;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.7rem;
}
.modal-head h3{font-size:.98rem;font-weight:700}
.modal-head .close{margin-left:auto;background:none;border:none;color:#7c8fa8;font-size:1.15rem;cursor:pointer;padding:.25rem .5rem;border-radius:8px;transition:.15s}
.modal-head .close:hover{background:#22303f;color:#fff}
.modal-body{padding:1.15rem 1.25rem;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-foot{
  padding:.85rem 1.25rem;border-top:1px solid var(--line);
  display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;
}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 .9rem}
.form-grid .full{grid-column:1/-1}

/* line items */
.lines-table{width:100%;border-collapse:collapse;font-size:.79rem;min-width:640px}
.lines-table th{background:#121c28;padding:.45rem .5rem;font-size:.63rem;text-transform:uppercase;letter-spacing:.8px;color:#8ba3bf;text-align:left;border-bottom:1px solid var(--line-2)}
.lines-table td{padding:.28rem .3rem;border-bottom:1px solid #17222e}
.lines-table input,.lines-table select{padding:.35rem .5rem;font-size:.78rem;border-radius:7px}
.totals{display:flex;flex-direction:column;gap:.35rem;margin-top:.9rem;align-items:flex-end}
.totals .trow{display:flex;gap:1.4rem;justify-content:space-between;min-width:270px;font-size:.83rem;color:#9ab3d8}
.totals .trow.grand{border-top:2px solid var(--line-2);padding-top:.45rem;margin-top:.3rem;font-size:1rem;font-weight:800;color:#f0f9ff}

/* toast */
#toasts{position:fixed;bottom:1.2rem;right:1.2rem;z-index:400;display:flex;flex-direction:column;gap:.5rem}
.toast{
  background:#16222f;border:1px solid var(--line-2);border-left:3px solid var(--accent);
  padding:.7rem 1rem;border-radius:11px;font-size:.8rem;color:#dbeafe;
  box-shadow:var(--shadow);animation:slideIn .25s ease;max-width:340px;
  display:flex;gap:.6rem;align-items:flex-start;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* report blocks */
.rep-head{text-align:center;margin-bottom:1.3rem;padding-bottom:1rem;border-bottom:2px solid var(--line-2)}
.rep-head h2{font-size:1.15rem;font-weight:800;color:#eaf4ff;letter-spacing:-.3px}
.rep-head p{font-size:.76rem;color:var(--txt-3)}
.rep-section{margin-bottom:1.3rem}
.rep-section h4{font-size:.76rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);margin-bottom:.5rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
.rep-row{display:flex;justify-content:space-between;padding:.36rem 0;font-size:.83rem;border-bottom:1px dashed #17222e}
.rep-row.total{font-weight:800;border-top:2px solid var(--line-2);border-bottom:none;margin-top:.35rem;padding-top:.55rem;color:#f0f9ff;font-size:.92rem}
.rep-row.sub{font-weight:700;color:#bcd4ee;background:#121c2820;padding-left:.5rem}
.rep-row .lbl{color:#a5bbd4}
.rep-row.total .lbl{color:#f0f9ff}
.neg{color:var(--danger)!important}
.pos{color:var(--ok)!important}

.mini-bars{display:flex;flex-direction:column;gap:.6rem}
.mini-bar-row{font-size:.8rem}
.mini-bar-top{display:flex;justify-content:space-between;margin-bottom:.22rem;color:#a5bbd4}
.mini-bar-track{height:7px;background:#121c28;border-radius:6px;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#38bdf8,#0ea5e9);transition:width .6s ease}

.divider{height:1px;background:var(--line);margin:1.1rem 0}
.text-muted{color:var(--txt-3)}
.text-sm{font-size:.76rem}
.text-xs{font-size:.7rem}
.mt1{margin-top:.6rem}.mt2{margin-top:1.1rem}.mt3{margin-top:1.7rem}
.mb1{margin-bottom:.6rem}.mb2{margin-bottom:1.1rem}
.flex{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.nowrap{white-space:nowrap}
.center{text-align:center}
.hidden{display:none!important}

.spinner{
  width:15px;height:15px;border:2px solid #38bdf840;border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= RESPONSIVE ================= */
@media (max-width:1100px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.8)}
  .main{margin-left:0}
  .hamburger{display:grid;place-items:center}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:75;display:none}
  .overlay.open{display:block}
}
@media (max-width:768px){
  .view{padding:1rem}
  .topbar{padding:.6rem .9rem}
  .kpi .k-value{font-size:1.2rem}
  .modal-body{max-height:calc(100vh - 180px)}
  .page-title{font-size:.92rem}
  .hide-sm{display:none!important}
}
@media print{
  .sidebar,.topbar,.toolbar,.no-print{display:none!important}
  .main{margin-left:0}
  body{background:#fff;color:#000}
  .card{background:#fff;border:1px solid #ccc;box-shadow:none}
  thead th{background:#eee;color:#000}
  tbody td{color:#000}
}
</style>
</head>
<body>

<div class="app">
  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">NGT</div>
      <div>
        <div class="brand-name">Ngure Gacheru</div>
        <div class="brand-sub">Technologies</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="conn"><span class="conn-dot loading" id="connDot"></span><span id="connTxt">Connecting…</span></div>
      <div>NGT Financial ERP v1.0</div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- ==================== MAIN ==================== -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      <div class="page-title" id="pageTitle">Dashboard<span id="pageSub">Financial command centre</span></div>
      <div class="topbar-right">
        <span class="chip hide-sm"><i class="fa-solid fa-calendar-day"></i> <strong id="todayChip">—</strong></span>
        <span class="chip hide-sm"><i class="fa-solid fa-coins"></i> <strong id="cashChip">—</strong></span>
        <button class="btn btn-ghost btn-sm" id="btnRefresh" title="Reload from Firebase"><i class="fa-solid fa-rotate"></i> <span class="hide-sm">Sync</span></button>
        <button class="btn btn-primary btn-sm" id="btnQuick"><i class="fa-solid fa-plus"></i> <span class="hide-sm">New</span></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toasts"></div>

<script>
/* ============================================================================
   NGURE GACHERU TECHNOLOGIES — FINANCIAL ERP
   Single-file application. Firebase Realtime Database backend.
   No seed/demo data is created automatically.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   1. FIREBASE REALTIME DATABASE LAYER (REST)
   --------------------------------------------------------------------------- */
const FB_BASE = 'https://ngt-accounting-system-default-rtdb.firebaseio.com';

const FB = {
  async req(path, method = 'GET', body) {
    const clean = String(path).replace(/^\/+|\/+$/g, '');
    const url = FB_BASE + '/' + (clean ? clean : '') + '.json';
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error('Firebase: ' + msg);
    }
    if (res.status === 204) return null;
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  },
  get(p)          { return this.req(p, 'GET'); },
  set(p, v)       { return this.req(p, 'PUT', v); },
  push(p, v)      { return this.req(p, 'POST', v); },
  update(p, v)    { return this.req(p, 'PATCH', v); },
  del(p)          { return this.req(p, 'DELETE'); }
};

const Store = {
  keys: ['company','accounts','customers','suppliers','items','quotations','invoices',
         'payments','purchases','expenses','projects','journal','assets','liabilities',
         'hirepurchase','agents','employees','payroll','brokerage','budgets','audit',
         'settings','periods','bankTx','mpesaTx','pettycash'],
  async loadAll() {
    const results = await Promise.all(
      this.keys.map(k => FB.get(k).catch(() => null))
    );
    this.keys.forEach((k, i) => { S[k] = results[i] || {}; });
  },
  async save(key, id, data) {
    if (id) { await FB.set(key + '/' + id, data); S[key][id] = data; }
    else { const r = await FB.push(key, data); const nid = r && r.name ? r.name : null; if (nid) S[key][nid] = data; return nid; }
    return id;
  },
  async remove(key, id) { await FB.del(key + '/' + id); delete S[key][id]; }
};

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round2(v){ return Math.round((num(v) + Number.EPSILON) * 100) / 100; }
function money(v, dp = 2) {
  const n = num(v);
  return (n < 0 ? '-' : '') + 'KES ' + Math.abs(n).toLocaleString('en-KE', {
    minimumFractionDigits: dp, maximumFractionDigits: dp
  });
}
function plainNum(v, dp = 2) {
  const n = num(v);
  return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-KE', {
    minimumFractionDigits: dp, maximumFractionDigits: dp
  });
}
function todayISO(){ const d = new Date(); return d.toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(d){
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDateTime(d){
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function monthKey(d){ return (d || todayISO()).slice(0,7); }
function monthName(k){
  if (!k) return '—';
  const [y,m] = k.split('-');
  return new Date(y, m-1, 1).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
}
function esc(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function cap(s){ return String(s||'').replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toArr(obj){ return Object.entries(obj || {}).map(([id, v]) => Object.assign({ id }, v)); }
function sortBy(arr, k, dir = 'asc'){
  return arr.slice().sort((a,b) => {
    let x = a[k], y = b[k];
    if (typeof x === 'string') x = x.toLowerCase();
    if (typeof y === 'string') y = y.toLowerCase();
    if (x === undefined || x === null) x = '';
    if (y === undefined || y === null) y = '';
    if (x < y) return dir === 'asc' ? -1 : 1;
    if (x > y) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}
function daysBetween(a, b){
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}

  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(30px)'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 320); }, ms);
}
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => {
    const s = String(c === undefined || c === null ? '' : c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function isDebitNormal(acc){
  if (!acc) return true;
  const dn = (acc.type === 'asset' || acc.type === 'expense');
  return acc.contra ? !dn : dn;
}
function accountById(id){ return S.accounts[id] || null; }
function accountByCode(code){
  return toArr(S.accounts).find(a => a.code === code) || null;
}
function accountByFlag(flag){
  return toArr(S.accounts).filter(a => a.flags && a.flags[flag]);
}
function accountName(id){
  const a = accountById(id);
  return a ? (a.code + ' · ' + a.name) : '—';
}

/** Flatten every journal line across all entries */
function allJournalLines(){
  const out = [];
  Object.entries(S.journal || {}).forEach(([jid, j]) => {
    if (!j || !Array.isArray(j.lines)) return;
    if (j.status === 'draft') return;
    j.lines.forEach(l => out.push({
      accountId: l.accountId,
      debit: num(l.debit),
      credit: num(l.credit),
      date: j.date,
      memo: j.memo || '',
      ref: j.ref || '',
      source: j.source || 'manual',
      journalId: jid,
      reversalOf: j.reversalOf || null
    }));
  });
  return out;
}

/** Balance of a single account (opening balance + journal movement) */
function accountBalance(id, uptoDate){
  const acc = accountById(id);
  if (!acc) return 0;
  let d = 0, c = 0;
  allJournalLines().forEach(l => {
    if (l.accountId !== id) return;
    if (uptoDate && l.date > uptoDate) return;
    d += l.debit; c += l.credit;
  });
  const opening = num(acc.openingBalance);
  const dn = isDebitNormal(acc);
  return round2(dn ? (opening + d - c) : (opening + c - d));
}

/** Sum balances of accounts filtered by predicate */
function sumBalances(pred, uptoDate){
  return round2(toArr(S.accounts).filter(pred).reduce((s, a) => s + accountBalance(a.id, uptoDate), 0));
}

/** Generate the next document number */
async function nextNumber(prefix){
  const path = 'settings/counters/' + prefix;
  let cur = 0;
  try { const v = await FB.get(path); cur = num(v); } catch(e){}
  const n = cur + 1;
  try { await FB.set(path, n); } catch(e){}
  S.settings.counters = S.settings.counters || {};
  S.settings.counters[prefix] = n;
  const padded = String(n).padStart(5, '0');
  return prefix + '-' + padded;
}

/** Post a balanced journal entry. Returns journal id. */
async function postJournal({ date, memo, ref, source, sourceId, lines, user }){
  const clean = (lines || []).filter(l => l.accountId && (num(l.debit) !== 0 || num(l.credit) !== 0))
    .map(l => ({
      accountId: l.accountId,
      description: l.description || '',
      debit: round2(l.debit),
      credit: round2(l.credit)
    }));
  if (!clean.length) throw new Error('Journal entry has no lines.');
  const td = round2(clean.reduce((s,l) => s + l.debit, 0));
  const tc = round2(clean.reduce((s,l) => s + l.credit, 0));
  if (Math.abs(td - tc) > 0.01) {
    throw new Error('Journal not balanced. Debits ' + money(td) + ' vs Credits ' + money(tc));
  }
  const entry = {
    date: date || todayISO(),
    memo: memo || '',
    ref: ref || '',
    source: source || 'manual',
    sourceId: sourceId || '',
    lines: clean,
    totalDebit: td,
    totalCredit: tc,
    status: 'posted',
    createdAt: nowISO(),
    createdBy: user || currentUser(),
    reversed: false
  };
  const id = await Store.save('journal', null, entry);
  await auditLog('CREATE', 'journal', id, null, entry);
  return id;
}

/** Reverse a journal entry (creates a mirror entry, never deletes) */
async function reverseJournal(journalId, reason){
  const j = S.journal[journalId];
  if (!j) throw new Error('Journal entry not found.');
  if (j.reversed) throw new Error('Entry already reversed.');
  const mirrored = j.lines.map(l => ({
    accountId: l.accountId,
    description: 'REVERSAL: ' + (l.description || ''),
    debit: l.credit,
    credit: l.debit
  }));
  const rid = await postJournal({
    date: todayISO(),
    memo: 'Reversal of ' + (j.ref || journalId) + (reason ? ' — ' + reason : ''),
    ref: 'REV-' + (j.ref || journalId.slice(-6).toUpperCase()),
    source: 'reversal',
    sourceId: journalId,
    lines: mirrored
  });
  S.journal[journalId].reversed = true;
  S.journal[journalId].reversedBy = rid;
  S.journal[journalId].reversedAt = nowISO();
  await FB.set('journal/' + journalId, S.journal[journalId]);
  await auditLog('REVERSE', 'journal', journalId, j, { reversedBy: rid, reason });
  return rid;
}

function totalCash(){
  return round2(
    sumBalances(a => a.flags && a.flags.cash) +
    sumBalances(a => a.flags && a.flags.mpesa) +
    sumBalances(a => a.flags && a.flags.bank)
  );
}
function cashPosition(){
  const cash  = sumBalances(a => a.flags && a.flags.cash && !a.flags.petty);
  const petty = sumBalances(a => a.flags && a.flags.petty);
  const mpesa = sumBalances(a => a.flags && a.flags.mpesa);
  const bank  = sumBalances(a => a.flags && a.flags.bank);
  return { cash, petty, mpesa, bank, total: round2(cash + petty + mpesa + bank) };
}
function totalReceivable(){
  const ar = accountByFlag('receivable')[0];
  return ar ? accountBalance(ar.id) : 0;
}
function totalPayable(){
  const ap = accountByFlag('payable')[0];
  return ap ? accountBalance(ap.id) : 0;
}
function revenueAccounts(){ return toArr(S.accounts).filter(a => a.type === 'revenue'); }
function expenseAccounts(){ return toArr(S.accounts).filter(a => a.type === 'expense'); }
function totalRevenue(upto){
  return round2(revenueAccounts().reduce((s,a) => s + accountBalance(a.id, upto), 0));
}
function totalExpenses(upto){
  return round2(expenseAccounts().reduce((s,a) => s + accountBalance(a.id, upto), 0));
}
function cogsTotal(upto){
  return round2(toArr(S.accounts).filter(a => a.subtype === 'cogs').reduce((s,a) => s + accountBalance(a.id, upto), 0));
}
function opexTotal(upto){
  return round2(toArr(S.accounts).filter(a => a.subtype === 'opex' || a.subtype === 'other_expense').reduce((s,a) => s + accountBalance(a.id, upto), 0));
}
function netProfit(upto){ return round2(totalRevenue(upto) - totalExpenses(upto)); }
function totalAssets(upto){
  return round2(toArr(S.accounts).filter(a => a.type === 'asset').reduce((s,a) => s + accountBalance(a.id, upto), 0));
}
function totalLiabilities(upto){
  return round2(toArr(S.accounts).filter(a => a.type === 'liability').reduce((s,a) => s + accountBalance(a.id, upto), 0));
}
function netWorth(upto){ return round2(totalAssets(upto) - totalLiabilities(upto)); }

function invoicesInRange(from, to){
  return toArr(S.invoices).filter(i => (!from || i.date >= from) && (!to || i.date <= to));
}
function expensesInRange(from, to){
  return toArr(S.expenses).filter(e => (!from || e.date >= from) && (!to || e.date <= to));
}
function paymentsInRange(from, to){
  return toArr(S.payments).filter(p => (!from || p.date >= from) && (!to || p.date <= to));
}

function invoiceBalance(inv){
  const paid = num(inv.amountPaid);
  return round2(num(inv.total) - paid);
}
function invoiceStatus(inv){
  const bal = invoiceBalance(inv);
  if (inv.status === 'draft') return 'draft';
  if (bal <= 0.005) return 'paid';
  if (num(inv.amountPaid) > 0) return 'partial';
  if (inv.dueDate && inv.dueDate < todayISO()) return 'overdue';
  return 'unpaid';
}
function statusBadge(st){
  const map = {
    draft:'gray', sent:'blue', unpaid:'blue', partial:'amber', paid:'green',
    overdue:'red', cancelled:'red', accepted:'green', rejected:'red',
    expired:'amber', converted:'purple', open:'blue', closed:'gray',
    active:'green', completed:'green', 'on-hold':'amber', reversed:'red',
    posted:'green', pending:'amber', disposed:'gray'
  };
  return '<span class="badge ' + (map[st] || 'gray') + '">' + esc(cap(st || '—')) + '</span>';
}

/* ---------------------------------------------------------------------------
   9. AUDIT TRAIL
   --------------------------------------------------------------------------- */
function currentUser(){
  try { return localStorage.getItem('ngt_user') || 'Administrator'; }
  catch(e){ return 'Administrator'; }
}
async function auditLog(action, entity, entityId, before, after, reason){
  const entry = {
    ts: nowISO(),
    user: currentUser(),
    action, entity, entityId: entityId || '',
    before: before ? JSON.stringify(before).slice(0, 2000) : '',
    after: after ? JSON.stringify(after).slice(0, 2000) : '',
    reason: reason || '',
    device: navigator.platform || '',
    agent: (navigator.userAgent || '').slice(0, 160)
  };
  try {
    const r = await FB.push('audit', entry);
    if (r && r.name) S.audit[r.name] = entry;
  } catch(e){ console.warn('Audit write failed', e); }
}

/* ---------------------------------------------------------------------------
   11. DERIVED ENTITY HELPERS
   --------------------------------------------------------------------------- */
function customerOutstanding(customerId){
  return round2(toArr(S.invoices)
    .filter(i => i.customerId === customerId && i.status !== 'draft' && i.status !== 'cancelled')
    .reduce((s,i) => s + invoiceBalance(i), 0));
}
function supplierOutstanding(supplierId){
  return round2(toArr(S.purchases)
    .filter(p => p.supplierId === supplierId)
    .reduce((s,p) => s + (num(p.total) - num(p.amountPaid)), 0));
}
function projectCost(projectId){
  const exp = toArr(S.expenses).filter(e => e.projectId === projectId).reduce((s,e) => s + num(e.amount), 0);
  const bills = toArr(S.purchases).filter(p => p.projectId === projectId).reduce((s,p) => s + num(p.total), 0);
  return round2(exp + bills);
}
function projectRevenue(projectId){
  return round2(toArr(S.invoices).filter(i => i.projectId === projectId && i.status !== 'cancelled')
    .reduce((s,i) => s + num(i.total), 0));
}
function projectProfit(projectId){
  const p = S.projects[projectId];
  const rev = projectRevenue(projectId) || num(p && p.quotedValue);
  return round2(rev - projectCost(projectId));
}
function assetBookValue(a){
  const cost = num(a.purchaseCost);
  if (a.depMethod === 'none' || !a.purchaseDate) return cost;
  const life = num(a.usefulLife) || 5;
  const salvage = num(a.salvage);
  const years = Math.max(0, daysBetween(a.purchaseDate, todayISO()) / 365.25);
  const dep = Math.min(cost - salvage, ((cost - salvage) / life) * years);
  return round2(Math.max(salvage, cost - dep));
}
function agentCommission(agentId){
  return round2(toArr(S.invoices)
    .filter(i => i.agentId === agentId && i.status !== 'cancelled')
    .reduce((s,i) => s + (num(i.total) * num(i.commissionRate) / 100), 0));
}
function brokerageMargin(r){
  return round2((num(r.sellingPrice) - num(r.supplierCost)) * (num(r.quantity) || 1) - num(r.deliveryCost) - num(r.otherCost));
}
function hpBalance(r){
  return round2(num(r.productPrice) - num(r.amountPaid));
}
function budgetActual(b){
  const mk = b.period;
  if (!mk) return 0;
  if (b.type === 'revenue') {
    return round2(invoicesInRange(mk + '-01', mk + '-31').reduce((s,i) => s + num(i.total), 0));
  }
  return round2(expensesInRange(mk + '-01', mk + '-31')
    .filter(e => !b.accountId || e.accountId === b.accountId)
    .reduce((s,e) => s + num(e.amount), 0));
}

let CURRENT_ROUTE = 'dashboard';
let ROUTE_PARAM = null;

function navigate(route, param){
  CURRENT_ROUTE = route;
  ROUTE_PARAM = param || null;
  location.hash = '#/' + route + (param ? '/' + param : '');
  renderRoute();
}
window.navigate = navigate;

function renderRoute(){
  const parts = (location.hash || '#/dashboard').replace(/^#\/?/, '').split('/');
  const route = parts[0] || 'dashboard';
  const param = parts[1] || null;
  CURRENT_ROUTE = route;
  ROUTE_PARAM = param;

  // nav highlight
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === route));

  const meta = findNavMeta(route);
  $('#pageTitle').innerHTML = esc(meta.label) + '<span>' + esc(meta.sub || '') + '</span>';

  const view = $('#view');
  try {
    if (route === 'dashboard')        view.innerHTML = viewDashboard();
    else if (route === 'accounts')    view.innerHTML = viewEntity('accounts');
    else if (route === 'customers')   view.innerHTML = viewEntity('customers');
    else if (route === 'suppliers')   view.innerHTML = viewEntity('suppliers');
    else if (route === 'items' || route === 'inventory') view.innerHTML = viewEntity('items');
    else if (route === 'projects')    view.innerHTML = viewEntity('projects');
    else if (route === 'assets')      view.innerHTML = viewEntity('assets');
    else if (route === 'liabilities') view.innerHTML = viewEntity('liabilities');
    else if (route === 'agents')      view.innerHTML = viewEntity('agents');
    else if (route === 'employees')   view.innerHTML = viewEntity('employees');
    else if (route === 'brokerage')   view.innerHTML = viewEntity('brokerage');
    else if (route === 'budgets')     view.innerHTML = viewEntity('budgets');
    else if (route === 'hirepurchase')view.innerHTML = viewEntity('hirepurchase');
    else if (route === 'invoices')    view.innerHTML = viewEntity('invoices');
    else if (route === 'quotations')  view.innerHTML = viewEntity('quotations');
    else if (route === 'purchases')   view.innerHTML = viewEntity('purchases');
    else if (route === 'payments')    view.innerHTML = viewPayments();
    else if (route === 'expenses')    view.innerHTML = viewExpenses();
    else if (route === 'journal')     view.innerHTML = viewJournal();
    else if (route === 'ledger')      view.innerHTML = viewLedger();
    else if (route === 'banking')     view.innerHTML = viewBanking();
    else if (route === 'tax')         view.innerHTML = viewTax();
    else if (route === 'recon')       view.innerHTML = viewReconciliation();
    else if (route === 'receivables') view.innerHTML = viewAging('ar');
    else if (route === 'payables')    view.innerHTML = viewAging('ap');
    else if (route === 'reports')     view.innerHTML = viewReports();
    else if (route === 'profitability') view.innerHTML = viewProfitability();
    else if (route === 'networth')    view.innerHTML = viewNetWorth();
    else if (route === 'audit')       view.innerHTML = viewAudit();
    else if (route === 'settings')    view.innerHTML = viewSettings();
    else view.innerHTML = '<div class="card"><div class="empty"><i class="fa-solid fa-compass"></i>Module not found.</div></div>';
  } catch(err){
    console.error(err);
    view.innerHTML = '<div class="card"><div class="alert err"><i class="fa-solid fa-circle-exclamation"></i><div><strong>Render error:</strong> ' + esc(err.message) + '</div></div></div>';
  }
  updateTopChips();
  bindViewEvents();
}

function findNavMeta(route){
  for (const sec of NAV){
    for (const it of sec.items){
      if (it.id === route) return { label: it.label, sub: sec.section };
    }
  }
  return { label: cap(route), sub: '' };
}

function updateTopChips(){
  const d = new Date();
  $('#todayChip').textContent = d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  const cp = cashPosition();
  $('#cashChip').textContent = money(cp.total, 0);

let ENTITY_STATE = {};

function viewEntity(key){
  const ent = ENTITIES[key];
  if (!ent) return '<div class="card"><div class="empty">Unknown module.</div></div>';

  const st = ENTITY_STATE[key] || (ENTITY_STATE[key] = { q:'', sort:null, dir:'asc' });
  let rows = toArr(S[ent.path] || {});

  if (st.q) {
    const q = st.q.toLowerCase();
    rows = rows.filter(r => (ent.search || ['name']).some(k => String(r[k] || '').toLowerCase().includes(q)));
  }
  if (st.sort) rows = sortBy(rows, st.sort, st.dir);
  else rows = sortBy(rows, ent.columns[0].k, 'desc');

  const cols = ent.columns;

  return `
  <div class="toolbar">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="entSearch" placeholder="Search ${esc(ent.label.toLowerCase())}…" value="${esc(st.q)}">
    </div>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" onclick="exportEntity('${key}')"><i class="fa-solid fa-file-csv"></i> Export</button>

function renderField(f, val, rec){
  const w = f.w === 'half' ? 'style="grid-column:span 1"' : (f.w === 'full' ? 'class="full"' : '');
  const lbl = `<label for="f_${f.k}">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  const nm = `name="${f.k}" id="f_${f.k}"`;

  switch (f.t) {
    case 'textarea':
      return `<div class="field ${f.w === 'full' ? 'full' : ''}">${lbl}<textarea ${nm} rows="3">${esc(val)}</textarea></div>`;
    case 'checkbox':
      return `<div class="field ${f.w === 'full' ? 'full' : ''}" style="justify-content:flex-end">
        <label style="display:flex;align-items:center;gap:.5rem;text-transform:none;letter-spacing:0;font-size:.82rem;color:#b7cbe4;cursor:pointer">
        <input type="checkbox" ${nm} ${val ? 'checked' : ''} style="width:16px;height:16px"> ${esc(f.l)}</label></div>`;
    case 'select':
    case 'ref': {
      let opts = [];
      if (f.t === 'ref') {
        let list = toArr(S[f.ref] || {});
        if (f.filter) list = list.filter(f.filter);
        opts = list.map(o => ({ v:o.id, l:(o.code ? o.code + ' · ' : '') + (o.name || o.number || o.id) }));
      } else {
        opts = f.opts || [];
      }
      return `<div class="field ${f.w === 'full' ? 'full' : ''}">${lbl}
        <select ${nm}>
          <option value="">— Select —</option>
          ${opts.map(o => `<option value="${esc(o.v)}" ${String(val) === String(o.v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}
        </select></div>`;
    }
    case 'flags': {
      const flags = val || {};
      const defs = [
        ['cash','Cash Account'],['petty','Petty Cash'],['mpesa','M-Pesa Account'],
        ['bank','Bank Account'],['receivable','Accounts Receivable'],['payable','Accounts Payable'],
        ['inventory','Inventory'],['tax','Tax Account']
      ];
      return `<div class="field full">${lbl}
        <div style="display:flex;gap:.9rem;flex-wrap:wrap;padding:.6rem .7rem;background:#0f1824;border:1px solid var(--line-2);border-radius:10px">
        ${defs.map(([k,l]) => `<label style="display:flex;align-items:center;gap:.4rem;font-size:.76rem;color:#b7cbe4;text-transform:none;letter-spacing:0;cursor:pointer">
          <input type="checkbox" data-flag="${k}" ${flags[k] ? 'checked' : ''} style="width:15px;height:15px"> ${l}</label>`).join('')}
        </div></div>`;
    }
    case 'month':
      return `<div class="field ${f.w === 'full' ? 'full' : ''}">${lbl}<input type="month" ${nm} value="${esc(val)}"></div>`;
    default:
      return `<div class="field ${f.w === 'full' ? 'full' : ''}">${lbl}<input type="${f.t || 'text'}" ${nm} value="${esc(val === undefined || val === null ? '' : val)}" ${f.t === 'number' ? 'step="0.01"' : ''}></div>`;
  }
}

async function saveEntityForm(key, id){
  const ent = ENTITIES[key];
  const form = $('#entityForm');
  if (!form) return;

  const data = {};
  // validate required
  for (const f of ent.fields) {
    if (f.req) {
      const el = form.querySelector('[name="' + f.k + '"]');
      if (el && !String(el.value).trim()) { toast('“' + f.l + '” is required.', 'err'); el.focus(); return; }
    }
  }
  for (const f of ent.fields) {
    const el = form.querySelector('[name="' + f.k + '"]');
    if (!el) continue;
    if (f.t === 'checkbox') data[f.k] = el.checked;
    else if (f.t === 'number') data[f.k] = num(el.value);
    else if (f.t === 'flags') {
      const flags = {};
      form.querySelectorAll('[data-flag]').forEach(cb => { flags[cb.dataset.flag] = cb.checked; });
      data[f.k] = flags;
    } else data[f.k] = el.value;
  }

  if (key === 'accounts' && !id) {
    // duplicate code check
    const dup = toArr(S.accounts).find(a => a.code === data.code);
    if (dup) { toast('An account with code ' + data.code + ' already exists.', 'err'); return; }
  }

  try {
    const before = id ? JSON.parse(JSON.stringify(S[ent.path][id])) : null;
    data.updatedAt = nowISO();
    if (!id) data.createdAt = nowISO();

    // Auto-generate code if missing
    if (!data.code && ent.prefix) {
      data.code = await nextNumber(ent.prefix);
    }

    // denormalise customer name for invoices etc.
    if (data.customerId && S.customers[data.customerId]) data.customerName = S.customers[data.customerId].name;
    if (data.supplierId && S.suppliers[data.supplierId]) data.supplierName = S.suppliers[data.supplierId].name;

    const newId = await Store.save(ent.path, id, data);
    await auditLog(id ? 'UPDATE' : 'CREATE', ent.path, id || newId, before, data);
    toast(ent.label.replace(/s$/,'') + ' ' + (id ? 'updated' : 'created') + ' successfully.', 'ok');
    closeModal();
    renderRoute();
    updateTopChips();
  } catch(err){
    console.error(err);
    toast('Save failed: ' + err.message, 'err', 6000);
  }
}
window.saveEntityForm = saveEntityForm;

function deleteEntity(key, id){
  const ent = ENTITIES[key];
  const rec = S[ent.path][id];
  const label = rec ? (rec.name || rec.number || rec.code || id) : id;

  // Financial documents must never be silently deleted
  const protectedKeys = ['invoices','payments','expenses','journal','purchases'];
  if (protectedKeys.includes(key)) {
    toast('Financial documents cannot be deleted. Use reversal or cancellation instead.', 'warn', 5000);
    return;
  }

  confirmDialog('Delete ' + ent.label.replace(/s$/,''),
    'Permanently delete <strong>' + esc(label) + '</strong>? This action is logged in the audit trail.',
    async () => {
      try {
        await auditLog('DELETE', ent.path, id, rec, null);
        await Store.remove(ent.path, id);
        toast('Record deleted.', 'ok');
        renderRoute();
      } catch(err){ toast('Delete failed: ' + err.message, 'err'); }
    }, 'Delete', true);
}
window.deleteEntity = deleteEntity;

function emptyLine(isRevenue){
  const accs = isRevenue ? revenueAccounts() : expenseAccounts().concat(
    toArr(S.accounts).filter(a => a.subtype === 'cogs' || (a.type === 'asset' && a.flags && a.flags.inventory))
  );
  const def = accs.length ? accs[0].id : '';
  return { description:'', qty:1, price:0, accountId:def, itemId:'' };
}
function addDocLine(isRevenue){ DOC_LINES.push(emptyLine(isRevenue)); renderDocLines(isRevenue); recalcDoc(); }
function addFromInventory(isRevenue){
  const items = toArr(S.items).filter(i => i.trackStock !== false);
  if (!items.length) { toast('No inventory items defined yet.', 'warn'); return; }
  openModal(`
    <div class="modal-head"><h3><i class="fa-solid fa-boxes-stacked"></i> Add from Inventory</h3>
      <button class="close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="field"><label>Item</label>
        <select id="pickItem"><option value="">— Select Item —</option>
          ${items.map(i => `<option value="${i.id}">${esc((i.sku ? i.sku + ' · ' : '') + i.name + ' — ' + money(isRevenue ? i.price : i.cost))}</option>`).join('')}
        </select></div>
      <div class="field"><label>Quantity</label><input type="number" id="pickQty" value="1" step="1"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="pickAdd">Add Line</button>
    </div>`, 'narrow');

  $('#pickAdd').onclick = () => {
    const iid = $('#pickItem').value;
    const qty = num($('#pickQty').value) || 1;
    const item = S.items[iid];
    if (!item) { toast('Select an item.', 'err'); return; }
    const acc = isRevenue
      ? (revenueAccounts()[0] || {}).id
      : (expenseAccounts()[0] || {}).id;
    DOC_LINES.push({
      description: item.name,
      qty,
      price: isRevenue ? num(item.price) : num(item.cost),
      accountId: item.revenueAccountId || acc,

    });

    renderDocLines(isRevenue);

  };
}
window.addDocLine = addDocLine;
window.addFromInventory = addFromInventory;

function renderDocLines(isRevenue){
  const tbody = $('#docLinesBody');
  if (!tbody) return;
  const accs = (isRevenue ? revenueAccounts() : expenseAccounts()).concat(
    isRevenue ? [] : toArr(S.accounts).filter(a => a.flags && a.flags.inventory)
  );
  const unique = [];
  const seen = new Set();
  accs.forEach(a => { if (!seen.has(a.id)) { seen.add(a.id); unique.push(a); } });

  tbody.innerHTML = DOC_LINES.map((l, idx) => `
    <tr>
      <td><input type="text" data-i="${idx}" data-f="description" value="${esc(l.description)}" placeholder="Description…"></td>
      <td><input type="number" data-i="${idx}" data-f="qty" value="${esc(l.qty)}" step="0.01" oninput="recalcDoc()"></td>
      <td><input type="number" data-i="${idx}" data-f="price" value="${esc(l.price)}" step="0.01" oninput="recalcDoc()"></td>
      <td><select data-i="${idx}" data-f="accountId">
        ${unique.map(a => `<option value="${a.id}" ${l.accountId === a.id ? 'selected' : ''}>${esc(a.code + ' · ' + a.name)}</option>`).join('')}
      </select></td>
      <td class="num mono" id="lineAmt_${idx}">${plainNum(num(l.qty) * num(l.price))}</td>
      <td><button type="button" class="btn btn-ghost btn-xs" onclick="removeDocLine(${idx},${isRevenue})"><i class="fa-solid fa-xmark"></i></button></td>
    </tr>`).join('');

  tbody.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.dataset.i, f = el.dataset.f;
      DOC_LINES[i][f] = (el.type === 'number') ? num(el.value) : el.value;
      if (f === 'qty' || f === 'price') {
        const amtCell = document.getElementById('lineAmt_' + i);
        if (amtCell) amtCell.textContent = plainNum(num(DOC_LINES[i].qty) * num(DOC_LINES[i].price));
      }
      recalcDoc();
    });
    el.addEventListener('change', () => {
      const i = +el.dataset.i, f = el.dataset.f;
      DOC_LINES[i][f] = el.value;
      recalcDoc();
    });
  });
}
function removeDocLine(idx, isRevenue){
  DOC_LINES.splice(idx, 1);
  if (!DOC_LINES.length) DOC_LINES.push(emptyLine(isRevenue));
  renderDocLines(isRevenue);
  recalcDoc();
}
window.removeDocLine = removeDocLine;

function docTotals(){
  const subtotal = round2(DOC_LINES.reduce((s,l) => s + num(l.qty) * num(l.price), 0));
  const discount = num($('#docDiscount') ? $('#docDiscount').value : 0);
  const taxRate  = num($('#docTaxRate') ? $('#docTaxRate').value : 0);
  const taxable  = Math.max(0, subtotal - discount);
  const tax      = round2(taxable * taxRate / 100);
  const total    = round2(taxable + tax);
  return { subtotal, discount, taxRate, tax, total };
}
function recalcDoc(){
  const t = docTotals();
  const el = $('#docTotals');
  if (el) {
    el.innerHTML = `
      <div class="trow"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div>
      <div class="trow"><span>Discount</span><strong>−${money(t.discount)}</strong></div>
      <div class="trow"><span>Taxable Amount</span><strong>${money(Math.max(0, t.subtotal - t.discount))}</strong></div>
      <div class="trow"><span>Tax (${t.taxRate}%)</span><strong>${money(t.tax)}</strong></div>
      <div class="trow grand"><span>TOTAL</span><span>${money(t.total)}</span></div>`;
  }
}
window.recalcDoc = recalcDoc;

async function saveDocument(type, id){
  const config = {
    quotations: { path:'quotations', prefix:'QUO', revenue:true },
    invoices:   { path:'invoices',   prefix:'INV', revenue:true },
    purchases:  { path:'purchases',  prefix:'BILL', revenue:false }
  }[type];

  const partyId = $('#docParty').value;
  if (!partyId) { toast('Please select a ' + (config.revenue ? 'customer' : 'supplier') + '.', 'err'); return; }
  const date = $('#docDate').value;
  if (!date) { toast('Date is required.', 'err'); return; }
  if (!DOC_LINES.some(l => num(l.qty) * num(l.price) !== 0)) { toast('Add at least one line item with a value.', 'err'); return; }

  const t = docTotals();
  const partyName = config.revenue
    ? (S.customers[partyId] ? S.customers[partyId].name : '')
    : (S.suppliers[partyId] ? S.suppliers[partyId].name : '');

  const data = {
    number: id ? S[config.path][id].number : await nextNumber(config.prefix),
    date,
    dueDate: $('#docDue').value || '',
    validUntil: type === 'quotations' ? ($('#docDue').value || '') : undefined,
    division: $('#docDivision').value || 'General',
    projectId: $('#docProject').value || '',
    status: $('#docStatus').value,
    lines: DOC_LINES.map(l => ({
      description: l.description,
      qty: num(l.qty),
      price: num(l.price),
      amount: round2(num(l.qty) * num(l.price)),
      accountId: l.accountId,
      itemId: l.itemId || ''
    })),
    subtotal: t.subtotal,
    discount: t.discount,
    taxRate: t.taxRate,
    tax: t.tax,
    total: t.total,
    notes: $('#docNotes').value,
    updatedAt: nowISO()
  };
  if (!id) data.createdAt = nowISO();

  if (config.revenue) {
    data.customerId = partyId;
    data.customerName = partyName;
    const agentEl = $('#docAgent');
    if (agentEl && agentEl.value) {
      data.agentId = agentEl.value;
      data.commissionRate = num($('#docComm').value);
    }
  } else {
    data.supplierId = partyId;
    data.supplierName = partyName;
  }

  if (type === 'invoices') {
    data.amountPaid = id ? num(S.invoices[id].amountPaid) : 0;
  }
  if (type === 'purchases') {
    data.amountPaid = id ? num(S.purchases[id].amountPaid) : 0;
  }

  try {
    const before = id ? JSON.parse(JSON.stringify(S[config.path][id])) : null;

    // Reverse previous journal if editing a posted invoice
    if (id && before && before.journalId && S.journal[before.journalId] && !S.journal[before.journalId].reversed) {
      await reverseJournal(before.journalId, 'Invoice edited — superseded');
    }

    const newId = await Store.save(config.path, id, data);

    // Post to General Ledger
    if (type === 'invoices' || type === 'purchases') {
      const jid = await postDocumentJournal(type, newId, data);
      data.journalId = jid;
      await FB.set(config.path + '/' + newId + '/journalId', jid);
      S[config.path][newId].journalId = jid;
    }

    await auditLog(id ? 'UPDATE' : 'CREATE', config.path, id || newId, before, data);
    toast(config.path.replace(/s$/,'') + ' ' + (id ? 'updated' : 'created') + ' and posted to the ledger.', 'ok');
    closeModal();
    renderRoute();
    updateTopChips();
  } catch(err){
    console.error(err);
    toast('Save failed: ' + err.message, 'err', 7000);
  }
}

/** Create the double-entry journal for an invoice or purchase bill */
async function postDocumentJournal(type, docId, doc){
  const arAcc = accountByFlag('receivable')[0];
  const apAcc = accountByFlag('payable')[0];
  const vatPayable = accountByCode('2040');
  const vatInput   = accountByCode('1100');

  const lines = [];

  if (type === 'invoices') {
    if (!arAcc) throw new Error('Accounts Receivable account not found. Load the Chart of Accounts in Settings.');
    lines.push({ accountId: arAcc.id, description: 'Invoice ' + doc.number, debit: doc.total, credit: 0 });
    (doc.lines || []).forEach(l => {
      if (!l.accountId) return;
      const amt = round2(num(l.amount));
      if (amt === 0) return;
      lines.push({ accountId: l.accountId, description: l.description, debit: 0, credit: amt });
    });
    if (num(doc.tax) !== 0 && vatPayable) {
      lines.push({ accountId: vatPayable.id, description: 'VAT on ' + doc.number, debit: 0, credit: num(doc.tax) });
    }
    // Apply discount as negative revenue adjustment if any
    if (num(doc.discount) !== 0) {
      const firstRev = (doc.lines || []).find(l => l.accountId);
      if (firstRev) {
        lines.push({ accountId: firstRev.accountId, description: 'Discount on ' + doc.number, debit: num(doc.discount), credit: 0 });
      }
    }
  } else {
    if (!apAcc) throw new Error('Accounts Payable account not found. Load the Chart of Accounts in Settings.');
    lines.push({ accountId: apAcc.id, description: 'Bill ' + doc.number, debit: 0, credit: doc.total });
    (doc.lines || []).forEach(l => {
      if (!l.accountId) return;
      const amt = round2(num(l.amount));
      if (amt === 0) return;
      lines.push({ accountId: l.accountId, description: l.description, debit: amt, credit: 0 });
    });
    if (num(doc.tax) !== 0 && vatInput) {
      lines.push({ accountId: vatInput.id, description: 'VAT input on ' + doc.number, debit: num(doc.tax), credit: 0 });
    }
    if (num(doc.discount) !== 0) {
      const firstExp = (doc.lines || []).find(l => l.accountId);
      if (firstExp) lines.push({ accountId: firstExp.accountId, description: 'Discount on ' + doc.number, debit: 0, credit: num(doc.discount) });
    }
  }

  // Balance rounding
  const td = round2(lines.reduce((s,l) => s + num(l.debit), 0));
  const tc = round2(lines.reduce((s,l) => s + num(l.credit), 0));
  const diff = round2(td - tc);
  if (Math.abs(diff) > 0.009) {
    const plugAcc = type === 'invoices' ? (vatPayable || arAcc) : (vatInput || apAcc);
    if (plugAcc) {
      if (diff > 0) lines.push({ accountId: plugAcc.id, description: 'Rounding adjustment', debit: 0, credit: diff });
      else lines.push({ accountId: plugAcc.id, description: 'Rounding adjustment', debit: -diff, credit: 0 });
    }
  }

  return await postJournal({
    date: doc.date,
    memo: (type === 'invoices' ? 'Sales invoice ' : 'Purchase bill ') + doc.number + ' — ' + (doc.customerName || doc.supplierName || ''),
    ref: doc.number,
    source: type,
    sourceId: docId,
    lines
  });
}

async function savePayment(direction){
  const isIn = direction === 'in';
  const date = $('#payDate').value;
  const amount = num($('#payAmount').value);
  const docId = $('#payDoc').value;
  const accountId = $('#payAccount').value;
  const method = $('#payMethod').value;
  const ref = $('#payRef').value;
  const notes = $('#payNotes').value;

  if (!date) { toast('Date is required.', 'err'); return; }
  if (amount <= 0) { toast('Amount must be greater than zero.', 'err'); return; }
  if (!accountId) { toast('Select the cash/bank/M-Pesa account.', 'err'); return; }

  try {
    let doc = null, partyId = '', partyName = '', docNumber = '';
    if (docId) {
      doc = isIn ? S.invoices[docId] : S.purchases[docId];
      if (doc) {
        const bal = num(doc.total) - num(doc.amountPaid);
        if (amount > bal + 0.01) {
          const proceed = confirm('Payment of ' + money(amount) + ' exceeds the outstanding balance of ' + money(bal) + '. Continue anyway?');
          if (!proceed) return;
        }
        partyId = isIn ? doc.customerId : doc.supplierId;
        partyName = isIn ? doc.customerName : doc.supplierName;
        docNumber = doc.number;
      }
    }

    const acc = accountById(accountId);
    const number = await nextNumber(isIn ? 'RCP' : 'PAY');

    const payment = {
      number, date, direction, amount: round2(amount),
      method, reference: ref, notes,
      accountId, accountName: acc ? acc.name : '',
      partyId, partyName,
      docId: docId || '', docNumber,
      createdAt: nowISO(), createdBy: currentUser()
    };

    const pid = await Store.save('payments', null, payment);

    // ---- Post journal ----
    const controlAcc = isIn ? accountByFlag('receivable')[0] : accountByFlag('payable')[0];
    if (!controlAcc) throw new Error('Control account not found. Load the Chart of Accounts.');

    const lines = isIn
      ? [
          { accountId, description: 'Receipt from ' + partyName, debit: amount, credit: 0 },
          { accountId: controlAcc.id, description: 'Receipt ' + number, debit: 0, credit: amount }
        ]
      : [
          { accountId: controlAcc.id, description: 'Payment ' + number, debit: amount, credit: 0 },
          { accountId, description: 'Payment to ' + partyName, debit: 0, credit: amount }
        ];

    const jid = await postJournal({
      date, memo: (isIn ? 'Customer receipt ' : 'Supplier payment ') + number + ' — ' + (partyName || 'Unallocated'),
      ref: number, source: isIn ? 'receipt' : 'payment', sourceId: pid, lines
    });

    await FB.set('payments/' + pid + '/journalId', jid);
    S.payments[pid].journalId = jid;

    // ---- Update document ----
    if (doc && docId) {
      const newPaid = round2(num(doc.amountPaid) + amount);
      const path = isIn ? 'invoices' : 'purchases';
      await FB.set(path + '/' + docId + '/amountPaid', newPaid);
      S[path][docId].amountPaid = newPaid;
      const bal = round2(num(doc.total) - newPaid);
      const newStatus = bal <= 0.005 ? 'paid' : (newPaid > 0 ? 'partial' : 'unpaid');
      await FB.set(path + '/' + docId + '/status', newStatus);
      S[path][docId].status = newStatus;

      await auditLog('PAYMENT', path, docId, { amountPaid: doc.amountPaid }, { amountPaid: newPaid, status: newStatus });
    }

    await auditLog('CREATE', 'payments', pid, null, payment);
    toast('Payment ' + number + ' recorded and posted.', 'ok');
    closeModal();
    renderRoute();
    updateTopChips();
  } catch(err){
    console.error(err);
    toast('Payment failed: ' + err.message, 'err', 7000);
  }
}

function reversePayment(id){
  const p = S.payments[id];
  if (!p) return;
  confirmDialog('Reverse Payment',
    'This creates a reversing journal entry and restores the invoice balance. The original record is retained for audit purposes.',
    async () => {
      try {
        if (p.journalId && S.journal[p.journalId] && !S.journal[p.journalId].reversed) {
          await reverseJournal(p.journalId, 'Payment reversed by user');
        }
        if (p.docId) {
          const path = p.direction === 'out' ? 'purchases' : 'invoices';
          const doc = S[path][p.docId];
          if (doc) {
            const newPaid = Math.max(0, round2(num(doc.amountPaid) - num(p.amount)));
            await FB.set(path + '/' + p.docId + '/amountPaid', newPaid);
            S[path][p.docId].amountPaid = newPaid;
            const bal = round2(num(doc.total) - newPaid);
            const st = bal <= 0.005 ? 'paid' : (newPaid > 0 ? 'partial' : 'unpaid');
            await FB.set(path + '/' + p.docId + '/status', st);
            S[path][p.docId].status = st;
          }
        }
        p.reversed = true;
        p.reversedAt = nowISO();
        await FB.set('payments/' + id, p);
        await auditLog('REVERSE', 'payments', id, p, { reversed: true });
        toast('Payment reversed.', 'ok');
        renderRoute();
        updateTopChips();
      } catch(err){ toast('Reversal failed: ' + err.message, 'err'); }
    }, 'Reverse Payment', true);
}
window.reversePayment = reversePayment;

async function saveExpense(){
  const date = $('#expDate').value;
  const amount = num($('#expAmount').value);
  const accountId = $('#expAccount').value;
  const payAccountId = $('#expPayAccount').value;

  if (!date) { toast('Date is required.', 'err'); return; }
  if (amount <= 0) { toast('Amount must be greater than zero.', 'err'); return; }
  if (!accountId || !payAccountId) { toast('Select category and payment account.', 'err'); return; }

  try {
    const number = await nextNumber('EXP');
    const supplierId = $('#expSupplier').value;
    const supplierName = supplierId && S.suppliers[supplierId] ? S.suppliers[supplierId].name : '';

    const exp = {
      number, date, amount: round2(amount),
      accountId, payAccountId,
      description: $('#expDesc').value,
      method: $('#expMethod').value,
      supplierId, supplierName,
      projectId: $('#expProject').value || '',
      division: $('#expDivision').value,
      receipt: $('#expReceipt').value,
      approvedBy: $('#expApproved').value,
      notes: $('#expNotes').value,
      createdAt: nowISO(), createdBy: currentUser()
    };

    const eid = await Store.save('expenses', null, exp);

    const jid = await postJournal({
      date,
      memo: 'Expense ' + number + ' — ' + (exp.description || accountById(accountId).name),
      ref: number, source: 'expense', sourceId: eid,
      lines: [
        { accountId, description: exp.description || 'Expense', debit: amount, credit: 0 },
        { accountId: payAccountId, description: 'Payment for ' + number, debit: 0, credit: amount }
      ]
    });

    await FB.set('expenses/' + eid + '/journalId', jid);
    S.expenses[eid].journalId = jid;

    await auditLog('CREATE', 'expenses', eid, null, exp);
    toast('Expense ' + number + ' recorded and posted.', 'ok');
    closeModal();
    renderRoute();
    updateTopChips();
  } catch(err){
    console.error(err);
    toast('Failed: ' + err.message, 'err', 6000);
  }
}

function reverseExpense(id){
  const e = S.expenses[id];
  if (!e) return;
  confirmDialog('Reverse Expense',
    'A reversing journal entry will be created. The original expense record will be marked as reversed but retained.',
    async () => {
      try {
        if (e.journalId && S.journal[e.journalId] && !S.journal[e.journalId].reversed) {
          await reverseJournal(e.journalId, 'Expense reversed by user');
        }
        e.reversed = true;
        e.reversedAt = nowISO();
        await FB.set('expenses/' + id, e);
        await auditLog('REVERSE', 'expenses', id, e, { reversed: true });
        toast('Expense reversed.', 'ok');
        renderRoute();
        updateTopChips();
      } catch(err){ toast('Reversal failed: ' + err.message, 'err'); }
    }, 'Reverse', true);
}
window.reverseExpense = reverseExpense;

function renderMJ(){
  const accs = sortBy(toArr(S.accounts), 'code');
  const tbody = $('#mjBody');
  if (!tbody) return;
  tbody.innerHTML = MJ_LINES.map((l, i) => `

        <option value="">— Select account —</option>
        ${accs.map(a => `<option value="${a.id}" ${l.accountId === a.id ? 'selected' : ''}>${esc(a.code + ' · ' + a.name)}</option>`).join('')}
      </select></td>
      <td><input type="text" data-mj="${i}" data-f="description" value="${esc(l.description)}"></td>
      <td><input type="number" step="0.01" data-mj="${i}" data-f="debit" value="${esc(l.debit)}" style="text-align:right"></td>
      <td><input type="number" step="0.01" data-mj="${i}" data-f="credit" value="${esc(l.credit)}" style="text-align:right"></td>
      <td><button class="btn btn-ghost btn-xs" onclick="removeMJLine(${i})"><i class="fa-solid fa-xmark"></i></button></td>
    </tr>`).join('');

  tbody.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.dataset.mj, f = el.dataset.f;
      MJ_LINES[i][f] = el.value;
      updateMJBalance();
    });
  });
  updateMJBalance();
}
function addMJLine(){ MJ_LINES.push({ accountId:'', description:'', debit:'', credit:'' }); renderMJ(); }
function removeMJLine(i){ MJ_LINES.splice(i, 1); if (!MJ_LINES.length) addMJLine(); else renderMJ(); }

function updateMJBalance(){
  const d = round2(MJ_LINES.reduce((s,l) => s + num(l.debit), 0));
  const c = round2(MJ_LINES.reduce((s,l) => s + num(l.credit), 0));
  const diff = round2(d - c);
  const el = $('#mjBalance');
  if (el) {
    el.innerHTML = `Debits <strong>${money(d)}</strong> &nbsp;·&nbsp; Credits <strong>${money(c)}</strong> &nbsp;·&nbsp;
      <span style="color:${Math.abs(diff) < 0.01 ? 'var(--ok)' : 'var(--danger)'}">
      ${Math.abs(diff) < 0.01 ? '✓ Balanced' : 'Out by ' + money(Math.abs(diff))}</span>`;
  }
}

async function postManualJournal(){
  const date = $('#mjDate').value;
  const memo = $('#mjMemo').value.trim();
  if (!date) { toast('Date is required.', 'err'); return; }
  if (!memo) { toast('Memo is required.', 'err'); return; }

  const lines = MJ_LINES
    .filter(l => l.accountId && (num(l.debit) || num(l.credit)))
    .map(l => ({ accountId: l.accountId, description: l.description, debit: num(l.debit), credit: num(l.credit) }));

  if (lines.length < 2) { toast('At least two lines are required.', 'err'); return; }

  try {
    await postJournal({ date, memo, ref: $('#mjRef').value || '', source:'manual', lines });
    toast('Journal entry posted successfully.', 'ok');
    closeModal();
    renderRoute();
  } catch(err){ toast(err.message, 'err', 6000); }
}

function viewTax(){

  const allBills = toArr(S.purchases);

  const outputVAT = round2(allInv.reduce((s,i) => s + num(i.tax), 0));
  const inputVAT  = round2(allBills.reduce((s,b) => s + num(b.tax), 0));
  const netVAT    = round2(outputVAT - inputVAT);

  const mk = monthKey();
  const mInv = allInv.filter(i => (i.date || '').slice(0,7) === mk);

      ${['2040','2060','2070'].map(code => {
        const a = accountByCode(code);

        return `<div class="rep-row"><span class="lbl">${esc(a.code)} · ${esc(a.name)}</span><strong>${money(accountBalance(a.id))}</strong></div>`;

function viewReconciliation(){
  const payments = toArr(S.payments);
  const unmatchedReceipts = payments.filter(p => !p.docId && p.direction !== 'out');
  const unmatchedPayouts  = payments.filter(p => !p.docId && p.direction === 'out');

  // Duplicate detection
  const dupes = [];
  const seen = {};
  payments.forEach(p => {
    const key = [p.date, p.amount, p.partyId, p.method].join('|');
    if (seen[key]) dupes.push([seen[key], p]);
    else seen[key] = p;
  });

  const invoicesNoJournal = toArr(S.invoices).filter(i => i.status !== 'draft' && !i.journalId);
  const expensesNoJournal = toArr(S.expenses).filter(e => !e.journalId && !e.reversed);

  const controls = toArr(S.accounts).filter(a => (a.flags && (a.flags.receivable || a.flags.payable)));
  const ledgerAR = totalReceivable();
  const ledgerAP = totalPayable();
  const subAR = round2(toArr(S.invoices)
    .filter(i => i.status !== 'draft' && i.status !== 'cancelled')
    .reduce((s,i) => s + invoiceBalance(i), 0));
  const subAP = round2(toArr(S.purchases).reduce((s,b) => s + (num(b.total) - num(b.amountPaid)), 0));

  return `
  <div class="alert info"><i class="fa-solid fa-scale-balanced"></i>
    <div class="text-sm">The Reconciliation Centre compares the General Ledger against operational sub-ledgers and flags items needing attention. A healthy system shows zero variances and zero unmatched items.</div>
  </div>

  <div class="grid g2 mb2">
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-arrows-rotate"></i> Control Account Reconciliation</h3></div>
      <div class="rep-row"><span class="lbl">Accounts Receivable — Ledger Balance</span><strong>${money(ledgerAR)}</strong></div>
      <div class="rep-row"><span class="lbl">Accounts Receivable — Invoice Sub-ledger</span><strong>${money(subAR)}</strong></div>
      <div class="rep-row sub"><span class="lbl">Variance</span><strong class="${Math.abs(ledgerAR - subAR) < 0.5 ? 'pos' : 'neg'}">${money(ledgerAR - subAR)}</strong></div>
      <div class="divider"></div>
      <div class="rep-row"><span class="lbl">Accounts Payable — Ledger Balance</span><strong>${money(ledgerAP)}</strong></div>
      <div class="rep-row"><span class="lbl">Accounts Payable — Bill Sub-ledger</span><strong>${money(subAP)}</strong></div>
      <div class="rep-row sub"><span class="lbl">Variance</span><strong class="${Math.abs(ledgerAP - subAP) < 0.5 ? 'pos' : 'neg'}">${money(ledgerAP - subAP)}</strong></div>
    </div>

    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-triangle-exclamation"></i> Exceptions Detected</h3></div>
      <div class="rep-row"><span class="lbl">Unallocated Receipts</span><strong class="${unmatchedReceipts.length ? 'neg' : 'pos'}">${unmatchedReceipts.length}</strong></div>
      <div class="rep-row"><span class="lbl">Unallocated Payments</span><strong class="${unmatchedPayouts.length ? 'neg' : 'pos'}">${unmatchedPayouts.length}</strong></div>
      <div class="rep-row"><span class="lbl">Potential Duplicate Payments</span><strong class="${dupes.length ? 'neg' : 'pos'}">${dupes.length}</strong></div>
      <div class="rep-row"><span class="lbl">Invoices Missing Ledger Posting</span><strong class="${invoicesNoJournal.length ? 'neg' : 'pos'}">${invoicesNoJournal.length}</strong></div>
      <div class="rep-row"><span class="lbl">Expenses Missing Ledger Posting</span><strong class="${expensesNoJournal.length ? 'neg' : 'pos'}">${expensesNoJournal.length}</strong></div>
      <div class="divider"></div>
      <div class="rep-row"><span class="lbl">Ledger Balanced (Dr = Cr)</span><strong class="${(() => {
        const d = round2(toArr(S.journal).reduce((s,j) => s + num(j.totalDebit), 0));
        const c = round2(toArr(S.journal).reduce((s,s2) => s + num(s2.totalCredit), 0));
        return Math.abs(d - c) < 0.01 ? 'pos' : 'neg';
      })()}">${(() => {
        const d = round2(toArr(S.journal).reduce((s,j) => s + num(j.totalDebit), 0));
        const c = round2(toArr(S.journal).reduce((s,j) => s + num(j.totalCredit), 0));
        return Math.abs(d - c) < 0.01 ? 'YES' : 'NO — ' + money(d - c);
      })()}</strong></div>
    </div>
  </div>

  ${dupes.length ? `
  <div class="card mb2">
    <div class="card-head"><h3><i class="fa-solid fa-clone"></i> Suspected Duplicate Payments</h3></div>
    <div class="table-wrap"><table style="min-width:auto">
      <thead><tr><th>Date</th><th>Ref</th><th>Party</th><th class="num">Amount</th><th>Method</th></tr></thead>
      <tbody>${dupes.map(([a,b]) => `
        <tr><td>${fmtDate(b.date)}</td><td class="mono">${esc(b.number)}</td><td>${esc(b.partyName || '—')}</td>
        <td class="num">${plainNum(b.amount)}</td><td>${esc(b.method || '—')}</td></tr>
        <tr><td>${fmtDate(a.date)}</td><td class="mono">${esc(a.number)}</td><td>${esc(a.partyName || '—')}</td>
        <td class="num">${plainNum(a.amount)}</td><td>${esc(a.method || '—')}</td></tr>
      `).join('')}</tbody>
    </table></div>
  </div>` : ''}

  <div class="grid g2">
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-link-slash"></i> Unallocated Receipts</h3></div>
      ${unmatchedReceipts.length ? `<div class="table-wrap"><table style="min-width:auto">

        </tr>`).join('')}</tbody></table></div>` : '<div class="empty"><i class="fa-solid fa-circle-check"></i>All receipts allocated.</div>'}
    </div>
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-link-slash"></i> Unallocated Payments</h3></div>
      ${unmatchedPayouts.length ? `<div class="table-wrap"><table style="min-width:auto">
        <thead><tr><th>Date</th><th>Ref</th><th>Party</th><th class="num">Amount</th></tr></thead>
        <tbody>${unmatchedPayouts.slice(0,15).map(p => `<tr>
          <td>${fmtDate(p.date)}</td><td class="mono">${esc(p.number)}</td>
          <td>${esc(p.partyName || '—')}</td><td class="num">${plainNum(p.amount)}</td>
        </tr>`).join('')}</tbody></table></div>` : '<div class="empty"><i class="fa-solid fa-circle-check"></i>All payments allocated.</div>'}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------------
   24. VIEW: AGING (AR / AP)
   --------------------------------------------------------------------------- */
function viewAging(type){
  const isAR = type === 'ar';
  const docs = isAR
    ? toArr(S.invoices).filter(i => i.status !== 'draft' && i.status !== 'cancelled' && invoiceBalance(i) > 0.005)
    : toArr(S.purchases).filter(b => (num(b.total) - num(b.amountPaid)) > 0.005);

  const buckets = { current:0, b30:0, b60:0, b90:0, over90:0 };
  const rows = docs.map(d => {
    const due = d.dueDate || d.date || todayISO();
    const days = daysBetween(due, todayISO());
    const bal = isAR ? invoiceBalance(d) : (num(d.total) - num(d.amountPaid));
    let bucket = 'current';
    if (days > 90) { bucket = 'over90'; buckets.over90 += bal; }
    else if (days > 60) { bucket = 'b90'; buckets.b90 += bal; }
    else if (days > 30) { bucket = 'b60'; buckets.b60 += bal; }
    else if (days > 0)  { bucket = 'b30'; buckets.b30 += bal; }
    else buckets.current += bal;
    return { d, days, bal, bucket };
  }).sort((a,b) => b.days - a.days);

  const total = round2(Object.values(buckets).reduce((s,v) => s + v, 0));

  return `
  <div class="grid g5 mb2">
    <div class="kpi accent"><div class="k-label">Not Yet Due</div><div class="k-value sm">${money(buckets.current, 0)}</div></div>
    <div class="kpi"><div class="k-label">1–30 Days</div><div class="k-value sm">${money(buckets.b30, 0)}</div></div>
    <div class="kpi warn"><div class="k-label">31–60 Days</div><div class="k-value sm">${money(buckets.b60, 0)}</div></div>
    <div class="kpi warn"><div class="k-label">61–90 Days</div><div class="k-value sm">${money(buckets.b90, 0)}</div></div>
    <div class="kpi danger"><div class="k-label">90+ Days</div><div class="k-value sm">${money(buckets.over90, 0)}</div></div>
  </div>

  <div class="toolbar">
    <h3 style="font-size:.95rem">${isAR ? 'Accounts Receivable' : 'Accounts Payable'} Aging — Total ${money(total)}</h3>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" onclick="exportAging('${type}')"><i class="fa-solid fa-file-csv"></i> Export</button>
    <button class="btn btn-ghost btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    ${rows.length ? `
    <div class="table-wrap" style="border:none;border-radius:0">
      <table>
        <thead><tr><th>Document</th><th>Date</th><th>Due</th><th>${isAR ? 'Customer' : 'Supplier'}</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th><th class="num">Days Overdue</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr>
            <td class="mono">${esc(r.d.number || '—')}</td>
            <td>${fmtDate(r.d.date)}</td>
            <td>${fmtDate(r.d.dueDate || r.d.date)}</td>
            <td>${esc(r.d.customerName || r.d.supplierName || '—')}</td>
            <td class="num">${plainNum(r.d.total)}</td>
            <td class="num">${plainNum(r.d.amountPaid)}</td>
            <td class="num"><strong>${plainNum(r.bal)}</strong></td>
            <td class="num ${r.days > 0 ? 'neg' : ''}">${r.days > 0 ? r.days : '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : `<div class="empty"><i class="fa-solid fa-circle-check"></i>No outstanding ${isAR ? 'receivables' : 'payables'}. Excellent.</div>`}
  </div>`;
}

function exportAging(type){
  const isAR = type === 'ar';
  const docs = isAR
    ? toArr(S.invoices).filter(i => i.status !== 'draft' && i.status !== 'cancelled' && invoiceBalance(i) > 0.005)
    : toArr(S.purchases).filter(b => (num(b.total) - num(b.amountPaid)) > 0.005);
  const rows = [['Document','Date','Due','Party','Total','Paid','Balance']];
  docs.forEach(d => rows.push([
    d.number, d.date, d.dueDate || d.date, d.customerName || d.supplierName || '',
    d.total, d.amountPaid, isAR ? invoiceBalance(d) : (num(d.total) - num(d.amountPaid))
  ]));
  downloadCSV('NGT_' + (isAR ? 'Receivables' : 'Payables') + '_Aging_' + todayISO() + '.csv', rows);
}
window.exportAging = exportAging;

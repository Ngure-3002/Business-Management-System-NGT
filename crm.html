}
function closeModal() {
  $('#modal-root').innerHTML = '';
  document.body.style.overflow = '';
}

/* ------------------------------------------------------------
   21. GLOBAL EVENT HANDLING
   ------------------------------------------------------------ */
document.addEventListener('click', async function (e) {
  const t = e.target.closest('[data-action]');
  const nav = e.target.closest('[data-nav]');

  if (nav && !t) {
    navigate(nav.dataset.nav);
    closeSidebar();
    return;
  }

  if (!t) {
    if (e.target.classList && e.target.classList.contains('modal-backdrop')) closeModal();
    return;
  }

  const a = t.dataset.action;

  try {
    /* ---- navigation / modals ---- */
    if (a === 'close-modal' || a === 'backdrop') { closeModal(); return; }

    if (a === 'goto-record') {
      closeModal();
      const v = t.dataset.view;
      const k = t.dataset.key;
      if (v === 'customer360') navigate('customer360', { key: k });
      else navigate(v, { key: k });
      return;
    }

    if (a === 'open-record') {
      openRecordDetail(t.dataset.entity, t.dataset.key);
      return;
    }

    if (a === 'new-record') {
      const preset = {};
      if (t.dataset.presetCustomer) preset.customerId = t.dataset.presetCustomer;
      openRecordForm(t.dataset.entity, null, preset);
      return;
    }

    if (a === 'edit-record') {
      const entity = t.dataset.entity, key = t.dataset.key;
      closeModal();
      setTimeout(() => openRecordForm(entity, key), 60);
      return;
    }

    if (a === 'delete-record') {
      const entity = t.dataset.entity, key = t.dataset.key;
      const rec = getRec(entity, key);
      const label = rec ? (rec[SCHEMAS[entity].noField] || rec[SCHEMAS[entity].labelField]) : '';
      if (confirm('Delete ' + SCHEMAS[entity].singular + ' ' + (label || '') + '?\n\nThis action is permanent and will be recorded in the audit trail.')) {
        await deleteRecord(entity, key);
        closeModal();
        toast(SCHEMAS[entity].singular + ' deleted', 'warn');
      }
      return;
    }

    /* ---- line items ---- */
    if (a === 'add-item-row') {
      const box = $('.items-field[data-items="' + t.dataset.items + '"]');
      $('.items-body', box).insertAdjacentHTML('beforeend', itemRowHTML({}));
      recomputeItems(box);
      return;
    }
    if (a === 'remove-item-row') {
      const row = t.closest('.item-row');
      const box = t.closest('.items-field');
      row.remove();
      recomputeItems(box);
      return;
    }

    /* ---- quick payment ---- */
    if (a === 'quick-payment') {
      closeModal();
      openRecordForm('payments', null, {
        customerId: t.dataset.customer,
        invoiceId: t.dataset.invoice,
        amount: num(t.dataset.amount),
        date: todayISO(),
        type: 'Payment'
      });
      return;
    }

    /* ---- settings ---- */
    if (a === 'save-user') {
      const v = $('#setUser').value.trim();
      state.user = v;
      localStorage.setItem('ngt_crm_user', v);
      updateUserChip();
      toast('Active user updated to "' + (v || 'Unspecified') + '"', 'ok');
      return;
    }

    if (a === 'save-settings') {
      await db.ref('settings').update({
        company: $('#setCompany').value.trim(),
        motto: $('#setMotto').value.trim(),
        phone: $('#setPhone').value.trim(),
        email: $('#setEmail').value.trim(),
        vatRate: num($('#setVat').value),
        updatedAt: Date.now(),
        updatedBy: state.user || 'Unspecified User'
      });
      audit('updated', 'settings', 'settings', 'System settings');
      toast('Settings saved', 'ok');
      return;
    }

    if (a === 'reset-counter') {
      const ent = $('#resetEntity').value;
      if (confirm('Reset the ' + SCHEMAS[ent].label + ' reference counter to 0?\n\nNew records will restart from ' + SCHEMAS[ent].prefix + '-00001. Existing records are NOT affected.')) {
        await db.ref('counters/' + ent).set(0);
        audit('reset counter', ent, ent, SCHEMAS[ent].label);
        toast('Counter reset for ' + SCHEMAS[ent].label, 'warn');
      }
      return;
    }

    /* ---- exports ---- */
    if (a === 'export-csv') {
      exportCSV(t.dataset.entity);
      return;
    }
    if (a === 'export-all') {
      exportAll();
      return;
    }

  } catch (err) {
    console.error(err);
    toast('Error: ' + (err && err.message ? err.message : 'unknown'), 'err');
  }
});

/* Form submission */
document.addEventListener('submit', async function (e) {
  if (e.target.id !== 'recordForm') return;
  e.preventDefault();
  const form = e.target;
  const entity = form.dataset.entity;
  const key = form.dataset.key;
  const s = SCHEMAS[entity];

  const fd = new FormData(form);
  const rec = {};
  if (key) rec._key = key;

  s.fields.forEach(f => {
    if (f.type === 'items') return;
    let v = fd.get(f.key);
    if (v === null) v = '';
    v = typeof v === 'string' ? v.trim() : v;
    if (f.type === 'money' || f.type === 'number') v = v === '' ? '' : num(v);
    rec[f.key] = v;
  });

  /* Line items + totals */
  const itemsBox = $('.items-field', form);
  if (itemsBox) {
    const res = collectItems(itemsBox);
    rec.items = res.items;
    rec.subtotal = res.totals.subtotal;
    rec.discount = res.totals.discount;
    rec.taxRate = res.totals.taxRate;
    rec.taxAmount = res.totals.taxAmount;
    rec.total = res.totals.total;
  }

  /* Required validation */
  const missing = s.fields.filter(f => f.required && !rec[f.key]);
  if (missing.length) {
    toast('Please complete: ' + missing.map(f => f.label).join(', '), 'err');
    return;
  }

  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

  try {
    await saveRecord(entity, rec);
    closeModal();
    toast(s.singular + (key ? ' updated' : ' created') + ' successfully', 'ok');
  } catch (err) {
    console.error(err);
    toast('Save failed: ' + (err.message || 'unknown error'), 'err');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-floppy-disk"></i> Save';
  }
});

/* Live recalculation of line items */
document.addEventListener('input', function (e) {
  const box = e.target.closest('.items-field');
  if (box) recomputeItems(box);

  /* Table filters */
  const searchInput = e.target.closest('[data-filter-table]');
  if (searchInput) filterTable(searchInput.dataset.filterTable);
});

document.addEventListener('change', function (e) {
  const sel = e.target.closest('[data-filter-status]');
  if (sel) filterTable(sel.dataset.filterStatus);
});

function filterTable(entity) {
  const q = ($('#tblSearch') ? $('#tblSearch').value : '').toLowerCase().trim();
  const st = ($('#tblStatus') ? $('#tblStatus').value : '');
  const rows = $$('#tbl-' + entity + ' tbody tr[data-key]');
  let visible = 0;
  rows.forEach(r => {
    const blob = r.dataset.search || '';
    const status = r.dataset.status || '';
    const okQ = !q || blob.indexOf(q) !== -1;
    const okS = !st || status === st;
    const show = okQ && okS;
    r.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  const cnt = $('#rowCount');
  if (cnt) cnt.innerHTML = 'Showing <b>' + visible + '</b>';
}

/* ------------------------------------------------------------
   22. PIPELINE DRAG & DROP
   ------------------------------------------------------------ */
let dragKey = null;
document.addEventListener('dragstart', e => {
  const card = e.target.closest('.kcard');
  if (!card) return;
  dragKey = card.dataset.opp;
  card.style.opacity = '.45';
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragKey); } catch (err) {}
});
document.addEventListener('dragend', e => {
  const card = e.target.closest('.kcard');
  if (card) card.style.opacity = '';
  $$('.kcol.dragover').forEach(c => c.classList.remove('dragover'));
});
document.addEventListener('dragover', e => {
  const col = e.target.closest('.kcol');
  if (!col) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  $$('.kcol.dragover').forEach(c => { if (c !== col) c.classList.remove('dragover'); });
  col.classList.add('dragover');
});
document.addEventListener('drop', async e => {
  const col = e.target.closest('.kcol');
  if (!col || !dragKey) return;
  e.preventDefault();
  const stage = col.dataset.dropStage;
  col.classList.remove('dragover');
  const opp = getRec('opportunities', dragKey);
  dragKey = null;
  if (!opp || opp.stage === stage) return;
  try {
    await db.ref('opportunities/' + opp._key).update({
      stage: stage,
      updatedAt: Date.now(),
      updatedBy: state.user || 'Unspecified User'
    });
    audit('stage changed', 'opportunities', opp._key, opp.oppNo, opp.stage + ' → ' + stage);
    toast('Moved "' + (opp.title || opp.oppNo) + '" to ' + stage, 'ok');
  } catch (err) {
    toast('Could not update stage', 'err');
  }
});

/* ------------------------------------------------------------
   23. GLOBAL SEARCH
   ------------------------------------------------------------ */
const searchInput = $('#globalSearch');
const searchResults = $('#searchResults');

searchInput.addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  if (q.length < 2) { searchResults.classList.remove('show'); return; }

  const results = [];
  const searchEntity = (entity, labelField, limit) => {
    list(entity).forEach(r => {
      const blob = Object.values(r).join(' ').toLowerCase();
      if (blob.indexOf(q) !== -1) {
        results.push({
          entity: entity,
          key: r._key,
          tag: SCHEMAS[entity].singular,
          title: r[labelField] || r[SCHEMAS[entity].noField] || '—',
          sub: [r[SCHEMAS[entity].noField], r.status, r.phone, r.email].filter(Boolean).join(' • ')
        });
      }
    });
  };

  ENTITIES.forEach(en => searchEntity(en, SCHEMAS[en].labelField));

  const top = results.slice(0, 25);
  if (!top.length) {
    searchResults.innerHTML = '<div class="sr-item"><span class="sr-sub">No matches found</span></div>';
  } else {
    searchResults.innerHTML = top.map(r => `
      <div class="sr-item" data-action="search-goto" data-view="${r.entity}" data-key="${esc(r.key)}">
        <span class="sr-tag">${esc(r.tag)}</span>
        <div style="min-width:0">
          <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</div>
          <div class="sr-sub">${esc(r.sub)}</div>
        </div>
      </div>`).join('');
  }
  searchResults.classList.add('show');
});

searchResults.addEventListener('click', function (e) {
  const item = e.target.closest('[data-action="search-goto"]');
  if (!item) return;
  searchResults.classList.remove('show');
  searchInput.value = '';
  const v = item.dataset.view;
  const k = item.dataset.key;
  if (v === 'customers') navigate('customer360', { key: k });
  else {
    navigate(v, { key: k });
    setTimeout(() => openRecordDetail(v, k), 120);
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});

/* ------------------------------------------------------------
   24. NAVIGATION
   ------------------------------------------------------------ */
function navigate(view, params) {
  state.view = view;
  state.params = params || {};
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* ------------------------------------------------------------
   25. SIDEBAR / USER CHIP
   ------------------------------------------------------------ */
function closeSidebar() { $('#sidebar').classList.remove('open'); }
$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

$('#notifBtn').addEventListener('click', () => navigate('notifications'));
$('#userChip').addEventListener('click', () => navigate('settings'));

function updateUserChip() {
  const name = state.user || 'Unspecified';
  $('#userName').textContent = state.user || 'Set user';
  $('#userAvatar').textContent = initials(state.user || 'NG');
}

/* ------------------------------------------------------------
   26. EXPORTS
   ------------------------------------------------------------ */
function download(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCSV(entity) {
  const s = SCHEMAS[entity];
  const rows = list(entity);
  if (!rows.length) { toast('No records to export', 'warn'); return; }

  const cols = [s.noField].concat(s.fields.map(f => f.key)).filter((v, i, a) => a.indexOf(v) === i);
  const head = cols.join(',');
  const body = rows.map(r => cols.map(c => {
    let v = r[c];
    if (Array.isArray(v)) v = v.map(x => x.description + ' x' + x.qty + ' @ ' + x.unitPrice).join(' | ');
    if (v === undefined || v === null) v = '';
    v = String(v).replace(/"/g, '""').replace(/\r?\n/g, ' ');
    return '"' + v + '"';
  }).join(',')).join('\n');

  download('NGT-' + entity + '-' + todayISO() + '.csv', head + '\n' + body);
  toast('Exported ' + rows.length + ' ' + s.label.toLowerCase(), 'ok');
}

function exportAll() {
  const data = { exportedAt: new Date().toISOString(), company: COMPANY, data: {} };
  ENTITIES.forEach(e => { data.data[e] = state.data[e] || {}; });
  data.data.settings = state.data.settings || {};
  download('NGT-CRM-backup-' + todayISO() + '.json', JSON.stringify(data, null, 2));
  toast('Full backup downloaded', 'ok');
}

/* ------------------------------------------------------------
   27. FIREBASE SUBSCRIPTIONS
   ------------------------------------------------------------ */
const connPill = $('#connPill');
const connText = $('#connText');

db.ref('.info/connected').on('value', snap => {
  const on = snap.val() === true;
  connPill.classList.toggle('online', on);
  connPill.classList.toggle('offline', !on);
  connText.textContent = on ? 'Live' : 'Offline';
  const sc = $('#setConn');
  if (sc) sc.innerHTML = on ? '<span class="c-ok">Connected</span>' : '<span class="c-danger">Disconnected</span>';
});

let loadedCount = 0;
DATA_ROOTS.forEach(root => {
  db.ref(root).on('value', snap => {
    state.data[root] = snap.val() || {};
    if (!state.ready) {
      loadedCount++;
      if (loadedCount >= DATA_ROOTS.length) {
        state.ready = true;
        updateUserChip();
        render();
      }
    } else {
      scheduleRender();
    }
  }, err => {
    console.error('Read error on /' + root, err);
    if (!state.ready) {
      state.ready = true;
      updateUserChip();
      render();
      toast('Database read error on /' + root + ' — check rules.', 'err');
    }
  });
});

/* Safety: if subscriptions take too long, show the UI anyway */
setTimeout(() => {
  if (!state.ready) {
    state.ready = true;
    updateUserChip();
    render();
  }
}, 6000);

/* ------------------------------------------------------------
   28. BOOT
   ------------------------------------------------------------ */
updateUserChip();
render();

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
});

})();
</script>

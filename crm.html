<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGT CRM — Ngure Gacheru Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   style.css — modern tech theme with animations
   Ngure Gacheru Technologies — CRM
   ============================================================ */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #0b1117;
  --bg-2: #0e1623;
  --bg-3: #0b121c;
  --panel: #131e2d;
  --panel-2: #1a2536;
  --panel-3: #1e2c40;
  --border: #24344a;
  --border-2: #2d3a4f;
  --text: #e0e7ff;
  --text-soft: #b0c4de;
  --muted: #8ba0bc;
  --accent: #38bdf8;
  --accent-2: #7dd3fc;
  --accent-dim: rgba(56, 189, 248, 0.12);
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --purple: #a78bfa;
  --info: #60a5fa;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #0d151f; }
::-webkit-scrollbar-thumb { background: #24344a; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: #35496a; }

/* ===== HEADER (brand) ===== */
.header {
  background: #0f172a;
  border-bottom: 2px solid #1e2c3a;
  box-shadow: 0 4px 20px rgba(0, 180, 255, 0.1);
}
.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
}
.company-name {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, #a5f3fc, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}
.motto {
  font-size: 1rem;
  color: #9ab3d8;
  font-style: italic;
  border-left: 3px solid #38bdf8;
  padding-left: 0.75rem;
  margin-top: 0.25rem;
}
.header-accent { display: flex; gap: 8px; }
.dot {
  width: 10px; height: 10px;
  background-color: #38bdf8;
  border-radius: 50%;
  opacity: 0.7;
  animation: pulse 2s infinite;
}
.dot:nth-child(2) { animation-delay: 0.4s; }
.dot:nth-child(3) { animation-delay: 0.8s; }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.3); opacity: 1; }
}

.btn {
  display: inline-block;
  padding: 0.7rem 1.6rem;
  border-radius: 40px;
  font-weight: 600;
  font-size: 0.9rem;
  text-decoration: none;
  transition: all 0.25s ease;
  border: 1px solid transparent;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.btn-primary {
  background: #38bdf8;
  color: #0b1117;
  box-shadow: 0 8px 16px rgba(56, 189, 248, 0.19);
}
.btn-primary:hover {
  background: #7dd3fc;
  transform: translateY(-2px);
  box-shadow: 0 16px 24px rgba(56, 189, 248, 0.38);
}
.btn-outline {
  border: 2px solid #38bdf8;
  color: #e0f2fe;
  background: transparent;
}
.btn-outline:hover { background: #38bdf8; color: #0b1117; transform: translateY(-2px); }
.btn-ghost {
  background: var(--panel-2);
  color: var(--text-soft);
  border: 1px solid var(--border-2);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: rgba(248,113,113,.14); color: var(--danger); border: 1px solid rgba(248,113,113,.35); }
.btn-danger:hover { background: var(--danger); color: #14060a; }
.btn-sm { padding: .4rem .9rem; font-size: .78rem; border-radius: 30px; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 258px;
  flex-shrink: 0;
  background: #0a111a;
  border-right: 1px solid #1a2536;
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  padding: 0 0 2rem;
  z-index: 60;
  transition: transform .28s ease;
}
.brand {
  padding: 1.1rem 1.25rem;
  border-bottom: 1px solid #1a2536;
  position: sticky;
  top: 0;
  background: #0a111a;
  z-index: 2;
}
.brand h1 {
  font-size: 1.18rem;
  font-weight: 800;
  letter-spacing: -.4px;
  background: linear-gradient(135deg, #a5f3fc, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.25;
}
.brand .sub {
  font-size: .68rem;
  letter-spacing: 2.6px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-top: 2px;
}
.brand .motto-sm {
  font-size: .7rem;
  color: var(--muted);
  font-style: italic;
  margin-top: .45rem;
  border-left: 2px solid var(--accent);
  padding-left: .5rem;
}

.nav-group { padding: .9rem 0 .2rem; }
.nav-group-title {
  font-size: .64rem;
  letter-spacing: 1.7px;
  text-transform: uppercase;
  color: #5b7292;
  padding: 0 1.25rem .45rem;
  font-weight: 700;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: .72rem;
  padding: .58rem 1.25rem;
  color: #a9bdd8;
  font-size: .875rem;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all .16s ease;
  user-select: none;
}
.nav-item i { width: 17px; text-align: center; font-size: .86rem; opacity: .85; }
.nav-item:hover { background: #101a26; color: var(--accent-2); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(56,189,248,.16), transparent);
  border-left-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.nav-item .count {
  margin-left: auto;
  font-size: .68rem;
  background: #1c2b3f;
  padding: 1px 7px;
  border-radius: 20px;
  color: var(--muted);
  font-weight: 600;
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: 62px;
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #1a2536;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0 1.4rem;
  position: sticky;
  top: 0;
  z-index: 50;
}
.menu-btn {
  display: none;
  background: none; border: none; color: var(--text-soft);
  font-size: 1.2rem; cursor: pointer;
}
.search-wrap { position: relative; flex: 1; max-width: 560px; }
.search-wrap i {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: .85rem;
}
.search-wrap input {
  width: 100%;
  background: #0e1724;
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: .6rem 1rem .6rem 2.4rem;
  color: var(--text);
  font-family: inherit;
  font-size: .87rem;
  outline: none;
  transition: border-color .2s;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.search-results {
  position: absolute; top: 110%; left: 0; right: 0;
  background: var(--panel); border: 1px solid var(--border-2);
  border-radius: 14px; box-shadow: var(--shadow);
  max-height: 420px; overflow-y: auto; display: none; z-index: 80;
}
.search-results.show { display: block; }
.sr-item {
  padding: .62rem .95rem; cursor: pointer; display: flex; gap: .7rem; align-items: center;
  border-bottom: 1px solid #1a2536; font-size: .84rem;
}
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: #182636; }
.sr-item .sr-tag {
  font-size: .62rem; text-transform: uppercase; letter-spacing: .8px;
  background: var(--accent-dim); color: var(--accent);
  padding: 2px 7px; border-radius: 20px; font-weight: 700; flex-shrink: 0;
}
.sr-item .sr-sub { color: var(--muted); font-size: .74rem; }

.top-actions { display: flex; align-items: center; gap: .6rem; margin-left: auto; }
.icon-btn {
  background: #0e1724; border: 1px solid var(--border);
  color: var(--text-soft); width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; position: relative; transition: all .2s; font-size: .9rem;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn .badge {
  position: absolute; top: -4px; right: -4px;
  background: var(--danger); color: #1a0505;
  font-size: .6rem; font-weight: 800; border-radius: 20px;
  padding: 1px 5px; min-width: 17px;
}
.user-chip {
  display: flex; align-items: center; gap: .55rem;
  background: #0e1724; border: 1px solid var(--border);
  border-radius: 40px; padding: .28rem .85rem .28rem .3rem;
  cursor: pointer; font-size: .82rem;
}
.user-chip:hover { border-color: var(--accent); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  display: flex; align-items: center; justify-content: center;
  color: #06121c; font-weight: 800; font-size: .74rem;
}

.view { padding: 1.6rem 1.6rem 4rem; flex: 1; }

/* ============================================================
   PAGE PRIMITIVES
   ============================================================ */
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-bottom: 1.3rem;
}
.page-title {
  font-size: 1.5rem; font-weight: 700; letter-spacing: -.4px;
  display: flex; align-items: center; gap: .65rem;
}
.page-title i { color: var(--accent); font-size: 1.15rem; }
.page-sub { color: var(--muted); font-size: .82rem; margin-top: .18rem; }
.page-actions { display: flex; gap: .55rem; flex-wrap: wrap; }

.grid { display: grid; gap: 1rem; }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.g-6 { grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); }

.card {
  background: linear-gradient(160deg, var(--panel), #101a27);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.15rem 1.25rem;
  position: relative;
  overflow: hidden;
  transition: border-color .2s, transform .2s;
}
.card:hover { border-color: #2f4considerable; }
.card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, rgba(37, 99, 235, .12), transparent 65%);
  pointer-events: none;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: .85rem; position: relative;
}
.card-head h3 {
  font-size: .95rem; font-weight: 700; letter-spacing: -.2px;
  display: flex; align-items: center; gap: .5rem;
}
.card-head h3 i { color: var(--accent); font-size: .85rem; }
.card-head .link { font-size: .76rem; color: var(--accent); cursor: pointer; }
.card-head .link:hover { text-decoration: underline; }

.stat { position: relative; }
.stat .stat-label {
  font-size: .68rem; text-transform: uppercase; letter-spacing: 1.1px;
  color: var(--muted); font-weight: 700;
}
.stat .stat-value {
  font-size: 1.5rem; font-weight: 800; letter-spacing: -.7px;
  margin-top: .3rem; line-height: 1.15;
}
.stat .stat-foot { font-size: .72rem; color: var(--muted); margin-top: .2rem; }
.stat .stat-icon {
  position: absolute; right: 1rem; top: 1rem;
  font-size: 1.15rem; opacity: .3;
}
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); }
.c-danger { color: var(--danger); } .c-accent { color: var(--accent); }
.c-purple { color: var(--purple); } .c-info { color: var(--info); }
.c-muted { color: var(--muted); }

.divider { height: 1px; background: var(--border); margin: .9rem 0; }

/* ============================================================
   TABLES
   ============================================================ */
.toolbar {
  display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: .9rem;
  align-items: center;
}
.input, select.input, textarea.input {
  background: #0e1724;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .55rem .8rem;
  color: var(--text);
  font-family: inherit;
  font-size: .84rem;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
  width: 100%;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.toolbar .input { max-width: 320px; }
.toolbar select.input { max-width: 210px; }

.table-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: auto;
  max-height: calc(100vh - 250px);
}
table.data-table { width: 100%; border-collapse: collapse; font-size: .825rem; }
table.data-table thead th {
  position: sticky; top: 0; z-index: 2;
  background: #16222f;
  text-align: left;
  padding: .72rem .85rem;
  font-size: .68rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #7f96b5;
  font-weight: 700;
  white-space: nowrap;
  border-bottom: 1px solid var(--border-2);
}
table.data-table tbody td {
  padding: .68rem .85rem;
  border-bottom: 1px solid #1a2536;
  vertical-align: middle;
  white-space: nowrap;
}
table.data-table tbody tr { cursor: pointer; transition: background .13s; }
table.data-table tbody tr:hover { background: #16222f; }
table.data-table tbody tr:last-child td { border-bottom: none; }
.col-actions { width: 42px; text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 3rem 1rem !important; font-size: .86rem; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: #5d7characters; }

/* Badges */
.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 20px;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .3px;
  white-space: nowrap;
  border: 1px solid transparent;
}
.b-ok { background: rgba(52,211,153,.14); color: var(--ok); border-color: rgba(52,211,153,.3); }
.b-warn { background: rgba(251,191,36,.14); color: var(--warn); border-color: rgba(251,191,36,.3); }
.b-danger { background: rgba(248,113,113,.14); color: var(--danger); border-color: rgba(248,113,113,.3); }
.b-info { background: rgba(96,165,250,.14); color: var(--info); border-color: rgba(96,165,250,.3); }
.b-accent { background: rgba(56,189,248,.14); color: var(--accent); border-color: rgba(56,189,248,.3); }
.b-purple { background: rgba(167,139,250,.14); color: var(--purple); border-color: rgba(167,139,250,.3); }
.b-muted { background: rgba(139,160,188,.12); color: var(--muted); border-color: rgba(139,160,188,.25); }

/* ============================================================
   PIPELINE (KANBAN)
   ============================================================ */
.kanban {
  display: flex; gap: .85rem; overflow-x: auto;
  padding-bottom: 1rem; align-items: flex-start;
}
.kcol {
  min-width: 232px; width: 232px; flex-shrink: 0;
  background: #101a26;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: .7rem;
  transition: border-color .2s, background .2s;
}
.kcol.dragover { border-color: var(--accent); background: #142433; }
.kcol-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .73rem; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; color: #8ba0bc;
  padding: .15rem .3rem .6rem;
}
.kcol-head .kval { color: var(--accent); font-size: .68rem; letter-spacing: 0; }
.kcard {
  background: linear-gradient(160deg, #1a2536, #16202e);
  border: 1px solid var(--border-2);
  border-radius: 13px;
  padding: .65rem .7rem;
  margin-bottom: .5rem;
  cursor: grab;
  transition: all .16s;
  font-size: .78rem;
}
.kcard:hover { border-color: var(--accent); transform: translateY(-2px); }
.kcard:active { cursor: grabbing; }
.kcard .kc-title { font-weight: 600; color: #e6efff; margin-bottom: .22rem; line-height: 1.35; }
.kcard .kc-sub { color: var(--muted); font-size: .7rem; display: flex; justify-content: space-between; gap: .5rem; }
.kcard .kc-val { color: var(--accent); font-weight: 700; margin-top: .3rem; font-size: .76rem; }

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(4, 9, 15, 0.78);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 2.5rem 1rem;
  overflow-y: auto;
  animation: fadeIn .16s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: linear-gradient(170deg, #131e2d, #0f1824);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 900px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, .7);
  animation: slideUp .22s cubic-bezier(.2,.8,.3,1);
  overflow: hidden;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.4rem;
  border-bottom: 1px solid var(--border);
  background: #16222f;
}
.modal-head h2 { font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: .55rem; }
.modal-head h2 i { color: var(--accent); }
.modal-body { padding: 1.25rem 1.4rem; max-height: 72vh; overflow-y: auto; }
.modal-foot {
  padding: .9rem 1.4rem;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: .6rem;
  background: #101a26;
}
.close-x {
  background: none; border: none; color: var(--muted);
  font-size: 1.2rem; cursor: pointer; line-height: 1;
}
.close-x:hover { color: var(--danger); }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: .9rem; }
.form-field { display: flex; flex-direction: column; gap: .3rem; }
.form-field.full { grid-column: 1 / -1; }
.form-field label {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .9px;
  color: #8ba0bc; font-weight: 700;
}
.form-field label .req { color: var(--danger); }
.form-field .hint { font-size: .68rem; color: #5d7characters; }
.section-label {
  grid-column: 1 / -1;
  font-size: .7rem; text-transform: uppercase; letter-spacing: 1.4px;
  color: var(--accent); font-weight: 800;
  margin-top: .5rem; padding-bottom: .35rem;
  border-bottom: 1px solid var(--border);
}

/* Line items */
.items-field { grid-column: 1 / -1; }
.items-table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-bottom: .5rem; }
.items-table th {
  text-align: left; font-size: .64rem; text-transform: uppercase;
  letter-spacing: .8px; color: #7f96b5; padding: .4rem .35rem; font-weight: 700;
}
.items-table td { padding: .22rem .2rem; }
.items-table input {
  width: 100%; background: #0e1724; border: 1px solid var(--border);
  border-radius: 8px; padding: .38rem .5rem; color: var(--text);
  font-family: inherit; font-size: .79rem; outline: none;
}
.items-table input:focus { border-color: var(--accent); }
.items-table .amt { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; padding-right: .5rem; }
.totals-box {
  margin-left: auto; width: 300px; max-width: 100%;
  background: #0e1724; border: 1px solid var(--border);
  border-radius: 14px; padding: .75rem .9rem; font-size: .82rem;
}
.totals-row { display: flex; justify-content: space-between; padding: .22rem 0; }
.totals-row.grand {
  border-top: 1px solid var(--border-2); margin-top: .4rem; padding-top: .5rem;
  font-weight: 800; font-size: 1rem; color: var(--accent);
}
.totals-row input {
  width: 105px; background: #16222f; border: 1px solid var(--border);
  border-radius: 8px; padding: .25rem .45rem; color: var(--text);
  font-family: inherit; font-size: .79rem; text-align: right; outline: none;
}

/* Detail view */
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .8rem; }
.detail-item {
  background: #101a26; border: 1px solid var(--border);
  border-radius: 13px; padding: .6rem .8rem;
}
.detail-item .dl {

const state = {
  data: {},
  ready: false,
  view: 'dashboard',
  params: {},
  user: localStorage.getItem('ngt_crm_user') || '',
  alerts: []
};

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function money(v) {
  return 'KES ' + num(v).toLocaleString('en-KE', { maximumFractionDigits: 0 });
}
function shortMoney(v) {
  const n = num(v);
  if (Math.abs(n) >= 1000000) return 'KES ' + (n / 1000000).toFixed(2) + 'M';
  if (Math.abs(n) >= 1000) return 'KES ' + (n / 1000).toFixed(1) + 'K';
  return 'KES ' + n.toLocaleString('en-KE');
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(ts) {
  if (!ts) return '';
  const dt = new Date(ts);
  if (isNaN(dt.getTime())) return String(ts);
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' ' + dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function initials(name) {
  if (!name) return 'NG';
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = esc(msg);
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

/* ------------------------------------------------------------
   5. DATA LAYER
   ------------------------------------------------------------ */
function list(entity) {
  const o = state.data[entity] || {};
  return Object.keys(o).map(k => Object.assign({}, o[k], { _key: k }));
}
function getRec(entity, key) {
  if (!key) return null;
  const o = state.data[entity] || {};
  const r = o[key];
  return r ? Object.assign({}, r, { _key: key }) : null;
}
function refLabel(entity, key) {
  const r = getRec(entity, key);
  if (!r) return '';
  const s = SCHEMAS[entity];
  return r[s.labelField] || r[s.noField] || r.name || '—';
}
function custName(key) { return refLabel('customers', key) || '—'; }

async function nextNumber(entity, prefix) {
  const ref = db.ref('counters/' + entity);
  const res = await ref.transaction(cur => (num(cur) + 1));
  const n = num(res.snapshot.val());
  return prefix + '-' + String(n).padStart(5, '0');
}

function audit(action, entity, key, label, extra) {
  const rec = {
    action: action,
    entity: entity,
    key: key,
    label: label || '',
    user: state.user || 'Unspecified User',
    at: Date.now()
  };
  if (extra) rec.detail = extra;
  db.ref('audit').push(rec).catch(() => {});
}

async function saveRecord(entity, rec) {
  const schema = SCHEMAS[entity];
  const data = Object.assign({}, rec);
  const key = data._key;
  delete data._key;

  if (key) {
    data.updatedAt = Date.now();
    data.updatedBy = state.user || 'Unspecified User';
    await db.ref(entity + '/' + key).update(data);
    audit('updated', entity, key, data[schema.labelField] || data[schema.noField] || '');
    return key;
  } else {
    data[schema.noField] = await nextNumber(entity, schema.prefix);
    data.createdAt = Date.now();
    data.createdBy = state.user || 'Unspecified User';
    const ref = db.ref(entity).push();
    await ref.set(data);
    audit('created', entity, ref.key, data[schema.noField]);
    return ref.key;
  }
}

async function deleteRecord(entity, key) {
  const r = getRec(entity, key);
  await db.ref(entity + '/' + key).remove();
  audit('deleted', entity, key, r ? (r[SCHEMAS[entity].noField] || '') : '');
}

/* Derived helpers */
function paidForInvoice(invoiceKey) {
  return list('payments')
    .filter(p => p.invoiceId === invoiceKey && p.type !== 'Refund')
    .reduce((s, p) => s + num(p.amount), 0);
}
function invoiceTotal(inv) { return num(inv.total); }
function invoiceBalance(inv) { return invoiceTotal(inv) - paidForInvoice(inv._key); }
function customerRevenue(custKey) {
  return list('invoices')
    .filter(i => i.customerId === custKey && i.status !== 'Cancelled')
    .reduce((s, i) => s + invoiceTotal(i), 0);
}
function customerPaid(custKey) {
  return list('payments')
    .filter(p => p.customerId === custKey && p.type !== 'Refund')
    .reduce((s, p) => s + num(p.amount), 0);
}
function customerCost(custKey) {
  const projectCost = list('projects')
    .filter(p => p.customerId === custKey)
    .reduce((s, p) => s + num(p.directCost), 0);
  const reqCost = list('requests')
    .filter(r => r.customerId === custKey)
    .reduce((s, r) => s + num(r.supplierPrice), 0);
  return projectCost + reqCost;
}
function customerOutstanding(custKey) {
  return customerRevenue(custKey) - customerPaid(custKey);
}
function isOverdue(inv) {
  if (!inv.dueDate) return false;
  if (['Paid', 'Cancelled', 'Draft'].includes(inv.status)) return false;
  return invoiceBalance(inv) > 0.5 && new Date(inv.dueDate).getTime() < todayStart();
}
function isQuoteExpired(q) {
  if (!q.validUntil) return false;
  if (['Accepted', 'Rejected', 'Cancelled'].includes(q.status)) return false;
  return new Date(q.validUntil).getTime() < todayStart();
}

/* ------------------------------------------------------------
   6. ALERTS ENGINE  (derived from real records only)
   ------------------------------------------------------------ */
function computeAlerts() {
  const alerts = [];
  const today = todayStart();
  const in30 = today + 30 * 86400000;

  list('invoices').forEach(inv => {
    const bal = invoiceBalance(inv);
    if (bal > 0.5 && isOverdue(inv)) {
      alerts.push({
        level: 'danger', icon: 'fa-file-invoice-dollar',
        title: 'Invoice ' + esc(inv.invoiceNo) + ' overdue',
        sub: custName(inv.customerId) + ' • ' + money(bal) + ' outstanding',
        view: 'invoices', key: inv._key
      });
    }
  });

  list('followups').forEach(f => {
    if (f.status === 'Completed' || f.status === 'Cancelled') return;
    if (!f.dueDate) return;
    const due = new Date(f.dueDate).getTime();
    if (due <= today) {
      alerts.push({
        level: due < today ? 'danger' : 'warn', icon: 'fa-bell-concierge',
        title: 'Follow-up due: ' + esc(f.subject),
        sub: (f.customerId ? custName(f.customerId) + ' • ' : '') + 'Due ' + fmtDate(f.dueDate),
        view: 'followups', key: f._key
      });
    }
  });

  list('quotations').forEach(q => {
    if (q.status === 'Sent' && q.validUntil) {
      const v = new Date(q.validUntil).getTime();
      if (v < today) {
        alerts.push({
          level: 'danger', icon: 'fa-file-signature',
          title: 'Quotation ' + esc(q.quoteNo) + ' expired',
          sub: custName(q.customerId) + ' • ' + money(q.total),
          view: 'quotations', key: q._key
        });
      } else if (v < in30) {
        alerts.push({
          level: 'warn', icon: 'fa-hourglass-half',
          title: 'Quotation ' + esc(q.quoteNo) + ' expiring',
          sub: custName(q.customerId) + ' • valid until ' + fmtDate(q.validUntil),
          view: 'quotations', key: q._key
        });
      }
    }
  });

  list('leads').forEach(l => {
    if (['Won', 'Lost', 'Cancelled'].includes(l.status)) return;
    if (l.nextFollowUp && new Date(l.nextFollowUp).getTime() <= today) {
      alerts.push({
        level: 'warn', icon: 'fa-bullseye',
        title: 'Lead follow-up: ' + esc(l.name),
        sub: (l.interest || 'General enquiry') + ' • ' + money(l.estimatedValue),
        view: 'leads', key: l._key
      });
    }
  });

  list('warranties').forEach(w => {
    if (w.status !== 'Active' || !w.warrantyEnd) return;
    const e = new Date(w.warrantyEnd).getTime();
    if (e > today && e < in30) {
      alerts.push({
        level: 'info', icon: 'fa-shield-halved',
        title: 'Warranty expiring: ' + esc(w.product),
        sub: custName(w.customerId) + ' • ends ' + fmtDate(w.warrantyEnd),
        view: 'warranties', key: w._key
      });
    }
  });

  list('tickets').forEach(t => {
    if (['Resolved', 'Closed', 'Cancelled'].includes(t.status)) return;
    if (['High', 'Urgent'].includes(t.priority)) {
      alerts.push({
        level: 'danger', icon: 'fa-headset',
        title: 'Open ticket ' + esc(t.ticketNo) + ' — ' + esc(t.priority),
        sub: custName(t.customerId) + ' • ' + esc(t.issue),
        view: 'tickets', key: t._key
      });
    }
  });

  list('projects').forEach(p => {
    if (p.status === 'Awaiting Deposit') {
      alerts.push({
        level: 'info', icon: 'fa-diagram-project',
        title: 'Project awaiting deposit: ' + esc(p.title),
        sub: custName(p.customerId) + ' • ' + money(p.projectValue),
        view: 'projects', key: p._key
      });
    }
  });

  list('opportunities').forEach(o => {
    if (num(o.estimatedValue) >= 300000 && ACTIVE_STAGES.includes(o.stage)) {
      alerts.push({
        level: 'info', icon: 'fa-lightbulb',
        title: 'High-value opportunity: ' + esc(o.title),
        sub: custName(o.customerId) + ' • ' + money(o.estimatedValue) + ' • ' + esc(o.stage),
        view: 'opportunities', key: o._key
      });
    }
  });

  list('hirepurchase').forEach(h => {
    if (h.status === 'Active') {
      const bal = num(h.financedAmount) - num(h.amountPaid);
      if (bal > 0) {
        alerts.push({
          level: 'warn', icon: 'fa-handshake',
          title: 'HP installment pending: ' + esc(h.product),
          sub: custName(h.customerId) + ' • Balance ' + money(bal),
          view: 'hirepurchase', key: h._key
        });
      }
    }
  });

  return alerts;
}

/* ------------------------------------------------------------
   7. METRICS
   ------------------------------------------------------------ */
function computeMetrics() {
  const leads = list('leads');
  const opps = list('opportunities');
  const quotes = list('quotations');
  const invoices = list('invoices');
  const payments = list('payments');
  const projects = list('projects');
  const customers = list('customers');

  const today = todayStart();
  const monthStart = new Date();
  monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);

  const wonOpps = opps.filter(o => o.stage === 'Won');
  const lostOpps = opps.filter(o => o.stage === 'Lost');
  const activeOpps = opps.filter(o => ACTIVE_STAGES.includes(o.stage));
  const closedOpps = wonOpps.length + lostOpps.length;

  const pipelineValue = activeOpps.reduce((s, o) => s + num(o.estimatedValue), 0);
  const weightedPipeline = activeOpps.reduce((s, o) => s + num(o.estimatedValue) * (num(o.probability) / 100), 0);

  const sentQuotes = quotes.filter(q => ['Sent', 'Approved'].includes(q.status));
  const pendingQuotes = quotes.filter(q => ['Draft', 'Approved', 'Sent'].includes(q.status));
  const expiredQuotes = quotes.filter(isQuoteExpired);

  const activeInvoices = invoices.filter(i => i.status !== 'Cancelled');
  const totalInvoiced = activeInvoices.reduce((s, i) => s + invoiceTotal(i), 0);
  const totalCollected = payments.filter(p => p.type !== 'Refund').reduce((s, p) => s + num(p.amount), 0);
  const outstanding = activeInvoices.reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);
  const overdueList = activeInvoices.filter(isOverdue);
  const overdueAmount = overdueList.reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);
  const deposits = payments.filter(p => p.type === 'Deposit').reduce((s, p) => s + num(p.amount), 0);

  const monthInvoiced = activeInvoices
    .filter(i => i.invoiceDate && new Date(i.invoiceDate).getTime() >= monthStart.getTime())
    .reduce((s, i) => s + invoiceTotal(i), 0);

  const wonValue = wonOpps.reduce((s, o) => s + num(o.estimatedValue), 0);
  const estProfit = wonOpps.reduce((s, o) => s + (num(o.estimatedValue) - num(o.expectedCost)), 0);

  const activeProjects = projects.filter(p => ['In Progress', 'Awaiting Deposit', 'Pending'].includes(p.status));
  const completedProjects = projects.filter(p => p.status === 'Completed');
  const projectProfit = projects.reduce((s, p) => s + (num(p.projectValue) - num(p.directCost)), 0);

  const newCustomers = customers.filter(c => c.createdAt && c.createdAt >= monthStart.getTime());
  const highValue = customers.filter(c => customerRevenue(c._key) >= 200000);

  return {
    totalLeads: leads.length,
    newLeadsToday: leads.filter(l => l.createdAt && l.createdAt >= today).length,
    activeOpps: activeOpps.length,
    wonOpps: wonOpps.length,
    lostOpps: lostOpps.length,
    conversionRate: closedOpps ? Math.round((wonOpps.length / closedOpps) * 100) : 0,
    pipelineValue, weightedPipeline,
    quotationValue: quotes.reduce((s, q) => s + num(q.total), 0),
    wonValue,
    pendingQuotations: pendingQuotes.length,
    expiredQuotations: expiredQuotes.length,
    sentQuotations: sentQuotes.length,
    totalInvoiced, totalCollected, outstanding, overdueAmount,
    overdueCount: overdueList.length,
    deposits, monthInvoiced,
    estProfit, projectProfit,
    activeProjects: activeProjects.length,
    completedProjects: completedProjects.length,
    totalCustomers: customers.length,
    newCustomers: newCustomers.length,
    highValueCustomers: highValue.length,
    totalProjects: projects.length,
    totalPayments: payments.length
  };
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

function render() {
  if (!state.ready) {
    $('#view').innerHTML = `<div class="loader-wrap">
      <div class="spinner"></div>
      <p style="color:#8ba0bc;font-size:.9rem">Connecting to NGT CRM database…</p>
    </div>`;
    return;
  }

  state.alerts = computeAlerts();
  renderNav();

  const badge = $('#notifBadge');
  if (state.alerts.length) { badge.style.display = 'inline-block'; badge.textContent = state.alerts.length; }
  else badge.style.display = 'none';

  const v = state.view;
  let html = '';

  if (v === 'dashboard') html = viewDashboard();
  else if (v === 'pipeline') html = viewPipeline();
  else if (v === 'notifications') html = viewNotifications();
  else if (v === 'reports') html = viewReports();
  else if (v === 'audit') html = viewAudit();
  else if (v === 'settings') html = viewSettings();
  else if (v === 'customer360') html = viewCustomer360(state.params.key);
  else if (SCHEMAS[v]) html = viewList(v);
  else html = viewDashboard();

  $('#view').innerHTML = html;
  observeAnimated();
}

function observeAnimated() {
  const els = $$('.animate-on-view');
  if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('visible')); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('visible'); io.unobserve(en.target); } });
  }, { threshold: .08 });
  els.forEach(e => io.observe(e));
}

function badgeHTML(v) {
  if (v === '' || v === null || v === undefined) return '<span class="muted">—</span>';
  const cls = BADGE_MAP[v] || 'b-muted';
  return `<span class="badge ${cls}">${esc(v)}</span>`;

function cellValue(entity, key, rec) {
  const f = fieldOf(entity, key);
  const v = rec[key];
  if (v === undefined || v === null || v === '') return '<span class="muted">—</span>';
  if (!f) return esc(String(v));
  switch (f.type) {
    case 'money': return '<span class="mono c-accent">' + money(v) + '</span>';
    case 'date': return esc(fmtDate(v));
    case 'datetime-local': return esc(fmtDateTime(v));
    case 'select': return badgeHTML(v);
    case 'ref': {
      const label = refLabel(f.ref, v);
      if (!label) return '<span class="muted">—</span>';
      if (f.ref === 'customers') {
        return `<span data-action="goto-record" data-view="customer360" data-key="${esc(v)}" style="color:#7dd3fc;cursor:pointer">${esc(label)}</span>`;
      }
      return esc(label);
    }
    case 'items':
      return '<span class="muted">' + (Array.isArray(v) ? v.length + ' item(s)' : '—') + '</span>';
    default: return esc(String(v));
  }
}

function searchBlob(entity, r) {

    return String(v);
  }).join(' ').toLowerCase();

function viewCustomer360(key) {
  const c = getRec('customers', key);
  if (!c) return `<div class="empty-state"><i class="fas fa-user-slash"></i>Customer not found.</div>`;

  const opps = list('opportunities').filter(x => x.customerId === key);
  const quotes = list('quotations').filter(x => x.customerId === key);
  const invoices = list('invoices').filter(x => x.customerId === key);
  const payments = list('payments').filter(x => x.customerId === key);
  const projects = list('projects').filter(x => x.customerId === key);
  const tickets = list('tickets').filter(x => x.customerId === key);
  const warranties = list('warranties').filter(x => x.customerId === key);
  const followups = list('followups').filter(x => x.customerId === key);
  const comms = list('communications').filter(x => x.customerId === key);
  const requests = list('requests').filter(x => x.customerId === key);
  const hp = list('hirepurchase').filter(x => x.customerId === key);

  const revenue = customerRevenue(key);
  const paid = customerPaid(key);
  const outstanding = revenue - paid;
  const cost = customerCost(key);
  const profit = revenue - cost;
  const overdue = invoices.filter(isOverdue).reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);

  /* Timeline */
  const events = [];
  c.createdAt && events.push({ at: c.createdAt, t: 'Customer created', s: c.customerNo || '' });
  list('leads').filter(l => l.convertedTo === key).forEach(l => events.push({ at: l.createdAt, t: 'Converted from lead', s: l.leadNo + ' — ' + (l.source || '') }));
  opps.forEach(o => events.push({ at: o.createdAt, t: 'Opportunity: ' + (o.title || ''), s: o.oppNo + ' • ' + money(o.estimatedValue) }));
  quotes.forEach(q => events.push({ at: q.createdAt, t: 'Quotation ' + (q.quoteNo || ''), s: money(q.total) + ' • ' + (q.status || '') }));
  invoices.forEach(i => events.push({ at: i.createdAt, t: 'Invoice ' + (i.invoiceNo || ''), s: money(i.total) + ' • ' + (i.status || '') }));
  payments.forEach(p => events.push({ at: p.createdAt, t: 'Payment received', s: money(p.amount) + ' • ' + (p.method || '') }));
  projects.forEach(p => events.push({ at: p.createdAt, t: 'Project: ' + (p.title || ''), s: p.projectNo + ' • ' + (p.status || '') }));
  tickets.forEach(t => events.push({ at: t.createdAt, t: 'Ticket ' + (t.ticketNo || ''), s: t.issue || '' }));
  comms.forEach(cm => events.push({ at: cm.createdAt, t: 'Communication: ' + (cm.subject || ''), s: (cm.channel || '') + ' • ' + (cm.direction || '') }));
  followups.forEach(f => events.push({ at: f.createdAt, t: 'Follow-up: ' + (f.subject || ''), s: (f.status || '') + ' • due ' + fmtDate(f.dueDate) }));
  events.sort((a, b) => num(b.at) - num(a.at));

  const tabsData = {
    opportunities: opps, quotations: quotes, invoices: invoices, payments: payments,
    projects: projects, requests: requests, tickets: tickets, warranties: warranties,
    followups: followups, communications: comms, hirepurchase: hp

        ${esc(c.county || c.location || '—')} •

      </p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost" data-action="open-record" data-entity="customers" data-key="${esc(key)}"><i class="fas fa-pen"></i> Edit</button>
      <button class="btn btn-ghost" data-action="new-record" data-entity="quotations" data-preset-customer="${esc(key)}"><i class="fas fa-file-signature"></i> New Quotation</button>
      <button class="btn btn-primary" data-action="new-record" data-entity="invoices" data-preset-customer="${esc(key)}"><i class="fas fa-file-invoice-dollar"></i> New Invoice</button>
    </div>
  </div>

  <!-- FINANCIAL SUMMARY -->
  <div class="grid g-6" style="margin-bottom:1rem">
    ${statCard('Total Revenue', shortMoney(revenue), money(revenue), 'fa-sack-dollar', 'c-accent')}
    ${statCard('Total Paid', shortMoney(paid), money(paid), 'fa-money-bill-transfer', 'c-ok')}
    ${statCard('Outstanding', shortMoney(outstanding), outstanding > 0 ? 'Balance due' : 'Settled', 'fa-hourglass-half', outstanding > 0 ? 'c-warn' : 'c-ok')}
    ${statCard('Overdue', shortMoney(overdue), overdue > 0 ? 'Action required' : 'None', 'fa-triangle-exclamation', overdue > 0 ? 'c-danger' : 'c-ok')}
    ${statCard('Direct Cost', shortMoney(cost), 'Projects + procurement', 'fa-receipt', 'c-muted')}
    ${statCard('Gross Profit', shortMoney(profit), revenue ? Math.round((profit / revenue) * 100) + '% margin' : '—', 'fa-chart-line', profit >= 0 ? 'c-ok' : 'c-danger')}
  </div>

  <!-- COUNTS -->
  <div class="card animate-on-view" style="margin-bottom:1rem">
    <div class="pill-row">
      ${Object.keys(tabsData).map(k => `<span class="chip">${esc(cap(k))}: <b>${tabsData[k].length}</b></span>`).join('')}
    </div>
  </div>

  <div class="grid g-2">
    <!-- PROFILE -->
    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-id-card"></i> Customer Profile</h3></div>
      <div class="detail-grid">
        ${detailItem('Phone', c.phone)}
        ${detailItem('WhatsApp', c.whatsapp)}
        ${detailItem('Email', c.email)}
        ${detailItem('Contact Person', c.contactPerson)}
        ${detailItem('Company', c.company)}
        ${detailItem('Industry', c.industry)}
        ${detailItem('Physical Address', c.address)}
        ${detailItem('Town / Location', [c.town, c.location].filter(Boolean).join(', '))}
        ${detailItem('County', c.county)}
        ${detailItem('KRA PIN', c.kraPin)}
        ${detailItem('Preferred Channel', c.preferredChannel)}
        ${detailItem('Lead Source', c.leadSource)}
      </div>
      ${c.notes ? `<div class="divider"></div><div style="font-size:.84rem;color:#b0c4de">${esc(c.notes)}</div>` : ''}
    </div>

    <!-- TIMELINE -->
    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-clock-rotate-left"></i> Customer Timeline</h3></div>
      ${events.length ? `<div class="timeline" style="max-height:460px;overflow-y:auto">
        ${events.slice(0, 40).map(e => `
          <div class="tl-item">
            <div class="tl-date">${fmtDateTime(e.at)}</div>
            <div class="tl-title">${esc(e.t)}</div>
            ${e.s ? `<div class="tl-sub">${esc(e.s)}</div>` : ''}
          </div>`).join('')}
      </div>` : '<div class="empty-state"><i class="fas fa-clock"></i>No activity yet.</div>'}
    </div>
  </div>

  <!-- RELATED RECORDS -->
  <div class="grid g-2" style="margin-top:1rem">
    ${relatedCard('Opportunities', opps, 'opportunities', ['oppNo', 'title', 'estimatedValue', 'stage'])}
    ${relatedCard('Quotations', quotes, 'quotations', ['quoteNo', 'date', 'total', 'status'])}
    ${relatedCard('Invoices', invoices, 'invoices', ['invoiceNo', 'invoiceDate', 'total', 'status'])}
    ${relatedCard('Payments', payments, 'payments', ['paymentNo', 'date', 'amount', 'method'])}
    ${relatedCard('Projects & Jobs', projects, 'projects', ['projectNo', 'title', 'projectValue', 'status'])}
    ${relatedCard('Customer Requests', requests, 'requests', ['reqNo', 'product', 'sellingPrice', 'status'])}
    ${relatedCard('Support Tickets', tickets, 'tickets', ['ticketNo', 'issue', 'priority', 'status'])}
    ${relatedCard('Warranties', warranties, 'warranties', ['warrantyNo', 'product', 'warrantyEnd', 'status'])}
    ${relatedCard('Follow-Ups', followups, 'followups', ['followupNo', 'subject', 'dueDate', 'status'])}
    ${relatedCard('Hire Purchase', hp, 'hirepurchase', ['agreementNo', 'product', 'balance', 'status'])}
  </div>
  `;
}

function detailItem(label, value) {
  return `<div class="detail-item">

function relatedCard(title, rows, entity, cols) {
  return `<div class="card animate-on-view">
    <div class="card-head">
      <h3><i class="fas ${SCHEMAS[entity].icon}"></i> ${esc(title)}</h3>

    ${rows.length ? `<div style="overflow-x:auto"><table class="data-table" style="font-size:.78rem">
      <thead><tr>${cols.map(c => `<th>${esc(labelOf(entity, c))}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, 8).map(r => `<tr data-action="open-record" data-entity="${entity}" data-key="${esc(r._key)}">

}

/* ------------------------------------------------------------
   14. VIEW — NOTIFICATIONS
   ------------------------------------------------------------ */
function viewNotifications() {
  const alerts = state.alerts;
  const groups = { danger: [], warn: [], info: [] };
  alerts.forEach(a => { (groups[a.level] || groups.info).push(a); });

  const renderGroup = (title, icon, cls, items) => `
    <div class="card animate-on-view" style="margin-bottom:1rem">
      <div class="card-head">
        <h3><i class="fas ${icon} ${cls}"></i> ${esc(title)} <span style="color:#8ba0bc;font-weight:400">(${items.length})</span></h3>
      </div>
      ${items.length ? items.map(a => `
        <div class="alert-item" data-action="goto-record" data-view="${a.view}" data-key="${a.key}">
          <div class="ai ai-${a.level}"><i class="fas ${a.icon}"></i></div>
          <div><div class="at">${a.title}</div><div class="as">${a.sub}</div></div>
        </div>`).join('') : '<div class="empty-state" style="padding:1rem"><i class="fas fa-circle-check"></i>Nothing here.</div>'}
    </div>`;

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title"><i class="fas fa-bell"></i> Notifications & Alerts</h1>
      <p class="page-sub">Derived live from your CRM records — ${alerts.length} item(s) need attention</p>
    </div>
  </div>
  ${renderGroup('Critical', 'fa-triangle-exclamation', 'c-danger', groups.danger)}
  ${renderGroup('Attention', 'fa-circle-exclamation', 'c-warn', groups.warn)}
  ${renderGroup('Informational', 'fa-circle-info', 'c-info', groups.info)}
  `;
}

/* ------------------------------------------------------------
   15. VIEW — REPORTS
   ------------------------------------------------------------ */
function viewReports() {
  const invoices = list('invoices').filter(i => i.status !== 'Cancelled');
  const payments = list('payments').filter(p => p.type !== 'Refund');
  const leads = list('leads');
  const customers = list('customers');
  const projects = list('projects');
  const agents = list('agents');

  /* Sales by service */
  const byService = {};
  invoices.forEach(i => {
    const k = i.service || 'Unclassified';
    byService[k] = (byService[k] || 0) + invoiceTotal(i);
  });
  const serviceRows = Object.keys(byService).map(k => ({ k, v: byService[k] })).sort((a, b) => b.v - a.v);
  const maxService = Math.max(1, ...serviceRows.map(r => r.v));

  /* Sales by month (last 12) */
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({
      key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
      label: d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }),
      invoiced: 0, collected: 0
    });
  }
  invoices.forEach(i => {
    if (!i.invoiceDate) return;
    const k = String(i.invoiceDate).slice(0, 7);
    const m = months.find(x => x.key === k);
    if (m) m.invoiced += invoiceTotal(i);
  });
  payments.forEach(p => {
    if (!p.date) return;
    const k = String(p.date).slice(0, 7);
    const m = months.find(x => x.key === k);
    if (m) m.collected += num(p.amount);
  });
  const maxMonth = Math.max(1, ...months.map(m => Math.max(m.invoiced, m.collected)));

  /* Lead source ROI */
  const sourceMap = {};
  leads.forEach(l => {
    const s = l.source || 'Unknown';
    if (!sourceMap[s]) sourceMap[s] = { leads: 0, customers: 0, revenue: 0 };
    sourceMap[s].leads++;
  });
  customers.forEach(c => {
    const s = c.leadSource || 'Unknown';
    if (!sourceMap[s]) sourceMap[s] = { leads: 0, customers: 0, revenue: 0 };
    sourceMap[s].customers++;
    sourceMap[s].revenue += customerRevenue(c._key);
  });
  const sourceRows = Object.keys(sourceMap).map(k => ({ k, ...sourceMap[k] }))
    .sort((a, b) => b.revenue - a.revenue || b.leads - a.leads);

  /* Top customers */
  const topCustomers = customers.map(c => ({
    name: c.name, key: c._key,
    revenue: customerRevenue(c._key),
    paid: customerPaid(c._key),
    cost: customerCost(c._key)
  })).map(x => ({ ...x, profit: x.revenue - x.cost }))
    .sort((a, b) => b.revenue - a.revenue).slice(0, 10);

  /* Outstanding */
  const outstandingRows = invoices
    .map(i => ({ inv: i, balance: invoiceBalance(i) }))
    .filter(x => x.balance > 0.5)
    .sort((a, b) => b.balance - a.balance);

  /* Overdue */
  const overdueRows = invoices.filter(isOverdue)
    .map(i => ({ inv: i, balance: invoiceBalance(i) }))
    .sort((a, b) => b.balance - a.balance);

  /* Project profitability */
  const projRows = projects.map(p => ({
    title: p.title, no: p.projectNo, key: p._key,
    value: num(p.projectValue), cost: num(p.directCost),
    profit: num(p.projectValue) - num(p.directCost)
  })).sort((a, b) => b.profit - a.profit).slice(0, 10);

  /* Agent performance */
  const agentRows = agents.map(a => {
    const rate = num(a.commissionRate);
    const sales = num(a.salesValue);
    return { ...a, calcCommission: sales * rate / 100 };
  }).sort((a, b) => num(b.salesValue) - num(a.salesValue));

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title"><i class="fas fa-chart-pie"></i> Reports & Analytics</h1>
      <p class="page-sub">Sales, collections, profitability and marketing return on investment</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost" data-action="export-all"><i class="fas fa-database"></i> Export Full Backup</button>
    </div>
  </div>

  <div class="grid g-2" style="margin-bottom:1rem">
    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-layer-group"></i> Sales by Service</h3></div>
      ${serviceRows.length ? serviceRows.map(r => `
        <div class="bar-row">
          <span class="bl" title="${esc(r.k)}">${esc(r.k)}</span>
          <div class="progress" style="flex:1"><span style="width:${Math.round((r.v / maxService) * 100)}%"></span></div>
          <span class="bv">${shortMoney(r.v)}</span>
        </div>`).join('') : '<div class="empty-state"><i class="fas fa-chart-bar"></i>No invoice data yet.</div>'}
    </div>

    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-calendar-days"></i> Invoiced vs Collected (12 months)</h3></div>
      ${months.map(m => `
        <div class="bar-row">
          <span class="bl">${esc(m.label)}</span>
          <div style="flex:1">
            <div class="progress"><span style="width:${Math.round((m.invoiced / maxMonth) * 100)}%"></span></div>
            <div class="progress" style="margin-top:3px"><span style="width:${Math.round((m.collected / maxMonth) * 100)}%;background:linear-gradient(90deg,#34d399,#10b981)"></span></div>
          </div>
          <span class="bv">${shortMoney(m.invoiced)}</span>
        </div>`).join('')}
      <div class="divider"></div>
      <div style="font-size:.74rem;color:#8ba0bc">
        <span style="color:#38bdf8">■</span> Invoiced &nbsp;&nbsp;
        <span style="color:#34d399">■</span> Collected
      </div>
    </div>
  </div>

  <div class="grid g-2" style="margin-bottom:1rem">
    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-bullhorn"></i> Marketing ROI — Lead Source</h3></div>
      <div style="overflow-x:auto"><table class="data-table" style="font-size:.79rem">
        <thead><tr><th>Source</th><th>Leads</th><th>Customers</th><th style="text-align:right">Revenue</th></tr></thead>
        <tbody>
          ${sourceRows.length ? sourceRows.map(r => `<tr>
            <td>${esc(r.k)}</td>
            <td>${r.leads}</td>
            <td>${r.customers}</td>
            <td style="text-align:right" class="mono c-accent">${money(r.revenue)}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="empty">No lead source data yet.</td></tr>'}
        </tbody>
      </table></div>
    </div>

    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-crown"></i> Customer Profitability (Top 10)</h3></div>
      <div style="overflow-x:auto"><table class="data-table" style="font-size:.79rem">
        <thead><tr><th>Customer</th><th style="text-align:right">Revenue</th><th style="text-align:right">Cost</th><th style="text-align:right">Profit</th></tr></thead>
        <tbody>
          ${topCustomers.length ? topCustomers.map(r => `<tr data-action="goto-record" data-view="customer360" data-key="${esc(r.key)}">
            <td>${esc(r.name)}</td>
            <td style="text-align:right" class="mono">${money(r.revenue)}</td>
            <td style="text-align:right" class="mono c-muted">${money(r.cost)}</td>
            <td style="text-align:right" class="mono ${r.profit >= 0 ? 'c-ok' : 'c-danger'}">${money(r.profit)}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="empty">No customer data yet.</td></tr>'}
        </tbody>
      </table></div>
    </div>
  </div>

  <div class="grid g-2" style="margin-bottom:1rem">
    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-hourglass-half"></i> Outstanding Invoices</h3></div>
      <div style="overflow-x:auto"><table class="data-table" style="font-size:.79rem">
        <thead><tr><th>Invoice</th><th>Customer</th><th>Due</th><th style="text-align:right">Balance</th></tr></thead>
        <tbody>
          ${outstandingRows.length ? outstandingRows.slice(0, 12).map(r => `<tr data-action="open-record" data-entity="invoices" data-key="${esc(r.inv._key)}">
            <td>${esc(r.inv.invoiceNo)}</td>
            <td>${esc(custName(r.inv.customerId))}</td>
            <td>${esc(fmtDate(r.inv.dueDate))}</td>
            <td style="text-align:right" class="mono c-warn">${money(r.balance)}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="empty">No outstanding balances. Excellent.</td></tr>'}
        </tbody>
      </table></div>
    </div>

    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-triangle-exclamation"></i> Overdue Invoices</h3></div>
      <div style="overflow-x:auto"><table class="data-table" style="font-size:.79rem">
        <thead><tr><th>Invoice</th><th>Customer</th><th>Due</th><th style="text-align:right">Balance</th></tr></thead>
        <tbody>
          ${overdueRows.length ? overdueRows.map(r => `<tr data-action="open-record" data-entity="invoices" data-key="${esc(r.inv._key)}">
            <td>${esc(r.inv.invoiceNo)}</td>
            <td>${esc(custName(r.inv.customerId))}</td>
            <td class="c-danger">${esc(fmtDate(r.inv.dueDate))}</td>
            <td style="text-align:right" class="mono c-danger">${money(r.balance)}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="empty">No overdue invoices.</td></tr>'}
        </tbody>
      </table></div>
    </div>
  </div>

  <div class="grid g-2">
    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-diagram-project"></i> Project Profitability</h3></div>
      <div style="overflow-x:auto"><table class="data-table" style="font-size:.79rem">
        <thead><tr><th>Project</th><th style="text-align:right">Value</th><th style="text-align:right">Cost</th><th style="text-align:right">Profit</th></tr></thead>
        <tbody>
          ${projRows.length ? projRows.map(r => `<tr data-action="open-record" data-entity="projects" data-key="${esc(r.key)}">
            <td>${esc(r.title)}</td>
            <td style="text-align:right" class="mono">${money(r.value)}</td>
            <td style="text-align:right" class="mono c-muted">${money(r.cost)}</td>
            <td style="text-align:right" class="mono ${r.profit >= 0 ? 'c-ok' : 'c-danger'}">${money(r.profit)}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="empty">No projects recorded yet.</td></tr>'}
        </tbody>
      </table></div>
    </div>

    <div class="card animate-on-view">
      <div class="card-head"><h3><i class="fas fa-user-tie"></i> Agent Performance</h3></div>
      <div style="overflow-x:auto"><table class="data-table" style="font-size:.79rem">
        <thead><tr><th>Agent</th><th>Leads</th><th style="text-align:right">Sales</th><th style="text-align:right">Commission</th></tr></thead>
        <tbody>
          ${agentRows.length ? agentRows.map(a => `<tr data-action="open-record" data-entity="agents" data-key="${esc(a._key)}">
            <td>${esc(a.name)}</td>
            <td>${num(a.leadsGenerated)}</td>
            <td style="text-align:right" class="mono c-accent">${money(a.salesValue)}</td>
            <td style="text-align:right" class="mono c-ok">${money(a.calcCommission)}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="empty">No agents registered yet.</td></tr>'}
        </tbody>
      </table></div>
    </div>
  </div>
  `;
}

/* ------------------------------------------------------------
   18. RECORD DETAIL PANEL
   ------------------------------------------------------------ */
function openRecordDetail(entity, key) {
  const r = getRec(entity, key);
  if (!r) { toast('Record not found', 'err'); return; }
  const s = SCHEMAS[entity];

  const rows = s.fields.map(f => {
    let val = r[f.key];
    if (val === undefined || val === null || val === '') return '';
    let display;
    switch (f.type) {
      case 'money': display = '<span class="mono c-accent">' + money(val) + '</span>'; break;
      case 'date': display = esc(fmtDate(val)); break;
      case 'datetime-local': display = esc(fmtDateTime(val)); break;
      case 'select': display = badgeHTML(val); break;
      case 'ref': display = esc(refLabel(f.ref, val)) || '<span class="muted">—</span>'; break;
      case 'items':
        display = Array.isArray(val) && val.length
          ? `<table class="items-table" style="margin-top:.3rem">
              <thead><tr><th>Description</th><th style="text-align:right">Qty</th><th style="text-align:right">Unit Price</th><th style="text-align:right">Amount</th></tr></thead>
              <tbody>${val.map(it => `<tr>
                <td>${esc(it.description || '')}</td>
                <td style="text-align:right" class="mono">${num(it.qty)}</td>
                <td style="text-align:right" class="mono">${money(it.unitPrice)}</td>
                <td style="text-align:right" class="mono c-accent">${money(num(it.qty) * num(it.unitPrice))}</td>
              </tr>`).join('')}</tbody>
            </table>`
          : '<span class="muted">—</span>';
        break;
      case 'textarea': display = '<div style="white-space:pre-wrap;font-size:.84rem;color:#b0c4de">' + esc(val) + '</div>'; break;
      default: display = esc(String(val));
    }
    return `<div class="detail-item ${f.type === 'textarea' || f.type === 'items' ? 'full' : ''}" style="${f.type === 'textarea' || f.type === 'items' ? 'grid-column:1/-1' : ''}">
      <div class="dl">${esc(f.label)}</div>
      <div class="dv">${display}</div>
    </div>`;
  }).join('');

  const totals = ['total', 'subtotal', 'discount', 'taxAmount'].some(k => r[k] !== undefined)
    ? `<div class="divider"></div>
       <div class="totals-box" style="margin-left:0">
         ${r.subtotal !== undefined ? `<div class="totals-row"><span>Subtotal</span><span class="mono">${money(r.subtotal)}</span></div>` : ''}
         ${r.discount ? `<div class="totals-row"><span>Discount</span><span class="mono c-danger">− ${money(r.discount)}</span></div>` : ''}
         ${r.taxAmount !== undefined ? `<div class="totals-row"><span>VAT (${num(r.taxRate)}%)</span><span class="mono">${money(r.taxAmount)}</span></div>` : ''}
         ${r.total !== undefined ? `<div class="totals-row grand"><span>Total</span><span class="mono">${money(r.total)}</span></div>` : ''}
       </div>` : '';

  const invoiceInfo = entity === 'invoices' ? (() => {
    const paid = paidForInvoice(key);
    const bal = invoiceTotal(r) - paid;
    return `<div class="divider"></div>
      <div class="grid g-3">
        ${detailItem('Invoice Total', money(invoiceTotal(r)))}
        ${detailItem('Amount Paid', money(paid))}
        ${detailItem('Balance Due', money(bal))}
      </div>
      ${bal > 0.5 ? `<button class="btn btn-primary" style="margin-top:.8rem" data-action="quick-payment" data-customer="${esc(r.customerId)}" data-invoice="${esc(key)}" data-amount="${bal}">
        <i class="fas fa-money-bill-transfer"></i> Record Payment
      </button>` : ''}`;
  })() : '';

  const hpInfo = entity === 'hirepurchase' ? (() => {
    const bal = num(r.financedAmount) - num(r.amountPaid);
    return `<div class="divider"></div>
      <div class="grid g-3">
        ${detailItem('Financed', money(r.financedAmount))}
        ${detailItem('Paid', money(r.amountPaid))}
        ${detailItem('Balance', money(bal))}
      </div>`;
  })() : '';

  openModal(`
    <div class="modal-head">
      <h2><i class="fas ${s.icon}"></i> ${esc(r[s.noField] || s.singular)} — ${esc(r[s.labelField] || '')}</h2>
      <button class="close-x" data-action="close-modal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="detail-grid">${rows}</div>
      ${totals}
      ${invoiceInfo}
      ${hpInfo}
      <div class="divider"></div>
      <div style="font-size:.72rem;color:#5b7292">
        Created ${esc(fmtDateTime(r.createdAt))} by ${esc(r.createdBy || '—')}
        ${r.updatedAt ? ' • Updated ' + esc(fmtDateTime(r.updatedAt)) + ' by ' + esc(r.updatedBy || '—') : ''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" data-action="delete-record" data-entity="${entity}" data-key="${esc(key)}">
        <i class="fas fa-trash"></i> Delete
      </button>
      ${entity === 'customers' ? `<button class="btn btn-ghost" data-action="goto-record" data-view="customer360" data-key="${esc(key)}"><i class="fas fa-address-card"></i> Customer 360°</button>` : ''}
      <button class="btn btn-primary" data-action="edit-record" data-entity="${entity}" data-key="${esc(key)}">
        <i class="fas fa-pen"></i> Edit
      </button>
    </div>
  `, 'wide');
}

/* ------------------------------------------------------------
   19. RECORD FORM
   ------------------------------------------------------------ */
function openRecordForm(entity, key, preset) {
  const s = SCHEMAS[entity];
  const r = key ? getRec(entity, key) : {};
  if (key && !r) { toast('Record not found', 'err'); return; }
  const rec = key ? r : Object.assign({}, preset || {});

  const fieldsHTML = s.fields.map(f => {
    const val = rec[f.key];
    const full = f.full || f.type === 'textarea' || f.type === 'items';

    if (f.type === 'items') {
      return `<div class="form-field full"><label>${esc(f.label)}</label>${renderItemsEditor(f.key, val)}</div>`;
    }

    let input;
    if (f.type === 'textarea') {
      input = `<textarea class="input" name="${f.key}" rows="3" placeholder="${esc(f.label)}">${esc(val || '')}</textarea>`;
    } else if (f.type === 'select') {
      input = `<select class="input" name="${f.key}">
        <option value="">— Select —</option>
        ${f.options.map(o => `<option value="${esc(o)}" ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>`;
    } else if (f.type === 'ref') {
      const opts = list(f.ref).sort((a, b) => {
        const la = refLabel(f.ref, a._key), lb = refLabel(f.ref, b._key);
        return la.localeCompare(lb);
      });
      input = `<select class="input" name="${f.key}">
        <option value="">— None —</option>
        ${opts.map(o => `<option value="${esc(o._key)}" ${val === o._key ? 'selected' : ''}>${esc(refLabel(f.ref, o._key))}${o[SCHEMAS[f.ref].noField] ? ' (' + esc(o[SCHEMAS[f.ref].noField]) + ')' : ''}</option>`).join('')}
      </select>`;
    } else if (f.type === 'money' || f.type === 'number') {
      input = `<input class="input" type="number" step="any" name="${f.key}" value="${val !== undefined && val !== null ? esc(val) : ''}" placeholder="0">`;
    } else if (f.type === 'date') {
      input = `<input class="input" type="date" name="${f.key}" value="${esc(val || '')}">`;
    } else if (f.type === 'datetime-local') {
      input = `<input class="input" type="datetime-local" name="${f.key}" value="${esc(val || '')}">`;
    } else {
      input = `<input class="input" type="${f.type === 'email' ? 'email' : f.type === 'tel' ? 'tel' : 'text'}" name="${f.key}" value="${esc(val || '')}" placeholder="${esc(f.label)}" ${f.required ? 'required' : ''}>`;
    }

    return `<div class="form-field ${full ? 'full' : ''}">
      <label>${esc(f.label)} ${f.required ? '<span class="req">*</span>' : ''}</label>
      ${input}
    </div>`;
  }).join('');

  openModal(`
    <div class="modal-head">
      <h2><i class="fas ${s.icon}"></i> ${key ? 'Edit' : 'New'} ${esc(s.singular)}</h2>
      <button class="close-x" data-action="close-modal">&times;</button>
    </div>
    <form id="recordForm" data-entity="${entity}" data-key="${key || ''}">
      <div class="modal-body">
        <div class="form-grid">${fieldsHTML}</div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> ${key ? 'Update' : 'Save'} ${esc(s.singular)}</button>
      </div>
    </form>
  `, 'wide');

  attachItemsEditors();
}

/* ---------- Line items editor ---------- */
function renderItemsEditor(key, val) {
  const rows = Array.isArray(val) ? val : [];
  return `<div class="items-field" data-items="${esc(key)}">
    <table class="items-table">
      <thead>
        <tr>
          <th style="width:44%">Description</th>
          <th style="width:12%;text-align:right">Qty</th>
          <th style="width:18%;text-align:right">Unit Price</th>
          <th style="width:18%;text-align:right">Amount</th>
          <th style="width:8%"></th>
        </tr>
      </thead>
      <tbody class="items-body">
        ${rows.map(r => itemRowHTML(r)).join('')}
      </tbody>
    </table>
    <button type="button" class="btn btn-ghost btn-sm" data-action="add-item-row" data-items="${esc(key)}">
      <i class="fas fa-plus"></i> Add Line
    </button>
    <div class="totals-box" style="margin-top:.7rem">
      <div class="totals-row"><span>Subtotal</span><span class="mono" data-total="subtotal">KES 0</span></div>
      <div class="totals-row"><span>Discount</span>
        <input type="number" step="any" data-total-input="discount" value="0">
      </div>
      <div class="totals-row"><span>VAT Rate (%)</span>
        <input type="number" step="any" data-total-input="taxRate" value="16">
      </div>
      <div class="totals-row"><span>VAT Amount</span><span class="mono" data-total="taxAmount">KES 0</span></div>
      <div class="totals-row grand"><span>Total</span><span class="mono" data-total="total">KES 0</span></div>
    </div>
  </div>`;
}

function itemRowHTML(r) {
  r = r || {};
  return `<tr class="item-row">
    <td><input type="text" class="it-desc" value="${esc(r.description || '')}" placeholder="Item / service description"></td>
    <td><input type="number" step="any" class="it-qty" value="${r.qty !== undefined ? esc(r.qty) : 1}" style="text-align:right"></td>
    <td><input type="number" step="any" class="it-price" value="${r.unitPrice !== undefined ? esc(r.unitPrice) : ''}" style="text-align:right" placeholder="0"></td>
    <td class="amt it-amt">KES 0</td>
    <td><button type="button" class="icon-btn" style="width:26px;height:26px;font-size:.7rem" data-action="remove-item-row"><i class="fas fa-times"></i></button></td>
  </tr>`;
}

function attachItemsEditors() {
  $$('.items-field').forEach(box => recomputeItems(box));
}

function recomputeItems(box) {
  const rows = $$('.item-row', box);
  let subtotal = 0;
  rows.forEach(row => {
    const q = num($('.it-qty', row).value);
    const p = num($('.it-price', row).value);
    const amt = q * p;
    subtotal += amt;
    $('.it-amt', row).textContent = money(amt);
  });
  const discount = num(($('[data-total-input="discount"]', box) || {}).value);
  const taxRate = num(($('[data-total-input="taxRate"]', box) || {}).value);
  const taxable = Math.max(0, subtotal - discount);
  const taxAmount = taxable * (taxRate / 100);
  const total = taxable + taxAmount;

  const set = (k, v) => { const el = $('[data-total="' + k + '"]', box); if (el) el.textContent = v; };
  set('subtotal', money(subtotal));
  set('taxAmount', money(taxAmount));
  set('total', money(total));
  return { subtotal, discount, taxRate, taxAmount, total };
}

function collectItems(box) {
  const items = $$('.item-row', box).map(row => ({
    description: $('.it-desc', row).value.trim(),
    qty: num($('.it-qty', row).value),
    unitPrice: num($('.it-price', row).value)
  })).filter(it => it.description || it.qty || it.unitPrice);
  const totals = recomputeItems(box);
  return { items, totals };
}

function openModal(html, size) {

  root.innerHTML = `<div class="modal-backdrop" data-action="backdrop">
    <div class="modal" ${size === 'wide' ? 'style="max-width:960px"' : ''}>${html}</div>
  </div>`;

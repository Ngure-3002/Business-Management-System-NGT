function c360Timeline(key) {
  const events = [];

  const c = findRec('customers', key);
  if (c && c.createdAt) events.push({ d: c.createdAt, t: 'Customer record created', s: c.name || '', cls: 'green' });

  list('leads').filter(x => x.convertedToCustomer === (c ? c.id : '')).forEach(l => {
    if (l.createdAt) events.push({ d: l.createdAt, t: 'Lead created — ' + (l.service || ''), s: 'Source: ' + (l.source || '—'), cls: 'amber' });
  });

  list('opportunities').filter(x => x.customer === key).forEach(o => {
    if (o.createdAt) events.push({ d: o.createdAt, t: 'Opportunity: ' + (o.title || ''), s: money(o.estimatedValue) + ' · ' + (o.stage || ''), cls: '' });
  });
  list('assessments').filter(x => x.customer === key).forEach(a => {
    if (a.assessmentDate) events.push({ d: a.assessmentDate, t: 'Site assessment — ' + (a.serviceType || ''), s: a.site || '', cls: 'amber' });
  });
  list('quotations').filter(x => x.customer === key).forEach(q => {
    if (q.date) events.push({ d: q.date, t: 'Quotation ' + (q.id || '') + ' issued', s: money(itemsTotal(q)) + ' · ' + (q.status || ''), cls: '' });
  });
  list('salesorders').filter(x => x.customer === key).forEach(s => {
    if (s.date) events.push({ d: s.date, t: 'Sales Order ' + (s.id || ''), s: money(itemsTotal(s)) + ' · ' + (s.status || ''), cls: 'green' });
  });
  list('invoices').filter(x => x.customer === key).forEach(i => {
    if (i.date) events.push({ d: i.date, t: 'Invoice ' + (i.id || '') + ' issued', s: money(i.total) + ' · ' + invoiceStatus(i), cls: '' });
  });
  list('payments').filter(x => x.customer === key).forEach(p => {
    if (p.date) events.push({ d: p.date, t: 'Payment received — ' + (p.method || ''), s: money(p.amount) + (p.reference ? ' · Ref ' + p.reference : ''), cls: 'green' });
  });
  list('projects').filter(x => x.customer === key).forEach(p => {
    if (p.startDate) events.push({ d: p.startDate, t: 'Project started: ' + (p.name || ''), s: p.status || '', cls: '' });
    if (p.endDate && p.status === 'Completed') events.push({ d: p.endDate, t: 'Project completed: ' + (p.name || ''), s: '', cls: 'green' });
  });
  list('tickets').filter(x => x.customer === key).forEach(t => {
    if (t.openedDate) events.push({ d: t.openedDate, t: 'Support ticket: ' + (t.issue || ''), s: t.status || '', cls: 'amber' });
  });
  list('communications').filter(x => x.customer === key).forEach(m => {
    if (m.date) events.push({ d: m.date, t: (m.direction || '') + ' ' + (m.channel || '') + ' — ' + (m.subject || ''), s: m.message || '', cls: 'amber' });
  });

  events.sort((a, b) => String(b.d).localeCompare(String(a.d)));

  if (!events.length) return '<div class="empty-state"><i class="fa-solid fa-timeline"></i><p>No activity recorded for this customer yet.</p></div>';

  let h = '<div class="card"><div class="timeline">';
  events.slice(0, 60).forEach(e => {
    h += '<div class="tl-item ' + (e.cls || '') + '">' +
      '<div class="tl-date">' + fmtDate(e.d) + '</div>' +
      '<div class="tl-title">' + esc(e.t) + '</div>' +
      (e.s ? '<div class="tl-sub">' + esc(e.s) + '</div>' : '') +
      '</div>';
  });
  h += '</div></div>';
  return h;
}

function miniTable(col, rows) {
  const s = SCHEMAS[col];
  if (!rows.length) {
    return '<div class="table-wrap"><div class="empty-state"><i class="fa-solid ' + s.icon + '"></i>' +
      '<p>No ' + esc(s.label.toLowerCase()) + ' for this customer.</p>' +
      '<button class="btn btn-primary btn-sm mt2" onclick="openForm(\'' + col + '\')"><i class="fa-solid fa-plus"></i> Add</button></div></div>';
  }
  let h = '<div class="table-wrap"><div class="table-scroll"><table class="tbl"><thead><tr>';
  s.columns.forEach(c => { h += '<th>' + esc(c.t) + '</th>'; });
  h += '<th></th></tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr onclick="openDetail(\'' + col + '\',\'' + r._key + '\')">';
    s.columns.forEach(c => { h += '<td>' + renderCell(r, c) + '</td>'; });
    h += '<td class="text-right"><i class="fa-solid fa-chevron-right dim"></i></td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

function c360Statement(key) {
  const invs = list('invoices').filter(i => i.customer === key && i.status !== 'Cancelled');
  const pays = list('payments').filter(p => p.customer === key);

  const txns = [];
  invs.forEach(i => txns.push({ d: i.date || '', desc: 'Invoice ' + (i.id || '') + (i.notes ? ' — ' + i.notes : ''), debit: num(i.total), credit: 0 }));
  pays.forEach(p => txns.push({ d: p.date || '', desc: 'Payment — ' + (p.method || '') + (p.reference ? ' Ref: ' + p.reference : ''), debit: 0, credit: num(p.amount) }));
  txns.sort((a, b) => String(a.d).localeCompare(String(b.d)));

  let bal = 0;
  let h = '<div class="card" style="padding:0;overflow:hidden"><div class="table-scroll"><table class="tbl">';
  h += '<thead><tr><th>Date</th><th>Transaction</th><th style="text-align:right">Debit (KES)</th>' +
    '<th style="text-align:right">Credit (KES)</th><th style="text-align:right">Balance (KES)</th></tr></thead><tbody>';

  if (!txns.length) {
    h += '<tr><td colspan="5"><div class="empty-state"><i class="fa-solid fa-receipt"></i><p>No financial transactions recorded.</p></div></td></tr>';
  } else {
    txns.forEach(t => {
      bal += t.debit - t.credit;
      h += '<tr><td class="small muted">' + fmtDate(t.d) + '</td>' +
        '<td>' + esc(t.desc) + '</td>' +
        '<td class="money text-right">' + (t.debit ? money(t.debit) : '—') + '</td>' +
        '<td class="money text-right" style="color:#6ee7a8">' + (t.credit ? money(t.credit) : '—') + '</td>' +
        '<td class="money text-right" style="color:' + (bal > 0.01 ? '#fcd34d' : '#6ee7a8') + '">' + money(bal) + '</td></tr>';
    });
  }
  h += '</tbody></table></div>';
  h += '<div class="items-foot"><div class="tot">Total Invoiced <b>' + money(invs.reduce((s, i) => s + num(i.total), 0)) + '</b></div>' +
    '<div class="tot">Total Paid <b style="color:#6ee7a8">' + money(pays.reduce((s, p) => s + num(p.amount), 0)) + '</b></div>' +
    '<div class="tot grand">Balance <b>' + money(bal) + '</b></div></div></div>';
  return h;
}

/* ============================================================
   15. REPORTS & ANALYTICS
   ============================================================ */
function viewReports() {
  const opps = list('opportunities');
  const invs = list('invoices');
  const pays = list('payments');
  const custs = list('customers');
  const projs = list('projects');
  const quotes = list('quotations');
  const leads = list('leads');

  let h = '<div class="page-head"><div><h2><i class="fa-solid fa-chart-pie"></i> Reports & Analytics</h2>' +
    '<p>Sales, pipeline, financial and operational intelligence</p></div>' +
    '<div class="page-actions"><button class="btn btn-primary btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button></div></div>';

  /* ---- Sales by Service ---- */
  const byService = {};
  invs.filter(i => i.status !== 'Cancelled').forEach(i => {
    const cust = findRec('customers', i.customer);
    const svc = (cust && cust.category) || 'Unclassified';
    byService[svc] = (byService[svc] || 0) + num(i.total);
  });

  /* ---- Sales by Month ---- */
  const byMonth = {};
  invs.filter(i => i.status !== 'Cancelled').forEach(i => {
    const m = (i.date || '').slice(0, 7);
    if (!m) return;
    byMonth[m] = (byMonth[m] || 0) + num(i.total);
  });
  const months = Object.keys(byMonth).sort().slice(-8);
  const maxMonth = Math.max(1, ...months.map(m => byMonth[m]));

  /* ---- Pipeline by stage ---- */
  const byStage = {};
  PIPE_STAGES.forEach(s => byStage[s] = { c: 0, v: 0 });
  opps.forEach(o => {
    if (!byStage[o.stage]) byStage[o.stage] = { c: 0, v: 0 };
    byStage[o.stage].c++;
    byStage[o.stage].v += num(o.estimatedValue);
  });

  /* ---- Agent performance ---- */
  const agentRows = list('agents').map(a => ({
    a,
    leads: leads.filter(l => l.assignedTo === a.name).length,
    opps: opps.filter(o => o.assignedTo === a.name).length,
    won: opps.filter(o => o.assignedTo === a.name && o.stage === 'Won').length,
    value: opps.filter(o => o.assignedTo === a.name && o.stage === 'Won').reduce((s, o) => s + num(o.estimatedValue), 0)
  }));

  /* ---- Sales by customer ---- */
  const byCust = custs.map(c => ({ c, v: customerRevenue(c._key) })).sort((a, b) => b.v - a.v).slice(0, 10);

  /* ---- Profitability ---- */
  const profRows = custs.map(c => {
    const rev = customerRevenue(c._key);
    const cost = list('projects').filter(p => p.customer === c._key).reduce((s, p) => s + num(p.expenses), 0);
    return { c, rev, cost, profit: rev - cost, margin: rev ? ((rev - cost) / rev * 100) : 0 };
  }).filter(r => r.rev > 0).sort((a, b) => b.profit - a.profit).slice(0, 12);

  /* ---- Service type breakdown ---- */
  const byType = {};
  projs.forEach(p => {
    const t = p.serviceType || 'Other';
    if (!byType[t]) byType[t] = { c: 0, v: 0 };
    byType[t].c++;
    byType[t].v += num(p.budget);
  });

  /* ---------- Render ---------- */
  h += '<div class="grid2">';

  /* Monthly sales */
  h += '<div class="card"><div class="section-head"><h3><i class="fa-solid fa-chart-column"></i> Monthly Invoiced Sales</h3></div>';
  if (!months.length) h += '<div class="empty-state" style="padding:1.5rem"><i class="fa-solid fa-chart-column"></i><p>No invoice data.</p></div>';
  else {
    h += '<div style="display:flex;align-items:flex-end;gap:.6rem;height:170px;padding:.5rem 0">';
    months.forEach(m => {
      const pct = Math.round((byMonth[m] / maxMonth) * 100);
      h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:.35rem;height:100%;justify-content:flex-end">' +
        '<div class="small" style="color:#7dd3fc;font-weight:700;font-size:.62rem">' + money(byMonth[m]).replace('KES ', '') + '</div>' +
        '<div style="width:100%;background:linear-gradient(180deg,#38bdf8,#0ea5e9);border-radius:6px 6px 0 0;height:' + Math.max(4, pct) + '%;min-height:6px;box-shadow:0 0 14px rgba(56,189,248,.3)"></div>' +
        '<div class="small dim" style="font-size:.6rem">' + m.slice(2) + '</div>' +
        '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* Pipeline by stage */
  h += '<div class="card"><div class="section-head"><h3><i class="fa-solid fa-filter-circle-dollar"></i> Pipeline by Stage</h3></div>';
  h += '<div class="table-wrap" style="background:transparent;border:none"><table class="tbl" style="min-width:auto">' +
    '<thead><tr><th>Stage</th><th>Count</th><th style="text-align:right">Value</th></tr></thead><tbody>';
  PIPE_STAGES.forEach(st => {
    if (!byStage[st] || (byStage[st].c === 0 && byStage[st].v === 0)) return;
    h += '<tr><td>' + badge(st) + '</td><td>' + byStage[st].c + '</td>' +
      '<td class="money text-right">' + money(byStage[st].v) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  h += '</div>';

  /* ---- Customer Profitability ---- */
  h += '<div class="section mt2"><div class="section-head"><h3><i class="fa-solid fa-sack-dollar"></i> Customer Profitability</h3></div>';
  h += '<div class="table-wrap"><div class="table-scroll"><table class="tbl"><thead><tr>' +
    '<th>Customer</th><th>Category</th><th style="text-align:right">Revenue</th>' +
    '<th style="text-align:right">Direct Costs</th><th style="text-align:right">Gross Profit</th>' +
    '<th style="text-align:right">Margin</th></tr></thead><tbody>';
  if (!profRows.length) {
    h += '<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-sack-dollar"></i><p>No revenue data yet.</p></div></td></tr>';
  } else {
    profRows.forEach(r => {
      h += '<tr onclick="openCustomer360(\'' + r.c._key + '\')">' +
        '<td style="font-weight:600">' + esc(r.c.name || '—') + '</td>' +
        '<td>' + esc(r.c.category || '—') + '</td>' +
        '<td class="money text-right">' + money(r.rev) + '</td>' +
        '<td class="money text-right" style="color:#fca5a5">' + money(r.cost) + '</td>' +
        '<td class="money text-right" style="color:' + (r.profit >= 0 ? '#6ee7a8' : '#fca5a5') + '">' + money(r.profit) + '</td>' +
        '<td class="text-right"><span class="badge ' + (r.margin >= 30 ? 'green' : r.margin >= 15 ? 'amber' : 'red') + '">' + r.margin.toFixed(1) + '%</span></td>' +
        '</tr>';
    });
  }
  h += '</tbody></table></div></div></div>';

  /* ---- Service Type Performance ---- */
  h += '<div class="section mt2"><div class="section-head"><h3><i class="fa-solid fa-screwdriver-wrench"></i> Project Performance by Service Line</h3></div>';
  h += '<div class="table-wrap"><div class="table-scroll"><table class="tbl"><thead><tr>' +
    '<th>Service Line</th><th>Projects</th><th style="text-align:right">Contract Value</th><th style="width:26%">Share</th></tr></thead><tbody>';
  const typeArr = Object.keys(byType).map(k => ({ k, ...byType[k] })).sort((a, b) => b.v - a.v);
  const maxType = Math.max(1, ...typeArr.map(t => t.v));
  if (!typeArr.length) {
    h += '<tr><td colspan="4"><div class="empty-state"><i class="fa-solid fa-screwdriver-wrench"></i><p>No project data yet.</p></div></td></tr>';
  } else {
    typeArr.forEach(t => {
      h += '<tr><td style="font-weight:600">' + esc(t.k) + '</td><td>' + t.c + '</td>' +
        '<td class="money text-right">' + money(t.v) + '</td>' +
        '<td><div class="progress"><span style="width:' + Math.round((t.v / maxType) * 100) + '%"></span></div></td></tr>';
    });
  }
  h += '</tbody></table></div></div></div>';

  /* ---- Agent Performance ---- */
  h += '<div class="section mt2"><div class="section-head"><h3><i class="fa-solid fa-user-tie"></i> Agent Performance & Commission</h3></div>';
  h += '<div class="table-wrap"><div class="table-scroll"><table class="tbl"><thead><tr>' +
    '<th>Agent</th><th>Leads</th><th>Opportunities</th><th>Won</th>' +
    '<th style="text-align:right">Sales Value</th><th style="text-align:right">Commission Due</th><th>Status</th></tr></thead><tbody>';
  if (!agentRows.length) {
    h += '<tr><td colspan="7"><div class="empty-state"><i class="fa-solid fa-user-tie"></i><p>No agents registered.</p>' +
      '<button class="btn btn-primary btn-sm mt2" onclick="setView(\'agents\')">Register an Agent</button></div></td></tr>';
  } else {
    agentRows.forEach(r => {
      const comm = r.value * num(r.a.commissionRate) / 100;
      h += '<tr onclick="openDetail(\'agents\',\'' + r.a._key + '\')">' +
        '<td style="font-weight:600">' + esc(r.a.name || '—') + '</td>' +
        '<td>' + r.leads + '</td><td>' + r.opps + '</td><td>' + r.won + '</td>' +
        '<td class="money text-right">' + money(r.value) + '</td>' +
        '<td class="money text-right" style="color:#fcd34d">' + money(comm) + '</td>' +
        '<td>' + badge(r.a.status) + '</td></tr>';
    });
  }
  h += '</tbody></table></div></div></div>';

  /* ---- Top customers ---- */
  h += '<div class="section mt2"><div class="section-head"><h3><i class="fa-solid fa-ranking-star"></i> Top 10 Customers by Revenue</h3></div>';
  h += '<div class="table-wrap"><div class="table-scroll"><table class="tbl"><thead><tr>' +
    '<th>#</th><th>Customer</th><th>Category</th><th style="text-align:right">Revenue</th><th style="text-align:right">Outstanding</th></tr></thead><tbody>';
  if (!byCust.length) {
    h += '<tr><td colspan="5"><div class="empty-state"><i class="fa-solid fa-ranking-star"></i><p>No customer revenue data.</p></div></td></tr>';
  } else {
    byCust.forEach((r, i) => {
      h += '<tr onclick="openCustomer360(\'' + r.c._key + '\')">' +
        '<td><span class="badge ' + (i < 3 ? 'purple' : 'gray') + '">' + (i + 1) + '</span></td>' +
        '<td style="font-weight:600">' + esc(r.c.name || '—') + '</td>' +
        '<td>' + esc(r.c.category || '—') + '</td>' +
        '<td class="money text-right">' + money(r.v) + '</td>' +
        '<td class="money text-right" style="color:#fcd34d">' + money(customerOutstanding(r.c._key)) + '</td></tr>';
    });
  }
  h += '</tbody></table></div></div></div>';

  return h;
}

      '<td class="text-right"><i class="fa-solid fa-chevron-right dim"></i></td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  h += '<div class="section mt2"><div class="card" style="border-color:#5b2323">' +
    '<div class="section-head"><h3 style="color:#fca5a5"><i class="fa-solid fa-triangle-exclamation"></i> Danger Zone</h3></div>' +
    '<p class="small muted mb2">These operations are irreversible and affect the live production database.</p>' +
    '<div class="flex flex-wrap">' +
      '<button class="btn btn-danger btn-sm" onclick="exportAll()"><i class="fa-solid fa-download"></i> Export Full Backup (JSON)</button>' +
    '</div></div></div>';

  return h;
}

/* ============================================================
   17. NOTIFICATIONS
   ============================================================ */
function computeNotifications() {
  const n = [];
  const today = todayISO();

  list('invoices').forEach(i => {
    if (i.status === 'Cancelled') return;
    const bal = invoiceBalance(i);
    if (i.dueDate && isOverdue(i.dueDate) && bal > 0.01) {
      n.push({ icon: 'fa-triangle-exclamation', cls: 'red', t: 'Invoice ' + (i.id || '') + ' is overdue',
        s: refName('customers', i.customer) + ' · ' + money(bal) + ' outstanding · Due ' + fmtDate(i.dueDate),
        view: 'invoices' });
    }
  });

  list('followups').forEach(f => {
    if (f.status === 'Pending' && f.dueDate && isOverdue(f.dueDate)) {
      n.push({ icon: 'fa-bell', cls: 'amber', t: 'Follow-up overdue: ' + (f.subject || ''),
        s: refName('customers', f.customer) + ' · Due ' + fmtDate(f.dueDate), view: 'followups' });
    }
  });

  list('quotations').forEach(q => {
    if (q.validity && isOverdue(q.validity) && ['Sent','Draft','Pending Approval'].includes(q.status)) {
      n.push({ icon: 'fa-file-circle-xmark', cls: 'amber', t: 'Quotation ' + (q.id || '') + ' has expired',
        s: refName('customers', q.customer) + ' · ' + money(itemsTotal(q)), view: 'quotations' });
    }
  });

  list('tickets').forEach(t => {
    if (!['Resolved','Closed'].includes(t.status)) {
      n.push({ icon: 'fa-headset', cls: 'blue', t: 'Open ticket: ' + (t.issue || ''),
        s: refName('customers', t.customer) + ' · ' + (t.priority || '') + ' priority', view: 'tickets' });
    }
  });

  list('warranties').forEach(w => {
    if (w.warrantyEnd && !isOverdue(w.warrantyEnd)) {
      const days = daysBetween(today, w.warrantyEnd);
      if (days <= 30) {
        n.push({ icon: 'fa-shield-halved', cls: 'amber', t: 'Warranty expiring in ' + days + ' days',
          s: (w.product || '') + ' · ' + refName('customers', w.customer), view: 'warranties' });
      }
    }
  });

  list('leads').forEach(l => {
    if (l.status === 'New' && l.createdAt && daysBetween(l.createdAt.slice(0, 10), today) <= 1) {
      n.push({ icon: 'fa-bullseye', cls: 'blue', t: 'New lead: ' + (l.name || ''),
        s: (l.service || '') + ' · ' + money(l.estimatedValue), view: 'leads' });
    }
  });

  list('projects').forEach(p => {
    if (['Awaiting Deposit','Pending Site Assessment'].includes(p.status)) {
      n.push({ icon: 'fa-diagram-project', cls: 'blue', t: 'Project awaiting action: ' + (p.name || ''),
        s: refName('customers', p.customer) + ' · ' + p.status, view: 'projects' });
    }
  });

  return n;
}

function updateNotifCount() {
  const n = computeNotifications();
  const el = document.getElementById('notifCount');
  if (!el) return;
  if (n.length) { el.classList.add('show'); el.textContent = n.length > 99 ? '99+' : n.length; }
  else el.classList.remove('show');
}

function openNotifications() {
  const n = computeNotifications();
  let body;
  if (!n.length) {
    body = '<div class="empty-state"><i class="fa-solid fa-bell-slash"></i><p>You are all caught up. No notifications.</p></div>';
  } else {
    body = '<div style="display:flex;flex-direction:column;gap:.5rem">';
    n.forEach(x => {
      body += '<div class="card" style="padding:.65rem .8rem;cursor:pointer" onclick="closeModal();setView(\'' + x.view + '\')">' +
        '<div class="flex" style="align-items:flex-start">' +
        '<div class="k-ico" style="width:30px;height:30px;border-radius:9px;background:#1a2c42;display:grid;place-items:center;color:var(--accent);flex-shrink:0">' +
        '<i class="fa-solid ' + x.icon + '"></i></div>' +
        '<div><div style="font-size:.79rem;font-weight:600;color:#dbeafe">' + esc(x.t) + '</div>' +
        '<div class="small dim">' + esc(x.s) + '</div></div></div></div>';
    });
    body += '</div>';
  }
  openModal('Notifications (' + n.length + ')', body, '<button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>');
}

/* ============================================================
   18. GLOBAL SEARCH
   ============================================================ */
function initSearch() {
  const inp = document.getElementById('globalSearch');
  const res = document.getElementById('searchResults');

  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2) { res.classList.remove('show'); return; }
    const results = [];

    COLLECTIONS.forEach(col => {
      const s = SCHEMAS[col];
      list(col).forEach(r => {
        const hay = [r.id, r.name, r.title, r.subject, r.company, r.phone, r.email, r.product, r.serial]
          .filter(Boolean).join(' ').toLowerCase();
        if (hay.includes(q)) {
          results.push({
            col: col,
            key: r._key,
            label: r[s.titleField] || r.id || r._key,
            sub: s.label + (r.id ? ' · ' + r.id : ''),
            icon: s.icon
          });
        }
      });
    });

    if (!results.length) {
      res.innerHTML = '<div class="sr-empty">No results found for "' + esc(q) + '"</div>';
    } else {
      res.innerHTML = results.slice(0, 40).map(r =>
        '<div class="sr-item" onclick="closeSearch();openSearchResult(\'' + r.col + '\',\'' + r.key + '\')">' +
        '<div class="sr-ico"><i class="fa-solid ' + r.icon + '"></i></div>' +
        '<div><div class="sr-t">' + esc(r.label) + '</div><div class="sr-s">' + esc(r.sub) + '</div></div>' +
        '</div>'
      ).join('');
    }
    res.classList.add('show');
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) res.classList.remove('show');
  });
}

function closeSearch() {
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('globalSearch').value = '';
}

function openSearchResult(col, key) {
  if (col === 'customers') openCustomer360(key);
  else openDetail(col, key);
}

/* ============================================================
   19. EXPORT
   ============================================================ */
function exportCSV(col) {
  const s = SCHEMAS[col];
  const rows = list(col);
  if (!rows.length) { toast('No data to export.', 'error'); return; }

  const headers = s.columns.map(c => c.t);
  const lines = [headers.join(',')];

  rows.forEach(r => {
    const cells = s.columns.map(c => {
      let v = r[c.k];
      if (c.type === 'ref') v = refName(c.ref, v);
      if (c.k === 'paidCalc') v = invoicePaid(r._key);
      if (c.k === 'balanceCalc') v = invoiceBalance(r);
      if (v === undefined || v === null) v = '';
      return '"' + String(v).replace(/"/g, '""') + '"';
    });
    lines.push(cells.join(','));
  });

  download(lines.join('\n'), 'NGT-' + col + '-' + todayISO() + '.csv', 'text/csv');
  toast('Exported ' + rows.length + ' records.', 'success');
}

function exportAll() {
  const data = {};
  COLLECTIONS.forEach(c => { data[c] = state.data[c] || {}; });
  data._exportedAt = new Date().toISOString();
  download(JSON.stringify(data, null, 2), 'NGT-CRM-Backup-' + todayISO() + '.json', 'application/json');
  toast('Full backup exported.', 'success');
}

function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============================================================
   20. MODAL SYSTEM
   ============================================================ */
function openModal(title, bodyHTML, footerHTML, size) {
  const root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal ' + (size || '') + '">' +
        '<div class="modal-head">' +
          '<h3><i class="fa-solid fa-circle-nodes"></i> ' + title + '</h3>' +
          '<button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +
        '<div class="modal-body">' + bodyHTML + '</div>' +
        '<div class="modal-foot">' + (footerHTML || '') + '</div>' +
      '</div>' +
    '</div>';

  /* Recompute items when tax rate changes */
  const taxEl = document.querySelector('[name="taxRate"]');
  if (taxEl) taxEl.addEventListener('input', recomputeItems);

  document.addEventListener('keydown', escHandler);
}

function escHandler(e) {
  if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escHandler); }
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escHandler);
}

/* ============================================================
   21. BOOT
   ============================================================ */
(function boot() {
  buildNav();
  initSearch();
  initListeners();
  setView('dashboard');

  /* Fallback: if no data arrives within 6s, still render */
  setTimeout(() => {
    if (!state.ready) {
      state.ready = true;
      render();
      setConn(false);
    }
  }, 6000);

  console.log('%c NGT CRM ', 'background:#38bdf8;color:#04141f;font-weight:800;padding:2px 8px;border-radius:4px',
    'Ngure Gacheru Technologies — Customer-to-Cash Management System v1.0.0');
  console.log('Firebase DB:', firebaseConfig.databaseURL);
})();
</script>

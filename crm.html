function openDetail(collName, id) {
  const def = SCHEMAS[collName];
  const r = coll(collName)[id];
  if (!r) return;

  let body = `<div class="detail-grid">`;
  def.fields.forEach(f => {

    body += detailItem(f.l, f.t === 'customer' ? recName('customers', r[f.k])
      : f.t === 'opportunity' ? recName('opportunities', r[f.k])
      : f.t === 'invoice' ? recName('invoices', r[f.k])
      : f.t === 'quotation' ? recName('quotations', r[f.k])
      : f.t === 'salesorder' ? recName('salesorders', r[f.k])
      : f.t === 'project' ? recName('projects', r[f.k])
      : f.t === 'lead' ? recName('leads', r[f.k])
      : f.t === 'date' ? fmtDate(r[f.k])
      : f.t === 'datetime-local' ? fmtDateTime(r[f.k])
      : r[f.k], f.money, f.badge);
  });

  /* Items table */
  if (Array.isArray(r.items) && r.items.length) {
    body += `<div class="section-sep"></div>
    <div class="panel-title" style="margin-bottom:.6rem"><i class="fa-solid fa-list"></i>Line Items</div>
    <table class="items-table">
      <thead><tr><th>Description</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>${r.items.map(it => `<tr>
        <td>${esc(it.desc || '—')}</td>
        <td style="text-align:right">${num(it.qty)}</td>
        <td style="text-align:right">${money(it.rate)}</td>
        <td style="text-align:right;color:#7dd3fc;font-weight:600">${money(num(it.qty) * num(it.rate))}</td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="totals-box">
      <div class="totals-row"><span>Subtotal</span><span>${money(r.subtotal)}</span></div>
      <div class="totals-row"><span>Discount</span><span>− ${money(r.discount)}</span></div>
      <div class="totals-row"><span>Tax</span><span>${money(r.taxAmount)}</span></div>
      <div class="totals-row grand"><span>Total</span><span>${money(r.total)}</span></div>
    </div>`;
  }

  /* Invoice payment summary */
  if (collName === 'invoices') {
    const paid = invoicePaid(id);
    const bal = num(r.total) - paid;
    body += `<div class="section-sep"></div>
    <div class="kpi-grid" style="margin-bottom:0">
      ${kpi('Invoice Total', moneyShort(r.total), '', 'fa-file-invoice', '')}
      ${kpi('Amount Paid', moneyShort(paid), '', 'fa-money-bill-wave', 'good')}
      ${kpi('Balance Due', moneyShort(bal), invoiceStatus(r), 'fa-hourglass-half', bal > 0.5 ? 'bad' : 'good')}
    </div>`;
    const pays = listOf('payments').filter(p => p.invoiceId === id);
    if (pays.length) {
      body += `<div class="section-sep"></div><div class="panel-title" style="margin-bottom:.5rem"><i class="fa-solid fa-receipt"></i>Payments Received</div>
      <table class="data" style="min-width:auto"><thead><tr><th>Date</th><th>Method</th><th>Reference</th><th class="num">Amount</th></tr></thead>
      <tbody>${pays.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.method || '—')}</td><td>${esc(p.reference || '—')}</td><td class="num">${money(p.amount)}</td></tr>`).join('')}</tbody></table>`;
    }
  }

  /* Related records */
  const related = findRelated(collName, id);
  if (related.length) {
    body += `<div class="section-sep"></div><div class="panel-title" style="margin-bottom:.6rem"><i class="fa-solid fa-link"></i>Related Records</div>`;
    related.forEach(rel => {
      body += `<div style="margin-bottom:.8rem">
        <div class="text-muted" style="margin-bottom:.3rem;text-transform:uppercase;letter-spacing:1px;font-size:.66rem;font-weight:700">${esc(SCHEMAS[rel.coll].title)} (${rel.rows.length})</div>
        <table class="data" style="min-width:auto">
          <tbody>${rel.rows.slice(0, 6).map(row => `<tr onclick="closeModal();openDetail('${rel.coll}','${row.id}')">
            <td>${esc(row.code || row.id)}</td>
            <td>${esc(row.name || row.title || row.subject || row.product || '')}</td>
            <td>${esc(row.status || row.stage || '')}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`;
    });
  }

  /* Actions */
  let actions = '';
  if (collName === 'leads') {
    actions += `<button class="btn btn-good btn-sm" onclick="convertLead('${id}')"><i class="fa-solid fa-arrow-right-arrow-left"></i> Convert to Customer</button>`;
  }
  if (collName === 'opportunities') {
    actions += `<button class="btn btn-good btn-sm" onclick="createQuotationFrom('${id}')"><i class="fa-solid fa-file-invoice-dollar"></i> Create Quotation</button>`;
  }
  if (collName === 'quotations') {
    actions += `<button class="btn btn-good btn-sm" onclick="createSalesOrderFrom('${id}')"><i class="fa-solid fa-file-signature"></i> Create Sales Order</button>`;
  }
  if (collName === 'salesorders') {
    actions += `<button class="btn btn-good btn-sm" onclick="createInvoiceFrom('${id}')"><i class="fa-solid fa-file-invoice"></i> Create Invoice</button>`;
  }
  if (collName === 'invoices') {
    actions += `<button class="btn btn-good btn-sm" onclick="recordPaymentFor('${id}')"><i class="fa-solid fa-money-bill-wave"></i> Record Payment</button>`;
  }
  if (collName === 'customers') {
    actions += `<button class="btn btn-good btn-sm" onclick="closeModal();navigate('#/customer360/${id}')"><i class="fa-solid fa-circle-info"></i> Customer 360°</button>`;
  }
  actions += `<button class="btn btn-ghost btn-sm" onclick="closeModal();openForm('${collName}','${id}')"><i class="fa-solid fa-pen"></i> Edit</button>`;
  actions += `<button class="btn btn-danger btn-sm" onclick="closeModal();confirmDelete('${collName}','${id}')"><i class="fa-solid fa-trash"></i> Delete</button>`;

  openModal(`
    <div class="modal-head">
      <div class="modal-title"><i class="fa-solid ${def.icon}"></i>
        <div>${esc(r.name || r.title || r.subject || def.single)}<small>${esc(r.code || '')} · ${esc(def.title)}</small></div>
      </div>
      <button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${actions}</div>
  `, true);
}

function findRelated(collName, id) {
  const out = [];
  Object.keys(SCHEMAS).forEach(other => {
    if (other === collName) return;
    const rows = listOf(other).filter(r => {
      return Object.keys(r).some(k => k.endsWith('Id') && r[k] === id);
    });
    if (rows.length) out.push({ coll: other, rows });
  });
  return out;
}

async function convertLead(leadId) {
  const lead = byId('leads', leadId);
  if (!lead) return;
  try {
    const custCode = nextCode('NGT-C', 'customers');
    const custId = await dbCreate('customers', {
      code: custCode,
      name: lead.name || lead.company || 'Unnamed',
      type: 'Individual',
      company: lead.company || '',
      phone: lead.phone || '',
      whatsapp: lead.phone || '',
      email: lead.email || '',
      address: lead.location || '',
      industry: 'Other',
      segment: 'Medium Value',
      source: lead.source || '',
      assignedTo: lead.assignedTo || '',
      status: 'Active',
      notes: `Converted from lead ${lead.code || ''} on ${today()}.`,
      createdAt: nowISO(),
      createdBy: APP_USER
    });

    const oppId = await dbCreate('opportunities', {
      code: nextCode('NGT-OP', 'opportunities'),
      title: `${lead.service || 'New'} requirement — ${lead.name || lead.company || ''}`,
      customerId: custId,
      service: lead.service || 'Other',
      stage: 'New',
      value: num(lead.value),
      probability: 30,
      expectedClose: '',
      assignedTo: lead.assignedTo || '',
      source: lead.source || '',
      notes: `Auto-created from lead ${lead.code || ''}.`,
      createdAt: nowISO(),
      createdBy: APP_USER
    });

    await dbUpdate('leads', leadId, { status: 'Converted', convertedAt: nowISO(), convertedCustomerId: custId });

    await audit('CONVERT', 'leads', leadId, lead.code || '',
      `Converted lead ${lead.code || ''} → customer ${custCode}`);

    closeModal();
    await loadAll(true);
    render();
    toast(`Lead converted to customer ${custCode}`, 'ok');
    setTimeout(() => openDetail('customers', custId), 400);
  } catch (err) {
    toast('Conversion failed: ' + err.message, 'err');
  }
}

async function createQuotationFrom(oppId) {

  if (!o) return;
  try {
    const id = await dbCreate('quotations', {
      code: nextCode('NGT-Q', 'quotations'),

      taxRate: 0,
      subtotal: num(o.value),
      taxAmount: 0,
      total: num(o.value),
      status: 'Draft',
      notes: `Auto-generated from opportunity ${o.code || ''}.`,
      createdAt: nowISO(),
      createdBy: APP_USER
    });
    await dbUpdate('opportunities', oppId, { stage: 'Quotation Prepared' });
    await audit('CREATE', 'quotations', id, '', `Quotation created from opportunity ${o.code || ''}`);

    await loadAll(true);

}

async function createInvoiceFrom(soId) {
  const so = byId('salesorders', soId);
  if (!so) return;
  try {
    const due = new Date(); due.setDate(due.getDate() + 14);
    const id = await dbCreate('invoices', {
      code: nextCode('NGT-INV', 'invoices'),
      customerId: so.customerId || '',
      salesOrderId: soId,
      service: so.service || '',
      date: today(),
      dueDate: due.toISOString().slice(0, 10),
      items: so.items || [],
      discount: num(so.discount),
      taxRate: num(so.taxRate),
      subtotal: num(so.subtotal),
      taxAmount: num(so.taxAmount),
      total: num(so.total),
      costAmount: 0,
      status: 'Issued',
      notes: `Generated from sales order ${so.code || ''}.`,
      createdAt: nowISO(),
      createdBy: APP_USER
    });
    await dbUpdate('salesorders', soId, { status: 'Completed' });
    await audit('CREATE', 'invoices', id, '', `Invoice created from sales order ${so.code || ''}`);

    render();
    toast('Invoice issued', 'ok');
    setTimeout(() => openForm('invoices', id), 400);
  } catch (err) {
    toast('Failed: ' + err.message, 'err');

}

function recordPaymentFor(invId) {
  closeModal();
  openForm('payments');
  setTimeout(() => {
    const inv = byId('invoices', invId);
    if (!inv) return;
    const custSel = document.getElementById('f_customerId');
    const invSel = document.getElementById('f_invoiceId');
    const amt = document.getElementById('f_amount');
    const typeSel = document.getElementById('f_type');
    if (custSel) custSel.value = inv.customerId || '';
    if (invSel) invSel.value = invId;
    if (amt) amt.value = invoiceBalance(inv).toFixed(2);
    if (typeSel) typeSel.value = invoicePaid(invId) > 0 ? 'Part Payment' : 'Deposit';
  }, 60);
}

async function audit(action, collName, recId, code, details) {
  try {
    await dbCreate('audit', {
      ts: nowISO(),
      user: APP_USER,
      action,
      collection: collName,
      recordId: recId || '',
      code: code || '',
      details: details || `${action} on ${collName}`
    });
  } catch (e) { console.warn('Audit write failed', e); }
}

   -------------------------------------------------------------------------- */
function buildNotifications() {
  const out = [];
  const t = today();
  const soon = new Date(); soon.setDate(soon.getDate() + 7);
  const soonStr = soon.toISOString().slice(0, 10);

  listOf('leads').filter(l => l.status === 'New').forEach(l =>
    out.push({ icon: 'fa-user-plus', type: 'New Lead', text: `${l.name || l.company || 'Lead'} — ${l.service || 'enquiry'}`, date: l.createdAt, link: `#/leads`, color: 'blue' }));

  listOf('opportunities').filter(o => num(o.value) >= 500000 && OPEN_STAGES.includes(o.stage)).forEach(o =>
    out.push({ icon: 'fa-gem', type: 'High-Value Opportunity', text: `${o.title} — ${moneyShort(o.value)}`, date: o.createdAt, link: '#/opportunities', color: 'purple' }));

  listOf('quotations').filter(q => q.status === 'Sent').forEach(q => {
    const days = daysBetween(q.date || q.createdAt || t, t);
    if (days >= 3) out.push({ icon: 'fa-file-invoice-dollar', type: 'Quotation Follow-Up', text: `${q.code} sent ${days} day(s) ago — ${moneyShort(q.total)}`, date: q.date, link: '#/quotations', color: 'amber' });
  });

  listOf('quotations').filter(q => q.status === 'Sent' && q.validityDays).forEach(q => {
    const exp = new Date(q.date || q.createdAt);
    exp.setDate(exp.getDate() + num(q.validityDays));
    if (exp < new Date() && q.status === 'Sent') out.push({ icon: 'fa-hourglass-end', type: 'Quotation Expired', text: `${q.code} validity has lapsed`, date: exp.toISOString().slice(0, 10), link: '#/quotations', color: 'red' });
  });

  listOf('invoices').filter(i => invoiceStatus(i) === 'Overdue').forEach(i =>
    out.push({ icon: 'fa-file-invoice', type: 'Invoice Overdue', text: `${i.code} — ${moneyShort(invoiceBalance(i))} outstanding`, date: i.dueDate, link: '#/invoices', color: 'red' }));

  listOf('followups').filter(f => f.status === 'Pending' && f.dueDate && f.dueDate <= t).forEach(f =>
    out.push({ icon: 'fa-list-check', type: 'Follow-Up Due', text: `${f.subject || 'Task'} — due ${fmtDate(f.dueDate)}`, date: f.dueDate, link: '#/followups', color: 'amber' }));

  listOf('tickets').filter(tk => !['Resolved', 'Closed', 'Cancelled'].includes(tk.status) && tk.priority === 'High').forEach(tk =>
    out.push({ icon: 'fa-headset', type: 'High Priority Ticket', text: `${tk.code} — ${tk.subject}`, date: tk.openedDate, link: '#/tickets', color: 'red' }));

  listOf('warranties').filter(w => w.endDate && w.endDate <= soonStr && w.endDate >= t && w.status === 'Active').forEach(w =>
    out.push({ icon: 'fa-shield-halved', type: 'Warranty Expiring', text: `${w.product} — expires ${fmtDate(w.endDate)}`, date: w.endDate, link: '#/warranties', color: 'amber' }));

  listOf('hirepurchase').filter(h => h.status === 'Active').forEach(h => {
    const paid = num(h.paidToDate);
    const financed = num(h.financed);
    if (financed > 0 && paid >= financed) out.push({ icon: 'fa-handshake', type: 'HP Fully Paid', text: `${h.code} — ready for release / clearance`, date: today(), link: '#/hirepurchase', color: 'green' });
  });

  listOf('projects').filter(p => p.status === 'Awaiting Deposit').forEach(p =>
    out.push({ icon: 'fa-piggy-bank', type: 'Awaiting Deposit', text: `${p.title} — project not financially activated`, date: p.startDate, link: '#/projects', color: 'amber' }));

  return out.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
}

/* --------------------------------------------------------------------------
   20. REPORTS & ANALYTICS
   -------------------------------------------------------------------------- */
function viewReports() {
  const invs = listOf('invoices').filter(i => i.status !== 'Cancelled');
  const custs = listOf('customers');
  const opps = listOf('opportunities');
  const leads = listOf('leads');
  const pays = listOf('payments');
  const projs = listOf('projects');

  /* Sales by service */
  const byService = {};
  invs.forEach(i => { const k = i.service || 'Unspecified'; byService[k] = (byService[k] || 0) + num(i.total); });
  const serviceRows = Object.entries(byService).sort((a, b) => b[1] - a[1]);

  /* Sales by lead source */
  const bySource = {};
  custs.forEach(c => {
    const k = c.source || 'Unspecified';
    const rev = customerRevenue(c.id);
    if (!bySource[k]) bySource[k] = { leads: 0, customers: 0, sales: 0 };
    bySource[k].customers++;
    bySource[k].sales += rev;
  });
  leads.forEach(l => { const k = l.source || 'Unspecified'; if (!bySource[k]) bySource[k] = { leads: 0, customers: 0, sales: 0 }; bySource[k].leads++; });
  const sourceRows = Object.entries(bySource).sort((a, b) => b[1].sales - a[1].sales);

  /* Top customers */
  const topCustomers = custs.map(c => ({ name: c.name, revenue: customerRevenue(c.id), profit: customerRevenue(c.id) - customerCost(c.id), id: c.id }))
    .filter(x => x.revenue > 0).sort((a, b) => b.revenue - a.revenue).slice(0, 10);

  /* Sales by month */
  const byMonth = {};
  invs.forEach(i => { const k = monthKey(i.date || i.createdAt); if (!k) return; byMonth[k] = (byMonth[k] || 0) + num(i.total); });
  const monthRows = Object.entries(byMonth).sort((a, b) => a[0].localeCompare(b[0])).slice(-12);
  const maxMonth = Math.max(1, ...monthRows.map(r => r[1]));

  /* Pipeline by stage */
  const stageRows = STAGES.filter(s => s !== 'Cancelled').map(s => {
    const items = opps.filter(o => o.stage === s);
    return { stage: s, count: items.length, value: items.reduce((a, o) => a + num(o.value), 0) };
  }).filter(r => r.count > 0);

  /* Agent performance */
  const byAgent = {};
  opps.filter(o => o.stage === 'Won').forEach(o => {
    const k = o.assignedTo || 'Unassigned';
    if (!byAgent[k]) byAgent[k] = { deals: 0, value: 0 };
    byAgent[k].deals++;
    byAgent[k].value += num(o.value);
  });
  const agentRows = Object.entries(byAgent).sort((a, b) => b[1].value - a[1].value);

  /* Receivables */
  const recvRows = custs.map(c => {
    const inv = listOf('invoices').filter(i => i.customerId === c.id && i.status !== 'Cancelled');
    const bal = inv.reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);
    return { name: c.name, id: c.id, balance: bal };
  }).filter(r => r.balance > 0).sort((a, b) => b.balance - a.balance).slice(0, 12);

  /* Profitability by service */
  const profitByService = {};
  invs.forEach(i => {
    const k = i.service || 'Unspecified';
    if (!profitByService[k]) profitByService[k] = { revenue: 0, cost: 0 };
    profitByService[k].revenue += num(i.total);
    profitByService[k].cost += num(i.costAmount);
  });
  const profitRows = Object.entries(profitByService).map(([k, v]) => ({ k, ...v, profit: v.revenue - v.cost }))
    .sort((a, b) => b.profit - a.profit);

  const totalRevenue = invs.reduce((s, i) => s + num(i.total), 0);
  const totalCost = invs.reduce((s, i) => s + num(i.costAmount), 0);
  const maxService = Math.max(1, ...serviceRows.map(r => r[1]));
  const maxSource = Math.max(1, ...sourceRows.map(r => r[1].sales));

  return `
  ${pageHead('Reports & Analytics', 'Sales, pipeline, profitability, marketing ROI and collections',
    `<button class="btn btn-ghost btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>`,
    'fa-chart-column')}

  <div class="kpi-grid animate-on-view">
    ${kpi('Total Revenue', moneyShort(totalRevenue), `${invs.length} invoices`, 'fa-sack-dollar', '')}
    ${kpi('Direct Costs', moneyShort(totalCost), 'Cost of sales', 'fa-money-bill-trend-up', 'warn')}
    ${kpi('Gross Profit', moneyShort(totalRevenue - totalCost), totalRevenue ? ((totalRevenue - totalCost) / totalRevenue * 100).toFixed(1) + '% margin' : '—', 'fa-chart-line', 'good')}
    ${kpi('Collected', moneyShort(pays.reduce((s, p) => s + num(p.amount), 0)), `${pays.length} receipts`, 'fa-money-bill-wave', 'good')}
    ${kpi('Leads', leads.length, `${leads.filter(l => l.status === 'Converted').length} converted`, 'fa-user-plus', 'blue')}
    ${kpi('Active Projects', projs.filter(p => p.status === 'In Progress').length, `${projs.length} total projects`, 'fa-diagram-project', 'purple')}
  </div>

  <div class="grid-2 animate-on-view">
    <div class="panel">
      <div class="panel-head"><div class="panel-title"><i class="fa-solid fa-layer-group"></i>Sales by Service</div></div>
      <div class="panel-body">
        ${serviceRows.length ? serviceRows.map(([k, v]) => `
          <div class="bar-row">
            <div class="bar-label" title="${esc(k)}">${esc(k)}</div>

async function exportAll() {
  try {
    const data = await api('');
    const blob = new Blob([JSON.stringify(data || {}, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ngt-crm-backup-${today()}.json`;
    a.click();
    toast('Database exported', 'ok');
  } catch (e) {
    toast('Export failed: ' + e.message, 'err');
  }
}

function exportCSV(collName) {
  const def = SCHEMAS[collName];
  const rows = listOf(collName);
  if (!rows.length) { toast('Nothing to export', 'warn'); return; }
  const cols = def.fields.map(f => f.k);
  const header = ['id', ...cols];
  const lines = [header.join(',')];
  rows.forEach(r => {
    const line = header.map(h => {
      let v = r[h];
      if (Array.isArray(v)) v = v.map(i => `${i.desc} x${i.qty} @ ${i.rate}`).join(' | ');
      if (v === undefined || v === null) v = '';
      return `"${String(v).replace(/"/g, '""')}"`;
    }).join(',');
    lines.push(line);
  });
  downloadCSV(lines.join('\n'), `ngt-${collName}-${today()}.csv`);
}

function exportStatement(custId) {
  const c = byId('customers', custId);
  const invs = listOf('invoices').filter(i => i.customerId === custId && i.status !== 'Cancelled');
  const pays = listOf('payments').filter(p => p.customerId === custId);
  const rows = [];
  invs.forEach(v => rows.push({ date: v.date || '', desc: `Invoice ${v.code}`, debit: num(v.total), credit: 0 }));
  pays.forEach(p => rows.push({ date: p.date || '', desc: `Payment ${p.code}`, debit: 0, credit: num(p.amount) }));
  rows.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let bal = 0;
  const lines = ['Date,Transaction,Debit,Credit,Balance'];
  rows.forEach(r => {
    bal += r.debit - r.credit;
    lines.push(`"${r.date}","${r.desc}",${r.debit},${r.credit},${bal}`);
  });
  downloadCSV(lines.join('\n'), `statement-${(c && c.name ? c.name : 'customer').replace(/\s+/g, '-')}-${today()}.csv`);
}

function downloadCSV(content, filename) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  toast('CSV exported', 'ok');
}

async function doWipe() {
  try {
    const keys = Object.keys(SCHEMAS).concat(['audit']);
    for (const k of keys) { await api(k, 'DELETE'); }
    closeModal();
    await loadAll(true);
    render();
    toast('All CRM data wiped', 'warn');
  } catch (e) { toast('Wipe failed: ' + e.message, 'err'); }
}

/* --------------------------------------------------------------------------
   23. GLOBAL SEARCH
   -------------------------------------------------------------------------- */
function initGlobalSearch() {
  const input = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { results.classList.remove('show'); results.innerHTML = ''; return; }
    const hits = [];
    Object.keys(SCHEMAS).forEach(collName => {
      listOf(collName).forEach(r => {
        const hay = JSON.stringify(r).toLowerCase();
        if (hay.includes(q)) {
          hits.push({
            coll: collName,
            id: r.id,
            title: r.name || r.title || r.subject || r.product || r.code || 'Record',
            sub: `${SCHEMAS[collName].title} · ${r.code || ''}`
          });
        }
      });
    });
    const top = hits.slice(0, 24);
    results.innerHTML = top.length ? top.map(h => `
      <div class="sr-item" onclick="closeSearch();openDetail('${h.coll}','${h.id}')">
        <span class="sr-type">${esc(SCHEMAS[h.coll].single)}</span>
        <div>
          <div class="sr-main">${esc(h.title)}</div>
          <div class="sr-sub">${esc(h.sub)}</div>
        </div>
      </div>`).join('') : `<div class="sr-item"><div class="sr-sub">No matches found for “${esc(q)}”.</div></div>`;
    results.classList.add('show');
  });

  input.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) closeSearch();
  });
}
function closeSearch() {
  const r = document.getElementById('searchResults');
  if (r) { r.classList.remove('show'); r.innerHTML = ''; }
}

/* --------------------------------------------------------------------------

function init() {

  }, POLL_MS);
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900) document.getElementById('sidebar').classList.remove('open');
  });
}

document.addEventListener('DOMContentLoaded', init);

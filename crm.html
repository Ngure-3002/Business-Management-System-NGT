<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGT CRM — Ngure Gacheru Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   NGT CRM — CORE THEME (dark tech / cyan accent)
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b1117; --bg2:#0e1623; --panel:#131e2c; --panel2:#1a2536; --panel3:#1e2c40;
  --border:#243447; --border2:#2d3a4f;
  --text:#e0e7ff; --muted:#8ba0bc; --dim:#64748b;
  --accent:#38bdf8; --accent2:#7dd3fc; --accent-dim:#0ea5e9;
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --purple:#a78bfa; --pink:#f472b6;
  --sidebar-w:252px;
  --shadow:0 8px 24px rgba(0,0,0,.45);
}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  line-height:1.55;-webkit-font-smoothing:antialiased;font-size:14px;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a121c}
::-webkit-scrollbar-thumb{background:#22344a;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#31485f}

/* ============================ APP SHELL ============================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);background:#09111b;border-right:1px solid var(--border);
  position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:300;
  transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
}
.brand{padding:1.1rem 1.15rem;border-bottom:1px solid var(--border);display:flex;gap:.7rem;align-items:center;flex-shrink:0}
.brand-logo{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#0ea5e9,#2563eb);display:grid;place-items:center;
  font-weight:800;color:#031018;font-size:.95rem;letter-spacing:-.5px;
  box-shadow:0 6px 18px rgba(56,189,248,.35)
}
.brand-txt h1{
  font-size:.92rem;font-weight:800;letter-spacing:-.3px;line-height:1.15;
  background:linear-gradient(135deg,#a5f3fc,#38bdf8);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.brand-txt span{font-size:.62rem;color:var(--dim);letter-spacing:2.4px;text-transform:uppercase;font-weight:600}
.nav{padding:.55rem .6rem 1.2rem;flex:1;overflow-y:auto}
.nav-group{margin-top:.7rem}
.nav-group-label{
  font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:#4a5f78;
  padding:.4rem .65rem;font-weight:700
}
.nav-item{
  display:flex;align-items:center;gap:.7rem;padding:.53rem .68rem;border-radius:9px;
  color:#a9bdd6;cursor:pointer;font-size:.815rem;font-weight:500;
  transition:background .16s,color .16s;user-select:none;position:relative
}
.nav-item i{width:17px;text-align:center;font-size:.83rem;color:#5d7governance}
.nav-item i{color:#5d7a99;transition:color .16s}
.nav-item:hover{background:#122031;color:#e2f2ff}
.nav-item:hover i{color:var(--accent)}
.nav-item.active{background:linear-gradient(90deg,rgba(56,189,248,.16),rgba(56,189,248,.03));color:#bae6fd;font-weight:600}
.nav-item.active i{color:var(--accent)}
.nav-item.active::before{
  content:'';position:absolute;left:-.6rem;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0
}
.nav-badge{
  margin-left:auto;background:#1e3a52;color:#7dd3fc;font-size:.62rem;font-weight:700;
  padding:.1rem .42rem;border-radius:20px;min-width:20px;text-align:center
}
.nav-badge.alert{background:#4a1d1d;color:#fca5a5}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column}

/* ============================ TOPBAR ============================ */
.topbar{
  position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:.9rem;
  padding:.7rem 1.4rem;background:rgba(11,17,23,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);min-height:62px
}
.menu-btn{
  display:none;background:#16233a;border:1px solid var(--border2);color:var(--text);
  width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:.95rem
}
.search-wrap{position:relative;flex:1;max-width:560px}
.search-wrap > i{
  position:absolute;left:.85rem;top:50%;transform:translateY(-50%);
  color:#4f6b88;font-size:.8rem;pointer-events:none
}
.search-wrap input{
  width:100%;background:#101c2b;border:1px solid var(--border);border-radius:11px;
  padding:.55rem .9rem .55rem 2.3rem;color:var(--text);font-size:.83rem;outline:none;
  font-family:inherit;transition:border-color .2s,box-shadow .2s
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.search-wrap input::placeholder{color:#4a5f78}
.search-results{
  position:absolute;top:calc(100% + .5rem);left:0;right:0;background:#101c2b;
  border:1px solid var(--border2);border-radius:13px;box-shadow:var(--shadow);
  max-height:420px;overflow-y:auto;display:none;z-index:400
}
.search-results.show{display:block}
.sr-item{padding:.6rem .85rem;display:flex;gap:.7rem;align-items:center;cursor:pointer;border-bottom:1px solid #16233a}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:#16273a}
.sr-item .sr-ico{
  width:28px;height:28px;border-radius:8px;background:#1b2f45;display:grid;place-items:center;
  color:var(--accent);font-size:.72rem;flex-shrink:0
}
.sr-item .sr-t{font-size:.8rem;font-weight:600;color:#dbeafe}
.sr-item .sr-s{font-size:.68rem;color:var(--dim)}
.sr-empty{padding:1rem;text-align:center;color:var(--dim);font-size:.78rem}

.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.icon-btn{
  background:#131f2f;border:1px solid var(--border);color:#9ab3d8;width:37px;height:37px;
  border-radius:10px;cursor:pointer;font-size:.86rem;position:relative;transition:.18s;
  display:grid;place-items:center
}
.icon-btn:hover{background:#1b2c42;color:var(--accent);border-color:#2f4a66}
.notif-count{
  position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:.56rem;
  font-weight:800;min-width:17px;height:17px;border-radius:9px;display:none;
  align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)
}
.notif-count.show{display:flex}
.user-chip{
  display:flex;align-items:center;gap:.55rem;background:#131f2f;border:1px solid var(--border);
  padding:.3rem .7rem .3rem .32rem;border-radius:30px;cursor:default
}
.user-av{
  width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#6366f1);
  display:grid;place-items:center;font-size:.68rem;font-weight:800;color:#03121e
}
.user-chip .un{font-size:.74rem;font-weight:600;color:#c7d9ef;line-height:1.1}
.user-chip .ur{font-size:.6rem;color:var(--dim)}

/* ============================ VIEW ============================ */
.view{padding:1.4rem;flex:1;max-width:1600px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.15rem}
.page-head h2{font-size:1.35rem;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:.55rem}
.page-head h2 i{color:var(--accent);font-size:1.05rem}
.page-head p{color:var(--muted);font-size:.78rem;margin-top:.15rem}
.page-actions{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}

/* ============================ BUTTONS ============================ */
.btn{
  display:inline-flex;align-items:center;gap:.42rem;padding:.5rem 1rem;border-radius:9px;
  font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid transparent;
  transition:.18s;font-family:inherit;text-decoration:none;white-space:nowrap
}
.btn i{font-size:.75rem}
.btn-primary{background:var(--accent);color:#04141f;box-shadow:0 4px 14px rgba(56,189,248,.28)}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(56,189,248,.4)}
.btn-outline{background:transparent;border-color:#2e4661;color:#a9c8e6}
.btn-outline:hover{background:#16273a;border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:#131f2f;border-color:var(--border);color:#9ab3d8}
.btn-ghost:hover{background:#1b2c42;color:var(--accent)}
.btn-danger{background:#3a1616;border-color:#5b2323;color:#fca5a5}
.btn-danger:hover{background:#4d1d1d;border-color:var(--red);color:#fecaca}
.btn-success{background:#0f2e1e;border-color:#1d5138;color:#86efac}
.btn-success:hover{background:#143a26;border-color:var(--green)}
.btn-sm{padding:.34rem .68rem;font-size:.71rem;border-radius:8px}
.btn-xs{padding:.2rem .5rem;font-size:.66rem;border-radius:6px}

/* ============================ CARDS / KPI ============================ */
.card{
  background:linear-gradient(160deg,#131e2c,#0f1926);border:1px solid var(--border);
  border-radius:15px;padding:1.1rem 1.2rem;position:relative;overflow:hidden
}
.card::before{
  content:'';position:absolute;top:-60px;right:-60px;width:150px;height:150px;
  background:radial-gradient(circle,rgba(37,99,235,.13),transparent 70%);border-radius:50%
}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.85rem;margin-bottom:1.15rem}
.kpi{
  background:linear-gradient(160deg,#131e2c,#0f1926);border:1px solid var(--border);
  border-radius:14px;padding:.9rem 1rem;position:relative;overflow:hidden;transition:.2s
}
.kpi:hover{border-color:#31506e;transform:translateY(-2px)}
.kpi::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85
}
.kpi.g::after{background:var(--green)} .kpi.a::after{background:var(--amber)}
.kpi.r::after{background:var(--red)} .kpi.p::after{background:var(--purple)}
.kpi .k-top{display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem}
.kpi .k-ico{
  width:26px;height:26px;border-radius:8px;background:#1a2c42;display:grid;place-items:center;
  color:var(--accent);font-size:.68rem
}
.kpi.g .k-ico{color:var(--green)} .kpi.a .k-ico{color:var(--amber)}
.kpi.r .k-ico{color:var(--red)} .kpi.p .k-ico{color:var(--purple)}
.kpi .k-lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.kpi .k-val{font-size:1.35rem;font-weight:700;letter-spacing:-.6px;color:#f0f9ff;line-height:1.15}
.kpi .k-sub{font-size:.66rem;color:var(--dim);margin-top:.15rem}

.section{margin-bottom:1.4rem}
.section-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem}
.section-head h3{font-size:.95rem;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:.45rem}
.section-head h3 i{color:var(--accent);font-size:.83rem}
.section-head .spacer{margin-left:auto}

/* ============================ TABLE ============================ */
.table-wrap{
  background:#101a27;border:1px solid var(--border);border-radius:14px;overflow:hidden
}
.table-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.78rem;min-width:640px}
table.tbl thead th{
  background:#0d1723;text-align:left;padding:.62rem .8rem;font-size:.64rem;
  text-transform:uppercase;letter-spacing:.85px;color:#7189a5;font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0
}
table.tbl tbody td{
  padding:.58rem .8rem;border-bottom:1px solid #16222f;color:#c3d5ea;vertical-align:middle
}
table.tbl tbody tr{transition:background .14s;cursor:pointer}
table.tbl tbody tr:hover{background:#152233}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;color:#7dd3fc}
table.tbl td.money{font-weight:600;color:#a7f3d0;white-space:nowrap}
table.tbl td.actions{text-align:right;white-space:nowrap}
.row-actions{display:flex;gap:.28rem;justify-content:flex-end}
.empty-state{padding:3rem 1rem;text-align:center;color:var(--dim)}
.empty-state i{font-size:2.2rem;opacity:.35;display:block;margin-bottom:.7rem}
.empty-state p{font-size:.82rem}

/* ============================ BADGES ============================ */
.badge{
  display:inline-flex;align-items:center;gap:.28rem;padding:.15rem .5rem;border-radius:20px;
  font-size:.66rem;font-weight:700;letter-spacing:.2px;white-space:nowrap;
  background:#1b2c42;color:#93b4d4;border:1px solid #263c55
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9}
.badge.green{background:rgba(34,197,94,.12);color:#6ee7a8;border-color:rgba(34,197,94,.28)}
.badge.amber{background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.28)}
.badge.red{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.badge.blue{background:rgba(56,189,248,.12);color:#7dd3fc;border-color:rgba(56,189,248,.28)}
.badge.purple{background:rgba(167,139,250,.12);color:#c4b5fd;border-color:rgba(167,139,250,.28)}
.badge.pink{background:rgba(244,114,182,.12);color:#f9a8d4;border-color:rgba(244,114,182,.28)}
.badge.gray{background:#1a2634;color:#8ba0bc;border-color:#26384c}

/* ============================ TOOLBAR ============================ */
.toolbar{
  display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;padding:.7rem .85rem;
  background:#0d1723;border-bottom:1px solid var(--border)
}
.toolbar input[type=text],.toolbar select{
  background:#131f2f;border:1px solid var(--border);border-radius:8px;padding:.4rem .7rem;
  color:var(--text);font-size:.75rem;outline:none;font-family:inherit
}
.toolbar input[type=text]{min-width:200px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.count-pill{
  margin-left:auto;font-size:.68rem;color:var(--muted);background:#131f2f;
  padding:.28rem .65rem;border-radius:20px;border:1px solid var(--border);white-space:nowrap
}

/* ============================ MODAL ============================ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(3,8,14,.78);backdrop-filter:blur(5px);
  z-index:900;display:flex;align-items:flex-start;justify-content:center;
  padding:2.2rem 1rem;overflow-y:auto;animation:fadeIn .18s ease
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.modal{
  background:#0f1a27;border:1px solid var(--border2);border-radius:17px;width:100%;
  max-width:760px;box-shadow:0 30px 70px rgba(0,0,0,.7);animation:slideUp .24s cubic-bezier(.2,.8,.3,1);
  overflow:hidden;margin:auto 0
}
.modal.wide{max-width:1080px}
.modal.narrow{max-width:480px}
.modal-head{
  display:flex;align-items:center;gap:.7rem;padding:1rem 1.25rem;
  border-bottom:1px solid var(--border);background:linear-gradient(180deg,#132234,#0f1a27)
}
.modal-head h3{font-size:.98rem;font-weight:700;letter-spacing:-.2px;flex:1;display:flex;align-items:center;gap:.5rem}
.modal-head h3 i{color:var(--accent);font-size:.85rem}
.modal-body{padding:1.15rem 1.25rem;max-height:calc(100vh - 250px);overflow-y:auto}
.modal-foot{
  padding:.8rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:.5rem;
  justify-content:flex-end;background:#0d1723
}

/* ============================ FORM ============================ */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.85rem}
.form-grid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:.28rem}
.fld label{font-size:.68rem;font-weight:700;color:#8ea8c6;text-transform:uppercase;letter-spacing:.6px}
.fld label .req{color:var(--red);margin-left:2px}
.fld input,.fld select,.fld textarea{
  background:#131f2f;border:1px solid var(--border);border-radius:9px;padding:.52rem .72rem;
  color:var(--text);font-size:.8rem;outline:none;font-family:inherit;transition:.16s;width:100%
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.11);background:#152437
}
.fld textarea{resize:vertical;min-height:74px;line-height:1.5}
.fld select option{background:#131f2f;color:var(--text)}
.fld .hint{font-size:.64rem;color:var(--dim)}

/* ============================ LINE ITEMS ============================ */
.items-editor{border:1px solid var(--border);border-radius:11px;overflow:hidden;background:#101a27}
.items-editor table{width:100%;border-collapse:collapse;font-size:.76rem}
.items-editor th{
  background:#0d1723;padding:.48rem .55rem;text-align:left;font-size:.62rem;
  text-transform:uppercase;letter-spacing:.7px;color:#7189a5;font-weight:700
}
.items-editor td{padding:.34rem .4rem;border-top:1px solid #16222f}
.items-editor input{
  width:100%;background:#131f2f;border:1px solid #22344a;border-radius:7px;
  padding:.36rem .5rem;color:var(--text);font-size:.75rem;outline:none;font-family:inherit
}
.items-editor input:focus{border-color:var(--accent)}
.items-editor input.num{text-align:right}
.items-editor .line-total{text-align:right;font-weight:700;color:#a7f3d0;padding-right:.6rem;white-space:nowrap}
.items-foot{
  display:flex;justify-content:flex-end;gap:1.6rem;padding:.7rem 1rem;
  background:#0d1723;border-top:1px solid var(--border)
}
.items-foot .tot{font-size:.76rem;color:var(--muted);display:flex;gap:.55rem;align-items:baseline}
.items-foot .tot b{font-size:1rem;color:#f0f9ff;font-weight:700}
.items-foot .tot.grand b{color:#7dd3fc;font-size:1.15rem}

/* ============================ CUSTOMER 360 ============================ */
.c360-hero{
  background:linear-gradient(135deg,#12263b,#0d1a29);border:1px solid var(--border2);
  border-radius:17px;padding:1.3rem 1.4rem;margin-bottom:1.15rem;position:relative;overflow:hidden
}
.c360-hero::before{
  content:'';position:absolute;top:-90px;right:-90px;width:260px;height:260px;
  background:radial-gradient(circle,rgba(56,189,248,.16),transparent 70%);border-radius:50%
}
.c360-top{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;position:relative}
.c360-avatar{
  width:58px;height:58px;border-radius:15px;background:linear-gradient(135deg,#0ea5e9,#6366f1);
  display:grid;place-items:center;font-size:1.35rem;font-weight:800;color:#04141f;flex-shrink:0
}
.c360-name{font-size:1.3rem;font-weight:800;letter-spacing:-.5px;color:#f0f9ff;line-height:1.2}
.c360-meta{display:flex;gap:.85rem;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:.3rem}
.c360-meta span{display:flex;align-items:center;gap:.32rem}
.c360-meta i{color:var(--accent);font-size:.7rem}
.c360-stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;margin-top:1.1rem;position:relative
}
.c360-stat{background:rgba(19,31,47,.75);border:1px solid var(--border);border-radius:11px;padding:.6rem .75rem}
.c360-stat .l{font-size:.6rem;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700}
.c360-stat .v{font-size:1rem;font-weight:700;color:#e6f4ff;letter-spacing:-.3px}
.c360-stat .v.green{color:#6ee7a8} .c360-stat .v.red{color:#fca5a5} .c360-stat .v.amber{color:#fcd34d}

.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--border);margin-bottom:1rem;overflow-x:auto;padding-bottom:1px}
.tab{
  padding:.5rem .9rem;font-size:.76rem;font-weight:600;color:#7f97b3;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:.16s
}
.tab:hover{color:#b8d4ef}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ============================ TIMELINE ============================ */
.timeline{position:relative;padding-left:1.5rem}
.timeline::before{content:'';position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:#1e2f42}
.tl-item{position:relative;padding-bottom:1rem}
.tl-item::before{
  content:'';position:absolute;left:-1.5rem;top:5px;width:11px;height:11px;border-radius:50%;
  background:#0f1a27;border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.1)
}
.tl-item.green::before{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.1)}
.tl-item.amber::before{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.tl-item.red::before{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.1)}
.tl-date{font-size:.63rem;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.tl-title{font-size:.79rem;font-weight:600;color:#cfe3f7;margin-top:.08rem}
.tl-sub{font-size:.71rem;color:var(--muted)}

/* ============================ DETAIL LIST ============================ */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem 1.2rem}
.dl-item{border-bottom:1px dashed #1d2c3d;padding-bottom:.45rem}
.dl-item .k{font-size:.62rem;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700}
.dl-item .v{font-size:.81rem;color:#d5e5f5;margin-top:.1rem;word-break:break-word}

/* ============================ TOAST ============================ */
.toast-root{position:fixed;bottom:1.2rem;right:1.2rem;z-index:1200;display:flex;flex-direction:column;gap:.5rem}
.toast{
  background:#132234;border:1px solid var(--border2);border-left:3px solid var(--accent);
  border-radius:11px;padding:.65rem .9rem;font-size:.78rem;color:#dbeafe;min-width:250px;
  box-shadow:var(--shadow);animation:slideUp .22s ease;display:flex;gap:.6rem;align-items:center
}
.toast.success{border-left-color:var(--green)} .toast.success i{color:var(--green)}
.toast.error{border-left-color:var(--red)} .toast.error i{color:var(--red)}
.toast.info i{color:var(--accent)}
.toast i{font-size:.9rem}

/* ============================ MISC ============================ */
.divider{height:1px;background:var(--border);margin:1rem 0}
.pill-row{display:flex;gap:.35rem;flex-wrap:wrap}
.progress{height:6px;background:#16222f;border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:6px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:.72rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.text-right{text-align:right}
.mt1{margin-top:.5rem}.mt2{margin-top:1rem}.mt3{margin-top:1.5rem}
.mb1{margin-bottom:.5rem}.mb2{margin-bottom:1rem}
.flex{display:flex;gap:.6rem;align-items:center}
.flex-wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.spinner{
  width:34px;height:34px;border:3px solid #1e2f42;border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:3rem auto
}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-badge{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.62rem;font-weight:700;
  padding:.15rem .5rem;border-radius:20px;background:#0f2e1e;color:#86efac;border:1px solid #1d5138
}
.conn-badge.off{background:#3a1616;color:#fca5a5;border-color:#5b2323}
.dot-live{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ============================ RESPONSIVE ============================ */
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 50px rgba(0,0,0,.7)}
  .main{margin-left:0}
  .menu-btn{display:grid;place-items:center}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .view{padding:.9rem}
  .topbar{padding:.55rem .85rem;gap:.5rem}
  .user-chip .un,.user-chip .ur{display:none}
  .user-chip{padding:.3rem}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:.55rem}
  .kpi .k-val{font-size:1.05rem}
  .page-head h2{font-size:1.1rem}
  .modal-backdrop{padding:.6rem}
  .modal-body{max-height:calc(100vh - 190px)}
}
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:250
}
.sidebar-overlay.show{display:block}

/* ============================================================
   4. UTILITIES
   ============================================================ */
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const money = n => 'KES ' + Number(n || 0).toLocaleString('en-KE', {maximumFractionDigits: 0});
const money2 = n => 'KES ' + Number(n || 0).toLocaleString('en-KE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = n => Number(n || 0);

const todayISO = () => new Date().toISOString().slice(0, 10);

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'});
}
function fmtDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}) +
    ' ' + dt.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
}
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function isOverdue(d) {
  if (!d) return false;
  return new Date(d) < new Date(todayISO());
}

/* Toast notifications */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
  el.innerHTML = '<i class="fa-solid ' + ico + '"></i><span>' + esc(msg) + '</span>';
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 320);
  }, 3200);
}

/* Badge colour mapping by keyword */
function badgeClass(v) {
  const s = String(v || '').toLowerCase();
  if (['won','paid','completed','resolved','closed','accepted','active','delivered','confirmed','qualified','converted','supplier found','received','customer accepted'].includes(s)) return 'green';
  if (['lost','overdue','cancelled','rejected','defaulted','expired','urgent','void','blacklisted','open'].includes(s)) return 'red';
  if (['pending','pending approval','partially paid','negotiation','in progress','awaiting deposit','assigned','repair','diagnosis','testing','expiring soon','on hold','draft','searching','quotation sent','sent','ordered','new'].includes(s)) return 'amber';
  if (['contacted','requirement identified','site assessment','site visit required','costing','quotation prepared','deposit requested','scheduled','dormant','prospect','issued'].includes(s)) return 'blue';
  if (['high','vip','high-value','won'].includes(s)) return 'purple';
  return 'gray';
}
function badge(v) {
  if (!v) return '<span class="badge gray">—</span>';
  return '<span class="badge ' + badgeClass(v) + '">' + esc(v) + '</span>';
}

/* Resolve a reference key to a display name */
function refName(col, key) {
  if (!key) return '—';
  const rec = (state.data[col] || {})[key];
  if (!rec) return key;
  const sch = SCHEMAS[col];
  return rec[sch.titleField] || rec.name || rec.id || key;
}

/* Generate sequential display IDs via RTDB transaction */
async function genId(prefix) {
  try {
    const ref = DB.ref('meta/counters/' + prefix);
    const res = await ref.transaction(cur => (cur || 0) + 1);
    const n = res.snapshot.val() || 1;
    return prefix + '-' + String(n).padStart(4, '0');
  } catch (e) {
    return prefix + '-' + Date.now().toString().slice(-6);
  }
}

/* Audit trail */
function logAudit(action, collection, recordId, details) {
  DB.ref('audit').push({
    action: action,
    collection: collection,
    recordId: recordId || '',
    details: details || '',
    user: 'Administrator',
    timestamp: new Date().toISOString()
  }).catch(() => {});
}

/* ============================================================
   5. FIREBASE REALTIME LISTENERS
   ============================================================ */
let renderTimer = null;
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => render(), 90);
}

function initListeners() {
  let loaded = 0;
  COLLECTIONS.forEach(col => {
    DB.ref(col).on('value', snap => {
      const val = snap.val() || {};
      // attach firebase key onto each record
      Object.keys(val).forEach(k => { if (val[k] && typeof val[k] === 'object') val[k]._key = k; });
      state.data[col] = val;
      loaded++;
      if (!state.ready && loaded >= 1) { state.ready = true; }
      scheduleRender();
    }, err => {
      console.error('DB error on ' + col, err);
      setConn(false);
    });
  });

  DB.ref('.info/connected').on('value', snap => setConn(!!snap.val()));
}

function setConn(ok) {
  const b = document.getElementById('connBadge');
  if (!b) return;
  b.className = 'conn-badge' + (ok ? '' : ' off');
  b.innerHTML = '<span class="dot-live"></span> ' + (ok ? 'LIVE' : 'OFFLINE');
}

/* ============================================================
   6. DATA HELPERS
   ============================================================ */
function list(col) {
  const obj = state.data[col] || {};
  return Object.keys(obj).map(k => obj[k]).filter(Boolean);
}

function findRec(col, key) {
  return (state.data[col] || {})[key] || null;
}

function paymentsForInvoice(invKey) {
  return list('payments').filter(p => p.invoice === invKey);
}
function invoicePaid(invKey) {
  return paymentsForInvoice(invKey).reduce((s, p) => s + num(p.amount), 0);
}
function invoiceBalance(inv) {
  return num(inv.total) - invoicePaid(inv._key);
}
function invoiceStatus(inv) {
  if (inv.status === 'Cancelled' || inv.status === 'Draft') return inv.status;
  const bal = invoiceBalance(inv);
  const paid = invoicePaid(inv._key);
  if (bal <= 0.01) return 'Paid';
  if (paid > 0) return 'Partially Paid';
  if (inv.dueDate && isOverdue(inv.dueDate)) return 'Overdue';
  return inv.status || 'Issued';
}

function customerRevenue(custKey) {
  return list('invoices')
    .filter(i => i.customer === custKey && i.status !== 'Cancelled')
    .reduce((s, i) => s + num(i.total), 0);
}
function customerPaid(custKey) {
  return list('payments').filter(p => p.customer === custKey).reduce((s, p) => s + num(p.amount), 0);
}
function customerOutstanding(custKey) {
  return list('invoices')
    .filter(i => i.customer === custKey && i.status !== 'Cancelled')
    .reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);
}
function customerOverdue(custKey) {
  return list('invoices')
    .filter(i => i.customer === custKey && i.status !== 'Cancelled' && i.dueDate && isOverdue(i.dueDate))
    .reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);
}
function customerProfit(custKey) {
  const rev = customerRevenue(custKey);
  const cost = list('projects').filter(p => p.customer === custKey).reduce((s, p) => s + num(p.expenses), 0);
  return rev - cost;
}

function buildNav() {
  const nav = document.getElementById('nav');
  let html = '';
  NAV_GROUPS.forEach(g => {
    html += '<div class="nav-group"><div class="nav-group-label">' + g.label + '</div>';
    g.items.forEach(it => {
      let id, label, icon;
      if (typeof it === 'string') {
        const s = SCHEMAS[it];
        id = it; label = s.label; icon = s.icon;
      } else { id = it.id; label = it.label; icon = it.icon; }
      html += '<div class="nav-item" data-nav="' + id + '" onclick="setView(\'' + id + '\')">' +
        '<i class="fa-solid ' + icon + '"></i><span>' + label + '</span>' +
        '<span class="nav-badge" id="nb-' + id + '" style="display:none"></span></div>';
    });
    html += '</div>';
  });
  nav.innerHTML = html;
}

function setView(v, params) {
  state.view = v;
  state.params = params || {};
  if (window.innerWidth <= 1024) closeSidebar();
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === v);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

/* ============================================================
   8. MASTER RENDER
   ============================================================ */
function render() {
  if (!state.ready) return;
  updateNavBadges();
  updateNotifCount();

  const view = state.view;
  const root = document.getElementById('view');

  if (view === 'dashboard') { root.innerHTML = viewDashboard(); }
  else if (view === 'reports') { root.innerHTML = viewReports(); }
  else if (view === 'settings') { root.innerHTML = viewSettings(); }
  else if (view === 'customer360') { root.innerHTML = viewCustomer360(state.params.id); }
  else if (SCHEMAS[view]) { root.innerHTML = viewCollection(view); }
  else { root.innerHTML = viewDashboard(); }

  if (view === 'dashboard') animateBars();
}

function updateNavBadges() {
  const counts = {
    leads: list('leads').filter(l => l.status === 'New').length,
    opportunities: list('opportunities').filter(o => !['Won','Lost','Cancelled'].includes(o.stage)).length,
    followups: list('followups').filter(f => f.status === 'Pending' && f.dueDate && isOverdue(f.dueDate)).length,
    invoices: list('invoices').filter(i => i.status !== 'Cancelled' && invoiceBalance(i) > 0.01 && i.dueDate && isOverdue(i.dueDate)).length,
    tickets: list('tickets').filter(t => !['Resolved','Closed'].includes(t.status)).length
  };
  Object.keys(counts).forEach(k => {
    const el = document.getElementById('nb-' + k);
    if (!el) return;
    if (counts[k] > 0) { el.style.display = ''; el.textContent = counts[k]; el.className = 'nav-badge' + (k === 'invoices' || k === 'followups' ? ' alert' : ''); }
    else el.style.display = 'none';
  });
}

/* ============================================================
   9. DASHBOARD
   ============================================================ */
function viewDashboard() {
  const leads = list('leads');
  const opps = list('opportunities');
  const quotes = list('quotations');
  const invs = list('invoices');
  const pays = list('payments');
  const custs = list('customers');
  const projs = list('projects');
  const tickets = list('tickets');
  const warrant = list('warranties');
  const hp = list('hirepurchase');

  const today = todayISO();
  const newLeadsToday = leads.filter(l => (l.createdAt || '').slice(0, 10) === today).length;
  const activeOpps = opps.filter(o => !['Won','Lost','Cancelled'].includes(o.stage));
  const wonOpps = opps.filter(o => o.stage === 'Won');
  const lostOpps = opps.filter(o => o.stage === 'Lost');
  const closedOpps = wonOpps.length + lostOpps.length;
  const convRate = closedOpps ? Math.round((wonOpps.length / closedOpps) * 100) : 0;

  const quoteValue = quotes.filter(q => !['Rejected','Cancelled'].includes(q.status)).reduce((s, q) => s + num(q.total), 0);
  const pendingQuotes = quotes.filter(q => ['Draft','Pending Approval','Sent'].includes(q.status));
  const expectedSales = activeOpps.reduce((s, o) => s + num(o.estimatedValue), 0);
  const closedSales = wonOpps.reduce((s, o) => s + num(o.estimatedValue), 0);

  const totalInvoiced = invs.filter(i => i.status !== 'Cancelled').reduce((s, i) => s + num(i.total), 0);
  const totalCollected = pays.reduce((s, p) => s + num(p.amount), 0);
  const outstanding = invs.filter(i => i.status !== 'Cancelled').reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);
  const overdue = invs.filter(i => i.status !== 'Cancelled' && i.dueDate && isOverdue(i.dueDate) && invoiceBalance(i) > 0.01)
    .reduce((s, i) => s + Math.max(0, invoiceBalance(i)), 0);

  const thisMonth = today.slice(0, 7);
  const salesThisMonth = invs.filter(i => (i.date || '').slice(0, 7) === thisMonth).reduce((s, i) => s + num(i.total), 0);
  const collectedThisMonth = pays.filter(p => (p.date || '').slice(0, 7) === thisMonth).reduce((s, p) => s + num(p.amount), 0);

  const estProfit = wonOpps.reduce((s, o) => s + num(o.expectedProfit), 0);
  const activeProjects = projs.filter(p => !['Completed','Cancelled','Warranty'].includes(p.status));
  const completedProjects = projs.filter(p => p.status === 'Completed').length;
  const openTickets = tickets.filter(t => !['Resolved','Closed'].includes(t.status));

  /* ---- Pipeline breakdown ---- */
  const pipelineRows = PIPE_STAGES.map(st => {
    const items = opps.filter(o => o.stage === st);
    return { stage: st, count: items.length, value: items.reduce((s, o) => s + num(o.estimatedValue), 0) };
  }).filter(r => r.count > 0);
  const maxPipe = Math.max(1, ...pipelineRows.map(r => r.value));

  /* ---- Follow-ups due ---- */
  const dueFollowups = list('followups')
    .filter(f => f.status === 'Pending' && f.dueDate)
    .sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''))
    .slice(0, 6);

  /* ---- Overdue invoices ---- */
  const overdueInvoices = invs
    .filter(i => i.status !== 'Cancelled' && i.dueDate && isOverdue(i.dueDate) && invoiceBalance(i) > 0.01)
    .sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''))
    .slice(0, 6);

  /* ---- Top customers by revenue ---- */
  const topCustomers = custs.map(c => ({
    c, rev: customerRevenue(c._key), out: customerOutstanding(c._key)
  })).sort((a, b) => b.rev - a.rev).slice(0, 6);

  /* ---- Lead source ROI ---- */
  const sourceStats = {};
  leads.forEach(l => {
    const s = l.source || 'Unknown';
    if (!sourceStats[s]) sourceStats[s] = { leads: 0, value: 0 };
    sourceStats[s].leads++;
    sourceStats[s].value += num(l.estimatedValue);
  });

  /* ---- Hire purchase summary ---- */
  const hpActive = hp.filter(h => h.status === 'Active');
  const hpBalance = hpActive.reduce((s, h) => s + Math.max(0, num(h.cashPrice) - num(h.amountPaid)), 0);

  let h = '';

    '<div class="k-top"><div class="k-ico"><i class="fa-solid ' + icon + '"></i></div>' +
    '<div class="k-lbl">' + esc(label) + '</div></div>' +
    '<div class="k-val">' + esc(display) + '</div>' +
    '<div class="k-sub">' + esc(sub || '') + '</div>' +

}

function animateBars() {

      b.style.width = w + '%';

function viewCollection(col) {
  const s = SCHEMAS[col];
  const rows = list(col).sort((a, b) => {
    const da = a.createdAt || a.date || a.id || '';
    const db_ = b.createdAt || b.date || b.id || '';
    return String(db_).localeCompare(String(da));
  });

  let h = '';
  h += '<div class="page-head">' +
    '<div><h2><i class="fa-solid ' + s.icon + '"></i> ' + esc(s.label) + '</h2>' +
    '<p>' + esc(s.subtitle || '') + '</p></div>' +
    '<div class="page-actions">' +
      '<button class="btn btn-ghost btn-sm" onclick="exportCSV(\'' + col + '\')"><i class="fa-solid fa-file-csv"></i> Export</button>' +
      '<button class="btn btn-primary btn-sm" onclick="openForm(\'' + col + '\')"><i class="fa-solid fa-plus"></i> New ' + esc(s.label.replace(/s$/, '')) + '</button>' +
    '</div></div>';

  h += '<div class="table-wrap">';

  /* Toolbar */
  h += '<div class="toolbar">' +
    '<input type="text" id="tblSearch" placeholder="Filter ' + esc(s.label.toLowerCase()) + '…" oninput="filterTable(this.value)" value="' + esc(state.q[col] || '') + '">' +
    '<select id="tblStatus" onchange="filterTable()"><option value="">All Statuses</option>' +
      statusOptionsFor(col).map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') +
    '</select>' +
    '<span class="count-pill" id="rowCount">' + rows.length + ' records</span>' +
  '</div>';

  /* Table */
  h += '<div class="table-scroll"><table class="tbl" id="dataTable"><thead><tr>';
  s.columns.forEach(c => { h += '<th>' + esc(c.t) + '</th>'; });
  h += '<th style="text-align:right">Actions</th></tr></thead><tbody>';

  if (!rows.length) {
    h += '<tr class="no-rows"><td colspan="' + (s.columns.length + 1) + '">' +
      '<div class="empty-state"><i class="fa-solid ' + s.icon + '"></i>' +
      '<p>No ' + esc(s.label.toLowerCase()) + ' recorded yet.</p>' +
      '<button class="btn btn-primary btn-sm mt2" onclick="openForm(\'' + col + '\')"><i class="fa-solid fa-plus"></i> Create First Record</button>' +
      '</div></td></tr>';
  } else {
    rows.forEach(r => {
      const searchStr = s.columns.map(c => {
        let v = r[c.k];
        if (c.type === 'ref') v = refName(c.ref, v);
        return String(v === undefined || v === null ? '' : v).toLowerCase();
      }).join(' ') + ' ' + String(r.id || '').toLowerCase();

      h += '<tr data-search="' + esc(searchStr) + '" data-status="' + esc(r.status || r.stage || '') + '" onclick="rowClick(\'' + col + '\',\'' + r._key + '\')">';
      s.columns.forEach(c => {
        h += '<td class="' + (c.cls || '') + '">' + renderCell(r, c) + '</td>';
      });
      h += '<td class="actions" onclick="event.stopPropagation()">' +
        '<div class="row-actions">' +
          '<button class="btn btn-ghost btn-xs" title="View" onclick="openDetail(\'' + col + '\',\'' + r._key + '\')"><i class="fa-solid fa-eye"></i></button>' +
          '<button class="btn btn-ghost btn-xs" title="Edit" onclick="openForm(\'' + col + '\',\'' + r._key + '\')"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="btn btn-danger btn-xs" title="Delete" onclick="deleteRecord(\'' + col + '\',\'' + r._key + '\')"><i class="fa-solid fa-trash"></i></button>' +
        '</div></td></tr>';
    });
  }
  h += '</tbody></table></div></div>';

  return h;
}

function statusOptionsFor(col) {
  if (col === 'leads') return ['New','Contacted','Qualified','Converted','Lost','Dormant'];
  if (col === 'customers') return ['Prospect','Active','Dormant','Lost','Blacklisted'];
  if (col === 'opportunities') return PIPE_STAGES;
  if (col === 'quotations') return QUOTE_STATUS;
  if (col === 'invoices') return INVOICE_STATUS;
  if (col === 'projects') return PROJECT_STATUS;
  if (col === 'tickets') return TICKET_STATUS;
  if (col === 'requests') return REQUEST_STATUS;
  if (col === 'hirepurchase') return HP_STATUS;
  if (col === 'followups') return ['Pending','In Progress','Completed','Cancelled'];
  if (col === 'salesorders') return ['Pending','Confirmed','In Progress','Delivered','Completed','Cancelled'];
  if (col === 'warranties') return ['Active','Expiring Soon','Expired','Claimed','Void'];
  if (col === 'agents') return ['Active','Inactive','Suspended'];
  if (col === 'assessments') return ['Scheduled','In Progress','Completed','Cancelled'];
  return [];
}

function renderCell(r, c) {
  let v = r[c.k];

  if (c.k === 'paidCalc') { v = invoicePaid(r._key); return '<span class="money">' + money(v) + '</span>'; }
  if (c.k === 'balanceCalc') {
    const bal = invoiceBalance(r);
    return '<span class="money" style="color:' + (bal > 0.01 ? '#fcd34d' : '#6ee7a8') + '">' + money(bal) + '</span>';
  }
  if (c.type === 'money') return '<span class="money">' + money(v) + '</span>';
  if (c.type === 'date') return '<span class="small muted">' + fmtDate(v) + '</span>';
  if (c.type === 'badge') return badge(v);
  if (c.type === 'pct') return '<span class="small">' + (v || 0) + '%</span>';
  if (c.type === 'num') return '<span class="small">' + (v === undefined || v === '' ? '—' : v) + '</span>';
  if (c.type === 'ref') return esc(refName(c.ref, v));
  if (c.k === 'id') return esc(v || '—');

  return esc(v === undefined || v === null || v === '' ? '—' : v);
}

/* Row click → open detail (customers go to 360) */
function rowClick(col, key) {
  if (col === 'customers') { openCustomer360(key); return; }
  openDetail(col, key);
}

/* Client-side table filtering (no re-render, preserves focus) */
function filterTable(q) {
  const col = state.view;
  const search = (q !== undefined ? q : (document.getElementById('tblSearch') || {}).value || '').toLowerCase().trim();
  const status = (document.getElementById('tblStatus') || {}).value || '';
  state.q[col] = search;

  const tbody = document.querySelector('#dataTable tbody');
  if (!tbody) return;
  let visible = 0;
  Array.from(tbody.querySelectorAll('tr')).forEach(tr => {
    if (tr.classList.contains('no-rows')) return;
    const s = tr.getAttribute('data-search') || '';
    const st = tr.getAttribute('data-status') || '';
    const okSearch = !search || s.includes(search);
    const okStatus = !status || st === status;
    if (okSearch && okStatus) { tr.style.display = ''; visible++; }
    else tr.style.display = 'none';
  });
  const pill = document.getElementById('rowCount');
  if (pill) pill.textContent = visible + ' records';
}

/* ============================================================
   11. RECORD DETAIL MODAL
   ============================================================ */
function openDetail(col, key) {
  const s = SCHEMAS[col];
  const r = findRec(col, key);
  if (!r) { toast('Record not found', 'error'); return; }

  let body = '';
  body += '<div class="dl">';
  s.fields.forEach(f => {
    if (f.t === 'items') {
      body += '</div>';
      body += '<div class="mt2"><div class="fld"><label>' + esc(f.l) + '</label>' + renderItemsReadonly(r.items) + '</div></div>';
      if (r.taxRate) {
        body += '<div class="items-foot mt1"><div class="tot">Subtotal <b>' + money(itemsSubtotal(r.items)) + '</b></div>' +
          '<div class="tot">VAT ' + r.taxRate + '% <b>' + money(itemsSubtotal(r.items) * num(r.taxRate) / 100) + '</b></div>' +
          '<div class="tot grand">TOTAL <b>' + money(itemsTotal(r)) + '</b></div></div>';
      } else {
        body += '<div class="items-foot mt1"><div class="tot grand">TOTAL <b>' + money(itemsTotal(r)) + '</b></div></div>';
      }
      body += '<div class="dl mt2">';
      return;
    }
    let v = r[f.k];
    if (f.t === 'ref') v = refName(f.ref, v);
    if (f.t === 'date') v = fmtDate(v);
    if (f.t === 'number' && (f.l || '').includes('KES')) v = money(v);
    if (f.t === 'number' && (f.k === 'probability' || f.k === 'progress' || f.k === 'commissionRate')) v = (v || 0) + '%';
    if (v === undefined || v === null || v === '') v = '—';

    body += '<div class="dl-item"><div class="k">' + esc(f.l) + '</div>' +
      '<div class="v">' + esc(v) + '</div></div>';
  });
  body += '</div>';

  /* Meta */
  body += '<div class="divider"></div><div class="flex flex-wrap" style="gap:1.2rem;font-size:.7rem;color:var(--dim)">' +
    '<span><i class="fa-solid fa-hashtag"></i> Key: <span class="mono">' + esc(key) + '</span></span>' +
    (r.createdAt ? '<span><i class="fa-regular fa-clock"></i> Created: ' + fmtDateTime(r.createdAt) + '</span>' : '') +
    (r.updatedAt ? '<span><i class="fa-solid fa-pen"></i> Updated: ' + fmtDateTime(r.updatedAt) + '</span>' : '') +
    '</div>';

  /* Related records */
  const related = relatedRecords(col, r);
  if (related.length) {
    body += '<div class="divider"></div><div class="section-head"><h3><i class="fa-solid fa-link"></i> Related Records</h3></div>';
    body += '<div class="table-wrap"><table class="tbl" style="min-width:auto"><tbody>';
    related.forEach(rel => {
      body += '<tr onclick="closeModal();openDetail(\'' + rel.col + '\',\'' + rel.key + '\')">' +
        '<td style="width:40%"><span class="badge blue">' + esc(SCHEMAS[rel.col].label) + '</span></td>' +
        '<td>' + esc(rel.label) + '</td>' +
        '<td class="text-right small dim">' + esc(rel.sub || '') + '</td>' +
        '<td class="text-right"><i class="fa-solid fa-chevron-right dim"></i></td></tr>';
    });
    body += '</tbody></table></div>';
  }

  /* Workflow actions */
  const actions = workflowActions(col, r);

  let foot = '<button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>';
  actions.forEach(a => {
    foot += '<button class="btn ' + a.cls + ' btn-sm" onclick="' + a.fn + '">' +
      '<i class="fa-solid ' + a.icon + '"></i> ' + a.label + '</button>';
  });
  foot += '<button class="btn btn-outline btn-sm" onclick="closeModal();openForm(\'' + col + '\',\'' + key + '\')"><i class="fa-solid fa-pen"></i> Edit</button>';

  openModal(s.label + ' — Detail', body, foot, 'wide');
}

function itemsSubtotal(items) {
  if (!Array.isArray(items)) return 0;
  return items.reduce((s, it) => s + (num(it.qty) * num(it.unitPrice) - num(it.discount)), 0);
}
function itemsTotal(r) {
  const sub = itemsSubtotal(r.items);
  return sub + (sub * num(r.taxRate) / 100);
}

function renderItemsReadonly(items) {
  if (!Array.isArray(items) || !items.length) return '<div class="dim small">No line items.</div>';
  let h = '<div class="items-editor"><table><thead><tr>' +
    '<th>Description</th><th style="width:70px;text-align:right">Qty</th>' +
    '<th style="width:110px;text-align:right">Unit Price</th>' +
    '<th style="width:100px;text-align:right">Discount</th>' +
    '<th style="width:110px;text-align:right">Total</th></tr></thead><tbody>';
  items.forEach(it => {
    const line = num(it.qty) * num(it.unitPrice) - num(it.discount);
    h += '<tr><td style="padding:.4rem .55rem">' + esc(it.desc || '—') + '</td>' +
      '<td style="text-align:right;padding-right:.55rem">' + num(it.qty) + '</td>' +
      '<td style="text-align:right;padding-right:.55rem">' + money(it.unitPrice) + '</td>' +
      '<td style="text-align:right;padding-right:.55rem">' + money(it.discount) + '</td>' +
      '<td class="line-total">' + money(line) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function relatedRecords(col, r) {
  const out = [];
  const key = r._key;
  const push = (c, label, sub, k) => out.push({ col: c, key: k, label, sub });

  if (col === 'customers') {
    list('opportunities').filter(x => x.customer === key).forEach(x => push('opportunities', x.title || x.id, money(x.estimatedValue), x._key));
    list('quotations').filter(x => x.customer === key).forEach(x => push('quotations', x.id, money(itemsTotal(x)), x._key));
    list('invoices').filter(x => x.customer === key).forEach(x => push('invoices', x.id, money(x.total), x._key));
    list('projects').filter(x => x.customer === key).forEach(x => push('projects', x.name, x.status, x._key));
    list('tickets').filter(x => x.customer === key).forEach(x => push('tickets', x.issue, x.status, x._key));
    list('warranties').filter(x => x.customer === key).forEach(x => push('warranties', x.product, x.status, x._key));
  }
  if (col === 'opportunities') {
    list('quotations').filter(x => x.opportunity === key).forEach(x => push('quotations', x.id, money(itemsTotal(x)), x._key));
  }
  if (col === 'quotations') {
    list('salesorders').filter(x => x.quotation === key).forEach(x => push('salesorders', x.id, money(itemsTotal(x)), x._key));
  }
  if (col === 'salesorders') {
    list('invoices').filter(x => x.salesOrder === key).forEach(x => push('invoices', x.id, money(x.total), x._key));
    list('projects').filter(x => x.salesOrder === key).forEach(x => push('projects', x.name, x.status, x._key));
  }
  if (col === 'invoices') {
    list('payments').filter(x => x.invoice === key).forEach(x => push('payments', x.id, money(x.amount), x._key));
  }
  return out;
}

function workflowActions(col, r) {

  }

let currentItems = [];

function openForm(col, key) {
  const s = SCHEMAS[col];
  const rec = key ? Object.assign({}, findRec(col, key)) : {};
  const isEdit = !!key;

  /* Defaults */
  if (!isEdit) {
    s.fields.forEach(f => { if (f.def !== undefined) rec[f.k] = f.def; });
    if (s.fields.some(f => f.k === 'date')) rec.date = todayISO();
    if (s.fields.some(f => f.k === 'openedDate')) rec.openedDate = todayISO();
    if (s.fields.some(f => f.k === 'dateRequested')) rec.dateRequested = todayISO();
    if (s.fields.some(f => f.k === 'startDate')) rec.startDate = todayISO();
  }

  currentItems = Array.isArray(rec.items) ? rec.items.map(x => Object.assign({}, x)) : [];

  let body = '<div class="form-grid">';
  s.fields.forEach(f => {
    body += fieldHTML(f, rec);
  });
  body += '</div>';

  let foot = '<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary btn-sm" onclick="saveForm(\'' + col + '\'' + (isEdit ? ',\'' + key + '\'' : '') + ')">' +
    '<i class="fa-solid fa-floppy-disk"></i> ' + (isEdit ? 'Update' : 'Create') + ' Record</button>';

  openModal((isEdit ? 'Edit ' : 'New ') + s.label.replace(/s$/, ''), body, foot, 'wide');

  if (currentItems.length === 0 && s.fields.some(f => f.t === 'items')) {
    addItemRow();
  } else if (s.fields.some(f => f.t === 'items')) {
    renderItemRows();
  }
}

function fieldHTML(f, rec) {
  const v = rec[f.k] !== undefined && rec[f.k] !== null ? rec[f.k] : '';
  const full = f.full ? ' full' : '';
  const req = f.req ? ' <span class="req">*</span>' : '';
  let h = '<div class="fld' + full + '"><label>' + esc(f.l) + req + '</label>';

  if (f.t === 'textarea') {
    h += '<textarea name="' + f.k + '" rows="3">' + esc(v) + '</textarea>';
  } else if (f.t === 'select') {
    h += '<select name="' + f.k + '"><option value="">— Select —</option>';
    (f.o || []).forEach(o => {
      h += '<option value="' + esc(o) + '"' + (String(v) === String(o) ? ' selected' : '') + '>' + esc(o) + '</option>';
    });
    h += '</select>';
  } else if (f.t === 'ref') {
    const opts = list(f.ref).sort((a, b) => String(a[SCHEMAS[f.ref].titleField] || '').localeCompare(String(b[SCHEMAS[f.ref].titleField] || '')));
    h += '<select name="' + f.k + '"><option value="">— Select —</option>';
    opts.forEach(o => {
      const lbl = (o[SCHEMAS[f.ref].titleField] || o.id || o._key);
      const extra = o.id && o.id !== lbl ? ' (' + o.id + ')' : '';
      h += '<option value="' + o._key + '"' + (String(v) === String(o._key) ? ' selected' : '') + '>' + esc(lbl + extra) + '</option>';
    });
    h += '</select>';
    if (!opts.length) h += '<span class="hint">No ' + esc(SCHEMAS[f.ref].label.toLowerCase()) + ' available yet.</span>';
  } else if (f.t === 'items') {
    h += '<div class="items-editor" id="itemsEditor">' +
      '<table><thead><tr>' +
      '<th>Description</th><th style="width:70px">Qty</th><th style="width:110px">Unit Price</th>' +
      '<th style="width:100px">Discount</th><th style="width:105px;text-align:right">Line Total</th><th style="width:34px"></th>' +
      '</tr></thead><tbody id="itemsBody"></tbody></table>' +
      '<div style="padding:.45rem .55rem;border-top:1px solid #16222f">' +
      '<button type="button" class="btn btn-ghost btn-xs" onclick="addItemRow()"><i class="fa-solid fa-plus"></i> Add Line Item</button>' +
      '</div>' +
      '<div class="items-foot">' +
      '<div class="tot">Subtotal <b id="itSub">KES 0</b></div>' +
      '<div class="tot">VAT (<span id="itRate">' + num(rec.taxRate) + '</span>%) <b id="itTax">KES 0</b></div>' +
      '<div class="tot grand">Total <b id="itTot">KES 0</b></div>' +
      '</div></div>';
  } else {
    h += '<input type="' + f.t + '" name="' + f.k + '" value="' + esc(v) + '"' +
      (f.t === 'number' ? ' step="any"' : '') + '>';
  }
  h += '</div>';
  return h;
}

/* ---- Line item editor ---- */
function addItemRow(item) {
  const body = document.getElementById('itemsBody');
  if (!body) return;
  const it = item || { desc: '', qty: 1, unitPrice: 0, discount: 0 };
  currentItems.push(it);
  renderItemRows();
}

function renderItemRows() {
  const body = document.getElementById('itemsBody');
  if (!body) return;
  body.innerHTML = '';
  currentItems.forEach((it, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><input type="text" value="' + esc(it.desc) + '" placeholder="Item / service description" oninput="updItem(' + i + ',\'desc\',this.value)"></td>' +
      '<td><input type="number" class="num" value="' + num(it.qty) + '" step="any" oninput="updItem(' + i + ',\'qty\',this.value)"></td>' +
      '<td><input type="number" class="num" value="' + num(it.unitPrice) + '" step="any" oninput="updItem(' + i + ',\'unitPrice\',this.value)"></td>' +
      '<td><input type="number" class="num" value="' + num(it.discount) + '" step="any" oninput="updItem(' + i + ',\'discount\',this.value)"></td>' +
      '<td class="line-total">' + money(num(it.qty) * num(it.unitPrice) - num(it.discount)) + '</td>' +
      '<td><button type="button" class="btn btn-danger btn-xs" onclick="removeItem(' + i + ')"><i class="fa-solid fa-xmark"></i></button></td>';
    body.appendChild(tr);
  });
  recomputeItems();
}

function updItem(i, prop, val) {
  if (!currentItems[i]) return;
  currentItems[i][prop] = prop === 'desc' ? val : Number(val || 0);
  renderItemRows();
}
function removeItem(i) {
  currentItems.splice(i, 1);
  renderItemRows();
}
function recomputeItems() {
  const sub = itemsSubtotal(currentItems);
  const rateEl = document.querySelector('[name="taxRate"]');
  const rate = rateEl ? num(rateEl.value) : 0;
  const tax = sub * rate / 100;
  const s = document.getElementById('itSub'); if (s) s.textContent = money(sub);
  const t = document.getElementById('itTax'); if (t) t.textContent = money(tax);
  const g = document.getElementById('itTot'); if (g) g.textContent = money(sub + tax);
  const r = document.getElementById('itRate'); if (r) r.textContent = rate;
}

/* ---- Save form ---- */
async function saveForm(col, key) {
  const s = SCHEMAS[col];
  const data = {};
  let valid = true;

  s.fields.forEach(f => {
    if (f.t === 'items') return;
    const el = document.querySelector('[name="' + f.k + '"]');
    if (!el) return;
    let v = el.value;
    if (f.t === 'number') v = v === '' ? 0 : Number(v);
    if (f.req && (v === '' || v === null || v === undefined)) {
      valid = false;
      el.style.borderColor = '#ef4444';
    } else {
      el.style.borderColor = '';
    }
    data[f.k] = v;
  });

  if (!valid) { toast('Please fill in all required fields.', 'error'); return; }

  if (s.fields.some(f => f.t === 'items')) {
    data.items = currentItems.filter(it => (it.desc || '').trim() !== '' || num(it.qty) || num(it.unitPrice));
    const sub = itemsSubtotal(data.items);
    data.subtotal = sub;
    data.tax = sub * num(data.taxRate) / 100;
    data.total = sub + data.tax;
  }

  try {
    if (key) {
      data.updatedAt = new Date().toISOString();
      await DB.ref(col + '/' + key).update(data);
      logAudit('Updated', col, key, 'Record modified');
      toast('Record updated successfully.', 'success');
    } else {
      data.createdAt = new Date().toISOString();
      const newKey = DB.ref(col).push().key;
      if (s.prefix) data.id = await genId(s.prefix);
      await DB.ref(col + '/' + newKey).set(data);
      logAudit('Created', col, data.id || newKey, 'New record created');
      toast((s.label.replace(/s$/, '')) + ' created — ' + (data.id || ''), 'success');
    }
    closeModal();
  } catch (e) {
    console.error(e);
    toast('Save failed: ' + e.message, 'error');
  }
}

/* ---- Delete ---- */
function deleteRecord(col, key) {
  const s = SCHEMAS[col];
  const r = findRec(col, key);
  const lbl = r ? (r[s.titleField] || r.id || key) : key;
  openModal('Confirm Deletion',

    '<p style="font-size:.9rem;color:#dbeafe">Delete <b>' + esc(lbl) + '</b> from <b>' + esc(s.label) + '</b>?</p>' +
    '<p class="small muted mt1">This action cannot be undone. Related records will not be deleted automatically.</p>' +
    '</div>',
    '<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-danger btn-sm" onclick="confirmDelete(\'' + col + '\',\'' + key + '\')"><i class="fa-solid fa-trash"></i> Delete Permanently</button>',
    'narrow');
}

async function confirmDelete(col, key) {
  try {
    const r = findRec(col, key);
    await DB.ref(col + '/' + key).remove();
    logAudit('Deleted', col, r ? r.id : key, 'Record deleted');
    toast('Record deleted.', 'success');
    closeModal();
  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');
  }
}

/* Lead → Customer + Opportunity */
async function convertLead(key) {
  const lead = findRec('leads', key);
  if (!lead) return;
  try {
    const custKey = DB.ref('customers').push().key;
    const custId = await genId('NGT-CU');
    const custData = {
      id: custId,
      type: 'Individual',
      name: lead.name || '',
      company: lead.company || '',
      contactPerson: lead.name || '',
      phone: lead.phone || '',
      whatsapp: lead.phone || '',
      email: lead.email || '',
      county: lead.county || '',
      town: lead.town || '',
      category: 'Individual',
      status: 'Prospect',
      leadSource: lead.source || '',
      notes: 'Converted from lead ' + (lead.id || key) + ' on ' + fmtDate(todayISO()) + '. Original enquiry: ' + (lead.service || ''),
      createdAt: new Date().toISOString(),
      convertedFromLead: lead.id || key
    };
    await DB.ref('customers/' + custKey).set(custData);

    const oppKey = DB.ref('opportunities').push().key;
    const oppId = await genId('NGT-OP');
    await DB.ref('opportunities/' + oppKey).set({
      id: oppId,
      title: (lead.service || 'New Opportunity') + ' — ' + (lead.company || lead.name || ''),
      customer: custKey,
      service: lead.service || '',
      estimatedValue: num(lead.estimatedValue),
      stage: 'New',
      probability: 10,
      assignedTo: lead.assignedTo || '',
      priority: lead.priority || 'Medium',
      requirement: lead.notes || '',
      notes: 'Auto-created from lead ' + (lead.id || key),
      createdAt: new Date().toISOString()
    });

    await DB.ref('leads/' + key).update({
      status: 'Converted',
      convertedAt: new Date().toISOString(),
      convertedToCustomer: custId,
      updatedAt: new Date().toISOString()
    });

    logAudit('Converted', 'leads', lead.id || key, 'Lead → Customer ' + custId + ' + Opportunity ' + oppId);
    toast('Lead converted to customer ' + custId, 'success');
    closeModal();
    setTimeout(() => openCustomer360(custKey), 350);
  } catch (e) {
    console.error(e);
    toast('Conversion failed: ' + e.message, 'error');
  }
}

/* Quotation → Sales Order */
async function quoteToOrder(key) {
  const q = findRec('quotations', key);
  if (!q) return;
  try {
    const oKey = DB.ref('salesorders').push().key;
    const oId = await genId('NGT-SO');
    await DB.ref('salesorders/' + oKey).set({
      id: oId,
      customer: q.customer || '',
      quotation: key,
      date: todayISO(),
      items: q.items || [],
      subtotal: num(q.subtotal),
      taxRate: num(q.taxRate),
      tax: num(q.tax),
      total: num(q.total),
      deliveryTerms: '',
      paymentTerms: q.terms || '',
      assignedTo: q.preparedBy || '',
      status: 'Confirmed',
      createdAt: new Date().toISOString()
    });
    await DB.ref('quotations/' + key).update({ status: 'Accepted', updatedAt: new Date().toISOString() });
    logAudit('Converted', 'quotations', q.id || key, 'Quotation → Sales Order ' + oId);
    toast('Sales Order ' + oId + ' created.', 'success');
    closeModal();
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

/* Sales Order → Invoice */
async function orderToInvoice(key) {
  const o = findRec('salesorders', key);
  if (!o) return;
  try {
    const iKey = DB.ref('invoices').push().key;
    const iId = await genId('NGT-INV');
    const due = new Date(); due.setDate(due.getDate() + 30);
    await DB.ref('invoices/' + iKey).set({
      id: iId,
      customer: o.customer || '',
      salesOrder: key,
      date: todayISO(),
      dueDate: due.toISOString().slice(0, 10),
      items: o.items || [],
      subtotal: num(o.subtotal),
      taxRate: num(o.taxRate),
      tax: num(o.tax),
      total: num(o.total),
      status: 'Issued',
      notes: 'Generated from Sales Order ' + (o.id || key),
      createdAt: new Date().toISOString()
    });
    logAudit('Converted', 'salesorders', o.id || key, 'Sales Order → Invoice ' + iId);
    toast('Invoice ' + iId + ' created.', 'success');
    closeModal();
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

/* Quick payment from invoice */
function quickPayment(invoiceKey) {
  const inv = findRec('invoices', invoiceKey);
  if (!inv) return;
  const bal = invoiceBalance(inv);
  closeModal();
  setTimeout(() => {
    openForm('payments');
    setTimeout(() => {
      const c = document.querySelector('[name="customer"]');
      const i = document.querySelector('[name="invoice"]');
      const a = document.querySelector('[name="amount"]');
      if (c) c.value = inv.customer || '';
      if (i) i.value = invoiceKey;
      if (a) a.value = bal > 0 ? bal : 0;
    }, 60);
  }, 120);
}

function c360stat(l, v, cls) {

function switchC360(tab) {
  state.c360tab = tab;

  document.querySelectorAll('.tab').forEach((el, i) => el.classList.remove('active'));

}

function c360Tab(key, tab) {
  const c = findRec('customers', key);
  if (tab === 'overview') return c360Overview(key, c);
  if (tab === 'timeline') return c360Timeline(key);
  if (tab === 'opportunities') return miniTable('opportunities', list('opportunities').filter(x => x.customer === key));
  if (tab === 'quotations') return miniTable('quotations', list('quotations').filter(x => x.customer === key));
  if (tab === 'invoices') return miniTable('invoices', list('invoices').filter(x => x.customer === key));
  if (tab === 'payments') return miniTable('payments', list('payments').filter(x => x.customer === key));
  if (tab === 'projects') return miniTable('projects', list('projects').filter(x => x.customer === key));
  if (tab === 'requests') return miniTable('requests', list('requests').filter(x => x.customer === key));
  if (tab === 'support') return miniTable('tickets', list('tickets').filter(x => x.customer === key)) +
    '<div class="mt2">' + miniTable('warranties', list('warranties').filter(x => x.customer === key)) + '</div>';
  if (tab === 'statement') return c360Statement(key);
  return '';
}

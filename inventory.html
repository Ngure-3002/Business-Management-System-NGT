function projectMaterialForm(projectId, type){
  const proj = S.projects[projectId];
  if(!proj) return;
  const isIssue = type === 'PROJECT_ISSUE';
  formModal({
    title: (isIssue?'Issue Material to ':'Return Material from ') + proj.name,
    icon: isIssue?'fa-arrow-up-from-bracket':'fa-arrow-down-to-bracket',
    fields:[
      {key:'productId', label:'Product', type:'select', required:true, options:()=>productOptions()},
      {key:'qty', label:'Quantity', type:'number', required:true, min:0, step:'1'},
      {key:'location', label: isIssue?'Source Location (store)':'Return Into Location', type:'select', options:()=>locationOptions()},
      {key:'date', label:'Date', type:'date', def:today()},
      {key:'note', label:'Notes', type:'textarea', full:true, rows:2}
    ],
    values:{date:today()},
    submitLabel: isIssue?'Issue Material':'Return Material',
    onSubmit: data => {
      const p = S.products[data.productId];
      const qty = num(data.qty);
      if(isIssue){
        const st = stockOf(data.productId);
        if(st.available < qty){ toast(`Only ${fmtInt(st.available)} available.`,'warn','Insufficient Stock'); return; }
      }
      recordMovement({
        type, productId:data.productId, productName:p.name, qty,
        location:data.location, unitCost:num(p.costPrice),
        reference:proj.code || proj.id, date:data.date,
        note:(data.note||'') + ' [Project: ' + proj.name + ']'
      });
      const delta = isIssue ? qty : -qty;
      DB.ref('projects/'+projectId).transaction(cur=>{
        if(!cur) return cur;
        cur.materialCost = num(cur.materialCost) + delta * num(p.costPrice);
        cur.issuedItems = num(cur.issuedItems) + delta;
        return cur;
      });
      logAudit(isIssue?'PROJECT MATERIAL ISSUE':'PROJECT MATERIAL RETURN', proj.code, null, data);
      closeModal();
      toast(isIssue ? 'Material issued to project.' : 'Material returned from project.', 'ok');
    }
  });
}

function bomForm(id){
  const ex = id ? S.bom[id] : null;

  const compHTML = `<div class="items-editor" id="bomComps">
    <div class="items-head" style="grid-template-columns:3fr .8fr 34px"><span>Component</span><span>Qty</span><span></span></div>
    <div id="bomBody">${comps.map(c=>bomLineHTML(c)).join('')}</div>

    <div>Material Cost: <strong id="bomCost">KES 0.00</strong></div></div>
  </div>`;

  formModal({
    title: ex?'Edit Package':'New Service Package', icon:'fa-layer-group', wide:true,
    fields:[
      {key:'name', label:'Package Name', required:true, full:true, placeholder:'e.g. 8-Camera CCTV Installation Package'},
      {key:'code', label:'Package Code'},
      {key:'businessUnit', label:'Business Unit', type:'select', options:BUSINESS_UNITS},

    ],
    values: ex||{},
    extraBody:`<div class="form-section"><i class="fa-solid fa-caret-right"></i>Bill of Materials</div>` + compHTML,
    onSubmit: data => {
      const components = [];
      document.querySelectorAll('#bomBody .items-row').forEach(row=>{
        const pid = row.querySelector('.bom-prod').value;
        const qty = num(row.querySelector('.bom-qty').value);
        if(pid && qty > 0){
          const p = S.products[pid];
          components.push({productId:pid, productName:p?p.name:'', qty, unitCost:num(p&&p.costPrice)});
        }
      });
      if(!components.length){ toast('Add at least one component.','warn'); return; }

      });
      setNode('bom', bid, rec).then(()=>{ closeModal(); toast('Package saved.','ok'); });
    },
    onAfter(){
      const body = document.getElementById('bomBody');
      const recalc = () => {
        let total = 0;
        body.querySelectorAll('.items-row').forEach(r=>{
          const pid = r.querySelector('.bom-prod').value;
          const p = S.products[pid];
          total += num(r.querySelector('.bom-qty').value) * num(p && p.costPrice);

        document.getElementById('bomCost').textContent = fmtMoney(total);

      body.querySelectorAll('.items-row').forEach(r=>{
        r.querySelector('.bom-qty').oninput = recalc;

        body.insertAdjacentHTML('beforeend', bomLineHTML({}));
        const r = body.lastElementChild;
        r.querySelector('.bom-qty').oninput = recalc;
        r.querySelector('.bom-prod').onchange = recalc;
        r.querySelector('.bom-del').onclick = () => { r.remove(); recalc(); };
        recalc();
      };
      recalc();
    }
  });
}

      {key:'termMonths', label:'Term (months)', type:'number', def:12},

      {key:'startDate', label:'Start Date', type:'date', def:today()},
      {key:'status', label:'Status', type:'select', options:['Draft','Active','Completed','Defaulted','Cancelled'], def:'Active'},

      });

          recordMovement({type:'HP_RESERVE', productId:data.productId, productName:data.productName||(S.products[data.productId]||{}).name,
            qty:1, reference:rec.contractNo, note:'Reserved under hire purchase contract'});

function hpPayment(id){
  const h = S.hirePurchase[id];
  if(!h) return;
  formModal({
    title:'Record HP Payment — ' + (h.contractNo||id), icon:'fa-money-bill', narrow:false,
    fields:[
      {key:'amount', label:'Payment Amount (KES)', type:'number', step:'0.01', required:true},
      {key:'date', label:'Payment Date', type:'date', def:today()},
      {key:'method', label:'Payment Method', type:'select', options:['Cash','M-Pesa','Bank Transfer','Cheque','Card'], def:'M-Pesa'},
      {key:'reference', label:'Payment Reference'}
    ],
    values:{date:today(), method:'M-Pesa'},
    submitLabel:'Record Payment',
    onSubmit: data => {
      const newPaid = num(h.amountPaid) + num(data.amount);
      const balance = Math.max(0, num(h.productPrice) - num(h.deposit) - newPaid);
      const upd = {amountPaid:newPaid, balance, lastPaymentDate:data.date, lastPaymentMethod:data.method};
      if(balance <= 0){
        upd.status = 'Completed';
        upd.releaseStatus = 'Released to Customer';
      }
      DB.ref('hirePurchase/'+id).update(upd);
      pushNode('hpPayments', {contractId:id, contractNo:h.contractNo, ...data, balanceAfter:balance});
      logAudit('HP PAYMENT', h.contractNo, num(h.amountPaid), newPaid);
      closeModal();
      toast(balance<=0 ? 'Final payment received. Contract completed.' : 'Payment recorded.', 'ok');
    }
  });
}

const REPORTS = {
  'stock-valuation': {
    title:'Stock Valuation Report',
    build(){
      const st = computeStock();
      let total = 0, sell = 0;
      const rows = arr('products').sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>{
        const s = st[p.id] || {qty:0};
        const cost = s.qty * num(p.costPrice);
        const sv = s.qty * (num(p.retailPrice)||num(p.corporatePrice)||num(p.wholesalePrice));
        total += cost; sell += sv;
        return [p.name, p.sku||'—', fmtInt(s.qty), fmtMoney(p.costPrice), fmtMoney(cost), fmtMoney(sv)];
      });
      return {
        headers:['Product','SKU','Qty',{label:'Unit Cost',cls:'num'},{label:'Stock Value',cls:'num'},{label:'Selling Value',cls:'num'}],
        rows, total, sell,
        footer:`Total Stock Value: <strong>${fmtMoney(total)}</strong> &nbsp;·&nbsp; Estimated Selling Value: <strong>${fmtMoney(sell)}</strong> &nbsp;·&nbsp; Potential GP: <strong>${fmtMoney(sell-total)}</strong>`
      };
    }
  },
  'low-stock': {
    title:'Low Stock / Reorder Report',
    build(){
      const st = computeStock();
      const rows = arr('products').filter(p=>{
        const s = st[p.id] || {available:0};
        return num(p.reorderPoint) > 0 && s.available <= num(p.reorderPoint);
      }).map(p=>{
        const s = st[p.id] || {available:0};
        return [p.name, p.sku||'—', fmtInt(s.available), fmtInt(p.reorderPoint), fmtInt(p.reorderQty),
          supplierName(p.preferredSupplier), fmtMoney(num(p.reorderQty)*num(p.costPrice))];
      });
      return {headers:['Product','SKU',{label:'Available',cls:'num'},{label:'Reorder Pt',cls:'num'},{label:'Reorder Qty',cls:'num'},'Preferred Supplier',{label:'Est. Cost',cls:'num'}], rows};
    }
  },
  'stock-movement': {
    title:'Stock Movement Summary',
    build(){
      const rows = arr('movements').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,300).map(m=>[
        fmtDate(m.date||m.createdAt),
        (getProduct(m.productId)||{}).name || m.productName || '—',
        MOVES[m.type] ? MOVES[m.type].label : m.type,
        fmtInt(m.qty), m.reference||'—', locationName(m.location), m.user||'—'
      ]);
      return {headers:['Date','Product','Movement',{label:'Qty',cls:'num'},'Reference','Location','User'], rows};
    }
  },
  'sales-by-product': {
    title:'Sales by Product',
    build(){
      const map = {};
      arr('movements').filter(m=>m.type==='SALE').forEach(m=>{
        const k = m.productId;
        map[k] = map[k] || {qty:0, revenue:0, cost:0, name:m.productName||(getProduct(k)||{}).name};
        const p = getProduct(k);
        map[k].qty += num(m.qty);
        map[k].revenue += num(m.qty)*num(m.unitPrice);
        map[k].cost += num(m.qty)*(num(m.unitCost)||num(p&&p.costPrice));
      });
      let tR=0,tC=0;
      const rows = Object.values(map).sort((a,b)=>b.revenue-a.revenue).map(d=>{
        tR += d.revenue; tC += d.cost;
        const gp = d.revenue - d.cost;
        return [d.name, fmtInt(d.qty), fmtMoney(d.revenue), fmtMoney(d.cost), fmtMoney(gp), d.revenue>0?(gp/d.revenue*100).toFixed(1)+'%':'0%'];
      });
      return {headers:['Product',{label:'Qty Sold',cls:'num'},{label:'Revenue',cls:'num'},{label:'COGS',cls:'num'},{label:'Gross Profit',cls:'num'},{label:'Margin',cls:'num'}], rows,
        footer:`Total Revenue: <strong>${fmtMoney(tR)}</strong> · COGS: <strong>${fmtMoney(tC)}</strong> · Gross Profit: <strong>${fmtMoney(tR-tC)}</strong>`};
    }
  },
  'purchases-by-supplier': {
    title:'Purchases by Supplier',
    build(){
      const map = {};
      arr('purchaseOrders').forEach(po=>{
        const k = po.supplierId || 'unassigned';
        map[k] = map[k] || {count:0, total:0, outstanding:0, name:supplierName(po.supplierId)};
        map[k].count++;
        map[k].total += num(po.total);
        if(po.paymentStatus !== 'Paid' && po.status !== 'Cancelled') map[k].outstanding += num(po.total);
      });
      const rows = Object.values(map).sort((a,b)=>b.total-a.total).map(d=>[
        d.name, fmtInt(d.count), fmtMoney(d.total), fmtMoney(d.outstanding)
      ]);
      const tot = Object.values(map).reduce((a,d)=>a+d.total,0);
      return {headers:['Supplier',{label:'Orders',cls:'num'},{label:'Total Purchased',cls:'num'},{label:'Outstanding',cls:'num'}], rows,
        footer:`Total purchases: <strong>${fmtMoney(tot)}</strong>`};
    }
  },

    title:'Project Material Cost',
    build(){
      const rows = arr('projects').sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>{
        const value = num(p.contractValue);
        const mat = num(p.materialCost);
        const gp = value - mat;
        return [p.code||p.id, p.name, p.customerName||customerName(p.customerId), fmtInt(p.issuedItems||0),
          fmtMoney(mat), fmtMoney(value), fmtMoney(gp), value>0?(gp/value*100).toFixed(1)+'%':'0%'];
      });
      return {headers:['Code','Project','Customer',{label:'Items',cls:'num'},{label:'Material Cost',cls:'num'},{label:'Contract Value',cls:'num'},{label:'Gross Profit',cls:'num'},{label:'Margin',cls:'num'}], rows};
    }
  },
  'stock-losses': {
    title:'Stock Losses & Adjustments',
    build(){
      let total = 0;
      const rows = arr('movements').filter(m=>['DAMAGE','LOSS','DISPOSAL','ADJUSTMENT'].includes(m.type))
        .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(m=>{
          const p = getProduct(m.productId);
          const val = num(m.qty)*(num(m.unitCost)||num(p&&p.costPrice));
          total += val;
          return [fmtDate(m.date||m.createdAt), (p&&p.name)||m.productName, MOVES[m.type].label,
            fmtInt(m.qty), fmtMoney(val), m.reference||'—', m.note||'—', m.user||'—'];
        });
      return {headers:['Date','Product','Type',{label:'Qty',cls:'num'},{label:'Value',cls:'num'},'Reference','Reason','User'], rows,
        footer:`Total stock loss / adjustment value: <strong>${fmtMoney(total)}</strong>`};
    }
  },
  'slow-moving': {
    title:'Slow-Moving & Dead Stock',
    build(){
      const st = computeStock();
      const lastSale = {};
      arr('movements').filter(m=>['SALE','PROJECT_ISSUE'].includes(m.type)).forEach(m=>{
        const d = m.date || m.createdAt;
        if(!lastSale[m.productId] || d > lastSale[m.productId]) lastSale[m.productId] = d;
      });
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-90);
      const rows = arr('products').filter(p=>{
        const s = st[p.id] || {qty:0};
        if(s.qty <= 0) return false;
        const last = lastSale[p.id];
        return !last || new Date(last) < cutoff;
      }).map(p=>{
        const s = st[p.id];
        const last = lastSale[p.id];
        const days = last ? Math.floor((Date.now()-new Date(last))/86400000) : 'Never sold';
        return [p.name, p.sku||'—', fmtInt(s.qty), fmtMoney(s.qty*num(p.costPrice)), last?fmtDate(last):'—', days];
      });
      return {headers:['Product','SKU',{label:'Qty',cls:'num'},{label:'Value Tied Up',cls:'num'},'Last Movement','Days Idle'], rows,
        empty:'No slow-moving stock identified. Excellent turnover!'};
    }
  },

    build(){

          fmtMoney(b.supplierCost), fmtMoney(b.ngtPrice), fmtMoney(m), b.status||'—'];
      });
      return {headers:['Deal No.','Product','Supplier','Customer',{label:'Supplier Cost',cls:'num'},{label:'NGT Price',cls:'num'},{label:'Margin',cls:'num'},'Status'], rows,
        footer:`Total brokerage revenue: <strong>${fmtMoney(totalRev)}</strong> · NGT margin: <strong>${fmtMoney(totalMargin)}</strong>`};
    }
  },
  'inventory-turnover': {
    title:'Inventory Turnover Analysis',
    build(){
      const st = computeStock();
      const cogs = {};
      arr('movements').filter(m=>['SALE','PROJECT_ISSUE'].includes(m.type)).forEach(m=>{
        const p = getProduct(m.productId);
        cogs[m.productId] = (cogs[m.productId]||0) + num(m.qty)*(num(m.unitCost)||num(p&&p.costPrice));
      });
      const rows = arr('products').map(p=>{
        const s = st[p.id] || {qty:0};
        const stockVal = s.qty * num(p.costPrice);
        const c = cogs[p.id] || 0;
        const turn = stockVal > 0 ? c/stockVal : 0;
        return [p.name, p.sku||'—', fmtMoney(stockVal), fmtMoney(c), turn.toFixed(2)+'×',
          turn >= 2 ? '<span class="badge b-ok">Fast</span>' : turn >= 0.5 ? '<span class="badge b-warn">Moderate</span>' : '<span class="badge b-danger">Slow</span>'];
      }).sort((a,b)=>parseFloat(b[4])-parseFloat(a[4]));
      return {headers:['Product','SKU',{label:'Stock Value',cls:'num'},{label:'COGS',cls:'num'},{label:'Turnover',cls:'num'},'Rating'], rows};
    }
  }
};

    ['Conduits','Electrical','Electrical'],['Lighting','Electrical','Electrical'],['Electrical Accessories','Electrical','Electrical'],

    ['Solar',null,'Solar'],['Solar Panels','Solar','Solar'],['Batteries','Solar','Solar'],['Inverters','Solar','Solar'],
    ['Charge Controllers','Solar','Solar'],['Solar Cables','Solar','Solar'],['Solar Accessories','Solar','Solar'],
    ['Solar Water Heating Components','Solar','Solar'],

    ['Security',null,'Electric Fencing'],['Electric Fence Components','Security','Electric Fencing'],
    ['Biometrics','Security','Biometrics'],['Access Control','Security','Biometrics'],['Locks','Security','Biometrics'],
    ['Sensors','Security','Biometrics'],['RFID','Security','Biometrics'],['Exit Buttons','Security','Biometrics'],

    ['IT',null,'IT'],['Networking','IT','IT'],['Servers','IT','IT'],['Computer Hardware','IT','IT'],
    ['Software Licences','IT','IT'],['Consumables','IT','IT'],

    ['Graphic Design',null,'Graphic Design'],['Printing Materials','Graphic Design','Graphic Design'],
    ['Papers','Graphic Design','Graphic Design'],['Ink','Graphic Design','Graphic Design'],
    ['Toners','Graphic Design','Graphic Design'],['Branding Materials','Graphic Design','Graphic Design']
  ];

  const LOCATIONS = [
    ['NGT Main Store','Main Store'],['NGT Office','Office'],['NGT Technician 001','Technician'],
    ['NGT Vehicle 001','Vehicle'],['In Transit','In Transit'],['Repair Centre','Repair Centre'],
    ['Supplier','Supplier'],['Customer','Customer']
  ];

  const BRANDS = ['Hikvision','Dahua','TP-Link','Ubiquiti','Cisco','HP','Dell','Lenovo','Samsung','Apple',
    'Huawei','Xiaomi','Canon','Epson','Eaton','Schneider','Chint','Victron','Growatt','Jinko'];

  let ops = [];

  /* categories - two pass to resolve parents */
  const created = {};
  CATEGORIES.forEach(([name,parent,bu])=>{
    const id = DB.ref('categories').push().key;
    created[name] = id;
    ops.push(DB.ref('categories/'+id).set({
      id, name, parentId: parent ? null : null, businessUnit: bu,
      code: name.toUpperCase().replace(/[^A-Z0-9]/g,'-').slice(0,16),
      createdAt: nowISO()

  CATEGORIES.forEach(([name,parent])=>{
    if(parent && created[parent] && created[name]){

  LOCATIONS.forEach(([name,type])=>{

  BRANDS.forEach(name=>{

  Promise.all(ops).then(()=>{
    logAudit('SEED REFERENCE DATA','system',null,{categories:CATEGORIES.length, locations:LOCATIONS.length, brands:BRANDS.length});
    toast('Starter reference data loaded successfully.','ok','Complete');
  }).catch(err=>{
    console.error(err);
    toast('Some reference data could not be written. Check database rules.','danger','Error');
  });
}

/* ---------------------------------------------------------------------------
   16. EXPORT HELPERS
   --------------------------------------------------------------------------- */
function exportCSV(filename, headers, rows){
  const clean = s => '"' + String(s ?? '').replace(/<[^>]*>/g,'').replace(/"/g,'""') + '"';
  const csv = [headers.map(clean).join(',')]
    .concat(rows.map(r => r.map(clean).join(',')))
    .join('\n');
  downloadBlob(filename + '.csv', csv, 'text/csv;charset=utf-8;');
  toast('CSV exported: ' + filename + '.csv', 'ok');
}
function downloadJSON(filename, obj){
  downloadBlob(filename, JSON.stringify(obj, null, 2), 'application/json');
  toast('Backup exported: ' + filename, 'ok');
}
function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}

function initGlobalSearch(){
  const input = document.getElementById('globalSearch');
  const box = document.getElementById('gsResults');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if(q.length < 2){ box.classList.remove('show'); box.innerHTML = ''; return; }

    const results = [];
    arr('products').forEach(p=>{
      if(JSON.stringify(p).toLowerCase().includes(q)){
        results.push({icon:'fa-box', label:p.name, sub:p.sku||'', view:'products', id:p.id});
      }
    });
    arr('serials').forEach(s=>{
      if(JSON.stringify(s).toLowerCase().includes(q)){
        results.push({icon:'fa-barcode', label:s.serial||s.imei||'Serial', sub:'Serial Record', view:'serials'});
      }
    });
    arr('suppliers').forEach(s=>{
      if(JSON.stringify(s).toLowerCase().includes(q)){
        results.push({icon:'fa-industry', label:s.name, sub:'Supplier', view:'suppliers'});
      }
    });
    arr('customers').forEach(c=>{
      if(JSON.stringify(c).toLowerCase().includes(q)){
        results.push({icon:'fa-user', label:c.name, sub:'Customer', view:'customers'});
      }
    });
    arr('purchaseOrders').forEach(po=>{
      if(JSON.stringify(po).toLowerCase().includes(q)){
        results.push({icon:'fa-file-invoice-dollar', label:po.poNo||po.id, sub:'Purchase Order', view:'purchaseorders'});
      }
    });
    arr('salesOrders').forEach(so=>{
      if(JSON.stringify(so).toLowerCase().includes(q)){
        results.push({icon:'fa-cart-shopping', label:so.soNo||so.id, sub:'Sales Order', view:'salesorders'});
      }
    });

    if(!results.length){
      box.innerHTML = `<div class="gs-item" style="color:#5f7796">No matches found</div>`;
    } else {
      box.innerHTML = results.slice(0,14).map(r=>
        `<div class="gs-item" data-view="${r.view}"><i class="fa-solid ${r.icon}" style="color:#38bdf8;width:16px"></i>
         <span>${esc(r.label)}</span><small>${esc(r.sub)}</small></div>`
      ).join('');
      box.querySelectorAll('[data-view]').forEach(el=>{
        el.onclick = () => {
          S.ui.view = el.dataset.view;
          input.value = ''; box.classList.remove('show');
          render();
        };
      });
    }
    box.classList.add('show');
  });

  document.addEventListener('click', e => {
    if(!e.target.closest('.global-search')) box.classList.remove('show');
  });
  input.addEventListener('keydown', e => { if(e.key === 'Escape'){ input.value=''; box.classList.remove('show'); } });
}

function boot(){
  initShell();
  initGlobalSearch();
  initListeners();
  render();

  /* keyboard shortcut: / focuses search */
  document.addEventListener('keydown', e => {
    if(e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
      e.preventDefault();
      document.getElementById('globalSearch').focus();
    }
  });

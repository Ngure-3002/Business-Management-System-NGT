<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngure Gacheru Technologies — Jobs &amp; Projects Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   NGURE GACHERU TECHNOLOGIES
   Jobs & Projects Management System — Core Stylesheet
   Modern tech theme with animations
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0b1117;
  --panel:#0f172a;
  --panel-2:#131d2e;
  --card:#1a2536;
  --card-2:#1e2c40;
  --border:#2d3a4f;
  --border-2:#3a4a63;
  --accent:#38bdf8;
  --accent-soft:#a5f3fc;
  --accent-glow:rgba(56,189,248,.16);
  --text:#e0e7ff;
  --text-2:#cfdfee;
  --muted:#9ab3d8;
  --muted-2:#7f96b8;
  --success:#22c55e;
  --warn:#f59e0b;
  --danger:#ef4444;
  --purple:#a78bfa;
  --pink:#f472b6;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --sidebar-w:264px;
}

html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.55;
  font-size:14px;
  overflow:hidden;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0b1117}
::-webkit-scrollbar-thumb{background:#26344a;border-radius:8px;border:2px solid #0b1117}
::-webkit-scrollbar-thumb:hover{background:#38bdf8}

a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ===================== APP SHELL ===================== */
.app-shell{display:flex;height:100vh;width:100vw;overflow:hidden}

/* ===================== SIDEBAR ===================== */
.sidebar{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  background:linear-gradient(180deg,#0f172a 0%,#0c1420 100%);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:60;
}
.brand{
  display:flex;align-items:center;gap:.75rem;
  padding:1.1rem 1.1rem;
  border-bottom:1px solid var(--border);
  background:rgba(56,189,248,.04);
}
.logo{
  width:44px;height:44px;min-width:44px;border-radius:13px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9 60%,#6366f1);
  display:grid;place-items:center;
  font-weight:800;font-size:.95rem;color:#04121d;
  box-shadow:0 6px 20px rgba(56,189,248,.35);
  letter-spacing:-.5px;
}
.brand-text h1{
  font-size:1.02rem;font-weight:700;letter-spacing:-.3px;line-height:1.15;
  background:linear-gradient(135deg,#a5f3fc,#38bdf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand-text span{
  font-size:.7rem;color:var(--muted);font-style:italic;letter-spacing:.4px;
}
.nav{flex:1;overflow-y:auto;padding:.7rem 0 1.4rem}
.nav-section{
  padding:1rem 1.1rem .35rem;
  font-size:.66rem;text-transform:uppercase;letter-spacing:1.6px;
  color:#5d7593;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.56rem 1.1rem;margin:.08rem .55rem;
  border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:.845rem;font-weight:500;
  transition:all .18s ease;position:relative;border:1px solid transparent;
  user-select:none;
}
.nav-item i{width:17px;text-align:center;font-size:.86rem;color:#6d86a8;transition:.18s}
.nav-item:hover{background:rgba(56,189,248,.07);color:var(--text);transform:translateX(3px)}
.nav-item:hover i{color:var(--accent)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(56,189,248,.16),rgba(56,189,248,.02));
  color:#e6f6ff;border-color:rgba(56,189,248,.3);
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.05);
}
.nav-item.active i{color:var(--accent)}
.nav-item.active::before{
  content:'';position:absolute;left:-.55rem;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--accent);border-radius:0 4px 4px 0;
  box-shadow:0 0 10px var(--accent);
}
.nav-badge{
  margin-left:auto;background:rgba(56,189,248,.18);color:var(--accent);
  font-size:.66rem;padding:.08rem .42rem;border-radius:20px;font-weight:700;
  border:1px solid rgba(56,189,248,.25);
}
.sidebar-footer{
  padding:.8rem 1.1rem;border-top:1px solid var(--border);
  font-size:.74rem;color:var(--muted-2);display:flex;align-items:center;gap:.5rem;
}
.dot{
  width:9px;height:9px;background-color:var(--accent);border-radius:50%;
  opacity:.7;animation:pulse 2s infinite;flex-shrink:0;
}
.dot.online{background:var(--success);box-shadow:0 0 10px var(--success)}
.dot.offline{background:var(--danger);box-shadow:0 0 10px var(--danger);animation:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.35);opacity:1}}

/* ===================== MAIN ===================== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

.topbar{
  background:rgba(15,23,42,.96);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:1rem;
  padding:.7rem 1.4rem;backdrop-filter:blur(8px);
  box-shadow:0 4px 22px rgba(0,180,255,.07);
  z-index:40;flex-shrink:0;
}
.icon-btn{
  background:transparent;border:1px solid transparent;color:var(--muted);
  width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1rem;
  display:grid;place-items:center;transition:.18s;
}
.icon-btn:hover{background:rgba(56,189,248,.1);color:var(--accent);border-color:rgba(56,189,248,.25)}
#menuBtn{display:none}
.page-title{font-size:1.06rem;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.page-title small{display:block;font-size:.68rem;color:var(--muted-2);font-weight:400;letter-spacing:.2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:.65rem}

.search-wrap{position:relative}
.search-wrap input{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:30px;padding:.48rem .95rem .48rem 2.1rem;width:250px;
  font-size:.8rem;font-family:inherit;transition:.2s;outline:none;
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);width:290px}
.search-wrap i{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:.8rem}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;width:400px;max-height:420px;overflow-y:auto;
  background:#131d2e;border:1px solid var(--border-2);border-radius:14px;
  box-shadow:var(--shadow);z-index:200;display:none;
}
.search-results.show{display:block}
.sr-item{padding:.6rem .9rem;cursor:pointer;border-bottom:1px solid #1c2739;font-size:.8rem}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:rgba(56,189,248,.09)}
.sr-item b{color:var(--accent);font-weight:600}
.sr-item span{display:block;color:var(--muted-2);font-size:.7rem}

.operator-input{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:30px;padding:.48rem .9rem;font-size:.78rem;width:160px;
  font-family:inherit;outline:none;transition:.2s;
}
.operator-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.clock{
  font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--panel-2);border:1px solid var(--border);border-radius:30px;
  padding:.42rem .85rem;white-space:nowrap;
}

.view{flex:1;overflow-y:auto;padding:1.4rem 1.6rem 3rem;scroll-behavior:smooth}

/* ===================== GENERIC UI ===================== */
.view-head{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.15rem;flex-wrap:wrap}
.view-head h2{font-size:1.4rem;font-weight:700;letter-spacing:-.4px}
.view-head p{color:var(--muted-2);font-size:.79rem;margin-top:.1rem}
.view-head .actions{margin-left:auto;display:flex;gap:.55rem;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.52rem 1.05rem;border-radius:30px;font-weight:600;font-size:.79rem;
  cursor:pointer;border:1px solid transparent;transition:all .2s ease;
  font-family:inherit;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#04121d;box-shadow:0 6px 16px rgba(56,189,248,.24)}
.btn-primary:hover{background:#7dd3fc;transform:translateY(-2px);box-shadow:0 10px 22px rgba(56,189,248,.36)}
.btn-outline{background:transparent;border:1.5px solid var(--border-2);color:var(--text-2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.btn-success{background:var(--success);color:#04180c}
.btn-success:hover{background:#4ade80;transform:translateY(-2px)}
.btn-danger{background:rgba(239,68,68,.13);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--accent);background:rgba(56,189,248,.08)}
.btn-xs{padding:.3rem .62rem;font-size:.7rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.15rem 1.25rem;box-shadow:0 4px 14px rgba(0,0,0,.3);position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;right:0;width:180px;height:180px;
  background:radial-gradient(circle at top right,rgba(37,99,235,.13),transparent 70%);
  pointer-events:none;
}
.card h3{font-size:.95rem;font-weight:650;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem}
.card h3 i{color:var(--accent);font-size:.85rem}

.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

/* KPI */
.kpi{
  background:linear-gradient(150deg,#1a2536,#141e2d);
  border:1px solid var(--border);border-radius:16px;padding:.95rem 1.05rem;
  position:relative;overflow:hidden;transition:.25s;
}
.kpi:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.45);box-shadow:0 14px 28px rgba(0,0,0,.4)}
.kpi .label{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted-2);font-weight:600}
.kpi .value{font-size:1.36rem;font-weight:700;margin-top:.28rem;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.7rem;color:var(--muted-2);margin-top:.18rem}
.kpi .ico{
  position:absolute;right:.85rem;top:.85rem;font-size:1.05rem;color:rgba(56,189,248,.35);
}
.kpi.accent .value{color:var(--accent)}
.kpi.good .value{color:var(--success)}
.kpi.warn .value{color:var(--warn)}
.kpi.bad .value{color:var(--danger)}
.kpi.purple .value{color:var(--purple)}

/* Table */
.table-wrap{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.3);max-height:calc(100vh - 290px);
}
table{width:100%;border-collapse:collapse;font-size:.79rem;min-width:640px}
thead th{
  position:sticky;top:0;z-index:5;
  background:#16202f;text-align:left;padding:.68rem .85rem;
  font-size:.66rem;text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{padding:.6rem .85rem;border-bottom:1px solid #1c2739;vertical-align:middle;color:var(--text-2)}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(56,189,248,.055)}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.74rem;color:var(--accent);font-weight:600}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted-2)}
.empty i{font-size:2.4rem;display:block;margin-bottom:.8rem;opacity:.35;color:var(--accent)}
.empty b{display:block;color:var(--text-2);margin-bottom:.25rem;font-size:.95rem}

/* Badges */
.badge{
  display:inline-block;padding:.16rem .55rem;border-radius:20px;font-size:.66rem;
  font-weight:700;letter-spacing:.3px;white-space:nowrap;border:1px solid transparent;
}
.b-gray{background:rgba(148,163,184,.14);color:#cbd5e1;border-color:rgba(148,163,184,.25)}
.b-blue{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:rgba(56,189,248,.3)}
.b-green{background:rgba(34,197,94,.14);color:#86efac;border-color:rgba(34,197,94,.3)}
.b-amber{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.3)}
.b-red{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.b-purple{background:rgba(167,139,250,.14);color:#c4b5fd;border-color:rgba(167,139,250,.3)}
.b-pink{background:rgba(244,114,182,.14);color:#f9a8d4;border-color:rgba(244,114,182,.3)}

/* Filters */
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filters input,.filters select{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:.48rem .8rem;font-size:.78rem;font-family:inherit;outline:none;transition:.18s;
}
.filters input:focus,.filters select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.filters input[type="text"]{min-width:230px}
.pagination{display:flex;gap:.35rem;align-items:center;margin-top:.9rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.pagination button{
  background:var(--card);border:1px solid var(--border);color:var(--text-2);
  border-radius:8px;padding:.3rem .62rem;cursor:pointer;font-size:.73rem;font-family:inherit;transition:.18s;
}
.pagination button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pagination button.active{background:var(--accent);color:#04121d;border-color:var(--accent);font-weight:700}
.pagination button:disabled{opacity:.35;cursor:not-allowed}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(4,9,16,.78);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:1.2rem;
}
.modal-backdrop.show{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel-2);border:1px solid var(--border-2);border-radius:20px;
  width:100%;max-width:820px;max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 30px 70px rgba(0,0,0,.7);animation:slideUp .22s cubic-bezier(.2,.9,.3,1);
}
.modal.wide{max-width:1180px}
.modal.narrow{max-width:520px}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{
  padding:1rem 1.3rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.7rem;flex-shrink:0;
}
.modal-head h3{font-size:1.02rem;font-weight:650;flex:1}
.modal-head .sub{font-size:.7rem;color:var(--muted-2);display:block;font-weight:400}
.modal-body{padding:1.25rem 1.3rem;overflow-y:auto;flex:1}
.modal-foot{
  padding:.85rem 1.3rem;border-top:1px solid var(--border);
  display:flex;gap:.6rem;justify-content:flex-end;flex-shrink:0;background:rgba(11,17,23,.4);
  border-radius:0 0 20px 20px;
}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.9rem}
.field{display:flex;flex-direction:column;gap:.3rem}
.field.full{grid-column:1/-1}
.field label{font-size:.7rem;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.field label .req{color:var(--danger);margin-left:2px}
.field input,.field select,.field textarea{
  background:#0f1a28;border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:.55rem .75rem;font-size:.82rem;font-family:inherit;
  outline:none;transition:.18s;width:100%;
}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);background:#101d2c;
}
.field input[readonly]{background:#0c1520;color:var(--muted);cursor:default;border-style:dashed}
.field .hint{font-size:.66rem;color:var(--muted-2)}
.field.check{flex-direction:row;align-items:center;gap:.5rem;padding-top:1.1rem}
.field.check input{width:auto}

/* Items editor */
.items-editor{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:.3rem}
.items-editor table{min-width:0;font-size:.78rem}
.items-editor thead th{background:#16202f;position:static}
.items-editor td{padding:.35rem .45rem}
.items-editor input{
  background:#0f1a28;border:1px solid #26344a;color:var(--text);border-radius:7px;
  padding:.36rem .5rem;font-size:.77rem;width:100%;font-family:inherit;outline:none;
}
.items-editor input:focus{border-color:var(--accent)}
.items-total{
  display:flex;justify-content:flex-end;gap:1.4rem;padding:.7rem .9rem;
  background:#131e2c;border-top:1px solid var(--border);font-size:.78rem;flex-wrap:wrap;
}
.items-total b{color:var(--accent)}

/* Job detail panel */
.panel-backdrop{
  position:fixed;inset:0;background:rgba(4,9,16,.6);backdrop-filter:blur(3px);
  z-index:900;display:none;
}
.panel-backdrop.show{display:block;animation:fadeIn .2s}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(1080px,96vw);
  background:var(--panel);border-left:1px solid var(--border-2);
  z-index:901;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:-20px 0 60px rgba(0,0,0,.6);
}
.panel.show{transform:translateX(0)}
.panel-head{
  padding:1rem 1.3rem;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:.9rem;flex-shrink:0;background:#0d1725;
}
.panel-head .ttl{flex:1;min-width:0}
.panel-head h2{font-size:1.15rem;font-weight:700;letter-spacing:-.3px}
.panel-head .meta{font-size:.72rem;color:var(--muted-2);margin-top:.2rem;display:flex;gap:.8rem;flex-wrap:wrap}
.tabs{
  display:flex;gap:.25rem;padding:.6rem 1rem;overflow-x:auto;
  border-bottom:1px solid var(--border);background:#0c1520;flex-shrink:0;
}
.tab{
  padding:.4rem .8rem;border-radius:8px;font-size:.75rem;font-weight:600;
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:.18s;border:1px solid transparent;
}
.tab:hover{color:var(--accent);background:rgba(56,189,248,.07)}
.tab.active{background:rgba(56,189,248,.14);color:var(--accent);border-color:rgba(56,189,248,.3)}
.panel-body{flex:1;overflow-y:auto;padding:1.2rem 1.3rem 3rem}

/* Timeline */
.timeline{position:relative;padding-left:1.6rem}
.timeline::before{content:'';position:absolute;left:.42rem;top:.4rem;bottom:.4rem;width:2px;background:linear-gradient(180deg,var(--accent),transparent)}
.tl-item{position:relative;padding-bottom:1.05rem}
.tl-item::before{
  content:'';position:absolute;left:-1.42rem;top:.32rem;width:11px;height:11px;border-radius:50%;
  background:var(--panel);border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.12);
}
.tl-item .t{font-size:.8rem;font-weight:600;color:var(--text)}
.tl-item .d{font-size:.7rem;color:var(--muted-2);margin-top:.1rem}

/* Bars */
.bar-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.55rem;font-size:.76rem}
.bar-row .lbl{width:150px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;height:9px;background:#16202f;border-radius:6px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#0ea5e9,#38bdf8);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.bar-fill.green{background:linear-gradient(90deg,#16a34a,#4ade80)}
.bar-fill.amber{background:linear-gradient(90deg,#d97706,#fbbf24)}
.bar-fill.red{background:linear-gradient(90deg,#dc2626,#f87171)}
.bar-fill.purple{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.bar-row .val{width:110px;text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;flex-shrink:0}

/* Progress */
.progress{height:8px;background:#16202f;border-radius:6px;overflow:hidden;margin-top:.4rem}
.progress > div{height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:6px;transition:width .5s}
.progress.green > div{background:linear-gradient(90deg,#16a34a,#4ade80)}
.progress.amber > div{background:linear-gradient(90deg,#d97706,#fbbf24)}
.progress.red > div{background:linear-gradient(90deg,#dc2626,#f87171)}

/* Toast */
#toastRoot{position:fixed;bottom:1.3rem;right:1.3rem;z-index:2000;display:flex;flex-direction:column;gap:.5rem}
.toast{
  background:#16202f;border:1px solid var(--border-2);border-left:3px solid var(--accent);
  border-radius:12px;padding:.72rem 1rem;font-size:.8rem;min-width:250px;max-width:380px;
  box-shadow:0 12px 30px rgba(0,0,0,.55);animation:toastIn .25s cubic-bezier(.2,.9,.3,1);
  display:flex;align-items:center;gap:.6rem;color:var(--text-2);
}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast i{font-size:.95rem}
.toast.success i{color:var(--success)}
.toast.error i{color:var(--danger)}
.toast.warn i{color:var(--warn)}
.toast.info i{color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;color:var(--muted-2);gap:.9rem}
.spinner{
  width:36px;height:36px;border:3px solid #1e2c3c;border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Section title */
.sec-title{
  font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:#5d7593;
  font-weight:700;margin:1.4rem 0 .7rem;display:flex;align-items:center;gap:.6rem;
}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* Animate on view */
.animate-on-view{opacity:0;transform:translateY(24px);transition:opacity .55s ease,transform .55s ease}
.animate-on-view.visible{opacity:1;transform:translateY(0)}

/* Misc */
.flex{display:flex}
.between{justify-content:space-between}
.center{align-items:center}
.gap{gap:.6rem}
.wrap{flex-wrap:wrap}
.mt{margin-top:1rem}
.mb{margin-bottom:1rem}
.muted{color:var(--muted-2)}
.small{font-size:.72rem}
.right{text-align:right}
.nowrap{white-space:nowrap}
.divider{height:1px;background:var(--border);margin:1rem 0}
.chip{
  display:inline-flex;align-items:center;gap:.35rem;background:#16202f;border:1px solid var(--border);
  border-radius:20px;padding:.2rem .6rem;font-size:.7rem;color:var(--muted);
}

/* Responsive */
@media (max-width:1100px){

}
@media (max-width:900px){

<script>

/* ------------------------------------------------------------
   1. FIREBASE INITIALISATION
   ------------------------------------------------------------ */
const firebaseConfig = {
  databaseURL: "https://ngt-projects-management-system-default-rtdb.firebaseio.com/"
};

  firebase.initializeApp(firebaseConfig);

  console.error("Firebase init failed", e);

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const money = v => 'KES ' + num(v).toLocaleString('en-KE', {minimumFractionDigits:2, maximumFractionDigits:2});
const money0 = v => 'KES ' + num(v).toLocaleString('en-KE', {maximumFractionDigits:0});
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = d => { if(!d) return '—'; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDT = ts => ts ? new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const clamp = (n,a,b) => Math.min(Math.max(n,a),b);
const pct = (a,b) => b ? (a/b*100) : 0;

function statusClass(s){
  const map = {
    // generic green
    'Approved':'b-green','Completed':'b-green','Closed':'b-green','Paid':'b-green','Fully Paid':'b-green',
    'Active':'b-green','Received':'b-green','Fully Received':'b-green','Done':'b-green','Converted to Job':'b-green',
    'Won':'b-green','Fully Invoiced':'b-green','Suitable':'b-green','Resolved':'b-green',
    // blue / in-flight
    'In Progress':'b-blue','Scheduled':'b-blue','Issued':'b-blue','Sent':'b-blue','Ordered':'b-blue',
    'Quotation Sent':'b-blue','Site Assessment Required':'b-blue','Quotation Required':'b-blue',
    'New':'b-blue','Contacted':'b-blue','Requested':'b-blue','Todo':'b-blue','Assigned':'b-blue',
    'Partially Received':'b-blue','Partially Paid':'b-blue','Partially Invoiced':'b-blue',
    'Partially Completed':'b-blue','Assessment Done':'b-blue','Converted':'b-blue',
    // amber / waiting
    'Pending':'b-amber','Pending Approval':'b-amber','On Hold':'b-amber','Awaiting Customer':'b-amber',
    'Awaiting Materials':'b-amber','Negotiation':'b-amber','Draft':'b-amber','Not Invoiced':'b-amber',
    'Quoted':'b-amber','Blocked':'b-amber','Requires Modification':'b-amber','Further Assessment Required':'b-amber',
    // red
    'Overdue':'b-red','Cancelled':'b-red','Rejected':'b-red','Blacklisted':'b-red','Defaulted':'b-red',
    'Not Recommended':'b-red','Void':'b-red','Expired':'b-red','Inactive':'b-red',
    // purple
    'Warranty':'b-purple','Maintenance':'b-purple','Expired Warranty':'b-purple'
  };
  return map[s] || 'b-gray';
}
const badge = s => s ? `<span class="badge ${statusClass(s)}">${esc(s)}</span>` : '<span class="muted">—</span>';

function toast(msg, type = 'info', ms = 3200){
  const icons = {info:'fa-circle-info', success:'fa-circle-check', error:'fa-circle-exclamation', warn:'fa-triangle-exclamation'};
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fa-solid ${icons[type]||icons.info}"></i><div>${esc(msg)}</div>`;
  $('#toastRoot').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(30px)'; el.style.transition = '.3s'; setTimeout(()=>el.remove(), 320); }, ms);
}

function downloadFile(filename, content, mime = 'text/csv;charset=utf-8;'){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportCSV(filename, rows, headers){
  if(!rows.length){ toast('Nothing to export', 'warn'); return; }
  const cols = headers || Object.keys(rows[0]);
  const esc2 = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const csv = [cols.map(esc2).join(',')].concat(rows.map(r => cols.map(c => esc2(r[c])).join(','))).join('\n');
  downloadFile(filename, '\uFEFF' + csv);
  toast('Exported ' + filename, 'success');
}

/* ------------------------------------------------------------
   7. DATA HELPERS
   ------------------------------------------------------------ */
const byId = (coll, id) => (state.data[coll] || []).find(r => r._id === id);
const refOf = (coll, id) => { const r = byId(coll, id); return r ? (r.ref || r.name || r.title || '—') : '—'; };
const nameOf = (coll, id) => { const r = byId(coll, id); return r ? (r.name || r.title || r.ref || '—') : '—'; };
const sortBy = (arr, k, dir=1) => arr.slice().sort((a,b)=>{
  let x = a[k], y = b[k];
  if(typeof x === 'number' || typeof y === 'number'){ return (num(x)-num(y))*dir; }
  return String(x ?? '').localeCompare(String(y ?? ''))*dir;
});

/* ---------------- Job financial engine ---------------- */
function jobFinancials(jobId){
  const job = byId('jobs', jobId);
  if(!job) return null;
  const cos = state.data.changeOrders.filter(c => c.jobId === jobId && c.status === 'Approved');
  const extra = cos.reduce((s,c)=>s+num(c.additionalCost),0);
  const contract = num(job.contractAmount) + extra;
  const discount = num(job.discount);
  const revenue = contract - discount;

  const exps = state.data.expenses.filter(e => e.jobId === jobId && e.status !== 'Rejected');
  const cost = exps.reduce((s,e)=>s+num(e.amount),0);

  const invs = state.data.invoices.filter(i => i.jobId === jobId && i.status !== 'Cancelled');
  const invoiced = invs.reduce((s,i)=>s+num(i.total),0);

  const pays = state.data.payments.filter(p => p.jobId === jobId);
  const paid = pays.reduce((s,p)=>s+num(p.amount),0);

  const profit = revenue - cost;
  const margin = revenue ? (profit / revenue * 100) : 0;

  // cost by category
  const byCat = {};
  exps.forEach(e => { byCat[e.category || 'Miscellaneous'] = (byCat[e.category || 'Miscellaneous'] || 0) + num(e.amount); });

  // budget
  const budget = num(job.budgetMaterial) + num(job.budgetLabour) + num(job.budgetOther);

  // progress from tasks
  const tks = state.data.tasks.filter(t => t.jobId === jobId);
  const progress = tks.length
    ? Math.round(tks.reduce((s,t)=>s+num(t.progress),0) / tks.length)
    : (job.status === 'Completed' || job.status === 'Closed' ? 100 : 0);

  return {
    job, contract, extra, discount, revenue, cost, invoiced, paid,
    outstanding: Math.max(contract - paid, 0),
    uninvoiced: Math.max(revenue - invoiced, 0),
    profit, margin, byCat, budget,
    budgetVariance: budget - cost,
    tasks: tks, progress,
    changeOrders: cos,
    expenses: exps, invoices: invs, payments: pays
  };
}

/* ---------------- Invoice paid amount ---------------- */
function invoicePaid(invId){
  return state.data.payments.filter(p => p.invoiceId === invId).reduce((s,p)=>s+num(p.amount),0);
}
function invoiceBalance(inv){
  return Math.max(num(inv.total) - invoicePaid(inv._id), 0);
}
function invoiceComputedStatus(inv){
  const bal = invoiceBalance(inv);
  const paid = invoicePaid(inv._id);
  if(inv.status === 'Cancelled' || inv.status === 'Draft') return inv.status;
  if(bal <= 0.01) return 'Paid';
  const overdue = inv.dueDate && new Date(inv.dueDate) < new Date(new Date().toDateString());
  if(paid > 0) return overdue ? 'Overdue' : 'Partially Paid';
  return overdue ? 'Overdue' : (inv.status === 'Issued' ? 'Issued' : inv.status);
}

/* ---------------- Customer balance ---------------- */
function customerBalance(custId){
  const jobs = state.data.jobs.filter(j => j.customerId === custId && j.status !== 'Cancelled');
  let contracted = 0, paid = 0, cost = 0;
  jobs.forEach(j=>{
    const f = jobFinancials(j._id);
    if(f){ contracted += f.contract; paid += f.paid; cost += f.cost; }
  });
  // include hire purchase balances
  let hpBal = 0;
  state.data.hirePurchase.filter(h=>h.customerId===custId && h.status==='Active').forEach(h=>{
    hpBal += Math.max(num(h.sellingPrice) - num(h.deposit) - num(h._paid||0), 0);
  });
  return { contracted, paid, outstanding: Math.max(contracted - paid, 0) + hpBal, cost, profit: contracted - cost, jobs: jobs.length };
}

/* ---------------- Material helpers ---------------- */
const matRemaining = m => num(m.purchasedQty) - num(m.usedQty) - num(m.returnedQty);
const matTotalCost = m => num(m.purchasedQty) * num(m.unitCost);
const asgLabourCost = a => num(a.hours) * num(a.rate);
const hpPaid = h => {
  const direct = state.data.payments.filter(p => p.hpId === h._id).reduce((s,p)=>s+num(p.amount),0);
  return num(h.deposit) + direct;
};
const hpBalance = h => Math.max(num(h.sellingPrice) - hpPaid(h), 0);

async function nextRef(prefix){
  const year = new Date().getFullYear();
  const path = `_counters/${prefix}_${year}`;
  try {
    const res = await db.ref(path).transaction(c => (c || 0) + 1);
    const n = res && res.snapshot ? res.snapshot.val() : null;
    if(n) return `${prefix}-${year}-${String(n).padStart(4,'0')}`;
  } catch(e){ console.warn('Counter fallback', e); }
  return `${prefix}-${year}-${String(Date.now()).slice(-4)}`;
}

async function saveRecord(coll, rec, isNew){
  const payload = Object.assign({}, rec);
  delete payload._id;
  payload.updatedAt = Date.now();
  if(isNew){
    payload.createdAt = Date.now();
    const ref = await db.ref(coll).push(payload);
    await ref.update({ _key: ref.key });
    return ref.key;
  } else {
    const id = rec._id;
    await db.ref(`${coll}/${id}`).update(payload);
    return id;
  }
}

async function deleteRecord(coll, id){
  await db.ref(`${coll}/${id}`).remove();
}

function audit(action, entity, refNo, details){
  try {
    db.ref('audit').push({
      ts: Date.now(),
      action, entity, ref: refNo || '',
      details: details || '',
      user: state.user || 'Unnamed Operator'
    });
  } catch(e){ /* silent */ }
}

/* ------------------------------------------------------------
   9. REALTIME LISTENERS
   ------------------------------------------------------------ */
function toArray(val){
  if(!val) return [];
  return Object.entries(val).map(([id, o]) => Object.assign({ _id: id }, o));
}

function startListeners(){
  COLLECTIONS.forEach(coll => {
    db.ref(coll).on('value', snap => {
      state.data[coll] = toArray(snap.val());
      scheduleRender();
    }, err => {
      console.error('Listener error on ' + coll, err);
      toast('Read error on ' + coll, 'error');
    });
  });

  db.ref('settings').on('value', s => { state.settings = s.val() || {}; scheduleRender(); });
  db.ref('audit').limitToLast(500).on('value', s => { state.audit = toArray(s.val()).sort((a,b)=>(b.ts||0)-(a.ts||0)); });

  db.ref('.info/connected').on('value', s => {
    const on = s.val() === true;
    const dot = $('#connDot'), txt = $('#connText');
    if(dot){ dot.className = 'dot ' + (on ? 'online' : 'offline'); }
    if(txt){ txt.textContent = on ? 'Connected · Live sync' : 'Offline — reconnecting…'; }
  });
}

   ------------------------------------------------------------ */
let renderQueued = false;
function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

function buildNav(){
  const counts = {
    leads: state.data.leads.filter(l=>l.status==='New').length,
    jobs: state.data.jobs.filter(j=>['Approved','Scheduled','In Progress','Awaiting Materials','Awaiting Customer','On Hold'].includes(j.status)).length,
    invoices: state.data.invoices.filter(i=>invoiceComputedStatus(i)==='Overdue').length
  };
  $('#nav').innerHTML = NAV.map(sec => `
    <div class="nav-section">${esc(sec.section)}</div>
    ${sec.items.map(it => {
      const c = counts[it.id];
      return `<div class="nav-item ${state.route===it.id?'active':''}" data-route="${it.id}">
        <i class="fa-solid ${it.icon}"></i><span>${esc(it.label)}</span>
        ${c ? `<span class="nav-badge">${c}</span>` : ''}
      </div>`;
    }).join('')}
  `).join('');
  $$('#nav .nav-item').forEach(el => el.onclick = () => go(el.dataset.route));
}

function go(route){
  state.route = route;
  location.hash = route;
  if(window.innerWidth <= 900) $('#sidebar').classList.remove('open');
  const el = $('#view'); if(el) el.scrollTop = 0;
  render();
}

function render(){
  buildNav();
  const route = state.route;
  const view = $('#view');
  if(!view) return;

  const navItem = NAV.flatMap(s=>s.items).find(i=>i.id===route);
  $('#pageTitle').innerHTML = `${esc(navItem ? navItem.label : 'Dashboard')}<small>${route==='dashboard'?'Business overview':(route==='reports'?'Financial & operational analytics':(route==='settings'?'System configuration':(route==='audit'?'System activity log':'Ngure Gacheru Technologies')))}</small>`;

  if(!fbReady){
    view.innerHTML = `<div class="empty"><i class="fa-solid fa-plug-circle-xmark"></i><b>Database unavailable</b>Could not connect to the Firebase Realtime Database. Check your internet connection and refresh.</div>`;
    return;
  }

  if(route === 'dashboard'){ view.innerHTML = renderDashboard(); afterRender(); return; }
  if(route === 'reports'){ view.innerHTML = renderReports(); afterRender(); return; }
  if(route === 'settings'){ view.innerHTML = renderSettings(); afterRender(); return; }
  if(route === 'audit'){ view.innerHTML = renderAudit(); afterRender(); return; }
  if(SCHEMAS[route]){ view.innerHTML = renderList(route); afterRender(); return; }

  view.innerHTML = `<div class="empty"><i class="fa-solid fa-compass"></i><b>Module not found</b></div>`;
}

function afterRender(){
  $$('.animate-on-view').forEach(el => io.observe(el));
  const gs = $('#globalSearch'); if(gs && !gs.dataset.bound){ bindGlobalSearch(); }
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold:.08 });

/* ------------------------------------------------------------
   12. GENERIC LIST VIEW
   ------------------------------------------------------------ */
function cellValue(coll, row, col){
  const S = SCHEMAS[coll];
  const f = S.fields.find(x => x.k === col);

  switch(col){
    case '_customer': return esc(nameOf('customers', row.customerId));
    case '_job': return row.jobId ? `<span class="mono">${esc(refOf('jobs', row.jobId))}</span>` : '<span class="muted">—</span>';
    case '_staff': return esc(nameOf('staff', row.staffId));
    case '_balance': { const b = customerBalance(row._id); return `<span class="num ${b.outstanding>0?'':'muted'}">${money0(b.outstanding)}</span>`; }
    case '_paid':
      if(coll === 'jobs'){ const f2 = jobFinancials(row._id); return `<span class="num">${money0(f2?f2.paid:0)}</span>`; }
      break;
    case '_outstanding':
      if(coll === 'jobs'){ const f2 = jobFinancials(row._id); return `<span class="num ${f2&&f2.outstanding>0?'':'muted'}">${money0(f2?f2.outstanding:0)}</span>`; }
      break;
    case '_progress': {
      const f2 = jobFinancials(row._id);
      const p = f2 ? f2.progress : 0;
      const cls = p>=100?'green':p>=50?'':'amber';
      return `<div style="min-width:90px"><div class="small muted">${p}%</div><div class="progress ${cls}"><div style="width:${clamp(p,0,100)}%"></div></div></div>`;
    }
    case '_paidAmount': return `<span class="num">${money0(invoicePaid(row._id))}</span>`;
    case '_balance': return `<span class="num">${money0(invoiceBalance(row))}</span>`;
    case '_margin': {
      if(coll === 'quotations' || coll === 'brokerage'){
        const rev = num(row.total) || num(row.sellingPrice);
        const cst = row.estimatedCost !== undefined ? num(row.estimatedCost) : num(row.supplierCost);
        const m = rev ? ((rev - cst)/rev*100) : 0;
        return `<span class="badge ${m>=25?'b-green':m>=10?'b-amber':'b-red'}">${m.toFixed(1)}%</span>`;
      }
      break;
    }
    case '_remaining': return `<span class="num">${num(matRemaining(row)).toLocaleString()}</span>`;
    case '_posted': return row.posted ? '<span class="badge b-green">Posted</span>' : '<span class="badge b-gray">Not posted</span>';
    case '_status': {
      if(coll === 'warranties'){
        const expired = row.endDate && new Date(row.endDate) < new Date();
        return badge(expired ? 'Expired' : (row.status || 'Active'));
      }
      if(coll === 'invoices') return badge(invoiceComputedStatus(row));
      break;
    }
  }

  const v = row[col];
  if(v === undefined || v === null || v === '') return '<span class="muted">—</span>';

  if(col === 'totalCost') return `<span class="num">${money0(matTotalCost(row))}</span>`;
  if(col === 'labourCost') return `<span class="num">${money0(asgLabourCost(row))}</span>`;
  if(col === 'status' || (f && f.t === 'select' && (col.includes('status') || col.includes('Status') || col === 'result' || col === 'priority' || col === 'rating' || col === 'frequency' || col === 'type'))) return badge(v);
  if(col === 'ref') return `<span class="mono">${esc(v)}</span>`;
  if(col === 'contractAmount' || col === 'total' || col === 'amount' || col === 'expectedBudget' || col === 'sellingPrice' || col === 'supplierCost' || col === 'deposit' || col === 'additionalCost' || col === 'value' || col === 'contractValue')
    return `<span class="num">${money0(v)}</span>`;
  if(col.endsWith('Date') || col === 'date' || col === 'dueDate') return esc(fmtDate(v));
  if(col === 'createdAt' || col === 'updatedAt') return esc(fmtDT(v));
  if(col === '_progress') return esc(v + '%');

  return esc(String(v).length > 70 ? String(v).slice(0,70)+'…' : v);
}

function getFiltered(coll){
  const S = SCHEMAS[coll];
  let rows = state.data[coll].slice();

  // status filter
  const st = state.filters[coll];
  if(st){ rows = rows.filter(r => r.status === st || r[Object.keys(r).find(k=>k==='status')] === st); }

  // search
  const q = (state.search[coll] || '').toLowerCase().trim();
  if(q){
    rows = rows.filter(r => {
      const hay = [r.ref, r.name, r.title, r.description, r.itemName, r.itemRequested, r.product, r.phone, r.email, r.location, r.reference, r.notes,
        nameOf('customers', r.customerId), refOf('jobs', r.jobId), nameOf('suppliers', r.supplierId), nameOf('staff', r.staffId)].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  // sort
  const sk = state.sort[coll];
  if(sk){
    const [key, dir] = sk.split(':');
    rows = sortBy(rows, key, dir === 'desc' ? -1 : 1);
  } else {
    rows = rows.sort((a,b) => (b.createdAt||0) - (a.createdAt||0) || String(a.ref||'').localeCompare(String(b.ref||'')));
  }
  return rows;
}

function renderList(coll){
  const S = SCHEMAS[coll];
  const rows = getFiltered(coll);
  const perPage = 25;
  const page = Math.min(state.page[coll] || 1, Math.max(1, Math.ceil(rows.length/perPage)));
  const slice = rows.slice((page-1)*perPage, page*perPage);
  const statuses = S.fields.find(f=>f.k==='status');

  const colHeaders = S.cols.map(c => {
    const f = S.fields.find(x=>x.k===c);
    const label = f ? f.l : ({
      _customer:'Customer', _job:'Job', _staff:'Staff Member', _balance:'Outstanding',
      _paid:'Collected', _outstanding:'Outstanding', _progress:'Progress',
      _paidAmount:'Paid', _margin:'Margin', _remaining:'Remaining', _posted:'Cost Posted', _status:'Effective Status'
    }[c] || c);
    const sortKey = state.sort[coll] || '';
    const active = sortKey.startsWith(c + ':');
    const arrow = active ? (sortKey.endsWith(':desc') ? ' ▾' : ' ▴') : '';
    return `<th data-sort="${c}" style="cursor:pointer">${esc(label)}${arrow}</th>`;
  }).join('');

  return `
  <div class="view-head animate-on-view">
    <div>
      <h2><i class="fa-solid ${S.icon}" style="color:var(--accent);margin-right:.45rem"></i>${esc(S.label)}</h2>
      <p>${rows.length} record${rows.length===1?'':'s'} · live from Firebase</p>
    </div>
    <div class="actions">
      <button class="btn btn-outline" id="expCSV"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
      <button class="btn btn-primary" id="newBtn"><i class="fa-solid fa-plus"></i> New ${esc(S.singular)}</button>
    </div>
  </div>

  <div class="filters animate-on-view">
    <input type="text" id="listSearch" placeholder="Search ${esc(S.label.toLowerCase())}…" value="${esc(state.search[coll]||'')}">
    ${statuses ? `<select id="statusFilter">
      <option value="">All statuses</option>
      ${statuses.o.map(o=>`<option value="${esc(o)}" ${state.filters[coll]===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>` : ''}
    <button class="btn btn-ghost btn-xs" id="clearFilters"><i class="fa-solid fa-filter-circle-xmark"></i> Clear</button>
  </div>

  <div class="table-wrap animate-on-view">
    <table>
      <thead><tr>${colHeaders}<th style="width:150px">Actions</th></tr></thead>
      <tbody id="listBody">
        ${slice.length ? slice.map(r => `
          <tr data-id="${r._id}">
            ${S.cols.map(c => `<td>${cellValue(coll, r, c)}</td>`).join('')}
            <td class="nowrap">
              <button class="btn btn-outline btn-xs" data-act="edit" data-id="${r._id}"><i class="fa-solid fa-pen"></i></button>
              ${rowActionsHTML(coll, r)}
              <button class="btn btn-danger btn-xs" data-act="del" data-id="${r._id}"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`).join('')
        : `<tr><td colspan="${S.cols.length+1}">
            <div class="empty"><i class="fa-solid ${S.icon}"></i><b>No ${esc(S.label.toLowerCase())} yet</b>Click “New ${esc(S.singular)}” to create the first record.</div>
          </td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pager">
    <button ${page<=1?'disabled':''} data-page="${page-1}"><i class="fa-solid fa-chevron-left"></i></button>
    <span>Page ${page} of ${Math.max(1,Math.ceil(rows.length/perPage))}</span>
    <button ${page>=Math.ceil(rows.length/perPage)?'disabled':''} data-page="${page+1}"><i class="fa-solid fa-chevron-right"></i></button>
    <span class="muted" style="margin-left:auto">Showing ${slice.length} of ${rows.length}</span>
  </div>`;
}

function rowActionsHTML(coll, r){
  const btns = [];
  if(coll === 'jobs') btns.push(`<button class="btn btn-primary btn-xs" data-act="open" data-id="${r._id}" title="Open job workspace"><i class="fa-solid fa-folder-open"></i></button>`);

    btns.push(`<button class="btn btn-outline btn-xs" data-act="print" data-id="${r._id}" title="Print quotation"><i class="fa-solid fa-print"></i></button>`);
    btns.push(`<button class="btn btn-success btn-xs" data-act="convert" data-id="${r._id}" title="Convert to Job"><i class="fa-solid fa-arrow-right"></i></button>`);
  }
  if(coll === 'invoices'){
    btns.push(`<button class="btn btn-outline btn-xs" data-act="print" data-id="${r._id}" title="Print invoice"><i class="fa-solid fa-print"></i></button>`);
    btns.push(`<button class="btn btn-success btn-xs" data-act="pay" data-id="${r._id}" title="Record payment"><i class="fa-solid fa-money-bill"></i></button>`);

function bindListEvents(coll){
  const S = SCHEMAS[coll];
  const view = $('#view');

  $('#newBtn').onclick = () => openForm(coll, null);
  $('#expCSV').onclick = () => {
    const rows = getFiltered(coll).map(r => {
      const o = {};
      S.cols.forEach(c => {
        const f = S.fields.find(x=>x.k===c);
        const label = f ? f.l : c;
        let v = r[c];
        if(c === '_customer') v = nameOf('customers', r.customerId);
        else if(c === '_job') v = refOf('jobs', r.jobId);
        else if(c === '_staff') v = nameOf('staff', r.staffId);
        else if(c === '_balance') v = customerBalance(r._id).outstanding;
        else if(c === '_paid'){ const f2 = jobFinancials(r._id); v = f2?f2.paid:0; }
        else if(c === '_outstanding'){ const f2 = jobFinancials(r._id); v = f2?f2.outstanding:0; }
        else if(c === '_progress'){ const f2 = jobFinancials(r._id); v = f2?f2.progress:0; }
        else if(c === '_paidAmount') v = invoicePaid(r._id);
        else if(c === '_balance') v = invoiceBalance(r);
        else if(c === '_remaining') v = matRemaining(r);
        else if(c === '_posted') v = r.posted ? 'Yes' : 'No';
        o[label] = v;
      });
      return o;
    });

  const si = $('#listSearch');
  if(si){
    let t;
    si.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => { state.search[coll] = si.value; state.page[coll] = 1; refreshList(coll); }, 220);
    };
  }
  const sf = $('#statusFilter');
  if(sf) sf.onchange = () => { state.filters[coll] = sf.value; state.page[coll] = 1; refreshList(coll); };

  const cf = $('#clearFilters');
  if(cf) cf.onclick = () => { state.search[coll]=''; state.filters[coll]=''; state.page[coll]=1; render(); };

  $$('#view thead th[data-sort]').forEach(th => th.onclick = () => {
    const key = th.dataset.sort;
    const cur = state.sort[coll] || '';
    state.sort[coll] = cur.startsWith(key) && cur.endsWith(':asc') ? key + ':desc' : key + ':asc';
    render();
  });

  $$('#pager button[data-page]').forEach(b => b.onclick = () => {
    state.page[coll] = parseInt(b.dataset.page, 10); render();
  });

  $$('#view tbody button[data-act]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const act = b.dataset.act, id = b.dataset.id;
    handleRowAction(coll, act, id);
  });

  $$('#view tbody tr[data-id]').forEach(tr => tr.onclick = (ev) => {
    if(ev.target.closest('button')) return;
    const id = tr.dataset.id;
    if(coll === 'jobs') openJobPanel(id);
    else openForm(coll, byId(coll, id));
  });
}

function refreshList(coll){
  const S = SCHEMAS[coll];
  const rows = getFiltered(coll);
  const perPage = 25;
  const page = Math.min(state.page[coll] || 1, Math.max(1, Math.ceil(rows.length/perPage)));
  state.page[coll] = page;
  const slice = rows.slice((page-1)*perPage, page*perPage);

  tb.innerHTML = slice.length ? slice.map(r => `
    <tr data-id="${r._id}">

      </td>

    if(ev.target.closest('button')) return;
    if(coll === 'jobs') openJobPanel(tr.dataset.id); else openForm(coll, byId(coll, tr.dataset.id));
  });

/* ------------------------------------------------------------
   13. ROW ACTIONS
   ------------------------------------------------------------ */
async function handleRowAction(coll, act, id){
  const rec = byId(coll, id);
  if(!rec) return;

  if(act === 'edit'){ openForm(coll, rec); return; }
  if(act === 'del'){
    confirmDialog(`Delete this ${SCHEMAS[coll].singular}?`, `Record <b>${esc(rec.ref || rec.name || rec.title || '')}</b> will be permanently removed from the database. This action cannot be undone.`, async () => {
      await deleteRecord(coll, id);
      audit('DELETE', coll, rec.ref || rec.name, 'Record deleted');
      toast('Record deleted', 'success');
    });
    return;
  }
  if(act === 'open'){ openJobPanel(id); return; }

  if(act === 'convert'){
    if(coll === 'leads'){
      const ref = await nextRef('JOB');
      const job = {
        ref,
        title: rec.title,
        customerId: rec.customerId,
        leadId: rec._id,
        department: rec.department,
        serviceCategory: rec.serviceCategory,
        jobType: 'Supply & Install',
        location: rec.location,
        siteAddress: '',
        manager: rec.assignedTo || '',
        team: '',
        priority: rec.priority,
        startDate: todayISO(),
        dueDate: '',
        completedDate: '',
        quotedAmount: num(rec.expectedBudget),
        contractAmount: num(rec.expectedBudget),
        discount: 0,
        budgetMaterial: 0, budgetLabour: 0, budgetOther: 0,
        status: 'Approved',
        description: rec.description || '',
        notes: 'Converted from job request ' + (rec.ref || ''),
        createdAt: Date.now(), updatedAt: Date.now()
      };
      const newId = await saveRecord('jobs', job, true);
      await db.ref(`leads/${id}`).update({ status:'Converted to Job', convertedJobId: newId, updatedAt: Date.now() });
      audit('CONVERT', 'leads', rec.ref, 'Converted to job ' + ref);
      toast('Converted to job ' + ref, 'success');
      go('jobs');
      setTimeout(()=>openJobPanel(newId), 600);
      return;
    }
    if(coll === 'quotations'){
      const ref = await nextRef('JOB');
      const job = {
        ref,
        title: rec.title || 'Project from ' + (rec.ref || ''),
        customerId: rec.customerId,
        leadId: rec.leadId || '',
        department: 'General',
        serviceCategory: '',
        jobType: 'Supply & Install',
        location: '', siteAddress: '',
        manager: rec.preparedBy || '', team: '',
        priority: 'Medium',
        startDate: todayISO(), dueDate: '', completedDate: '',
        quotedAmount: num(rec.total),
        contractAmount: num(rec.total),
        discount: num(rec.discount),
        budgetMaterial: 0, budgetLabour: 0, budgetOther: 0,
        status: 'Approved',
        description: (rec.items || []).map(i=>`${i.description} × ${i.qty}`).join('\n'),
        notes: 'Converted from quotation ' + (rec.ref || ''),
        createdAt: Date.now(), updatedAt: Date.now()
      };
      const newId = await saveRecord('jobs', job, true);
      await db.ref(`quotations/${id}`).update({ status:'Approved', convertedJobId: newId, updatedAt: Date.now() });
      audit('CONVERT', 'quotations', rec.ref, 'Converted to job ' + ref);
      toast('Quotation converted to job ' + ref, 'success');
      go('jobs');
      setTimeout(()=>openJobPanel(newId), 600);
      return;
    }
  }

  if(act === 'print'){
    if(coll === 'invoices') printInvoice(rec);
    if(coll === 'quotations') printQuotation(rec);
    return;
  }

  if(act === 'pay'){
    openForm('payments', {
      customerId: rec.customerId,
      jobId: rec.jobId,
      invoiceId: rec._id,
      amount: invoiceBalance(rec),
      method: 'M-Pesa',
      date: todayISO()
    });
    return;
  }

  if(act === 'quote'){
    const ref = await nextRef('QUO');
    openForm('quotations', {
      ref,
      customerId: rec.customerId,
      leadId: rec.leadId || '',
      date: todayISO(),
      title: 'Quotation for ' + (rec.siteAddress || 'site works'),
      items: [{description:'', qty:1, unitPrice:0, cost:0}],
      discount: 0, taxRate: 16,
      status: 'Draft',
      terms: '50% deposit on approval, balance on completion.',
      notes: 'Generated from site assessment ' + (rec.ref || '')
    });
    return;
  }

  if(act === 'post'){
    if(coll === 'materials'){
      if(rec.posted){ toast('This material cost has already been posted', 'warn'); return; }
      const total = matTotalCost(rec);
      if(total <= 0){ toast('Set a unit cost before posting', 'warn'); return; }
      const expRef = await nextRef('EXP');
      await saveRecord('expenses', {
        ref: expRef, jobId: rec.jobId, date: todayISO(), category:'Materials',
        description: `${rec.itemName} — ${num(rec.purchasedQty)} ${rec.unit || ''} (${rec.ref})`,
        amount: total, paymentMethod:'Cash', paidBy: state.user || '', receiptNo: rec.ref,
        supplierId: rec.supplierId || '', status:'Approved',
        notes:'Auto-posted from Materials module', createdAt: Date.now(), updatedAt: Date.now()
      }, true);
      await db.ref(`materials/${rec._id}`).update({ posted:true, updatedAt: Date.now() });
      audit('POST', 'materials', rec.ref, 'Cost ' + total + ' posted to expenses');
      toast('Material cost posted to job expenses', 'success');
      return;
    }
    if(coll === 'assignments'){
      if(rec.posted){ toast('This labour cost has already been posted', 'warn'); return; }
      const total = asgLabourCost(rec);
      if(total <= 0){ toast('Set hours and rate before posting', 'warn'); return; }
      const expRef = await nextRef('EXP');
      await saveRecord('expenses', {
        ref: expRef, jobId: rec.jobId, date: todayISO(), category:'Labour',
        description: `Labour — ${nameOf('staff', rec.staffId)} (${num(rec.hours)} hrs @ ${num(rec.rate)})`,
        amount: total, paymentMethod:'Cash', paidBy: state.user || '', receiptNo: rec.ref,
        status:'Approved', notes:'Auto-posted from Job Assignments', createdAt: Date.now(), updatedAt: Date.now()
      }, true);
      await db.ref(`assignments/${rec._id}`).update({ posted:true, updatedAt: Date.now() });
      audit('POST', 'assignments', rec.ref, 'Labour cost ' + total + ' posted to expenses');
      toast('Labour cost posted to job expenses', 'success');
      return;
    }
  }

  if(act === 'invoice'){
    const f = jobFinancials(id);
    if(!f) return;
    const ref = await nextRef('INV');
    const due = new Date(); due.setDate(due.getDate() + 14);
    openForm('invoices', {
      ref,
      customerId: rec.customerId,
      jobId: rec._id,
      date: todayISO(),
      dueDate: due.toISOString().slice(0,10),
      items: [{ description: rec.title + ' — ' + (rec.serviceCategory || 'works'), qty: 1, unitPrice: f.contract }],
      discount: 0, taxRate: 0,
      paymentTerms: 'Net 14 days',
      status: 'Issued',
      notes: 'Generated from job ' + (rec.ref || '')
    });
    return;
  }
}

/* ------------------------------------------------------------
   14. FORM MODAL (schema-driven)
   ------------------------------------------------------------ */
let itemState = [];
let currentFormCtx = null;

function fieldHTML(f, val, S){
  const id = 'fld_' + f.k;
  const full = f.full ? ' full' : '';
  let inner = '';

  switch(f.t){
    case 'textarea':
      inner = `<textarea id="${id}" data-key="${f.k}" placeholder="${esc(f.ph||'')}">${esc(val ?? '')}</textarea>`;
      break;
    case 'select':
      inner = `<select id="${id}" data-key="${f.k}">
        ${(f.o||[]).map(o => `<option value="${esc(o)}" ${String(val)===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`;
      break;
    case 'ref': {
      const opts = (state.data[f.coll] || []).slice().sort((a,b)=>String(a.ref||a.name||'').localeCompare(String(b.ref||b.name||'')));
      inner = `<select id="${id}" data-key="${f.k}">
        <option value="">— none —</option>
        ${opts.map(o => `<option value="${o._id}" ${val===o._id?'selected':''}>${esc(o.ref ? o.ref + ' · ' + (o.name||o.title||'') : (o.name||o.title||''))}</option>`).join('')}
      </select>`;
      break;
    }
    case 'number':
      inner = `<input type="number" step="0.01" id="${id}" data-key="${f.k}" value="${val ?? ''}" placeholder="0">`;
      break;
    case 'date':
      inner = `<input type="date" id="${id}" data-key="${f.k}" value="${val ?? ''}">`;
      break;
    case 'checkbox':
      return `<div class="field check${full}">
        <input type="checkbox" id="${id}" data-key="${f.k}" ${val?'checked':''}>
        <label for="${id}" style="text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--text-2)">${esc(f.l)}</label>
      </div>`;
    case 'readonly':
      return `<div class="field${full}"><label>${esc(f.l)}</label><input type="text" data-key="${f.k}" value="${esc(val ?? '')}" readonly></div>`;
    case 'items':
      return `<div class="field full"><label>${esc(f.l)}</label><div id="itemsEditor"></div></div>`;
    default:
      inner = `<input type="${f.t==='tel'?'tel':(f.t==='email'?'email':'text')}" id="${id}" data-key="${f.k}" value="${esc(val ?? '')}" placeholder="${esc(f.ph||'')}">`;
  }
  return `<div class="field${full}">
    <label for="${id}">${esc(f.l)}${f.req?'<span class="req">*</span>':''}</label>
    ${inner}
    ${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}
  </div>`;
}

function renderItemsEditor(){
  const ctx = currentFormCtx;
  if(!ctx || !ctx.itemsCfg) return;
  const cfg = ctx.itemsCfg;
  const cols = cfg.cols;
  const wrap = $('#itemsEditor');
  if(!wrap) return;

  wrap.innerHTML = `
    <div class="items-editor">
      <table>
        <thead><tr>
          ${cols.map(c => `<th style="${c.w==='auto'?'':'width:110px'};text-align:${c.n?'right':'left'}">${esc(c.l)}</th>`).join('')}
          <th style="width:44px"></th>
        </tr></thead>
        <tbody>
          ${itemState.map((it, i) => `<tr>
            ${cols.map(c => `<td>${c.n
              ? `<input type="number" step="0.01" data-i="${i}" data-k="${c.k}" value="${num(it[c.k])}" style="text-align:right">`
              : `<input type="text" data-i="${i}" data-k="${c.k}" value="${esc(it[c.k] ?? '')}">`}</td>`).join('')}
            <td><button type="button" class="btn btn-danger btn-xs" data-remove="${i}"><i class="fa-solid fa-xmark"></i></button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div style="padding:.5rem .7rem;background:#131e2c;border-top:1px solid var(--border)">
        <button type="button" class="btn btn-outline btn-xs" id="addItemRow"><i class="fa-solid fa-plus"></i> Add line</button>
      </div>
      <div class="items-total" id="itemsTotals"></div>
    </div>`;

  wrap.querySelectorAll('input[data-i]').forEach(inp => {
    inp.oninput = () => {
      const i = parseInt(inp.dataset.i,10), k = inp.dataset.k;
      const col = cols.find(c=>c.k===k);
      itemState[i][k] = col && col.n ? num(inp.value) : inp.value;
      updateItemTotals();
    };
  });
  wrap.querySelectorAll('button[data-remove]').forEach(b => b.onclick = () => {
    itemState.splice(parseInt(b.dataset.remove,10), 1);
    if(!itemState.length) itemState.push(blankItem());
    renderItemsEditor();
  });
  const add = $('#addItemRow');
  if(add) add.onclick = () => { itemState.push(blankItem()); renderItemsEditor(); };

  updateItemTotals();
}

function blankItem(){
  const ctx = currentFormCtx;
  const o = {};
  (ctx?.itemsCfg?.cols || []).forEach(c => o[c.k] = c.n ? 0 : '');
  if(o.qty !== undefined) o.qty = 1;
  return o;
}

function updateItemTotals(){
  const ctx = currentFormCtx;
  if(!ctx || !ctx.itemsCfg) return;
  const cfg = ctx.itemsCfg;
  const hasPrice = cfg.cols.some(c=>c.k==='unitPrice');
  const hasCost  = cfg.cols.some(c=>c.k==='cost');
  const subtotal = itemState.reduce((s,i)=>s + num(i.qty) * num(i.unitPrice || i.unitCost), 0);
  const cost     = itemState.reduce((s,i)=>s + num(i.qty) * num(i.cost), 0);
  const discount = num(($('#fld_discount')||{}).value);
  const taxRate  = num(($('#fld_taxRate')||{}).value);
  const net      = subtotal - discount;
  const tax      = net * taxRate / 100;
  const total    = net + tax;
  const profit   = net - cost;

  const el = $('#itemsTotals');
  if(!el) return;
  el.innerHTML = `
    <span>Subtotal: <b>${money0(subtotal)}</b></span>
    ${hasCost ? `<span>Estimated Cost: <b style="color:var(--warn)">${money0(cost)}</b></span>` : ''}
    ${hasCost ? `<span>Expected Profit: <b style="color:${profit>=0?'var(--success)':'var(--danger)'}">${money0(profit)}</b> (${subtotal?((profit/net||0)*100).toFixed(1):'0.0'}%)</span>` : ''}
    ${hasPrice ? `<span>Tax: <b>${money0(tax)}</b></span>` : ''}
    ${hasPrice ? `<span>Grand Total: <b style="color:var(--success);font-size:.92rem">${money0(total)}</b></span>` : ''}`;

  ctx.totals = { subtotal, cost, discount, taxRate, tax, total, profit };
}

function openForm(coll, record, preset){
  const S = SCHEMAS[coll];
  const isNew = !record || !record._id;
  const data = Object.assign({}, record || {}, preset || {});
  delete data._id;

  if(isNew){
    S.fields.forEach(f => { if(f.d !== undefined && data[f.k] === undefined) data[f.k] = f.d; });
    if(S.fields.some(f=>f.k==='date') && !data.date) data.date = todayISO();
  }

  // items
  if(S.items){
    itemState = Array.isArray(data.items) && data.items.length
      ? JSON.parse(JSON.stringify(data.items))
      : [ (()=>{ const o={}; S.items.cols.forEach(c=>o[c.k]= c.n?0:''); if(o.qty!==undefined)o.qty=1; return o; })() ];
  } else {
    itemState = [];
  }

  currentFormCtx = {
    coll, isNew, record,
    itemsCfg: S.items || null,
    totals: null
  };

  const body = `
    <div class="form-grid">
      ${S.fields.map(f => f.t === 'items' ? fieldHTML(f, null, S) : fieldHTML(f, data[f.k], S)).join('')}
    </div>`;

  const backdrop = $('#modalBackdrop');
  backdrop.innerHTML = `
    <div class="modal ${S.items?'wide':''}">
      <div class="modal-head">
        <div style="flex:1">
          <h3>${isNew ? 'New ' + esc(S.singular) : 'Edit ' + esc(S.singular)}
            <span class="sub">${esc(data.ref || 'Reference will be generated automatically')}</span>
          </h3>
        </div>
        <button class="icon-btn" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        <button class="btn btn-outline" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalSave"><i class="fa-solid fa-floppy-disk"></i> Save ${esc(S.singular)}</button>
      </div>
    </div>`;
  backdrop.classList.add('show');

  if(S.items) renderItemsEditor();

  const close = () => { backdrop.classList.remove('show'); backdrop.innerHTML = ''; currentFormCtx = null; itemState = []; };
  $('#modalClose').onclick = close;
  $('#modalCancel').onclick = close;
  backdrop.onclick = (e) => { if(e.target === backdrop) close(); };

  // live recalc when discount/tax changes
  ['discount','taxRate'].forEach(k => {
    const el = $('#fld_' + k);
    if(el) el.oninput = updateItemTotals;
  });

  $('#modalSave').onclick = async () => {
    // gather
    const rec = {};
    let valid = true;
    $$('.modal-body [data-key]').forEach(el => {
      const k = el.dataset.key;
      const f = S.fields.find(x => x.k === k);
      if(!f) return;
      if(f.t === 'checkbox') rec[k] = el.checked;
      else if(f.t === 'number') rec[k] = el.value === '' ? 0 : Number(el.value);
      else rec[k] = el.value;
    });

    // validation
    for(const f of S.fields){
      if(f.req && f.t !== 'items' && f.t !== 'readonly'){
        const v = rec[f.k];
        if(v === undefined || v === null || v === '' || (f.t==='number' && isNaN(v))){
          valid = false;
          toast(`"${f.l}" is required`, 'error');
          const el = $(`#fld_${f.k}`) || $(`.modal-body [data-key="${f.k}"]`);
          if(el){ el.focus(); el.style.borderColor = 'var(--danger)'; setTimeout(()=>el.style.borderColor='', 2200); }
          break;
        }
      }
    }
    if(!valid) return;

    // items + totals
    if(S.items){
      rec.items = itemState.filter(i => String(i.description || '').trim() !== '' || num(i.qty) > 0);
      const subtotal = rec.items.reduce((s,i)=>s + num(i.qty)*num(i.unitPrice ?? i.unitCost), 0);
      const cost = rec.items.reduce((s,i)=>s + num(i.qty)*num(i.cost), 0);
      rec.subtotal = subtotal;
      if(S.items.cols.some(c=>c.k==='cost') || S.items.cols.some(c=>c.k==='unitCost')){
        rec.estimatedCost = cost;
        rec.expectedProfit = (subtotal - num(rec.discount)) - cost;
      }
      if(S.items.cols.some(c=>c.k==='unitPrice')){
        const net = subtotal - num(rec.discount);
        rec.taxAmount = net * num(rec.taxRate) / 100;
        rec.total = net + rec.taxAmount;
      } else {
        // procurement style
        rec.totalCost = cost;
      }
      if(coll === 'procurement' && rec.totalCost === undefined) rec.totalCost = cost;
    }

    // warranty computed status
    if(coll === 'warranties' && rec.endDate){
      rec.status = new Date(rec.endDate) < new Date() ? 'Expired' : (rec.status === 'Expired' ? 'Active' : rec.status);
    }

    // reference generation
    if(isNew && !rec.ref) rec.ref = await nextRef(S.prefix);

    try {
      const btn = $('#modalSave');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';
      const id = await saveRecord(coll, Object.assign({}, rec, isNew ? {} : {_id: record._id}), isNew);
      audit(isNew ? 'CREATE' : 'UPDATE', coll, rec.ref, (isNew ? 'Created ' : 'Updated ') + S.singular);
      toast(`${S.singular} ${isNew ? 'created' : 'updated'} — ${rec.ref || ''}`, 'success');
      close();
      if(coll === 'jobs' && isNew) setTimeout(()=>openJobPanel(id), 500);
    } catch(err){
      console.error(err);
      toast('Save failed: ' + err.message, 'error');
      const btn = $('#modalSave'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save';
    }
  };
}

function confirmDialog(title, msg, onYes){
  const bd = $('#modalBackdrop');
  bd.innerHTML = `
    <div class="modal narrow">
      <div class="modal-head"><h3>${esc(title)}</h3></div>
      <div class="modal-body"><p style="color:var(--text-2);font-size:.86rem;line-height:1.65">${msg}</p></div>
      <div class="modal-foot">
        <button class="btn btn-outline" id="cNo">Cancel</button>
        <button class="btn btn-danger" id="cYes"><i class="fa-solid fa-trash"></i> Confirm</button>
      </div>
    </div>`;
  bd.classList.add('show');
  const close = () => { bd.classList.remove('show'); bd.innerHTML = ''; };
  $('#cNo').onclick = close;
  bd.onclick = e => { if(e.target === bd) close(); };
  $('#cYes').onclick = async () => { close(); await onYes(); };
}

/* ------------------------------------------------------------
   15. DASHBOARD
   ------------------------------------------------------------ */
function renderDashboard(){
  const jobs = state.data.jobs;
  const active = jobs.filter(j => ['Approved','Scheduled','In Progress','Awaiting Materials','Awaiting Customer','On Hold','Partially Completed'].includes(j.status));
  const completed = jobs.filter(j => ['Completed','Closed'].includes(j.status));
  const cancelled = jobs.filter(j => j.status === 'Cancelled');

  let contracted = 0, paid = 0, cost = 0, invoiced = 0, profit = 0;
  jobs.filter(j=>j.status!=='Cancelled').forEach(j => {
    const f = jobFinancials(j._id);
    if(!f) return;
    contracted += f.contract; paid += f.paid; cost += f.cost; invoiced += f.invoiced; profit += f.profit;
  });
  const outstanding = Math.max(contracted - paid, 0);
  const margin = contracted ? (profit/contracted*100) : 0;

  const newLeads = state.data.leads.filter(l => l.status === 'New');
  const pendingQuotes = state.data.quotations.filter(q => ['Draft','Sent'].includes(q.status));
  const overdueInvoices = state.data.invoices.filter(i => invoiceComputedStatus(i) === 'Overdue');
  const overdueJobs = active.filter(j => j.dueDate && new Date(j.dueDate) < new Date(new Date().toDateString()));

  // dept breakdown
  const deptMap = {};
  jobs.filter(j=>j.status!=='Cancelled').forEach(j => {
    const d = j.department || 'General';
    const f = jobFinancials(j._id);
    if(!deptMap[d]) deptMap[d] = {rev:0, cost:0, count:0};
    deptMap[d].rev += f.contract; deptMap[d].cost += f.cost; deptMap[d].count++;
  });
  const depts = Object.entries(deptMap).map(([d,v]) => ({dept:d, rev:v.rev, cost:v.cost, profit:v.rev-v.cost, count:v.count}))
    .sort((a,b)=>b.rev-a.rev);

  // status breakdown
  const statusMap = {};
  jobs.forEach(j => { statusMap[j.status] = (statusMap[j.status]||0)+1; });

  // monthly trend (last 6 months)
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const key = d.toISOString().slice(0,7);
    months.push({key, label:d.toLocaleDateString('en-GB',{month:'short', year:'2-digit'}), rev:0, cost:0, profit:0});
  }
  jobs.filter(j=>j.status!=='Cancelled').forEach(j => {
    const f = jobFinancials(j._id);
    const d = j.startDate || j.createdAt;
    if(!d) return;
    const key = new Date(d).toISOString().slice(0,7);
    const m = months.find(x=>x.key===key);
    if(m){ m.rev += f.contract; m.cost += f.cost; m.profit += f.profit; }
  });

  const recentJobs = jobs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,8);
  const upcoming = active.filter(j=>j.dueDate).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)).slice(0,6);

  const maxDeptRev = Math.max(1, ...depts.map(d=>d.rev));
  const maxMonthRev = Math.max(1, ...months.map(m=>m.rev));

  return `
  <div class="view-head animate-on-view">
    <div>
      <h2>Business Dashboard</h2>
      <p>Live financial and operational position · ${fmtDate(todayISO())}</p>
    </div>
    <div class="actions">
      <button class="btn btn-outline" onclick="go('jobs')"><i class="fa-solid fa-diagram-project"></i> All Jobs</button>
      <button class="btn btn-primary" onclick="go('jobs');setTimeout(()=>openForm('jobs',null),200)"><i class="fa-solid fa-plus"></i> New Job</button>
    </div>
  </div>

  <div class="sec-title">Financial Position</div>
  <div class="grid g5 animate-on-view">
    <div class="kpi"><i class="fa-solid fa-file-contract ico"></i><div class="label">Contracted Value</div><div class="value">${money0(contracted)}</div><div class="sub">${jobs.length} jobs on record</div></div>
    <div class="kpi accent"><i class="fa-solid fa-file-invoice ico"></i><div class="label">Invoiced</div><div class="value">${money0(invoiced)}</div><div class="sub">${state.data.invoices.length} invoices</div></div>
    <div class="kpi good"><i class="fa-solid fa-money-bill-transfer ico"></i><div class="label">Collected</div><div class="value">${money0(paid)}</div><div class="sub">${contracted?pct(paid,contracted).toFixed(1):'0.0'}% of contract</div></div>
    <div class="kpi ${outstanding>0?'warn':''}"><i class="fa-solid fa-hourglass-half ico"></i><div class="label">Outstanding</div><div class="value">${money0(outstanding)}</div><div class="sub">Receivable from customers</div></div>
    <div class="kpi"><i class="fa-solid fa-receipt ico"></i><div class="label">Total Job Costs</div><div class="value">${money0(cost)}</div><div class="sub">${state.data.expenses.length} expense vouchers</div></div>
    <div class="kpi ${profit>=0?'good':'bad'}"><i class="fa-solid fa-chart-line ico"></i><div class="label">Gross Profit</div><div class="value">${money0(profit)}</div><div class="sub">Margin ${margin.toFixed(1)}%</div></div>
    <div class="kpi purple"><i class="fa-solid fa-diagram-project ico"></i><div class="label">Active Jobs</div><div class="value">${active.length}</div><div class="sub">${completed.length} completed · ${cancelled.length} cancelled</div></div>
    <div class="kpi"><i class="fa-solid fa-inbox ico"></i><div class="label">New Requests</div><div class="value">${newLeads.length}</div><div class="sub">${pendingQuotes.length} quotations pending</div></div>
  </div>

  <div class="sec-title">Attention Required</div>
  <div class="grid g3 animate-on-view">
    <div class="card">
      <h3><i class="fa-solid fa-triangle-exclamation"></i> Overdue Invoices</h3>
      ${overdueInvoices.length ? overdueInvoices.slice(0,5).map(i=>`
        <div class="flex between center" style="padding:.45rem 0;border-bottom:1px solid #1c2739">
          <div><span class="mono">${esc(i.ref)}</span><div class="small muted">${esc(nameOf('customers', i.customerId))}</div></div>
          <div class="right"><b style="color:var(--danger)">${money0(invoiceBalance(i))}</b><div class="small muted">due ${esc(fmtDate(i.dueDate))}</div></div>
        </div>`).join('') : '<div class="muted small">No overdue invoices. 🎉</div>'}

/* ------------------------------------------------------------
   16. JOB WORKSPACE PANEL
   ------------------------------------------------------------ */
let panelTab = 'overview';

function openJobPanel(jobId){
  const job = byId('jobs', jobId);
  if(!job){ toast('Job not found', 'error'); return; }
  panelTab = 'overview';
  renderPanel(jobId);
  $('#panel').classList.add('show');
  $('#panelBackdrop').classList.add('show');
}

function closePanel(){
  $('#panel').classList.remove('show');
  $('#panelBackdrop').classList.remove('show');
}

function renderPanel(jobId){
  const job = byId('jobs', jobId);
  if(!job) return;
  const f = jobFinancials(jobId);

  const tabs = [
    ['overview','Overview','fa-gauge'], ['financials','Financials','fa-chart-pie'],
    ['tasks','Tasks','fa-list-check'], ['milestones','Milestones','fa-flag-checkered'],
    ['materials','Materials','fa-boxes-stacked'], ['team','Team','fa-user-check'],
    ['expenses','Expenses','fa-receipt'], ['procurement','Procurement','fa-cart-flatbed'],
    ['invoices','Invoices','fa-file-invoice'], ['payments','Payments','fa-money-bill-transfer'],
    ['changes','Change Orders','fa-code-compare'], ['assessments','Site Assessments','fa-clipboard-check'],
    ['comms','Communication','fa-comments'], ['docs','Documents','fa-folder-open'],
    ['warranty','Warranty','fa-shield-halved'], ['timeline','Timeline','fa-timeline']
  ];

  $('#panel').innerHTML = `
    <div class="panel-head">
      <div class="ttl">
        <h2>${esc(job.title)}</h2>
        <div class="meta">
          <span class="mono">${esc(job.ref)}</span>
          <span>${badge(job.status)}</span>
          <span><i class="fa-solid fa-user"></i> ${esc(nameOf('customers', job.customerId))}</span>
          <span><i class="fa-solid fa-building"></i> ${esc(job.department||'—')}</span>
          <span><i class="fa-solid fa-calendar"></i> ${esc(fmtDate(job.startDate))} → ${esc(fmtDate(job.dueDate))}</span>
        </div>
      </div>
      <button class="btn btn-outline btn-xs" id="panelEdit"><i class="fa-solid fa-pen"></i> Edit</button>
      <button class="icon-btn" id="panelClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="tabs">
      ${tabs.map(([id,label,icon]) => `<div class="tab ${panelTab===id?'active':''}" data-tab="${id}"><i class="fa-solid ${icon}"></i> ${label}</div>`).join('')}
    </div>
    <div class="panel-body" id="panelBody">${panelTabContent(jobId, panelTab, f)}</div>`;

  $('#panelClose').onclick = closePanel;
  $('#panelEdit').onclick = () => openForm('jobs', job);
  $$('#panel .tab').forEach(t => t.onclick = () => { panelTab = t.dataset.tab; renderPanel(jobId); });
  bindPanelActions(jobId);
}

function relatedTable(coll, rows, cols, opts = {}){
  const S = SCHEMAS[coll];
  if(!rows.length) return `<div class="empty" style="padding:2rem 1rem"><i class="fa-solid ${S.icon}"></i><b>No ${esc(S.label.toLowerCase())}</b>${opts.empty || ''}</div>`;
  return `<div class="table-wrap" style="max-height:none">
    <table><thead><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}${opts.actions?'<th style="width:120px"></th>':''}</tr></thead>
    <tbody>${rows.map(r=>`<tr>
      ${cols.map(c=>`<td>${c.f ? c.f(r) : esc(r[c.k] ?? '—')}</td>`).join('')}
      ${opts.actions?`<td class="nowrap">
        <button class="btn btn-outline btn-xs" data-edit-coll="${coll}" data-edit-id="${r._id}"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-danger btn-xs" data-del-coll="${coll}" data-del-id="${r._id}"><i class="fa-solid fa-trash"></i></button>
      </td>`:''}
    </tr>`).join('')}</tbody></table></div>`;
}

function panelTabContent(jobId, tab, f){

    const budgetPct = f.budget ? pct(f.cost, f.budget) : 0;

      <div class="grid g4">

    const rows = data.procurement.filter(t=>t.jobId===jobId);

      ${relatedTable('procurement', rows, [
        {l:'Ref', f:r=>`<span class="mono">${esc(r.ref||'')}</span>`},
        {l:'Title', k:'title'},
        {l:'Supplier', f:r=>esc(nameOf('suppliers', r.supplierId))},

    return `${panelAddBar('payments', jobId, 'Record Payment')}

        {l:'Receipt No.', f:r=>`<span class="mono">${esc(r.ref||'')}</span>`},
        {l:'Date', f:r=>esc(fmtDate(r.date))},
        {l:'Amount', f:r=>money0(r.amount)},

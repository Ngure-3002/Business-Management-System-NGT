        {l:'Reference', k:'reference'},
        {l:'Received By', k:'receivedBy'}
      ], {actions:true})}
      <div class="card mt"><h3><i class="fa-solid fa-wallet"></i> Payment Summary</h3>
        <div class="flex between"><span class="muted">Total collected</span><b style="color:var(--success)">${money0(f.paid)}</b></div>
        <div class="flex between mt"><span class="muted">Outstanding balance</span><b style="color:var(--warn)">${money0(f.outstanding)}</b></div>
      </div>`;
  }

  if(tab === 'changes'){
    const rows = f.changeOrders;
    return `${panelAddBar('changeOrders', jobId, 'New Change Order')}
      ${relatedTable('changeOrders', rows, [
        {l:'Ref', f:r=>`<span class="mono">${esc(r.ref||'')}</span>`},
        {l:'Title', k:'title'},
        {l:'Date', f:r=>esc(fmtDate(r.date))},
        {l:'Additional Cost', f:r=>money0(r.additionalCost)},
        {l:'Extra Days', f:r=>num(r.additionalDays)},
        {l:'Status', f:r=>badge(r.status)}
      ], {actions:true})}
      <div class="card mt"><h3><i class="fa-solid fa-plus-minus"></i> Impact on Contract</h3>
        <div class="flex between"><span class="muted">Original contract</span><b>${money0(job.contractAmount)}</b></div>
        <div class="flex between mt"><span class="muted">Approved variations</span><b style="color:var(--success)">+${money0(f.extra)}</b></div>
        <div class="flex between mt" style="border-top:1px solid var(--border);padding-top:.55rem"><span><b>Revised contract value</b></span><b style="font-size:1.05rem">${money0(f.contract)}</b></div>
      </div>`;
  }

  if(tab === 'assessments'){
    const rows = data.assessments.filter(t=>t.jobId===jobId || t.customerId===job.customerId);
    return `${panelAddBar('assessments', jobId, 'New Assessment')}

        {l:'Ref', f:r=>`<span class="mono">${esc(r.ref||'')}</span>`},
        {l:'Date', f:r=>esc(fmtDate(r.date))},

        {l:'Status', f:r=>badge(r.status)}

  }

  if(tab === 'comms'){
    const rows = data.communications.filter(t=>t.jobId===jobId).sort((a,b)=>new Date(b.date)-new Date(a.date));
    return `${panelAddBar('communications', jobId, 'Log Communication')}
      ${relatedTable('communications', rows, [
        {l:'Ref', f:r=>`<span class="mono">${esc(r.ref||'')}</span>`},
        {l:'Date', f:r=>esc(fmtDate(r.date))},
        {l:'Type', f:r=>badge(r.type)},
        {l:'Contact', k:'contactPerson'},
        {l:'Summary', k:'summary'},
        {l:'Follow-up', f:r=>esc(fmtDate(r.followUpDate))}
      ], {actions:true})}`;
  }

  if(tab === 'docs'){
    const rows = data.documents.filter(t=>t.jobId===jobId);
    return `${panelAddBar('documents', jobId, 'Add Document')}
      ${relatedTable('documents', rows, [
        {l:'Ref', f:r=>`<span class="mono">${esc(r.ref||'')}</span>`},

  if(tab === 'warranty'){
    const rows = data.warranties.filter(t=>t.jobId===jobId);

  if(tab === 'timeline'){
    const events = [];
    const push = (d, t, s) => { if(d) events.push({d:new Date(d), t, s}); };
    push(job.createdAt, 'Job created', 'Record opened in the system');
    push(job.startDate, 'Work commenced', 'Planned start date');
    (data.leads.filter(l=>l._id===job.leadId)).forEach(l => push(l.dateReceived, 'Job request received', l.ref + ' — ' + (l.title||'')));
    data.assessments.filter(a=>a.jobId===jobId).forEach(a => push(a.date, 'Site assessment', a.ref + ' — ' + (a.result||'')));
    data.quotations.filter(q=>q.jobId===jobId).forEach(q => push(q.date, 'Quotation issued', q.ref + ' — ' + money0(q.total)));
    data.procurement.filter(p=>p.jobId===jobId).forEach(p => push(p.date, 'Procurement raised', p.ref + ' — ' + (p.title||'')));
    data.expenses.filter(e=>e.jobId===jobId).forEach(e => push(e.date, 'Expense recorded', (e.category||'') + ' — ' + money0(e.amount)));
    data.invoices.filter(i=>i.jobId===jobId).forEach(i => push(i.date, 'Invoice issued', i.ref + ' — ' + money0(i.total)));
    data.payments.filter(p=>p.jobId===jobId).forEach(p => push(p.date, 'Payment received', (p.method||'') + ' — ' + money0(p.amount)));
    data.changeOrders.filter(c=>c.jobId===jobId && c.status==='Approved').forEach(c => push(c.date, 'Change order approved', c.ref + ' — +' + money0(c.additionalCost)));
    data.tasks.filter(t=>t.jobId===jobId && t.status==='Done').forEach(t => push(t.dueDate, 'Task completed', t.title));

    data.warranties.filter(w=>w.jobId===jobId).forEach(w => push(w.startDate, 'Warranty started', w.itemCovered));

    events.sort((a,b)=>a.d-b.d);
    return `<div class="timeline">${events.map(e => `
      <div class="tl-item">
        <div class="t">${esc(e.t)}</div>
        <div class="d">${esc(fmtDate(e.d.toISOString().slice(0,10)))} — ${esc(e.s)}</div>
      </div>`).join('') || '<div class="muted small">No timeline events yet.</div>'}</div>`;
  }

  return '<div class="empty"><b>Select a tab</b></div>';
}

function panelAddBar(coll, jobId, label){
  return `<div class="flex between center mb">
    <div class="small muted">${esc(SCHEMAS[coll].label)} linked to this job</div>
    <button class="btn btn-primary btn-xs" onclick="panelAdd('${coll}','${jobId}')"><i class="fa-solid fa-plus"></i> ${esc(label)}</button>
  </div>`;
}

function panelAdd(coll, jobId){
  const job = byId('jobs', jobId);
  const preset = { jobId };
  if(job) preset.customerId = job.customerId;
  if(coll === 'expenses'){ preset.date = todayISO(); preset.status = 'Approved'; }
  if(coll === 'assignments'){ preset.startDate = todayISO(); }
  if(coll === 'invoices'){ preset.date = todayISO(); }
  if(coll === 'payments'){ preset.date = todayISO(); }
  if(coll === 'warranties'){ preset.startDate = todayISO(); }
  openForm(coll, null, preset);
}

function panelQuickInvoice(jobId){
  const f = jobFinancials(jobId);
  if(!f) return;
  openForm('invoices', null, {
    customerId: f.job.customerId,
    jobId: jobId,
    date: todayISO(),
    items: [{ description: f.job.title + ' — ' + (f.job.serviceCategory||'works'), qty:1, unitPrice: f.contract }],
    discount: 0, taxRate: 0, status:'Issued',
    paymentTerms:'Net 14 days'
  });
}

function bindPanelActions(jobId){
  const body = $('#panelBody');
  if(!body) return;
  $$('#panelBody [data-edit-coll]').forEach(b => b.onclick = () => {
    openForm(b.dataset.editColl, byId(b.dataset.editColl, b.dataset.editId));
  });
  $$('#panelBody [data-del-coll]').forEach(b => b.onclick = () => {
    const coll = b.dataset.delColl, id = b.dataset.delId;
    const rec = byId(coll, id);
    confirmDialog('Delete record?', `This will permanently remove <b>${esc(rec?.ref || rec?.title || 'the record')}</b>.`, async () => {
      await deleteRecord(coll, id);
      audit('DELETE', coll, rec?.ref, 'Deleted from job workspace');
      toast('Deleted', 'success');
      renderPanel(jobId);
    });
  });
}

function printQuotation(q){

  const itemsHtml = items.map((i, n) => `<tr>

    <td class="right">${money(i.unitPrice)}</td>

  const sub = num(q.subtotal) || items.reduce((s,i)=>s+num(i.qty)*num(i.unitPrice),0);

  const total = num(q.total) || (sub - disc + tax);

}

  const sub = num(inv.subtotal) || items.reduce((s,i)=>s+num(i.qty)*num(i.unitPrice),0);
  const disc = num(inv.discount);
  const tax = num(inv.taxAmount);
  const total = num(inv.total) || (sub - disc + tax);
  const paid = invoicePaid(inv._id);
  const bal = Math.max(total - paid, 0);
  const totalsHtml = `

let reportRange = { from:'', to:'', dept:'' };

function renderReports(){
  const jobs = state.data.jobs.filter(j => {
    if(reportRange.dept && j.department !== reportRange.dept) return false;
    if(reportRange.from && j.startDate && j.startDate < reportRange.from) return false;
    if(reportRange.to && j.startDate && j.startDate > reportRange.to) return false;
    return j.status !== 'Cancelled';
  });

  let rev = 0, cost = 0, paid = 0, invoiced = 0;
  const byDept = {}, byCustomer = {}, byMonth = {}, byService = {};
  const jobRows = [];

  jobs.forEach(j => {
    const f = jobFinancials(j._id);
    if(!f) return;
    rev += f.contract; cost += f.cost; paid += f.paid; invoiced += f.invoiced;

    const d = j.department || 'General';
    byDept[d] = byDept[d] || {rev:0,cost:0,n:0};
    byDept[d].rev += f.contract; byDept[d].cost += f.cost; byDept[d].n++;

    const c = nameOf('customers', j.customerId) || 'Unknown';
    byCustomer[c] = byCustomer[c] || {rev:0,cost:0,n:0};
    byCustomer[c].rev += f.contract; byCustomer[c].cost += f.cost; byCustomer[c].n++;

    const s = j.serviceCategory || 'Uncategorised';
    byService[s] = byService[s] || {rev:0,cost:0,n:0};
    byService[s].rev += f.contract; byService[s].cost += f.cost; byService[s].n++;

    const mk = (j.startDate || new Date(j.createdAt||Date.now()).toISOString().slice(0,10)).slice(0,7);
    byMonth[mk] = byMonth[mk] || {rev:0,cost:0,paid:0};
    byMonth[mk].rev += f.contract; byMonth[mk].cost += f.cost; byMonth[mk].paid += f.paid;

    jobRows.push({ ref:j.ref, title:j.title, customer:c, dept:d, status:j.status,
      contract:f.contract, cost:f.cost, profit:f.profit, margin:f.margin, paid:f.paid, outstanding:f.outstanding });
  });

  jobRows.sort((a,b)=>b.profit-a.profit);

  const deptRows = Object.entries(byDept).map(([d,v])=>({dept:d, ...v, profit:v.rev-v.cost, margin:v.rev?(v.rev-v.cost)/v.rev*100:0})).sort((a,b)=>b.rev-a.rev);
  const custRows = Object.entries(byCustomer).map(([c,v])=>({customer:c, ...v, profit:v.rev-v.cost})).sort((a,b)=>b.rev-a.rev).slice(0,15);
  const servRows = Object.entries(byService).map(([s,v])=>({service:s, ...v, profit:v.rev-v.cost, margin:v.rev?(v.rev-v.cost)/v.rev*100:0})).sort((a,b)=>b.profit-a.profit);
  const monthRows = Object.entries(byMonth).map(([m,v])=>({month:m, ...v, profit:v.rev-v.cost})).sort((a,b)=>a.month.localeCompare(b.month)).slice(-12);

  // receivables aging
  const today = new Date();
  const aging = {current:0, d30:0, d60:0, d90:0, d90plus:0};
  state.data.invoices.forEach(i => {
    const bal = invoiceBalance(i);
    if(bal <= 0.01) return;
    const due = i.dueDate ? new Date(i.dueDate) : today;
    const days = Math.floor((today - due)/86400000);
    if(days <= 0) aging.current += bal;
    else if(days <= 30) aging.d30 += bal;
    else if(days <= 60) aging.d60 += bal;
    else if(days <= 90) aging.d90 += bal;
    else aging.d90plus += bal;
  });

  const maxDept = Math.max(1, ...deptRows.map(d=>d.rev));
  const maxMonth = Math.max(1, ...monthRows.map(m=>m.rev));
  const grossProfit = rev - cost;

  return `
  <div class="view-head animate-on-view">
    <div><h2>Reports &amp; Analytics</h2><p>Financial and operational performance across all jobs</p></div>
    <div class="actions">
      <button class="btn btn-outline" id="repExport"><i class="fa-solid fa-file-csv"></i> Export Job Profitability</button>
      <button class="btn btn-outline" id="repExportAll"><i class="fa-solid fa-database"></i> Export All Data (JSON)</button>
    </div>
  </div>

  <div class="filters animate-on-view">
    <label class="small muted">From</label><input type="date" id="repFrom" value="${esc(reportRange.from)}">
    <label class="small muted">To</label><input type="date" id="repTo" value="${esc(reportRange.to)}">
    <select id="repDept">
      <option value="">All departments</option>
      ${DEPARTMENTS.map(d=>`<option value="${esc(d)}" ${reportRange.dept===d?'selected':''}>${esc(d)}</option>`).join('')}
    </select>
    <button class="btn btn-primary btn-xs" id="repApply"><i class="fa-solid fa-filter"></i> Apply</button>

/* ------------------------------------------------------------
   21. GLOBAL SEARCH
   ------------------------------------------------------------ */
function bindGlobalSearch(){
  const inp = $('#globalSearch');
  const res = $('#searchResults');
  inp.dataset.bound = '1';

  let t;
  inp.oninput = () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const q = inp.value.trim().toLowerCase();
      if(q.length < 2){ res.classList.remove('show'); res.innerHTML = ''; return; }
      const out = [];
      const push = (coll, rec, label, sub) => out.push({coll, id: rec._id, label, sub});

      state.data.jobs.forEach(r => {
        if((r.ref||'').toLowerCase().includes(q) || (r.title||'').toLowerCase().includes(q))
          push('jobs', r, r.ref + ' · ' + r.title, nameOf('customers', r.customerId) + ' · ' + (r.status||''));
      });
      state.data.customers.forEach(r => {
        if((r.name||'').toLowerCase().includes(q) || (r.phone||'').includes(q) || (r.ref||'').toLowerCase().includes(q))
          push('customers', r, r.name, (r.ref||'') + ' · ' + (r.phone||''));
      });
      state.data.invoices.forEach(r => {
        if((r.ref||'').toLowerCase().includes(q))
          push('invoices', r, r.ref, nameOf('customers', r.customerId) + ' · ' + money0(r.total));
      });
      state.data.quotations.forEach(r => {
        if((r.ref||'').toLowerCase().includes(q) || (r.title||'').toLowerCase().includes(q))
          push('quotations', r, r.ref, nameOf('customers', r.customerId) + ' · ' + money0(r.total));
      });
      state.data.leads.forEach(r => {
        if((r.ref||'').toLowerCase().includes(q) || (r.title||'').toLowerCase().includes(q))
          push('leads', r, r.ref + ' · ' + r.title, (r.status||''));
      });
      state.data.expenses.forEach(r => {
        if((r.ref||'').toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q))
          push('expenses', r, r.ref, (r.description||'') + ' · ' + money0(r.amount));
      });

      res.innerHTML = out.length
        ? out.slice(0,25).map(o => `<div class="sr-item" data-coll="${o.coll}" data-id="${o.id}"><b>${esc(o.label)}</b><span>${esc(o.sub)}</span></div>`).join('')
        : '<div class="sr-item muted">No matches found</div>';
      res.classList.add('show');

      $$('.sr-item[data-coll]').forEach(el => el.onclick = () => {
        const coll = el.dataset.coll, id = el.dataset.id;
        res.classList.remove('show'); inp.value = '';
        if(coll === 'jobs'){ go('jobs'); setTimeout(()=>openJobPanel(id), 450); }
        else { go(coll); }
      });
    }, 200);
  };

  document.addEventListener('click', e => {
    if(!e.target.closest('.search-wrap')) res.classList.remove('show');
  });
}

/* ------------------------------------------------------------
   22. EVENT BINDINGS AFTER RENDER
   ------------------------------------------------------------ */
function afterRenderFull(){
  const route = state.route;

  if(SCHEMAS[route]) bindListEvents(route);

  if(route === 'settings'){
    $('#saveSettings').onclick = async () => {
      const keys = ['companyName','motto','phone','email','address','kraPin','website','bankName','bankAccount','mpesa','defaultTax'];
      const obj = {};
      keys.forEach(k => { const el = $('#st_' + k); if(el) obj[k] = el.value; });
      obj.defaultTax = num(obj.defaultTax);
      await db.ref('settings').update(obj);
      audit('UPDATE','settings','Company profile','Settings updated');
      toast('Settings saved', 'success');
    };
    const op = $('#st_operator');
    op.onchange = () => {
      state.user = op.value.trim();
      localStorage.setItem('ngt_operator', state.user);
      $('#operator').value = state.user;
      toast('Operator set to ' + (state.user || 'unnamed'), 'success');
    };
    $('#expAllJson').onclick = () => {
      const dump = { exportedAt: new Date().toISOString(), company: state.settings, data: {} };
      COLLECTIONS.forEach(c => dump.data[c] = state.data[c]);
      downloadFile(`NGT_backup_${todayISO()}.json`, JSON.stringify(dump, null, 2), 'application/json');
      toast('Full backup exported', 'success');
    };
    $('#expAllCsv').onclick = () => {
      const rows = state.data.jobs.map(j => {
        const f = jobFinancials(j._id);
        return {
          'Job ID': j.ref, 'Title': j.title, 'Customer': nameOf('customers', j.customerId),
          'Department': j.department, 'Service': j.serviceCategory, 'Status': j.status,
          'Start Date': j.startDate, 'Due Date': j.dueDate,
          'Contract Value': f.contract, 'Total Cost': f.cost, 'Gross Profit': f.profit,
          'Margin %': f.margin.toFixed(2), 'Invoiced': f.invoiced, 'Collected': f.paid, 'Outstanding': f.outstanding
        };
      });
      exportCSV(`NGT_Job_Register_${todayISO()}.csv`, rows);
    };
    const connEl = $('#stConn');
    if(connEl && db) db.ref('.info/connected').once('value', s => { connEl.textContent = s.val() ? 'Connected (live)' : 'Disconnected'; connEl.style.color = s.val() ? 'var(--success)' : 'var(--danger)'; });
  }

  if(route === 'reports'){
    $('#repApply').onclick = () => {
      reportRange.from = $('#repFrom').value;
      reportRange.to = $('#repTo').value;
      reportRange.dept = $('#repDept').value;
      render();
    };
    $('#repReset').onclick = () => { reportRange = {from:'',to:'',dept:''}; render(); };
    $('#repExport').onclick = () => {
      const rows = state.data.jobs.filter(j=>j.status!=='Cancelled').map(j => {
        const f = jobFinancials(j._id);
        return {
          'Job ID': j.ref, 'Title': j.title, 'Customer': nameOf('customers', j.customerId),
          'Department': j.department, 'Status': j.status,
          'Contract': f.contract, 'Cost': f.cost, 'Profit': f.profit,
          'Margin %': f.margin.toFixed(2), 'Invoiced': f.invoiced, 'Collected': f.paid, 'Outstanding': f.outstanding
        };
      });
      exportCSV(`NGT_Profitability_${todayISO()}.csv`, rows);
    };
    $('#repExportAll').onclick = () => {
      const dump = { exportedAt: new Date().toISOString(), company: state.settings, data: {} };
      COLLECTIONS.forEach(c => dump.data[c] = state.data[c]);
      downloadFile(`NGT_full_backup_${todayISO()}.json`, JSON.stringify(dump, null, 2), 'application/json');
      toast('Full data export complete', 'success');
    };
  }

  if(route === 'audit'){
    const b = $('#expAudit');
    if(b) b.onclick = () => exportCSV(`NGT_Audit_${todayISO()}.csv`, state.audit.map(a => ({
      Timestamp: fmtDT(a.ts), Operator: a.user, Action: a.action, Module: a.entity, Record: a.ref, Details: a.details
    })));
  }
}

/* Override afterRender to also run full bindings */
const _afterRender = afterRender;
afterRender = function(){
  _afterRender();
  try { afterRenderFull(); } catch(e){ console.error('afterRenderFull', e); }
};

/* ------------------------------------------------------------
   23. GLOBAL EVENTS / CLOCK / PANEL CLOSE
   ------------------------------------------------------------ */
function tickClock(){
  const el = $('#clock');
  if(el) el.textContent = new Date().toLocaleString('en-GB', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}
setInterval(tickClock, 30000);

function initShell(){
  tickClock();
  buildNav();

  $('#menuBtn').onclick = () => $('#sidebar').classList.toggle('open');
  $('#panelBackdrop').onclick = closePanel;

  const op = $('#operator');
  op.value = state.user;
  op.onchange = () => {
    state.user = op.value.trim();
    localStorage.setItem('ngt_operator', state.user);
  };

  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#','');
    if(h && h !== state.route){
      const exists = NAV.some(s => s.items.some(i => i.id === h));
      if(exists){ state.route = h; render(); }
    }
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if($('#modalBackdrop').classList.contains('show')){ $('#modalBackdrop').classList.remove('show'); $('#modalBackdrop').innerHTML=''; currentFormCtx=null; itemState=[]; }
      else if($('#panel').classList.contains('show')) closePanel();
      else $('#sidebar').classList.remove('open');
    }
  });
}

/* ------------------------------------------------------------
   24. BOOT
   ------------------------------------------------------------ */
function boot(){
  initShell();

  if(!fbReady || !db){
    $('#view').innerHTML = `<div class="empty"><i class="fa-solid fa-plug-circle-xmark"></i><b>Database unavailable</b>The Firebase SDK could not be initialised. Check your internet connection and reload.</div>`;
    $('#connDot').className = 'dot offline';
    $('#connText').textContent = 'Not connected';
    return;
  }

  const h = location.hash.replace('#','');
  if(h && NAV.some(s => s.items.some(i => i.id === h))) state.route = h;

  startListeners();

  // First render once data starts arriving
  db.ref('jobs').once('value').then(() => {
    render();
  }).catch(err => {
    console.error(err);
    toast('Could not read from database: ' + err.message, 'error');
    render();
  });

  setTimeout(() => { if(!$('#view').innerHTML.trim() || $('#view').innerHTML.includes('Connecting to database')) render(); }, 2500);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>

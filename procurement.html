function renderThreeWay(host) {
  setPageTitle('Three-Way Matching', 'NGT Procurement');

  const pos = rows('purchaseOrders');
  const selected = ui.twmPo || (pos.length ? pos[0].poNumber : '');
  const po = pos.find(p => p.poNumber === selected) || null;

  host.innerHTML = `
    <div class="page-head">
      <div><h2>Three-Way Matching</h2>
      <p>Purchase Order ↔ Goods Received Note ↔ Supplier Invoice. The system checks what was ordered, what was received and what is being billed.</p></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btnPrint">🖨 Print</button>
    </div>

    <div class="toolbar">
      <label class="f-label" style="margin:0">Purchase Order</label>
      <select id="cmbPo">
        ${pos.length ? pos.map(p => `<option value="${esc(p.poNumber)}" ${p.poNumber === selected ? 'selected' : ''}>${esc(p.poNumber)} — ${esc(p.supplier || '')} — ${money(p.total)}</option>`).join('')
          : '<option value="">No purchase orders recorded</option>'}
      </select>
      <div class="spacer"></div>
      <span class="hint" style="font-size:.78rem;color:var(--txt-3)">Exceptions are flagged automatically</span>
    </div>
    <div id="twmBody"></div>
  `;

  if ($('#cmbPo')) $('#cmbPo').onchange = e => { ui.twmPo = e.target.value; render(); };
  $('#btnPrint').onclick = () => window.print();

  const body = $('#twmBody');
  if (!po) {
    body.innerHTML = '<div class="panel"><div class="empty"><span class="e-ico">🔗</span><h4>No purchase order selected</h4><p>Create purchase orders, receive goods and record supplier invoices to run three-way matching.</p></div></div>';
    return;
  }

  const grns = rows('goodsReceived').filter(g => g.poNumber === po.poNumber);
  const invs = rows('supplierInvoices').filter(i => i.poNumber === po.poNumber);

  const receivedByItem = {};
  grns.forEach(g => (g.items || []).forEach(it => {
    const k = (it.item || '').toLowerCase().trim();
    if (!k) return;
    receivedByItem[k] = receivedByItem[k] || { item: it.item, qty: 0, accepted: 0 };
    receivedByItem[k].qty += num(it.receivedQty);
    receivedByItem[k].accepted += num(it.acceptedQty);
  }));

  const invoicedByItem = {};
  invs.forEach(iv => (iv.items || []).forEach(it => {
    const k = (it.item || '').toLowerCase().trim();
    if (!k) return;
    invoicedByItem[k] = invoicedByItem[k] || { item: it.item, qty: 0, value: 0 };
    invoicedByItem[k].qty += num(it.quantity);
    invoicedByItem[k].value += num(it.total);
  }));

  const poItems = po.items || [];
  const poTotal = num(po.total);
  const grnValue = sum(grns, g => sum(g.items || [], i => num(i.acceptedQty) * 0));
  const invTotal = sum(invs, i => i.total);
  const receivedQtyTotal = sum(grns, g => sum(g.items || [], i => i.receivedQty));
  const orderedQtyTotal = sum(poItems, i => i.quantity);

  let overall = 'ok';
  const flags = [];

  if (!grns.length) { flags.push({ t: 'warn', m: 'No Goods Received Note recorded against this PO.' }); overall = 'warn'; }
  if (!invs.length) { flags.push({ t: 'warn', m: 'No supplier invoice recorded against this PO.' }); overall = 'warn'; }
  if (grns.length && receivedQtyTotal < orderedQtyTotal) {
    flags.push({ t: 'warn', m: 'Received quantity (' + receivedQtyTotal + ') is less than ordered quantity (' + orderedQtyTotal + '). PO should remain Partially Received.' });
    if (overall === 'ok') overall = 'warn';
  }
  if (invs.length && Math.abs(invTotal - poTotal) > 1) {
    flags.push({ t: 'bad', m: 'Invoice total (' + money(invTotal) + ') does not equal PO total (' + money(poTotal) + '). Exception requiring review.' });
    overall = 'bad';
  }

  body.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Match Summary — ${esc(po.poNumber)}</h3><div class="spacer"></div>
        <span class="badge ${overall === 'ok' ? 'ok' : overall === 'warn' ? 'warn' : 'bad'}">
          ${overall === 'ok' ? '✅ Matched' : overall === 'warn' ? '⚠ Partial / Pending' : '⛔ Exception'}
        </span>
      </div>
      <div class="kpi-grid" style="margin-bottom:0">
        <div class="kpi-card"><div class="k-label">Ordered Value</div><div class="k-value">${money0(poTotal)}</div><div class="k-sub">${poItems.length} line(s)</div></div>
        <div class="kpi-card"><div class="k-label">Goods Received</div><div class="k-value">${grns.length}</div><div class="k-sub">${receivedQtyTotal} unit(s) received</div></div>
        <div class="kpi-card"><div class="k-label">Invoiced Value</div><div class="k-value">${money0(invTotal)}</div><div class="k-sub">${invs.length} invoice(s)</div></div>
        <div class="kpi-card ${Math.abs(invTotal - poTotal) <= 1 ? 'ok' : 'bad'}"><div class="k-label">Variance</div>
          <div class="k-value">${money0(invTotal - poTotal)}</div><div class="k-sub">Invoice vs PO</div></div>
      </div>
    </div>

    ${flags.length ? '<div class="panel"><div class="panel-head"><h3>Exceptions</h3></div><div class="alert-list">' +
      flags.map(f => '<div class="alert-row ' + f.t + '"><span class="a-ico">' + (f.t === 'bad' ? '⛔' : '⚠') + '</span><span>' + esc(f.m) + '</span></div>').join('') +
      '</div></div>' : ''}

    <div class="panel">
      <div class="panel-head"><h3>Line-by-Line Match</h3></div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Item</th>
          <th class="num">PO Qty</th><th class="num">PO Unit</th>
          <th class="num">GRN Received</th><th class="num">GRN Accepted</th>
          <th class="num">Invoice Qty</th><th class="num">Invoice Value</th>
          <th>Result</th></tr></thead>
        <tbody>
        ${poItems.length ? poItems.map(it => {
          const k = (it.item || '').toLowerCase().trim();
          const g = receivedByItem[k] || { qty: 0, accepted: 0 };
          const iv = invoicedByItem[k] || { qty: 0, value: 0 };
          const qtyOk = Math.abs(iv.qty - num(it.quantity)) < 0.001;
          const recOk = g.qty >= num(it.quantity);
          let res, cls;
          if (!g.qty && !iv.qty) { res = 'Not received / not invoiced'; cls = 'match-warn'; }
          else if (qtyOk && recOk) { res = '✅ Match'; cls = 'match-ok'; }
          else if (!recOk) { res = '⚠ Short receipt'; cls = 'match-warn'; }
          else { res = '⛔ Quantity exception'; cls = 'match-bad'; }
          return `<tr>
            <td>${esc(it.item || '')}<br><span class="muted">${esc((it.description || '').slice(0, 60))}</span></td>
            <td class="num">${num(it.quantity).toLocaleString('en-KE')}</td>
            <td class="num">${money(it.unitPrice)}</td>
            <td class="num">${g.qty.toLocaleString('en-KE')}</td>
            <td class="num">${g.accepted.toLocaleString('en-KE')}</td>
            <td class="num">${iv.qty.toLocaleString('en-KE')}</td>
            <td class="num">${money(iv.value)}</td>
            <td class="${cls}">${res}</td>
          </tr>`;
        }).join('') : '<tr><td colspan="8" class="muted">This purchase order has no line items.</td></tr>'}
        </tbody>
        <tfoot><tr>
          <td>Totals</td>
          <td class="num">${orderedQtyTotal}</td><td></td>
          <td class="num">${receivedQtyTotal}</td><td></td>
          <td class="num">${sum(Object.values(invoicedByItem), x => x.qty)}</td>
          <td class="num">${money(invTotal)}</td><td></td>
        </tr></tfoot>
      </table></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>Goods Received Notes</h3></div>
        ${grns.length ? '<div class="table-wrap"><table class="data" style="min-width:auto"><thead><tr><th>GRN</th><th>Date</th><th>Location</th><th>Status</th></tr></thead><tbody>' +
          grns.map(g => '<tr><td>' + esc(g.grnNumber) + '</td><td>' + esc(g.deliveryDate || '') + '</td><td>' + esc(g.location || '—') + '</td><td>' + statusBadge(g.status) + '</td></tr>').join('') +
          '</tbody></table></div>' : '<div class="empty" style="padding:1.2rem"><p>No GRN recorded.</p></div>'}
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Supplier Invoices</h3></div>
        ${invs.length ? '<div class="table-wrap"><table class="data" style="min-width:auto"><thead><tr><th>Invoice</th><th>Date</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>' +
          invs.map(i => '<tr><td>' + esc(i.invoiceNumber) + '</td><td>' + esc(i.invoiceDate || '') + '</td><td class="num">' + money(i.total) + '</td><td>' + statusBadge(i.paymentStatus) + '</td></tr>').join('') +
          '</tbody></table></div>' : '<div class="empty" style="padding:1.2rem"><p>No invoice recorded.</p></div>'}
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------------------------
   19. SUPPLIER PERFORMANCE VIEW
   --------------------------------------------------------------------------- */
function renderSupplierPerformance(host) {
  setPageTitle('Supplier Performance', 'NGT Procurement');

  const sups = rows('suppliers');
  const pos = rows('purchaseOrders');
  const grns = rows('goodsReceived');
  const invs = rows('supplierInvoices');
  const rets = rows('purchaseReturns');
  const insp = rows('inspections');
  const sqs = rows('quotations');

  const names = sups.map(s => s.name).filter(Boolean);
  pos.forEach(p => { if (p.supplier && names.indexOf(p.supplier) === -1) names.push(p.supplier); });

  const data = names.map(n => {
    const sp = pos.filter(p => p.supplier === n);
    const sg = grns.filter(g => g.supplier === n);
    const si = invs.filter(i => i.supplier === n);
    const sr = rets.filter(r => r.supplier === n);
    const sq = sqs.filter(q => q.supplier === n);

    const lead = [];
    sg.forEach(g => {
      const p = pos.find(x => x.poNumber === g.poNumber);
      if (p && p.poDate && g.deliveryDate) {
        const d = daysBetween(p.poDate, g.deliveryDate);
        if (d !== null && d >= 0) lead.push(d);
      }
    });

    const late = sp.filter(p => {
      const g = grns.filter(x => x.poNumber === p.poNumber).sort((a, b) => (a.deliveryDate || '').localeCompare(b.deliveryDate || ''))[0];
      if (!g || !p.expectedDeliveryDate) return false;
      return g.deliveryDate > p.expectedDeliveryDate;
    }).length;

    const rejected = sum(grns.filter(g => g.supplier === n), g => sum(g.items || [], i => num(i.rejectedQty) + num(i.damagedQty)));

    const invoiced = sum(si, i => i.total);
    const paid = sum(si, i => i.amountPaid);
    const disputed = si.filter(i => i.taxInvoiceStatus === 'Disputed' || i.paymentStatus === 'Disputed').length;

    return {
      name: n,
      orders: sp.length,
      value: sum(sp, p => p.total),
      avgLead: lead.length ? (lead.reduce((a, b) => a + b, 0) / lead.length) : null,
      leadSamples: lead.length,
      late: late,
      rejected: rejected,
      returns: sr.length,
      quotations: sq.length,
      invoiced: invoiced,
      paid: paid,
      outstanding: sum(si, i => (i.balance === '' || i.balance == null) ? (num(i.total) - num(i.amountPaid)) : num(i.balance)),
      disputed: disputed,
      terms: (sups.find(s => s.name === n) || {}).paymentTerms || '—',
      status: (sups.find(s => s.name === n) || {}).status || '—'
    };
  }).filter(d => d.orders || d.quotations || d.invoiced);

  // price movement per supplier
  const priceRows = [];
  sqs.forEach(q => (q.items || []).forEach(it => {
    if (!it.item) return;
    priceRows.push({ supplier: q.supplier, item: it.item, price: num(it.unitPrice), date: q.quoteDate || '' });
  }));

  host.innerHTML = `
    <div class="page-head">
      <div><h2>Supplier Performance</h2>
      <p>Objective supplier history built from actual orders, deliveries, invoices, returns and quotations.</p></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btnExportSP">⬇ Export CSV</button>
      <button class="btn btn-ghost btn-sm" id="btnPrint">🖨 Print</button>
    </div>

    ${data.length ? `
    <div class="panel">
      <div class="panel-head"><h3>Supplier Scorecard</h3></div>
      <div class="table-wrap"><table class="data">
        <thead><tr>
          <th>Supplier</th><th>Status</th><th class="num">Orders</th><th class="num">Purchase Value</th>
          <th class="num">Quotations</th><th class="num">Avg Lead (days)</th><th class="num">Late</th>

        </tr></thead>
        <tbody>
        ${data.sort((a, b) => b.value - a.value).map(d => `<tr>

          <td class="num">${money(d.value)}</td>
          <td class="num">${d.quotations}</td>

          <td class="num" style="color:${d.late ? '#fca5a5' : '#6ee7b7'}">${d.late}</td>
          <td class="num" style="color:${d.rejected ? '#fcd34d' : '#6ee7b7'}">${d.rejected}</td>
          <td class="num">${d.returns}</td>

    ${priceRows.length ? `
    <div class="panel">
      <div class="panel-head"><h3>Observed Quoted Unit Prices</h3><div class="spacer"></div>
        <span class="hint">Price movement across suppliers</span></div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Item</th><th>Supplier</th><th>Quote Date</th><th class="num">Unit Price</th></tr></thead>
        <tbody>${sortBy(priceRows, 'date', -1).slice(0, 100).map(p =>
          `<tr><td>${esc(p.item)}</td><td>${esc(p.supplier || '—')}</td><td>${esc(p.date || '—')}</td><td class="num">${money(p.price)}</td></tr>`).join('')}

  $('#btnPrint').onclick = () => window.print();
  $('#btnExportSP').onclick = () => {

      d.invoiced.toFixed(2), d.outstanding.toFixed(2), d.disputed, '"' + d.terms + '"'
    ].join(','))).join('\n');

    a.href = URL.createObjectURL(blob);

    a.click();
  };
}

/* ---------------------------------------------------------------------------
   20. REPORTS
   --------------------------------------------------------------------------- */
const REPORTS = [
  { k: 'summary', l: 'Procurement Summary' },
  { k: 'byMonth', l: 'Procurement by Month' },
  { k: 'bySupplier', l: 'Procurement by Supplier' },
  { k: 'byCategory', l: 'Procurement by Category' },
  { k: 'byProject', l: 'Procurement by Project' },
  { k: 'byCustomer', l: 'Procurement by Customer' },
  { k: 'byDepartment', l: 'Procurement by Department' },
  { k: 'byStaff', l: 'Procurement by Staff Member' },
  { k: 'budgetVsActual', l: 'Procurement Budget vs Actual' },
  { k: 'savings', l: 'Procurement Savings' },
  { k: 'supplierHistory', l: 'Supplier Purchase History' },
  { k: 'supplierOutstanding', l: 'Supplier Outstanding Invoices' },
  { k: 'supplierPayments', l: 'Supplier Payment History' },
  { k: 'supplierReturns', l: 'Supplier Returns' },
  { k: 'priceHistory', l: 'Supplier Price History' },
  { k: 'totalPurchases', l: 'Total Purchases' },
  { k: 'outstandingPayables', l: 'Outstanding Payables' },
  { k: 'paidUnpaid', l: 'Paid vs Unpaid Purchases' },
  { k: 'taxSummary', l: 'Purchase Tax Summary' },
  { k: 'projectCost', l: 'Procurement Cost by Project' },
  { k: 'customerCost', l: 'Procurement Cost by Customer' },
  { k: 'profitability', l: 'Procurement Profitability' }
];

function buildReport(k) {
  const pos = rows('purchaseOrders');
  const prs = rows('purchaseRequests');
  const invs = rows('supplierInvoices');
  const pays = rows('supplierPayments');
  const rets = rows('purchaseReturns');
  const bdgs = rows('budgets');
  const svcs = rows('procurementServices');
  const sqs = rows('quotations');
  const phs = rows('priceHistory');

  switch (k) {
    case 'summary': {
      const byPurpose = groupSum(pos, p => p.purpose, p => p.total);
      const byStatus = groupSum(pos, p => p.status, p => p.total);
      return {
        title: 'Procurement Summary', cols: ['Measure', 'Value'],
        rows: [
          ['Purchase requisitions', prs.length],
          ['Purchase orders', pos.length],
          ['Total procurement value', money(sum(pos, p => p.total))],
          ['Goods received notes', rows('goodsReceived').length],
          ['Supplier invoices', invs.length],
          ['Total invoiced', money(sum(invs, i => i.total))],
          ['Total paid to suppliers', money(sum(pays, p => p.amount))],
          ['Outstanding payables', money(sum(invs, i => (i.balance === '' || i.balance == null) ? (num(i.total) - num(i.amountPaid)) : num(i.balance)))],
          ['Purchase returns', rets.length],
          ['Procurement service requests', svcs.length],
          ['Gross procurement profit (services)', money(sum(svcs, s => s.grossProfit))]
        ].concat(Object.keys(byPurpose).map(p => ['  Purpose — ' + p, money(byPurpose[p])]))
         .concat(Object.keys(byStatus).map(s => ['  Status — ' + s, money(byStatus[s])]))
      };
    }
    case 'byMonth': {
      const g = {};
      pos.forEach(p => { const m = monthKey(p.poDate) || 'Unknown'; g[m] = (g[m] || 0) + num(p.total); });
      const keys = Object.keys(g).sort();
      return { title: 'Procurement by Month', cols: ['Month', 'Procurement Value'], rows: keys.map(k => [monthLabel(k), money(g[k])]) };
    }
    case 'bySupplier': {
      const g = groupSum(pos, p => p.supplier, p => p.total);
      return { title: 'Procurement by Supplier', cols: ['Supplier', 'Procurement Value', 'Orders'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k]), pos.filter(p => p.supplier === k).length]) };
    }
    case 'byCategory': {
      const g = groupSum(pos, p => p.department || 'Unspecified', p => p.total);
      const prG = groupSum(prs, p => p.requestType, p => p.estimatedTotal);
      return { title: 'Procurement by Category', cols: ['Category / Request Type', 'Estimated Value'],
        rows: Object.keys(prG).sort((a, b) => prG[b] - prG[a]).map(k => [k, money(prG[k])]) };
    }
    case 'byProject': {
      const g = groupSum(pos.filter(p => p.project), p => p.project, p => p.total);
      return { title: 'Procurement by Project', cols: ['Project / Job', 'Procurement Value', 'Orders'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k]), pos.filter(p => p.project === k).length]) };
    }
    case 'byCustomer': {
      const g = groupSum(pos.filter(p => p.customer), p => p.customer, p => p.total);
      return { title: 'Procurement by Customer', cols: ['Customer', 'Procurement Value', 'Orders'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k]), pos.filter(p => p.customer === k).length]) };
    }
    case 'byDepartment': {
      const g = groupSum(prs, p => p.department || 'Unspecified', p => p.estimatedTotal);
      return { title: 'Procurement by Department', cols: ['Department', 'Estimated Value', 'Requests'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k]), prs.filter(p => (p.department || 'Unspecified') === k).length]) };
    }
    case 'byStaff': {
      const g = groupSum(prs, p => p.requestedBy || 'Unspecified', p => p.estimatedTotal);
      return { title: 'Procurement by Staff Member', cols: ['Staff Member', 'Requested Value', 'Requests'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k]), prs.filter(p => (p.requestedBy || 'Unspecified') === k).length]) };
    }
    case 'budgetVsActual': {
      return { title: 'Procurement Budget vs Actual', cols: ['Budget', 'Project', 'Budget', 'Actual', 'Variance', 'Utilisation %'],
        rows: bdgs.map(b => {
          const util = num(b.totalBudget) ? (num(b.totalActual) / num(b.totalBudget) * 100).toFixed(1) + '%' : '—';
          return [b.name || b.budgetCode, b.project || '—', money(b.totalBudget), money(b.totalActual), money(b.variance), util];
        }) };
    }
    case 'savings': {
      const rws = [];
      prs.forEach(pr => {
        const cmp = rows('comparisons').find(c => c.prReference === pr.prNumber);
        if (!cmp) return;
        const est = num(pr.estimatedTotal), act = num(cmp.selectedAmount);
        rws.push([pr.prNumber, pr.reason ? pr.reason.slice(0, 40) : '', money(est), money(act), money(est - act), cmp.selectedSupplier || '—']);
      });
      return { title: 'Procurement Savings (Estimated vs Negotiated)', cols: ['PR No.', 'Reason', 'Estimated', 'Negotiated', 'Savings', 'Supplier'], rows: rws };
    }
    case 'supplierHistory': {
      return { title: 'Supplier Purchase History', cols: ['Supplier', 'PO No.', 'PO Date', 'Purpose', 'Total', 'Status'],
        rows: sortBy(pos, 'poDate', -1).map(p => [p.supplier || '—', p.poNumber, p.poDate || '', p.purpose || '', money(p.total), p.status || '']) };
    }
    case 'supplierOutstanding': {
      const rws = invs.filter(i => {
        const b = (i.balance === '' || i.balance == null) ? (num(i.total) - num(i.amountPaid)) : num(i.balance);
        return b > 0;
      }).map(i => [i.supplier || '—', i.invoiceNumber, i.invoiceDate || '', i.dueDate || '',
        money(i.total), money(i.amountPaid),
        money((i.balance === '' || i.balance == null) ? (num(i.total) - num(i.amountPaid)) : i.balance),
        i.paymentStatus || '']);
      return { title: 'Supplier Outstanding Invoices', cols: ['Supplier', 'Invoice', 'Invoice Date', 'Due Date', 'Total', 'Paid', 'Balance', 'Status'], rows: rws };
    }
    case 'supplierPayments': {
      return { title: 'Supplier Payment History', cols: ['Payment ID', 'Date', 'Supplier', 'Invoice', 'Amount', 'Method', 'Reference'],
        rows: sortBy(pays, 'paymentDate', -1).map(p => [p.paymentId, p.paymentDate || '', p.supplier || '', p.invoiceNumber || '', money(p.amount), p.paymentMethod || '', p.transactionReference || p.mpesaCode || '']) };
    }
    case 'supplierReturns': {
      return { title: 'Supplier Returns', cols: ['Return No.', 'Date', 'Supplier', 'Original PO', 'Value', 'Status', 'Reason'],
        rows: sortBy(rets, 'returnDate', -1).map(r => [r.returnNumber, r.returnDate || '', r.supplier || '', r.originalPO || '', money(r.totalValue), r.status || '', (r.reason || '').slice(0, 50)]) };
    }
    case 'priceHistory': {
      const all = phs.concat(sqs.flatMap(q => (q.items || []).filter(i => i.item).map(i => ({
        date: q.quoteDate, supplier: q.supplier, item: i.item, unitPrice: i.unitPrice, poReference: q.sqNumber
      }))));
      return { title: 'Supplier Price History', cols: ['Date', 'Supplier', 'Item', 'Unit Price', 'Reference'],
        rows: sortBy(all, 'date', -1).map(p => [p.date || '', p.supplier || '', p.item || '', money(p.unitPrice), p.poReference || '']) };
    }
    case 'totalPurchases': {
      return { title: 'Total Purchases', cols: ['Measure', 'Value'],
        rows: [
          ['Total purchase order value', money(sum(pos, p => p.total))],
          ['Total invoiced by suppliers', money(sum(invs, i => i.total))],
          ['Total paid', money(sum(pays, p => p.amount))],
          ['Total outstanding', money(sum(invs, i => (i.balance === '' || i.balance == null) ? (num(i.total) - num(i.amountPaid)) : num(i.balance)))],
          ['Purchase orders issued', pos.length],
          ['Closed purchase orders', pos.filter(p => p.status === 'Closed').length]
        ] };
    }
    case 'outstandingPayables': {
      const g = {};
      invs.forEach(i => {
        const b = (i.balance === '' || i.balance == null) ? (num(i.total) - num(i.amountPaid)) : num(i.balance);
        if (b > 0) g[i.supplier || '—'] = (g[i.supplier || '—'] || 0) + b;
      });
      return { title: 'Outstanding Payables by Supplier', cols: ['Supplier', 'Outstanding'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k])]) };
    }
    case 'paidUnpaid': {
      const paid = invs.filter(i => i.paymentStatus === 'Fully Paid' || num(i.amountPaid) >= num(i.total));
      const partial = invs.filter(i => num(i.amountPaid) > 0 && num(i.amountPaid) < num(i.total));
      const unpaid = invs.filter(i => num(i.amountPaid) === 0);
      return { title: 'Paid vs Unpaid Purchases', cols: ['Category', 'Invoices', 'Value'],
        rows: [
          ['Fully paid', paid.length, money(sum(paid, i => i.total))],
          ['Partially paid', partial.length, money(sum(partial, i => i.total - i.amountPaid))],
          ['Unpaid', unpaid.length, money(sum(unpaid, i => i.total))]
        ] };
    }
    case 'taxSummary': {
      return { title: 'Purchase Tax Summary', cols: ['Supplier', 'Invoice', 'Invoice Date', 'Subtotal', 'VAT', 'Other Taxes', 'Total', 'Tax Invoice Status'],
        rows: sortBy(invs, 'invoiceDate', -1).map(i => [i.supplier || '', i.invoiceNumber || '', i.invoiceDate || '',
          money(i.subtotal), money(i.vat), money(i.otherTaxes), money(i.total), i.taxInvoiceStatus || '—']) };
    }
    case 'projectCost': {
      const g = groupSum(pos.filter(p => p.project), p => p.project, p => p.total);
      return { title: 'Procurement Cost by Project', cols: ['Project', 'Procurement Cost', 'Orders'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k]), pos.filter(p => p.project === k).length]) };
    }
    case 'customerCost': {
      const g = groupSum(pos.filter(p => p.customer), p => p.customer, p => p.total);
      return { title: 'Procurement Cost by Customer', cols: ['Customer', 'Procurement Cost', 'Orders'],
        rows: Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => [k, money(g[k]), pos.filter(p => p.customer === k).length]) };
    }
    case 'profitability': {
      return { title: 'Procurement Profitability (Customer Transactions)',
        cols: ['Request No.', 'Customer', 'Customer Price', 'Supplier Cost', 'Delivery', 'Other Direct', 'Gross Profit', 'Margin %', 'Status'],
        rows: svcs.map(s => [s.psNumber, s.customer || '', money(s.totalCustomerPrice), money(s.totalSupplierCost),
          money(s.deliveryCost), money(s.otherDirectCosts), money(s.grossProfit),
          num(s.marginPercent).toFixed(2) + '%', s.status || '']) };
    }
    default: return { title: 'Report', cols: [], rows: [] };
  }
}

function renderReports(host) {
  setPageTitle('Reports', 'NGT Procurement');

  const selected = ui.report || 'summary';
  const rep = buildReport(selected);

  host.innerHTML = `
    <div class="page-head">
      <div><h2>Procurement Reports</h2>
      <p>Generate management, supplier and financial reports from live Firebase data. Export to CSV or print to PDF.</p></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btnRepCsv">⬇ Export CSV</button>
      <button class="btn btn-ghost btn-sm" id="btnRepPrint">🖨 Print / PDF</button>
    </div>

    <div class="panel" style="padding:1rem">
      <div class="tabs">
        ${REPORTS.map(r => `<button class="tab ${r.k === selected ? 'active' : ''}" data-rep="${r.k}">${esc(r.l)}</button>`).join('')}
      </div>
    </div>

    <div class="panel" id="repOut">
      <div class="panel-head"><h3>${esc(rep.title)}</h3><div class="spacer"></div>
        <span class="hint">Generated ${new Date().toLocaleString()}</span></div>
      ${rep.rows.length ? `<div class="table-wrap"><table class="data">
        <thead><tr>${rep.cols.map(c => '<th>' + esc(c) + '</th>').join('')}</tr></thead>
        <tbody>${rep.rows.map(r => '<tr>' + r.map((c, i) => '<td' + (typeof c === 'string' && c.indexOf('KES') === 0 ? ' class="num"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('')}</tbody>
      </table></div>` : '<div class="empty"><span class="e-ico">📄</span><h4>No data available</h4><p>This report will populate automatically once records exist in the Firebase database.</p></div>'}
    </div>
  `;

  $$('[data-rep]').forEach(b => b.onclick = () => { ui.report = b.dataset.rep; render(); });
  $('#btnRepPrint').onclick = () => window.print();
  $('#btnRepCsv').onclick = () => {
    if (!rep.rows.length) { toast('Nothing to export.', 'warn'); return; }
    const csv = [rep.cols.join(',')].concat(rep.rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(','))).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'NGT-report-' + selected + '-' + today() + '.csv';
    a.click();
    toast('Report exported.', 'ok');
  };
}

          <button class="btn btn-ghost btn-xs" id="btnRefreshNow">⟳ Force refresh</button>
        </div>
        <p style="font-size:.76rem;color:var(--txt-3);margin-top:.7rem">No sample or generated data is ever inserted by this system. The database starts empty and is populated only by real user entries.</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Reference Lists</h3><div class="spacer"></div>
        <span class="hint">One value per line — these populate dropdown suggestions across the system</span></div>
      <div class="form-grid">
        <div class="field c4"><label class="f-label">Departments</label>
          <textarea data-s="departments" rows="6">${esc((s.departments || []).join('\n'))}</textarea></div>
        <div class="field c4"><label class="f-label">Categories</label>
          <textarea data-s="categories" rows="6">${esc((s.categories || []).join('\n'))}</textarea></div>
        <div class="field c4"><label class="f-label">Projects / Jobs</label>
          <textarea data-s="projects" rows="6">${esc((s.projects || []).join('\n'))}</textarea></div>
        <div class="field c4"><label class="f-label">Customers</label>
          <textarea data-s="customers" rows="6">${esc((s.customers || []).join('\n'))}</textarea></div>
        <div class="field c4"><label class="f-label">Warehouses / Locations</label>
          <textarea data-s="locations" rows="6">${esc((s.locations || []).join('\n'))}</textarea></div>
        <div class="field c4"><label class="f-label">User Roles</label>
          <textarea data-s="roles" rows="6">${esc((s.roles || ['Administrator','Procurement Officer','Finance Officer','Store/Warehouse','Project Manager','Technician','Sales/CRM','Director']).join('\n'))}</textarea></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Document Numbering</h3></div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Module</th><th>Prefix</th><th>Records</th><th>Next Number</th></tr></thead>
        <tbody>
          ${Object.keys(RES).map(k => {
            const R = RES[k];
            if (!R.prefix) return '';
            const nn = nextNumber(k, R.prefix);
            return `<tr><td>${esc(R.plural)}</td><td><code>${esc(R.prefix)}</code></td>
              <td>${rows(k).length}</td><td><strong>${esc(nn.number)}</strong></td></tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>
  `;

  $('#btnSaveSettings').onclick = saveSettings;
  $('#btnRefreshNow').onclick = () => syncAll(true);
  $('#btnExportAll').onclick = () => {
    const blob = new Blob([JSON.stringify(store.data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'NGT-procurement-database-' + today() + '.json';
    a.click();
    toast('Database exported.', 'ok');
  };
}

async function saveSettings() {
  const s = Object.assign({}, store.settings);
  $$('[data-s]').forEach(el => {
    const k = el.dataset.s;
    if (el.tagName === 'TEXTAREA') {
      s[k] = el.value.split('\n').map(x => x.trim()).filter(Boolean);
    } else if (el.type === 'number') {
      s[k] = el.value === '' ? '' : num(el.value);
    } else {
      s[k] = el.value;
    }
  });
  try {
    await fbPut('settings', s);
    store.settings = s;
    store.data.settings = s;
    $('#brandName').textContent = s.companyName || 'Ngure Gacheru Technologies';
    await audit('UPDATE', 'settings', 'settings', 'System Settings', null, s, 'Settings saved');
    toast('Settings saved to Firebase.', 'ok');
    render();
  } catch (e) { toast('Save failed: ' + e.message, 'bad'); }
}

/* ---------------------------------------------------------------------------
   23. ANIMATION OBSERVER
   --------------------------------------------------------------------------- */
let observer = null;
function observeAnimations() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
  }, { threshold: 0.08 });
  $$('.animate-on-view').forEach(el => observer.observe(el));
}

/* ---------------------------------------------------------------------------
   24. BOOT
   --------------------------------------------------------------------------- */
function boot() {
  // role / user persistence (local only — not business data)
  const savedRole = localStorage.getItem('ngt_role');
  const savedUser = localStorage.getItem('ngt_user');
  if (savedRole) { $('#roleSelect').value = savedRole; store.user.role = savedRole; }
  if (savedUser) { $('#userName').value = savedUser; store.user.name = savedUser; }

  $('#roleSelect').onchange = e => {
    store.user.role = e.target.value;
    localStorage.setItem('ngt_role', e.target.value);
    toast('Active role: ' + e.target.value, 'info', 1800);
  };
  $('#userName').onchange = e => {
    store.user.name = e.target.value || 'Unknown';
    localStorage.setItem('ngt_user', store.user.name);
  };
  $('#userName').oninput = e => { store.user.name = e.target.value || 'Unknown'; localStorage.setItem('ngt_user', store.user.name); };

  $('#btnRefresh').onclick = () => syncAll(true);

  window.addEventListener('resize', () => {
    if (store.route === 'dashboard') {
      const cv = $('#chMonthly');
      if (cv) {
        const t = today(), ym = monthKey(t);
        const months = [];
        const d0 = new Date(); d0.setDate(1);
        for (let i = 11; i >= 0; i--) {
          const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1);
          months.push(d.toISOString().slice(0, 7));
        }
        const pos = rows('purchaseOrders');
        drawLineChart(cv, months.map(monthLabel), months.map(m => sum(pos.filter(p => monthKey(p.poDate) === m), p => p.total)));
      }
    }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  syncAll(false);
  startPolling();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>

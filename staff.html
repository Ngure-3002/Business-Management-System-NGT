<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGT BMS · Staff Management</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       style.css – modern tech theme with animations
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1117;
      color: #e0e7ff;
      line-height: 1.6;
      scroll-behavior: smooth;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ===== HEADER ===== */
    .header {
      background: #0f172a;
      border-bottom: 2px solid #1e2c3a;
      box-shadow: 0 4px 20px rgba(0, 180, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      background-color: rgba(15, 23, 42, 0.95);
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .company-name {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5f3fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .motto {
      font-size: 1rem;
      color: #9ab3d8;
      font-style: italic;
      border-left: 3px solid #38bdf8;
      padding-left: 0.75rem;
      margin-top: 0.25rem;
    }

    .header-accent {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: #38bdf8;
      border-radius: 50%;
      opacity: 0.7;
      animation: pulse 2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.4s; }
    .dot:nth-child(3) { animation-delay: 0.8s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* ===== APP LAYOUT ===== */
    .app-shell {
      display: flex;
      min-height: calc(100vh - 80px);
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      background: #0e1623;
      border-right: 1px solid #1e2c3a;
      padding: 1.5rem 0;
      flex-shrink: 0;
      overflow-y: auto;
      position: sticky;
      top: 80px;
      height: calc(100vh - 80px);
    }

    .sidebar-brand {
      padding: 0 1.5rem 1.5rem;
      border-bottom: 1px solid #1e2c3a;
      margin-bottom: 1rem;
    }

    .sidebar-brand .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .sidebar-brand .brand-sub {
      font-size: 0.75rem;
      color: #6b7f9a;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .nav-section {
      padding: 0 0.75rem;
      margin-bottom: 0.5rem;
    }

    .nav-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4a5f7a;
      padding: 0.6rem 0.75rem 0.3rem;
      font-weight: 600;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      color: #9ab3d8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 2px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .nav-item i {
      width: 20px;
      text-align: center;
      font-size: 1rem;
      color: #5b7a9c;
      transition: color 0.2s;
    }

    .nav-item:hover {
      background: #1a2536;
      color: #e0e7ff;
    }

    .nav-item:hover i {
      color: #38bdf8;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #1e3a5f, #1a2c44);
      color: #e0f2fe;
      border-left: 3px solid #38bdf8;
    }

    .nav-item.active i {
      color: #38bdf8;
    }

    .nav-item .badge {
      margin-left: auto;
      background: #38bdf8;
      color: #0b1117;
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      font-weight: 700;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      min-width: 0;
    }

    /* ===== PAGE HEADER ===== */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #bae6fd, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
    }

    .page-header p {
      color: #6b7f9a;
      font-size: 0.9rem;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-primary {
      background: #38bdf8;
      color: #0b1117;
      box-shadow: 0 8px 16px #38bdf830;
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-3px);
      box-shadow: 0 16px 24px #38bdf860;
    }

    .btn-outline {
      border: 2px solid #38bdf8;
      color: #e0f2fe;
      background: transparent;
    }

    .btn-outline:hover {
      background: #38bdf8;
      color: #0b1117;
      transform: translateY(-3px);
    }

    .btn-ghost {
      background: transparent;
      color: #9ab3d8;
      border: 1px solid #2d3a4f;
    }

    .btn-ghost:hover {
      background: #1a2536;
      color: #e0e7ff;
      border-color: #38bdf8;
    }

    .btn-sm {
      padding: 0.4rem 0.9rem;
      font-size: 0.78rem;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      justify-content: center;
      border-radius: 10px;
    }

    /* ===== STAT CARDS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #1a2536;
      border: 1px solid #2d3a4f;
      border-radius: 18px;
      padding: 1.2rem 1.3rem;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle at top right, #2563eb15, transparent 70%);
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 20px 30px -10px #0f172a, 0 0 0 1px #38bdf840;
    }

    .stat-card .stat-icon {
      font-size: 1.4rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    .stat-card .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f0f9ff;
      line-height: 1.2;
    }

    .stat-card .stat-label {
      font-size: 0.75rem;
      color: #6b7f9a;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .stat-card.accent-green .stat-value { color: #4ade80; }
    .stat-card.accent-green .stat-icon { color: #4ade80; }
    .stat-card.accent-amber .stat-value { color: #fbbf24; }
    .stat-card.accent-amber .stat-icon { color: #fbbf24; }
    .stat-card.accent-red .stat-value { color: #f87171; }
    .stat-card.accent-red .stat-icon { color: #f87171; }

    /* ===== PANELS ===== */
    .panel {
      background: #1a2536;
      border: 1px solid #2d3a4f;
      border-radius: 22px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .panel-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .panel-header h2 i {
      color: #38bdf8;
    }

    /* ===== QUICK ACTIONS ===== */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .quick-action-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.1rem;
      border-radius: 14px;
      background: #0e1623;
      border: 1px solid #2d3a4f;
      color: #9ab3d8;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }

    .quick-action-btn i {
      color: #38bdf8;
      font-size: 1rem;
    }

    .quick-action-btn:hover {
      border-color: #38bdf8;
      color: #e0e7ff;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -8px #38bdf840;
    }

    /* ===== ACTIVITY LIST ===== */
    .activity-list {
      list-style: none;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e2c3a;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e3a5f, #2d4a6f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #38bdf8;
      flex-shrink: 0;
    }

    .activity-info {
      flex: 1;
      min-width: 0;
    }

    .activity-info .act-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: #e0e7ff;
    }

    .activity-info .act-desc {
      font-size: 0.8rem;
      color: #6b7f9a;
    }

    .activity-time {
      font-size: 0.75rem;
      color: #4a5f7a;
      white-space: nowrap;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid #1e2c3a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 700px;
    }

    thead {
      background: #0e1623;
    }

    th {
      text-align: left;
      padding: 0.85rem 1rem;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #5b7a9c;
      border-bottom: 1px solid #1e2c3a;
      white-space: nowrap;
    }

    td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #1a2536;
      color: #b0c4de;
      vertical-align: middle;
    }

    tbody tr {
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: #1e2c3a;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* ===== STATUS BADGES ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-active { background: #052e1c; color: #4ade80; border: 1px solid #166534; }
    .badge-leave { background: #3b2e05; color: #fbbf24; border: 1px solid #713f12; }
    .badge-suspended { background: #3b0505; color: #f87171; border: 1px solid #7f1d1d; }
    .badge-inactive { background: #1e2c3a; color: #6b7f9a; border: 1px solid #2d3a4f; }
    .badge-terminated { background: #1a0a0a; color: #ef4444; border: 1px solid #7f1d1d; }
    .badge-resigned { background: #1e2c3a; color: #9ab3d8; border: 1px solid #2d3a4f; }
    .badge-present { background: #052e1c; color: #4ade80; border: 1px solid #166534; }
    .badge-absent { background: #3b0505; color: #f87171; border: 1px solid #7f1d1d; }
    .badge-late { background: #3b2e05; color: #fbbf24; border: 1px solid #713f12; }
    .badge-halfday { background: #2a1e05; color: #fb923c; border: 1px solid #713f12; }
    .badge-offday { background: #1e2c3a; color: #6b7f9a; border: 1px solid #2d3a4f; }
    .badge-pending { background: #3b2e05; color: #fbbf24; border: 1px solid #713f12; }
    .badge-approved { background: #052e1c; color: #4ade80; border: 1px solid #166534; }
    .badge-rejected { background: #3b0505; color: #f87171; border: 1px solid #7f1d1d; }

    /* ===== FORM ===== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #8ba0bc;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: #0e1623;
      border: 1px solid #2d3a4f;
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      color: #e0e7ff;
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      width: 100%;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px #38bdf820;
    }

    .form-group select option {
      background: #0e1623;
      color: #e0e7ff;
    }

    .form-section-title {
      grid-column: 1 / -1;
      font-size: 0.8rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding-top: 0.75rem;
      margin-bottom: 0.25rem;
      border-top: 1px solid #1e2c3a;
    }

    .form-section-title:first-child {
      border-top: none;
      padding-top: 0;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding-top: 0.75rem;
    }

    /* ===== SEARCH BAR ===== */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #0e1623;
      border: 1px solid #2d3a4f;
      border-radius: 12px;
      padding: 0.5rem 1rem;
      flex: 1;
      min-width: 200px;
      max-width: 340px;
    }

    .search-bar i {
      color: #5b7a9c;
      font-size: 0.9rem;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #e0e7ff;
      font-size: 0.88rem;
      font-family: inherit;
      width: 100%;
    }

    .search-bar input::placeholder {
      color: #4a5f7a;
    }

    /* ===== FILTER ROW ===== */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
      align-items: center;
    }

    .filter-row select {
      background: #0e1623;
      border: 1px solid #2d3a4f;
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
      color: #e0e7ff;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .filter-row select:focus {
      border-color: #38bdf8;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 2px solid #1e2c3a;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0;
    }

    .tab-btn {
      padding: 0.7rem 1.1rem;
      background: transparent;
      border: none;
      color: #6b7f9a;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #b0c4de;
    }

    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== PROFILE CARD ===== */
    .profile-header {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .profile-avatar-lg {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1e3a5f, #2d4a6f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
      flex-shrink: 0;
      border: 2px solid #38bdf840;
    }

    .profile-info h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f0f9ff;
    }

    .profile-info .staff-id {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.2rem;
    }

    .profile-info .staff-meta {
      font-size: 0.9rem;
      color: #8ba0bc;
    }

    .profile-contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.88rem;
      color: #b0c4de;
    }

    .contact-item i {
      color: #38bdf8;
      width: 18px;
      text-align: center;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #4a5f7a;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #2d3a4f;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    /* ===== LOADING SPINNER ===== */
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #1e2c3a;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem;
      color: #6b7f9a;
      font-size: 0.9rem;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background: #1a2536;
      border: 1px solid #2d3a4f;
      border-left: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      color: #e0e7ff;
      font-size: 0.88rem;
      box-shadow: 0 12px 30px #00000060;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideIn 0.35s ease;
      max-width: 360px;
    }

    .toast.success { border-left-color: #4ade80; }
    .toast.error { border-left-color: #f87171; }
    .toast.warning { border-left-color: #fbbf24; }

    .toast i {
      font-size: 1.1rem;
    }

    .toast.success i { color: #4ade80; }
    .toast.error i { color: #f87171; }
    .toast.warning i { color: #fbbf24; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 18, 0.85);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #0f172a;
      border: 1px solid #2d3a4f;
      border-radius: 24px;
      width: 100%;
      max-width: 820px;
      padding: 1.8rem;
      box-shadow: 0 30px 60px #00000080;
      animation: modalIn 0.3s ease;
      margin: auto;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0f9ff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-header h2 i {
      color: #38bdf8;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #6b7f9a;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.3rem;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #1a2536;
      color: #f87171;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .sidebar {
        width: 68px;
        overflow: hidden;
      }

      .sidebar .nav-label,
      .sidebar .brand-title,

    @media (max-width: 768px) {

      .hero-cta {
        justify-content: center;

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ============================================================
       FIREBASE SDK (compat) + APP SCRIPT
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ============================================================
    // 1. FIREBASE CONFIGURATION
    // ============================================================
    const firebaseConfig = {
      databaseURL: "https://ngt-hr-management-system-default-rtdb.firebaseio.com/"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // 2. CONSTANTS & CONFIG
    // ============================================================
    const DEPARTMENTS = [
      "Management", "Human Resources", "Finance", "IT",
      "Electrical", "CCTV & Security Systems", "Solar",
      "Procurement", "Sales", "Marketing", "Graphic Design",
      "Customer Support", "Operations"
    ];

    const STAFF_TYPES = [
      "Employee", "Agent", "Technician", "Contractor",
      "Intern", "Management", "Other"
    ];

    const EMPLOYMENT_TYPES = [
      "Permanent", "Contract", "Part-time", "Casual",
      "Intern", "Commission", "Freelance", "Volunteer"
    ];

    const EMPLOYMENT_STATUSES = [
      "Active", "On Leave", "Suspended", "Inactive",
      "Terminated", "Resigned"
    ];

    const ATTENDANCE_STATUSES = [
      "Present", "Absent", "Late", "Half Day", "Leave", "Off Day"
    ];

    const LEAVE_TYPES = [
      "Annual Leave", "Sick Leave", "Maternity Leave",
      "Paternity Leave", "Compassionate Leave", "Unpaid Leave", "Other"
    ];

    const LEAVE_STATUSES = ["Pending", "Approved", "Rejected"];

    // ============================================================
    // 3. STATE
    // ============================================================
    const state = {
      currentPage: "dashboard",
      staff: [],
      departments: [...DEPARTMENTS],
      attendance: [],
      leaveRequests: [],
      assignments: [],
      payroll: [],
      performanceReviews: [],
      documents: [],
      staffCounter: 0,
      attendanceCounter: 0,
      leaveCounter: 0,
      assignmentCounter: 0,
      payrollCounter: 0,
      reviewCounter: 0,
      documentCounter: 0,
      selectedStaffId: null,
      editingStaffId: null,
      loading: false
    };

    // ============================================================
    // 4. UTILITY FUNCTIONS
    // ============================================================

    /** Generate next ID with prefix and padded number */
    function generateId(prefix, counterKey, pad = 4) {
      state[counterKey] = (state[counterKey] || 0) + 1;
      return `${prefix}${String(state[counterKey]).padStart(pad, "0")}`;
    }

    /** Format date to readable string */
    function formatDate(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString("en-GB", {
        day: "2-digit", month: "short", year: "numeric"
      });
    }

    /** Get initials from name */
    function getInitials(first, last) {
      return `${(first || "?")[0]}${(last || "?")[0]}`.toUpperCase();
    }

    /** Escape HTML to prevent XSS */
    function esc(str) {
      if (str === undefined || str === null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /** Show toast notification */
    function showToast(message, type = "success") {
      const container = document.getElementById("toastContainer");
      const icons = {
        success: "fa-circle-check",
        error: "fa-circle-xmark",
        warning: "fa-triangle-exclamation"
      };
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.success}"></i><span>${esc(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(40px)";
        toast.style.transition = "all 0.3s";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    /** Show loading overlay in main content */
    function showLoading() {
      document.getElementById("mainContent").innerHTML = `
        <div class="loading-overlay">
          <div class="spinner"></div>
          <span>Loading…</span>
        </div>`;
    }

    // ============================================================
    // 5. FIREBASE DATA OPERATIONS (Realtime Database)
    // ============================================================

    /** Read a collection from Firebase */
    function readCollection(path) {
      return db.ref(path).once("value").then(snap => {
        const data = snap.val() || {};
        return Object.entries(data).map(([id, val]) => ({ id, ...val }));
      });
    }

    /** Write/set data at a path */
    function writeData(path, data) {
      return db.ref(path).set(data);
    }

    /** Push new data (auto-generated key) */
    function pushData(path, data) {
      return db.ref(path).push(data);
    }

    /** Update data at a path */
    function updateData(path, data) {
      return db.ref(path).update(data);
    }

    /** Remove data at a path */
    function removeData(path) {
      return db.ref(path).remove();
    }

    /** Load all collections from Firebase */
    async function loadAllData() {
      state.loading = true;
      try {
        const [staff, attendance, leave, assignments, payroll, reviews, docs] =
          await Promise.all([
            readCollection("staff"),
            readCollection("attendance"),
            readCollection("leaveRequests"),
            readCollection("staffAssignments"),
            readCollection("payroll"),
            readCollection("performanceReviews"),
            readCollection("staffDocuments")
          ]);

        state.staff = staff;
        state.attendance = attendance;
        state.leaveRequests = leave;
        state.assignments = assignments;
        state.payroll = payroll;
        state.performanceReviews = reviews;
        state.documents = docs;

        // Update counters based on existing data
        state.staffCounter = staff.length;
        state.attendanceCounter = attendance.length;
        state.leaveCounter = leave.length;
        state.assignmentCounter = assignments.length;
        state.payrollCounter = payroll.length;
        state.reviewCounter = reviews.length;
        state.documentCounter = docs.length;

        state.loading = false;
        return true;
      } catch (err) {
        console.error("Firebase load error:", err);
        showToast("Failed to load data from Firebase. Check connection.", "error");
        state.loading = false;
        return false;
      }
    }

    // ============================================================
    // 6. COMPUTED / DERIVED DATA
    // ============================================================

    function getStats() {
      const total = state.staff.length;
      const employees = state.staff.filter(s => s.staffType === "Employee").length;
      const agents = state.staff.filter(s => s.staffType === "Agent").length;
      const technicians = state.staff.filter(s => s.staffType === "Technician").length;
      const contractors = state.staff.filter(s => s.staffType === "Contractor").length;
      const active = state.staff.filter(s => s.employmentStatus === "Active").length;
      const onLeave = state.staff.filter(s => s.employmentStatus === "On Leave").length;
      const inactive = state.staff.filter(s => ["Inactive", "Suspended", "Terminated", "Resigned"].includes(s.employmentStatus)).length;

      // Present today
      const today = new Date().toISOString().slice(0, 10);
      const presentToday = state.attendance.filter(a => a.date === today && a.status === "Present").length;

      return { total, employees, agents, technicians, contractors, active, onLeave, inactive, presentToday };
    }

    function getRecentActivity(limit = 6) {
      const items = [];

      state.attendance.forEach(a => {
        const staff = state.staff.find(s => s.id === a.staffId);
        if (staff) {
          items.push({
            name: `${staff.firstName} ${staff.lastName}`,
            action: `Checked in (${a.status})`,
            time: a.checkIn || a.date,
            timestamp: new Date(a.date + "T" + (a.checkIn || "00:00")).getTime()
          });
        }
      });

      state.leaveRequests.forEach(l => {
        const staff = state.staff.find(s => s.id === l.staffId);
        if (staff) {
          items.push({
            name: `${staff.firstName} ${staff.lastName}`,
            action: `Leave ${l.status}`,
            time: formatDate(l.startDate),
            timestamp: new Date(l.startDate).getTime()
          });
        }
      });

      state.assignments.forEach(a => {
        const staff = state.staff.find(s => s.id === a.staffId);
        if (staff) {
          items.push({
            name: `${staff.firstName} ${staff.lastName}`,
            action: `Assigned: ${a.role || "Job"}`,
            time: formatDate(a.assignedDate),
            timestamp: new Date(a.assignedDate).getTime()
          });
        }
      });

      return items.sort((a, b) => b.timestamp - a.timestamp).slice(0, limit);
    }

    // ============================================================
    // 7. PAGE RENDERERS
    // ============================================================

    /** Render the main content area based on current page */
    function renderPage() {
      if (state.loading) {
        showLoading();
        return;
      }

      const main = document.getElementById("mainContent");
      const page = state.currentPage;

      switch (page) {
        case "dashboard":
          main.innerHTML = renderDashboard();
          break;
        case "directory":
          main.innerHTML = renderDirectory();
          break;
        case "add-staff":
          main.innerHTML = renderAddStaffForm();
          break;
        case "attendance":
          main.innerHTML = renderAttendance();
          break;
        case "leave":
          main.innerHTML = renderLeave();
          break;
        case "assignments":
          main.innerHTML = renderAssignments();
          break;
        case "payroll":
          main.innerHTML = renderPayroll();
          break;
        case "performance":
          main.innerHTML = renderPerformance();
          break;
        case "documents":
          main.innerHTML = renderDocuments();
          break;
        case "reports":
          main.innerHTML = renderReports();
          break;
        case "settings":
          main.innerHTML = renderSettings();
          break;
        case "profile":
          main.innerHTML = renderProfile();
          break;
        default:
          main.innerHTML = renderDashboard();
      }
    }

    // ============================================================
    // 8. DASHBOARD PAGE
    // ============================================================
    function renderDashboard() {
      const s = getStats();
      const recent = getRecentActivity(6);

      return `
        <div class="page-header">
          <div>
            <h1><i class="fa-solid fa-chart-pie" style="color:#38bdf8;margin-right:0.5rem;"></i> Staff Management Dashboard</h1>
            <p>Overview of your entire workforce — employees, agents, technicians, contractors and more.</p>
          </div>
          <button class="btn btn-primary" onclick="navigateTo('add-staff')">
            <i class="fa-solid fa-plus"></i> Add Staff
          </button>
        </div>

        <!-- Stats Row 1 -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
            <div class="stat-value">${s.total}</div>
            <div class="stat-label">Total Staff</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-user-tie"></i></div>
            <div class="stat-value">${s.employees}</div>
            <div class="stat-label">Employees</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-handshake"></i></div>
            <div class="stat-value">${s.agents}</div>
            <div class="stat-label">Agents</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
            <div class="stat-value">${s.technicians}</div>
            <div class="stat-label">Technicians</div>
          </div>
        </div>

        <!-- Stats Row 2 -->
        <div class="stats-grid">
          <div class="stat-card accent-green">
            <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="stat-value">${s.active}</div>
            <div class="stat-label">Active</div>
          </div>
          <div class="stat-card accent-amber">
            <div class="stat-icon"><i class="fa-solid fa-umbrella-beach"></i></div>
            <div class="stat-value">${s.onLeave}</div>
            <div class="stat-label">On Leave</div>
          </div>
          <div class="stat-card accent-green">
            <div class="stat-icon"><i class="fa-solid fa-clock"></i></div>
            <div class="stat-value">${s.presentToday}</div>
            <div class="stat-label">Present Today</div>
          </div>
          <div class="stat-card accent-red">
            <div class="stat-icon"><i class="fa-solid fa-user-slash"></i></div>
            <div class="stat-value">${s.inactive}</div>
            <div class="stat-label">Inactive</div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="panel">
          <div class="panel-header">
            <h2><i class="fa-solid fa-bolt"></i> Quick Actions</h2>
          </div>
          <div class="quick-actions">
            <button class="quick-action-btn" onclick="navigateTo('add-staff')">
              <i class="fa-solid fa-user-plus"></i> Add Staff
            </button>
            <button class="quick-action-btn" onclick="navigateTo('attendance')">
              <i class="fa-solid fa-clock"></i> Attendance
            </button>
            <button class="quick-action-btn" onclick="navigateTo('leave')">
              <i class="fa-solid fa-umbrella-beach"></i> Leave
            </button>
            <button class="quick-action-btn" onclick="navigateTo('assignments')">
              <i class="fa-solid fa-clipboard-list"></i> Assignments
            </button>
            <button class="quick-action-btn" onclick="navigateTo('payroll')">
              <i class="fa-solid fa-money-bill-wave"></i> Payroll
            </button>
            <button class="quick-action-btn" onclick="navigateTo('reports')">
              <i class="fa-solid fa-chart-bar"></i> Reports
            </button>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="panel">
          <div class="panel-header">
            <h2><i class="fa-solid fa-wave-square"></i> Recent Staff Activity</h2>
            <button class="btn btn-ghost btn-sm" onclick="navigateTo('directory')">View All</button>
          </div>
          ${recent.length === 0 ? `
            <div class="empty-state">
              <i class="fa-solid fa-inbox"></i>
              <p>No recent activity. Add staff or record attendance to see activity here.</p>
            </div>
          ` : `
            <ul class="activity-list">
              ${recent.map(a => `
                <li class="activity-item">
                  <div class="activity-avatar">${getInitials(a.name.split(" ")[0], a.name.split(" ")[1] || "")}</div>
                  <div class="activity-info">
                    <div class="act-name">${esc(a.name)}</div>
                    <div class="act-desc">${esc(a.action)}</div>
                  </div>
                  <div class="activity-time">${esc(a.time)}</div>
                </li>
              `).join("")}
            </ul>
          `}
        </div>
      `;
    }

    // ============================================================
    // 9. STAFF DIRECTORY PAGE
    // ============================================================
    function renderDirectory() {
      return `
        <div class="page-header">
          <div>
            <h1><i class="fa-solid fa-users" style="color:#38bdf8;margin-right:0.5rem;"></i> Staff Directory</h1>
            <p>All employees, agents, technicians, contractors and other staff members.</p>
          </div>
          <button class="btn btn-primary" onclick="navigateTo('add-staff')">
            <i class="fa-solid fa-plus"></i> Add Staff
          </button>
        </div>

        <div class="filter-row">
          <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="staffSearch" placeholder="Search by name, ID, email or phone…" oninput="filterDirectory()">
          </div>
          <select id="filterDepartment" onchange="filterDirectory()">
            <option value="">All Departments</option>
            ${state.departments.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}
          </select>
          <select id="filterType" onchange="filterDirectory()">

    function filterDirectory() {
      const q = (document.getElementById("staffSearch").value || "").toLowerCase();
      const dept = document.getElementById("filterDepartment").value;
      const type = document.getElementById("filterType").value;
      const status = document.getElementById("filterStatus").value;

      const filtered = state.staff.filter(s => {
        const name = `${s.firstName} ${s.middleName || ""} ${s.lastName}`.toLowerCase();
        const matchQ = !q || name.includes(q) || (s.id || "").toLowerCase().includes(q) ||
          (s.email || "").toLowerCase().includes(q) || (s.phone || "").includes(q);
        const matchDept = !dept || s.department === dept;
        const matchType = !type || s.staffType === type;
        const matchStatus = !status || s.employmentStatus === status;
        return matchQ && matchDept && matchType && matchStatus;
      });

      document.getElementById("directoryBody").innerHTML = renderDirectoryRows(filtered);
    }

    function saveStaff(e) {
      e.preventDefault();

      const id = document.getElementById("staffId").value;
      const data = {
        id,
        staffType: document.getElementById("staffType").value,
        firstName: document.getElementById("firstName").value.trim(),
        middleName: document.getElementById("middleName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),

        department: document.getElementById("department").value,
        jobTitle: document.getElementById("jobTitle").value.trim(),
        employmentType: document.getElementById("employmentType").value,
        employmentStatus: document.getElementById("employmentStatus").value,
        dateJoined: document.getElementById("dateJoined").value,
        supervisor: document.getElementById("supervisor").value.trim(),
        workLocation: document.getElementById("workLocation").value.trim(),
        contractStart: document.getElementById("contractStart").value,
        contractEnd: document.getElementById("contractEnd").value,
        commissionRate: document.getElementById("commissionRate").value,
        commissionType: document.getElementById("commissionType").value,
        salesTarget: document.getElementById("salesTarget").value,
        totalSales: document.getElementById("totalSales").value,
        basicSalary: document.getElementById("basicSalary").value,
        allowances: document.getElementById("allowances").value,
        deductions: document.getElementById("deductions").value,
        updatedAt: new Date().toISOString()
      };

      if (state.editingStaffId) {
        // Update existing
        updateData(`staff/${state.editingStaffId}`, data).then(() => {
          showToast("Staff record updated successfully", "success");
          state.editingStaffId = null;
          loadAllData().then(() => navigateTo("directory"));
        }).catch(err => {
          console.error(err);
          showToast("Failed to update staff record", "error");
        });
      } else {
        // Check for duplicate ID
        if (state.staff.find(s => s.id === id)) {
          showToast("Staff ID already exists. Please refresh the page.", "error");
          return;
        }
        // Write new
        writeData(`staff/${id}`, data).then(() => {
          showToast("Staff registered successfully", "success");
          loadAllData().then(() => navigateTo("directory"));
        }).catch(err => {
          console.error(err);
          showToast("Failed to save staff record", "error");
        });
      }
    }

    function editStaff(id) {

    function deleteStaff(id) {
      const staff = state.staff.find(s => s.id === id);
      if (!staff) return;
      if (!confirm(`Are you sure you want to delete ${staff.firstName} ${staff.lastName} (${id})?\n\nThis will also remove their attendance, leave, assignments, payroll and performance records.`)) return;

      // Delete staff and all related data
      const updates = {};
      updates[`staff/${id}`] = null;

      // Remove related attendance
      state.attendance.filter(a => a.staffId === id).forEach(a => {
        updates[`attendance/${a.id}`] = null;
      });
      // Remove related leave
      state.leaveRequests.filter(l => l.staffId === id).forEach(l => {
        updates[`leaveRequests/${l.id}`] = null;
      });
      // Remove related assignments
      state.assignments.filter(a => a.staffId === id).forEach(a => {
        updates[`staffAssignments/${a.id}`] = null;
      });
      // Remove related payroll
      state.payroll.filter(p => p.staffId === id).forEach(p => {
        updates[`payroll/${p.id}`] = null;
      });
      // Remove related performance
      state.performanceReviews.filter(r => r.staffId === id).forEach(r => {
        updates[`performanceReviews/${r.id}`] = null;
      });
      // Remove related documents
      state.documents.filter(d => d.staffId === id).forEach(d => {
        updates[`staffDocuments/${d.id}`] = null;
      });

      db.ref().update(updates).then(() => {
        showToast("Staff record and all related data deleted", "success");
        loadAllData().then(() => {
          if (state.currentPage === "profile") state.currentPage = "directory";
          navigateTo(state.currentPage);
        });
      }).catch(err => {
        console.error(err);
        showToast("Failed to delete staff record", "error");
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));

      const btn = Array.from(document.querySelectorAll(".tab-btn")).find(b =>
        b.textContent.toLowerCase().includes(tabName)
      );
      if (btn) btn.classList.add("active");

      const panel = document.getElementById(`tab-${tabName}`);
      if (panel) panel.classList.add("active");
    }

    function autoFillPayroll() {
      const staffId = document.getElementById("payStaffId").value;
      const staff = state.staff.find(s => s.id === staffId);
      if (staff) {
        document.getElementById("payBasic").value = staff.basicSalary || "";
        document.getElementById("payAllowances").value = staff.allowances || "";
        document.getElementById("payDeductions").value = staff.deductions || "";
        calcNetPay();
      }
    }

    function calcNetPay() {
      const basic = Number(document.getElementById("payBasic").value) || 0;
      const allow = Number(document.getElementById("payAllowances").value) || 0;
      const deduct = Number(document.getElementById("payDeductions").value) || 0;
      document.getElementById("payNet").value = basic + allow - deduct;
    }

                  <tr>
                    <td>${esc(a.firstName)} ${esc(a.lastName)}</td>
                    <td><span style="color:#38bdf8;">${esc(a.id)}</span></td>
                    <td>KES ${Number(a.salesTarget || 0).toLocaleString()}</td>
                    <td>KES ${Number(a.totalSales || 0).toLocaleString()}</td>
                    <td style="color:#4ade80;font-weight:700;">KES ${Number(a.totalSales * (a.commissionRate / 100) || 0).toLocaleString()}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
        ` : ""}
      `;
    }

    // ============================================================
    // 19. SETTINGS PAGE
    // ============================================================
    function renderSettings() {
      return `
        <div class="page-header">
          <div>
            <h1><i class="fa-solid fa-gear" style="color:#38bdf8;margin-right:0.5rem;"></i> Settings</h1>
            <p>System configuration and data management.</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2><i class="fa-solid fa-database"></i> Firebase Connection</h2></div>
          <div class="form-grid">
            <div class="form-group full">
              <label>Database URL</label>
              <input type="text" value="https://ngt-hr-management-system-default-rtdb.firebaseio.com/" readonly style="color:#38bdf8;">
            </div>
            <div class="form-group">
              <label>Connection Status</label>
              <input type="text" value="${state.loading ? "Connecting…" : "Connected ✓"}" readonly style="color:${state.loading ? "#fbbf24" : "#4ade80"};">
            </div>
            <div class="form-group">
              <label>Total Records Loaded</label>
              <input type="text" value="${state.staff.length + state.attendance.length + state.leaveRequests.length + state.assignments.length + state.payroll.length + state.performanceReviews.length + state.documents.length}" readonly>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2><i class="fa-solid fa-building"></i> Departments</h2></div>
          <div class="form-grid">
            ${state.departments.map(d => `
              <div class="form-group">
                <input type="text" value="${esc(d)}" readonly>
              </div>
            `).join("")}
          </div>
          <p style="font-size:0.8rem;color:#4a5f7a;margin-top:0.75rem;">
            <i class="fa-solid fa-info-circle"></i> Departments are currently managed in the system configuration. They can be stored in Firebase for dynamic management.
          </p>
        </div>

        <div class="panel">
          <div class="panel-header"><h2><i class="fa-solid fa-triangle-exclamation" style="color:#f87171;"></i> Danger Zone</h2></div>
          <p style="color:#8ba0bc;font-size:0.88rem;margin-bottom:1rem;">
            These actions are irreversible. Use with extreme caution.
          </p>
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
            <button class="btn btn-ghost" style="color:#f87171;border-color:#7f1d1d;" onclick="clearAllData()">
              <i class="fa-solid fa-trash"></i> Clear All Data
            </button>
            <button class="btn btn-ghost" onclick="loadAllData().then(() => { renderPage(); showToast('Data refreshed'); })">
              <i class="fa-solid fa-rotate"></i> Refresh Data
            </button>
          </div>
        </div>
      `;
    }

    function clearAllData() {
      if (!confirm("⚠️ WARNING: This will permanently delete ALL staff, attendance, leave, assignments, payroll, performance and document records from Firebase.\n\nThis cannot be undone. Are you absolutely sure?")) return;
      if (!confirm("Final confirmation: Delete ALL data?")) return;

      const updates = {};
      ["staff", "attendance", "leaveRequests", "staffAssignments", "payroll", "performanceReviews", "staffDocuments"].forEach(col => {
        updates[col] = null;
      });

      db.ref().update(updates).then(() => {
        showToast("All data cleared from Firebase", "success");
        state.staff = [];
        state.attendance = [];
        state.leaveRequests = [];
        state.assignments = [];
        state.payroll = [];
        state.performanceReviews = [];
        state.documents = [];
        state.staffCounter = 0;
        state.attendanceCounter = 0;
        state.leaveCounter = 0;
        state.assignmentCounter = 0;
        state.payrollCounter = 0;
        state.reviewCounter = 0;
        state.documentCounter = 0;
        renderPage();
      }).catch(err => {
        console.error(err);
        showToast("Failed to clear data", "error");
      });
    }

    // ============================================================
    // 20. NAVIGATION & MODAL
    // ============================================================
    function navigateTo(page) {
      state.currentPage = page;
      if (page !== "add-staff") state.editingStaffId = null;
      if (page !== "profile") state.selectedStaffId = null;

      // Update sidebar active state
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      const navBtn = document.querySelector(`.nav-item[data-page="${page}"]`);
      if (navBtn) navBtn.classList.add("active");

      renderPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("open");
    }

    // Close modal on overlay click
    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    // Close modal on Escape
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // ============================================================
    // 21. INITIALIZATION
    // ============================================================
    async function init() {
      showLoading();

      // Attach sidebar navigation handlers
      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
          const page = btn.dataset.page;
          if (page) navigateTo(page);
        });
      });

      // Load data from Firebase
      const ok = await loadAllData();

      if (ok) {
        renderPage();
        showToast("Staff Management System loaded", "success");
      } else {
        // Show error state with retry
        document.getElementById("mainContent").innerHTML = `
          <div class="page-header">
            <h1><i class="fa-solid fa-triangle-exclamation" style="color:#f87171;margin-right:0.5rem;"></i> Connection Error</h1>
            <p>Could not load data from Firebase.</p>
          </div>
          <div class="panel">
            <div class="empty-state">
              <i class="fa-solid fa-wifi" style="color:#f87171;"></i>
              <p>Failed to connect to the Firebase Realtime Database.</p>
              <p style="font-size:0.8rem;color:#4a5f7a;margin-top:0.5rem;">
                URL: "https://ngt-hr-management-system-default-rtdb.firebaseio.com/"
              </p>
              <button class="btn btn-primary" onclick="init()" style="margin-top:1.5rem;">
                <i class="fa-solid fa-rotate"></i> Retry Connection
              </button>
            </div>
          </div>
        `;
      }
    }

    // Start the application
    init();
  </script>
</body>
</html>

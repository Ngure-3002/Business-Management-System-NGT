<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGT Supplier Management System | Ngure Gacheru Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   NGT SUPPLIER MANAGEMENT SYSTEM
   Base theme (supplied) + application layer
   ============================================================ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root{
  --bg:#0b1117;
  --panel:#111c29;
  --panel2:#1a2536;
  --panel3:#16223a;
  --border:#243244;
  --border2:#2d3a4f;
  --text:#e0e7ff;
  --muted:#8ba0bc;
  --accent:#38bdf8;
  --accent2:#a5f3fc;
  --ok:#22c55e;
  --warn:#f59e0b;
  --danger:#ef4444;
  --info:#818cf8;
  --radius:16px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}

body {
  font-family: 'Inter', sans-serif;
  background-color: #0b1117;
  color: #e0e7ff;
  line-height: 1.6;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 2rem;
}

/* ===== HEADER ===== */
.header {
  background: #0f172a;
  border-bottom: 2px solid #1e2c3a;
  box-shadow: 0 4px 20px rgba(0, 180, 255, 0.1);
  position: sticky;
  top: 0;
  z-index: 900;
  backdrop-filter: blur(6px);
  background-color: rgba(15, 23, 42, 0.97);
}

.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 1.5rem;
  gap: 1rem;
}

.brand-wrap{ display:flex; align-items:center; gap:1rem; min-width:0; }
.brand-mark{
  width:46px;height:46px;flex:0 0 46px;border-radius:14px;
  background:linear-gradient(135deg,#0ea5e9,#22d3ee);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.15rem;color:#06121c;
  box-shadow:0 0 22px rgba(56,189,248,.45);
}
.company-name {
  font-size: 1.35rem;
  font-weight: 700;
  background: linear-gradient(135deg, #a5f3fc, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
  white-space:nowrap;
}
.motto {
  font-size: .78rem;
  color: #9ab3d8;
  font-style: italic;
  border-left: 3px solid #38bdf8;
  padding-left: 0.6rem;
  margin-top: 0.15rem;
  white-space:nowrap;
}

.header-accent { display: flex; gap: 8px; align-items:center; }
.dot {
  width: 10px;
  height: 10px;
  background-color: #38bdf8;
  border-radius: 50%;
  opacity: 0.7;
  animation: pulse 2s infinite;
}
.dot:nth-child(2) { animation-delay: 0.4s; }
.dot:nth-child(3) { animation-delay: 0.8s; }

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.3); opacity: 1; }
}

.header-tools{ display:flex; align-items:center; gap:.65rem; flex-wrap:wrap; justify-content:flex-end; }
.conn-pill{
  display:inline-flex;align-items:center;gap:.45rem;
  font-size:.75rem;padding:.35rem .75rem;border-radius:999px;
  border:1px solid var(--border2);background:#0d1726;color:var(--muted);
}
.conn-pill .led{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px currentColor;}
.conn-pill.online .led{background:var(--ok);}
.conn-pill.offline .led{background:var(--danger);}

.role-select{
  background:#0d1726;border:1px solid var(--border2);color:var(--text);
  padding:.42rem .7rem;border-radius:10px;font-size:.8rem;font-family:inherit;outline:none;
}
.role-select:focus{border-color:var(--accent);}

.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border2);
  background:#0d1726;color:var(--muted);cursor:pointer;position:relative;
  display:inline-flex;align-items:center;justify-content:center;transition:.2s;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);background:#122033;}
.badge-count{
  position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;
  font-size:.62rem;font-weight:700;min-width:18px;height:18px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #0f172a;
}

/* ===== APP LAYOUT ===== */
.app-body{ display:flex; align-items:flex-start; min-height:calc(100vh - 72px); }

.sidebar{
  width:255px; flex:0 0 255px;
  background:#0d1622;
  border-right:1px solid #1e2c3a;
  height:calc(100vh - 72px);
  position:sticky; top:72px;
  overflow-y:auto;
  padding:.75rem 0 2rem;
  transition:transform .25s ease;
}
.sidebar::-webkit-scrollbar{width:8px;}
.sidebar::-webkit-scrollbar-thumb{background:#1e2c3a;border-radius:8px;}

.nav-group-title{
  font-size:.66rem;text-transform:uppercase;letter-spacing:1.6px;
  color:#4d6party;color:#516b8a;padding:1rem 1.3rem .45rem;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.62rem 1.3rem;color:#9ab3d8;cursor:pointer;font-size:.88rem;
  border-left:3px solid transparent;transition:.16s;user-select:none;
}
.nav-item i{width:18px;text-align:center;font-size:.95rem;}
.nav-item:hover{background:#131f31;color:#e0f2fe;}
.nav-item.active{background:#132437;color:#38bdf8;border-left-color:#38bdf8;font-weight:600;}
.nav-item .nav-tag{
  margin-left:auto;font-size:.65rem;background:#1e2c3a;color:#8ba0bc;
  padding:.05rem .45rem;border-radius:999px;
}

.main{ flex:1; min-width:0; padding:1.4rem 1.6rem 5rem; }
.main-inner{ max-width:1500px; margin:0 auto; }

/* ===== PAGE HEAD ===== */
.page-head{
  display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;
  flex-wrap:wrap;margin-bottom:1.4rem;
}
.page-title{ font-size:1.6rem; font-weight:700; color:#eaf4ff; display:flex; align-items:center; gap:.6rem;}
.page-title i{color:var(--accent);}
.page-sub{ color:var(--muted); font-size:.88rem; margin-top:.15rem;}

/* ===== CARDS / KPI ===== */
.kpi-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:1rem; margin-bottom:1.6rem;
}
.kpi-card{
  background:linear-gradient(160deg,#152233,#111b29);
  border:1px solid var(--border);
  border-radius:18px; padding:1.1rem 1.2rem;
  position:relative; overflow:hidden; transition:.25s;
}
.kpi-card::after{
  content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.16),transparent 70%);
}
.kpi-card:hover{ transform:translateY(-4px); border-color:#33506f; box-shadow:0 16px 30px -14px #000; }
.kpi-label{ font-size:.72rem; text-transform:uppercase; letter-spacing:1.1px; color:var(--muted); font-weight:600; }
.kpi-value{ font-size:1.6rem; font-weight:700; color:#f0f9ff; margin-top:.35rem; letter-spacing:-.5px; word-break:break-word;}
.kpi-foot{ font-size:.75rem; color:#7d93b3; margin-top:.3rem; }
.kpi-icon{
  position:absolute;right:1rem;top:1rem;font-size:1.5rem;color:rgba(56,189,248,.35);
}
.kpi-card.ok .kpi-value{color:#86efac;}
.kpi-card.warn .kpi-value{color:#fcd34d;}
.kpi-card.danger .kpi-value{color:#fca5a5;}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.2rem 1.3rem;
  margin-bottom:1.4rem;
}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  margin-bottom:1rem;flex-wrap:wrap;
}
.panel-title{ font-size:1.02rem;font-weight:700;color:#dbeafe;display:flex;align-items:center;gap:.55rem;}
.panel-title i{color:var(--accent);}

.grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:1.2rem; }

/* ===== TABLES ===== */
.table-wrap{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.table-toolbar{
  display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
  padding:.9rem 1rem;border-bottom:1px solid var(--border);background:#0f1a27;
}
.search-box{
  display:flex;align-items:center;gap:.5rem;background:#0b1420;border:1px solid var(--border2);
  border-radius:10px;padding:.42rem .75rem;min-width:230px;flex:1;max-width:340px;
}
.search-box i{color:#5b7characters;color:#5b7a9c;font-size:.85rem;}
.search-box input{
  background:transparent;border:none;outline:none;color:var(--text);
  font-family:inherit;font-size:.85rem;width:100%;
}
.filter-select{
  background:#0b1420;border:1px solid var(--border2);color:var(--text);
  padding:.45rem .65rem;border-radius:10px;font-family:inherit;font-size:.82rem;outline:none;cursor:pointer;
}
.filter-select:focus{border-color:var(--accent);}

.table-scroll{ overflow-x:auto; }
table.data-table{ width:100%; border-collapse:collapse; font-size:.83rem; min-width:640px; }
table.data-table thead th{
  text-align:left;padding:.72rem .9rem;background:#0f1a27;color:#8fb2d6;
  font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;
  border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;
}
table.data-table thead th:hover{color:var(--accent);}
table.data-table tbody td{
  padding:.68rem .9rem;border-bottom:1px solid #1a2635;color:#cddbf0;vertical-align:middle;
}
table.data-table tbody tr:hover{background:#14202f;}
table.data-table tbody tr:last-child td{border-bottom:none;}
.t-right{text-align:right !important;}
.t-center{text-align:center !important;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;color:#7dd3fc;}
.no-rows td{ text-align:center;padding:2.2rem 1rem;color:#5c7characters;color:#5c7a9c;font-style:italic; }

/* ===== BADGES ===== */
.badge{
  display:inline-block;padding:.2rem .6rem;border-radius:999px;
  font-size:.68rem;font-weight:700;letter-spacing:.4px;white-space:nowrap;
  border:1px solid transparent;
}
.b-ok{background:rgba(34,197,94,.13);color:#4ade80;border-color:rgba(34,197,94,.35);}
.b-warn{background:rgba(245,158,11,.13);color:#fbbf24;border-color:rgba(245,158,11,.35);}
.b-danger{background:rgba(239,68,68,.13);color:#f87171;border-color:rgba(239,68,68,.35);}
.b-info{background:rgba(56,189,248,.13);color:#38bdf8;border-color:rgba(56,189,248,.35);}
.b-muted{background:rgba(139,160,188,.12);color:#9ab3d8;border-color:rgba(139,160,188,.3);}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;align-items:center;gap:.5rem;justify-content:center;
  padding: 0.68rem 1.4rem;
  border-radius: 12px;
  font-weight: 600;
  font-size:.85rem;
  text-decoration: none;
  transition: all 0.22s ease;
  border: 1px solid transparent;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.btn-primary {
  background: #38bdf8;
  color: #06121c;
  box-shadow: 0 8px 16px #38bdf830;
}
.btn-primary:hover {
  background: #7dd3fc;
  transform: translateY(-2px);
  box-shadow: 0 14px 22px #38bdf860;
}
.btn-outline {
  border: 1px solid #38bdf8;
  color: #bae6fd;background:transparent;
}
.btn-outline:hover { background: rgba(56,189,248,.14); transform: translateY(-2px); }
.btn-ghost{
  background:#152233;border:1px solid var(--border2);color:#a9c3e0;
}
.btn-ghost:hover{ background:#1b2b41;color:#e0f2fe;border-color:#3a5878;}
.btn-danger{ background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.45); color:#fca5a5;}
.btn-danger:hover{background:rgba(239,68,68,.25);}
.btn-sm{ padding:.42rem .8rem; font-size:.76rem; border-radius:9px;}
.btn-xs{ padding:.25rem .55rem; font-size:.7rem; border-radius:7px;}

/* ===== FORMS ===== */
.form-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem 1rem;
}
.form-field{ display:flex;flex-direction:column;gap:.32rem;min-width:0; }
.form-field.span-2{ grid-column:1 / -1; }
.form-field label{ font-size:.76rem;font-weight:600;color:#9fb8d6;letter-spacing:.3px;}
.form-field label .req{color:#f87171;}
.form-field small{ font-size:.7rem;color:#6b85a6; }
.form-field input[type=text],
.form-field input[type=number],
.form-field input[type=date],
.form-field input[type=email],
.form-field input[type=tel],
.form-field input[type=url],
.form-field select,
.form-field textarea{
  background:#0b1420;border:1px solid var(--border2);color:var(--text);
  padding:.58rem .72rem;border-radius:10px;font-family:inherit;font-size:.85rem;
  outline:none;transition:.18s;width:100%;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.13);
}
.form-field input[readonly]{ background:#0e1826;color:#7d93b3;cursor:not-allowed; }
.form-field textarea{ resize:vertical;min-height:70px; }
.form-section-title{
  grid-column:1 / -1;
  font-size:.72rem;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;
  color:#38bdf8;border-bottom:1px solid #1e2c3a;padding-bottom:.35rem;margin-top:.5rem;
}
.ms-box{
  display:flex;flex-wrap:wrap;gap:.4rem;background:#0b1420;border:1px solid var(--border2);
  border-radius:10px;padding:.6rem;max-height:150px;overflow-y:auto;
}
.ms-item{
  display:inline-flex;align-items:center;gap:.35rem;background:#152233;
  border:1px solid #24354b;padding:.24rem .55rem;border-radius:999px;
  font-size:.75rem;color:#b8cde6;cursor:pointer;
}
.ms-item input{accent-color:#38bdf8;cursor:pointer;}
.ms-item:hover{border-color:#38bdf8;color:#e0f2fe;}

/* line items editor */
.items-editor{ margin-top:.4rem; }
.items-editor table{ width:100%; border-collapse:collapse; font-size:.8rem; min-width:700px;}
.items-editor th{
  background:#0f1a27;color:#8fb2d6;font-size:.68rem;text-transform:uppercase;
  letter-spacing:.7px;padding:.5rem .5rem;text-align:left;border-bottom:1px solid var(--border);
}
.items-editor td{ padding:.3rem .35rem;border-bottom:1px solid #1a2635; }
.items-editor input, .items-editor select{
  width:100%;background:#0b1420;border:1px solid #24354b;color:var(--text);
  padding:.38rem .45rem;border-radius:8px;font-family:inherit;font-size:.78rem;outline:none;
}
.items-editor input:focus,.items-editor select:focus{border-color:var(--accent);}
.items-total-bar{
  display:flex;justify-content:flex-end;gap:1.6rem;flex-wrap:wrap;
  margin-top:.8rem;padding:.8rem 1rem;background:#0f1a27;border-radius:12px;border:1px solid var(--border);
}
.items-total-bar div{ font-size:.82rem;color:#9fb8d6; }
.items-total-bar strong{ color:#eaf4ff;font-size:.95rem;display:block;text-align:right;}
.items-total-bar .grand strong{ color:#38bdf8;font-size:1.15rem; }

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,9,15,.78);backdrop-filter:blur(4px);
  z-index:1200;display:flex;align-items:flex-start;justify-content:center;
  padding:2.2rem 1rem;overflow-y:auto;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#111c29;border:1px solid #26374d;border-radius:20px;
  width:100%;max-width:960px;box-shadow:0 30px 70px rgba(0,0,0,.7);
  animation:slideUp .22s ease;overflow:hidden;
}
.modal.narrow{max-width:560px;}
.modal.wide{max-width:1200px;}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:1rem 1.3rem;border-bottom:1px solid var(--border);background:#0f1a27;
}
.modal-head h3{ font-size:1.05rem;font-weight:700;color:#eaf4ff;display:flex;align-items:center;gap:.55rem;}
.modal-head h3 i{color:var(--accent);}
.modal-body{ padding:1.3rem;max-height:70vh;overflow-y:auto; }
.modal-foot{
  display:flex;justify-content:flex-end;gap:.65rem;padding:.9rem 1.3rem;
  border-top:1px solid var(--border);background:#0f1a27;flex-wrap:wrap;
}

/* detail list */
.detail-grid{ display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.9rem; }
.detail-item{ background:#0f1a27;border:1px solid #1e2c3a;border-radius:12px;padding:.7rem .9rem; }
.detail-item .dl{ font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:#6b85a6;font-weight:700;}
.detail-item .dv{ font-size:.88rem;color:#e2edf9;margin-top:.2rem;word-break:break-word;}

/* ===== CHARTS ===== */
.chart-box{ position:relative;height:250px;width:100%; }
.chart-box canvas{ width:100%;height:100%;display:block; }
.chart-empty{
  height:100%;display:flex;align-items:center;justify-content:center;
  color:#4f6b8c;font-style:italic;font-size:.85rem;
}

/* ===== MISC ===== */
.empty-state{
  text-align:center;padding:3.5rem 1rem;color:#5c7a9c;
}
.empty-state i{ font-size:3rem;color:#22364d;margin-bottom:1rem;display:block;}
.empty-state h4{ color:#8fb2d6;font-size:1rem;margin-bottom:.35rem;font-weight:600;}
.empty-state p{ font-size:.85rem;max-width:420px;margin:0 auto;}

.toast-wrap{ position:fixed;right:1.2rem;bottom:1.2rem;z-index:2000;display:flex;flex-direction:column;gap:.55rem;}
.toast{
  background:#152233;border:1px solid #2d4a6b;border-left:4px solid var(--accent);
  color:#dbeafe;padding:.75rem 1.05rem;border-radius:12px;font-size:.84rem;
  box-shadow:0 14px 30px rgba(0,0,0,.55);animation:slideIn .22s ease;min-width:230px;max-width:340px;
}
.toast.ok{border-left-color:var(--ok);}
.toast.err{border-left-color:var(--danger);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

.tabs{ display:flex;gap:.4rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem;flex-wrap:wrap;}
.tab{
  padding:.55rem 1rem;font-size:.83rem;color:#8ba0bc;cursor:pointer;
  border-bottom:2px solid transparent;font-weight:600;transition:.18s;
}
.tab:hover{color:#cfe4fa;}
.tab.active{color:#38bdf8;border-bottom-color:#38bdf8;}

.aging-bar{ display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--border);margin:.9rem 0;}
.aging-seg{ display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#06121c;min-width:0;overflow:hidden;white-space:nowrap;}

.mini-list{ list-style:none; }
.mini-list li{
  display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;
  border-bottom:1px solid #1a2635;font-size:.83rem;color:#c3d5ec;
}
.mini-list li:last-child{border-bottom:none;}
.mini-list .val{color:#38bdf8;font-weight:600;white-space:nowrap;}

.note-box{
  background:#0f1a27;border:1px dashed #2d4a6b;border-radius:12px;
  padding:.9rem 1.1rem;font-size:.82rem;color:#9fb8d6;margin-bottom:1.2rem;
}
.note-box i{color:#38bdf8;margin-right:.45rem;}

.hero-graphic { display: flex; gap: 2rem; justify-content: center; font-size: 5rem; color: #38bdf860; }
.hero-graphic i { animation: float 4s ease-in-out infinite; filter: drop-shadow(0 0 15px #38bdf8); }
.hero-graphic i:nth-child(2) { animation-delay: 0.6s; }
.hero-graphic i:nth-child(3) { animation-delay: 1.2s; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

.animate-on-view { opacity: 0; transform: translateY(35px); transition: opacity 0.7s ease, transform 0.7s ease; }
.animate-on-view.visible { opacity: 1; transform: translateY(0); }

.footer {
  background: #0a111a;
  padding: 1.6rem 0;
  border-top: 1px solid #1e2c3c;
  text-align: center;
  color: #8ba0bc;
  font-size:.82rem;
}

.mobile-toggle{ display:none; }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px){
  .grid-2{ grid-template-columns:1fr; }
}
@media (max-width: 860px) {
  .mobile-toggle{ display:inline-flex; }
  .sidebar{
    position:fixed;top:72px;left:0;z-index:800;

/* ----------------------------------------------------------------------------
   6. UTILITIES
---------------------------------------------------------------------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

function esc(v){
  return String(v===undefined||v===null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(v){ const n = parseFloat(v); return isNaN(n)?0:n; }
function today(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }

function settings(){
  const s = state.data.settings || {};
  return {
    company: Object.assign({}, DEFAULT_SETTINGS.company, s.company||{}),
    tax: Object.assign({}, DEFAULT_SETTINGS.tax, s.tax||{}),
    numbering: Object.assign({}, DEFAULT_SETTINGS.numbering, s.numbering||{})
  };
}
function currency(){ return settings().tax.currency || 'KES'; }
function money(v){
  const n = num(v);
  return currency()+' '+n.toLocaleString('en-KE',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function money0(v){
  const n = num(v);
  return currency()+' '+n.toLocaleString('en-KE',{minimumFractionDigits:0, maximumFractionDigits:0});
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return esc(d);
  return dt.toLocaleDateString('en-GB');
}
function daysBetween(a,b){
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d1-d2)/(1000*60*60*24));
}
function daysFromToday(d){
  if(!d) return null;
  return daysBetween(d, today());
}
function monthKey(d){ return (d||'').slice(0,7); }
function monthLabel(k){
  if(!k) return '';
  const [y,m] = k.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(m,10)-1]+' '+y.slice(2);
}
function lastNMonths(n){
  const out = [];
  const d = new Date();
  d.setDate(1);
  for(let i=n-1;i>=0;i--){
    const t = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(t.toISOString().slice(0,7));
  }
  return out;
}
function uid(){ return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ----------------------------------------------------------------------------
   7. DATA ACCESS
---------------------------------------------------------------------------- */
function list(name){
  const o = state.data[name];
  if(!o || typeof o !== 'object') return [];
  return Object.keys(o).map(k => {
    const v = o[k];
    if(v && typeof v === 'object') return Object.assign({}, v, {_id:k});
    return {_id:k, value:v};
  });
}
function find(name, id){
  if(!id) return null;
  return list(name).find(r => r._id === id) || null;
}
function supLabel(key){
  const s = find('suppliers', key);
  if(!s) return key? String(key) : '—';
  return s.name || s.supplierId || '—';
}
function supCode(key){
  const s = find('suppliers', key);
  return s ? (s.supplierId||'') : '';
}
function invLabel(key){
  const i = find('invoices', key);
  if(!i) return key? String(key) : '—';
  return (i.invoiceId||'') + (i.supplierInvoiceNo? ' / '+i.supplierInvoiceNo : '');
}
function poLabel(key){
  const p = find('purchaseOrders', key);
  return p ? (p.poNo||'') : (key||'—');
}

/* ----------------------------------------------------------------------------
   8. CALCULATIONS
---------------------------------------------------------------------------- */
function itemsTotal(items, opts){
  opts = opts || {};
  const arr = Array.isArray(items)? items : [];
  let sub = 0, disc = 0, tax = 0;
  arr.forEach(it=>{
    const qty = num(it.qty ?? it.qtyOrdered ?? it.qtyReceived);
    const up  = num(it.unitPrice ?? it.estimatedUnitCost);
    const line = qty * up;
    const d = num(it.discount);
    sub += line;
    disc += d;
    if(!opts.noTax) tax += (line - d) * (num(it.taxRate)/100);
  });
  const delivery = num(opts.delivery);
  const total = sub - disc + tax + delivery;
  return { sub, disc, tax, delivery, total };
}
function rfqTotal(r){
  return itemsTotal(r.items,{delivery:r.deliveryCharge}).total;
}
function poTotal(r){
  return itemsTotal(r.items,{delivery:r.deliveryCharge}).total;
}
function invoiceTotal(r){
  return itemsTotal(r.items,{delivery:r.deliveryCharge}).total;
}
function paymentsForInvoice(invoiceId){
  return list('payments').filter(p => p.invoiceRef === invoiceId && p.status !== 'Reversed');
}
function invoicePaid(invoiceId){
  const inv = find('invoices', invoiceId);
  const credits = list('creditNotes')
      .filter(c => c.invoiceRef === invoiceId && (c.status === 'Applied'))
      .reduce((a,c)=>a+num(c.amount),0);
  const paid = paymentsForInvoice(invoiceId).reduce((a,p)=>a+num(p.amount),0);
  return paid + credits;
}
function invoiceBalance(inv){
  if(!inv) return 0;
  return invoiceTotal(inv) - invoicePaid(inv._id);
}
function invoiceStatus(inv){
  if(!inv) return 'Unpaid';
  if(inv.status === 'Cancelled') return 'Cancelled';
  if(inv.status === 'Disputed') return 'Disputed';
  const bal = invoiceBalance(inv);
  const total = invoiceTotal(inv);
  if(bal <= 0.005) return 'Paid';
  if(daysFromToday(inv.dueDate) !== null && daysFromToday(inv.dueDate) < 0) return 'Overdue';
  if(invoicePaid(inv._id) > 0.005 && bal < total) return 'Partially Paid';
  return 'Unpaid';
}
function supplierPayables(supplierKey){
  return list('invoices')
    .filter(i => i.supplierKey === supplierKey && i.status !== 'Cancelled')
    .reduce((a,i)=> a + Math.max(0, invoiceBalance(i)), 0);
}
function supplierSpend(supplierKey){
  return list('purchaseOrders')
    .filter(p => p.supplierKey === supplierKey && p.status !== 'Cancelled')
    .reduce((a,p)=> a + poTotal(p), 0);
}

const BADGE_MAP = {
  'Active':'ok','Approved':'ok','Paid':'ok','Fully Delivered':'ok','Completed':'ok',
  'Resolved':'ok','Closed':'ok','Available':'ok','Accepted':'ok','Valid':'ok',
  'Done':'ok','Compliant':'ok','Applied':'ok','Quotation Received':'ok','Credited':'ok',
  'Draft':'muted','Inactive':'muted','Cancelled':'muted','Discontinued':'muted',
  'Terminated':'muted','Unknown':'muted','Missing':'muted',
  'Pending Approval':'warn','Pending Verification':'warn','Partially Paid':'warn',
  'Partially Delivered':'warn','Sent to Supplier':'warn','Open':'warn','In Progress':'warn',
  'Inspection':'warn','Return Requested':'warn','Pre-order':'warn','Expiring Soon':'warn',
  'Pending':'warn','Low':'muted','Normal':'info','High':'warn','Urgent':'danger',
  'Overdue':'danger','Suspended':'danger','Blacklisted':'danger','Disputed':'danger',
  'Rejected':'danger','Out of Stock':'danger','Non-Compliant':'danger','Expired':'danger',
  'Unpaid':'info','Received':'info','Approved ':'ok','Partially Accepted':'warn',
  'Supplier Approved':'ok','Returned':'info','Replaced':'ok','Converted to PO':'ok',
  'Converted':'ok','Invoiced':'ok','Reversed':'danger','Pending Verification ':'warn'
};
function badge(text){
  const t = String(text===undefined||text===null?'':text);
  if(!t) return '<span class="badge b-muted">—</span>';
  return `<span class="badge b-${BADGE_MAP[t]||'info'}">${esc(t)}</span>`;
}
function expiryBadge(dateStr){
  if(!dateStr) return '<span class="badge b-muted">No date</span>';
  const d = daysFromToday(dateStr);
  if(d === null) return '<span class="badge b-muted">—</span>';
  if(d < 0)  return `<span class="badge b-danger">Expired ${Math.abs(d)}d ago</span>`;
  if(d <= 30) return `<span class="badge b-warn">${d}d left</span>`;
  return `<span class="badge b-ok">${d}d left</span>`;
}
function dueBadge(dateStr, status){
  if(status === 'Done') return '<span class="badge b-ok">Completed</span>';
  if(status === 'Cancelled') return '<span class="badge b-muted">Cancelled</span>';
  if(!dateStr) return '<span class="badge b-muted">No date</span>';
  const d = daysFromToday(dateStr);
  if(d === null) return '<span class="badge b-muted">—</span>';
  if(d < 0) return `<span class="badge b-danger">${Math.abs(d)}d overdue</span>`;
  if(d === 0) return '<span class="badge b-warn">Due today</span>';
  if(d <= 3) return `<span class="badge b-warn">Due in ${d}d</span>`;
  return `<span class="badge b-info">In ${d}d</span>`;
}

function toast(msg, type){
  const wrap = $('#toastWrap');
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  el.innerHTML = `<i class="fa ${type==='ok'?'fa-circle-check':type==='err'?'fa-circle-exclamation':'fa-circle-info'}" style="margin-right:.5rem"></i>${esc(msg)}`;

---------------------------------------------------------------------------- */
async function nextNumber(collectionKey){
  const prefix = settings().numbering[collectionKey] || 'NGT-REF';
  const snap = await DB.ref('counters/'+collectionKey).transaction(c => (c||0)+1);
  const n = snap.snapshot.val() || 1;
  return prefix + '-' + String(n).padStart(4,'0');
}

/* ----------------------------------------------------------------------------
   13. CRUD
---------------------------------------------------------------------------- */
async function saveRecord(collection, obj, id){
  try{
    if(id){
      const before = find(collection, id);
      await DB.ref(collection+'/'+id).set(obj);
      audit('UPDATE', collection, id, obj[COLLECTIONS[collection].idField] || '', 'Record updated');
      if(before && (collection==='suppliers') && before.accountNumber !== obj.accountNumber){
        audit('BANK-CHANGE', collection, id, obj.name, `Account changed from "${before.accountNumber||'—'}" to "${obj.accountNumber||'—'}"`);
      }
    }else{
      const ref = DB.ref(collection).push();
      await ref.set(obj);
      audit('CREATE', collection, ref.key, obj[COLLECTIONS[collection].idField] || '', 'Record created');
    }
    return true;
  }catch(e){
    console.error(e);
    toast('Save failed: '+e.message,'err');
    return false;
  }
}
async function deleteRecord(collection, id){
  const rec = find(collection, id);
  try{
    await DB.ref(collection+'/'+id).remove();
    audit('DELETE', collection, id, rec ? (rec[COLLECTIONS[collection].idField]||rec.name||'') : '', 'Record deleted');
    toast('Record deleted','ok');
  }catch(e){
    toast('Delete failed: '+e.message,'err');
  }
}

function getOptions(src){
  if(src === 'categories'){
    return list('categories')
      .sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')))
      .map(c => ({ value:c.name, label: (c.parent? c.parent+' → ':'')+(c.name||'') }));
  }
  if(src === 'suppliers'){
    return list('suppliers')
      .sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')))
      .map(s => ({ value:s._id, label: (s.supplierId? s.supplierId+' — ':'')+(s.name||'Untitled') }));
  }
  if(src === 'products'){
    return list('products').map(p => ({ value:p._id, label:(p.productId?p.productId+' — ':'')+(p.name||'') }));
  }
  if(src === 'purchaseOrders'){
    return list('purchaseOrders').map(p => ({ value:p.poNo, label:p.poNo+' — '+supLabel(p.supplierKey) }));
  }
  if(src === 'grns'){
    return list('grns').map(p => ({ value:p.grnNo, label:p.grnNo+' — '+supLabel(p.supplierKey) }));
  }
  if(src === 'invoices'){
    return list('invoices').map(p => ({ value:p._id, label:(p.invoiceId||'')+' — '+(p.supplierInvoiceNo||'') }));
  }
  if(src === 'returns'){
    return list('returns').map(p => ({ value:p.returnNo, label:p.returnNo }));
  }
  return [];
}

/* ----------------------------------------------------------------------------
   15. FORM RENDERING
---------------------------------------------------------------------------- */
function fieldInput(f, value){
  const id = 'f_'+f.key;
  const v = (value === undefined || value === null) ? (f.default !== undefined ? f.default : '') : value;
  const req = f.required ? 'required' : '';
  let input = '';

  switch(f.type){
    case 'textarea':
      input = `<textarea id="${id}" name="${esc(f.key)}" rows="3" ${req}>${esc(v)}</textarea>`;
      break;
    case 'select': {
      const opts = (typeof f.options === 'function') ? f.options() : (f.options||[]);
      input = `<select id="${id}" name="${esc(f.key)}" ${req}>
        <option value="">— Select —</option>
        ${opts.map(o=>{
          const val = (typeof o === 'object') ? o.value : o;
          const lab = (typeof o === 'object') ? o.label : o;
          return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`;
        }).join('')}
      </select>`;
      break;
    }
    case 'multiselect': {
      const opts = getOptions(f.optionsFrom);
      const arr = Array.isArray(v) ? v : [];
      input = `<div class="ms-box" data-name="${esc(f.key)}">
        ${opts.length
          ? opts.map(o=>`<label class="ms-item"><input type="checkbox" value="${esc(o.value)}" ${arr.includes(o.value)?'checked':''}><span>${esc(o.label)}</span></label>`).join('')
          : '<span style="font-size:.78rem;color:#6b85a6">No options available yet — create entries in the related module first.</span>'}
      </div>`;
      break;
    }
    case 'checkbox':
      input = `<label style="display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:#c3d5ec">
        <input type="checkbox" id="${id}" name="${esc(f.key)}" ${v?'checked':''} style="width:auto;accent-color:#38bdf8"> Yes
      </label>`;
      break;
    case 'number':
      input = `<input type="number" id="${id}" name="${esc(f.key)}" value="${esc(v)}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} step="${f.step||'1'}" ${req} ${f.readonly?'readonly':''}>`;
      break;
    case 'date':
      input = `<input type="date" id="${id}" name="${esc(f.key)}" value="${esc(v)}" ${req} ${f.readonly?'readonly':''}>`;
      break;
    default:
      input = `<input type="${f.type||'text'}" id="${id}" name="${esc(f.key)}" value="${esc(v)}" ${req} ${f.readonly?'readonly':''} placeholder="${esc(f.placeholder||'')}">`;
  }

  const span = f.span === 2 ? ' span-2' : '';
  return `<div class="form-field${span}">
    <label for="${id}">${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label>
    ${input}
    ${f.help?`<small>${esc(f.help)}</small>`:''}
  </div>`;
}

function renderFormFields(cfg, record){
  let html = '';
  let lastGroup = null;
  cfg.fields.forEach(f=>{
    if(f.group && f.group !== lastGroup){
      lastGroup = f.group;
      html += `<div class="form-section-title">${esc(f.group)}</div>`;
    }
    html += fieldInput(f, record ? record[f.key] : undefined);
  });
  return html;
}

let modalItems = [];

function renderItemsEditor(cfg){
  if(!cfg.items) return '';
  const cols = cfg.items;
  const rows = modalItems.map((it, idx)=>{

      }

      <button type="button" class="btn btn-xs btn-danger" data-action="remove-item" data-idx="${idx}"><i class="fa fa-trash"></i></button>

  }).join('');

      <table>
        <thead><tr>${cols.map(c=>`<th style="width:${c.width||'auto'}">${esc(c.label)}</th>`).join('')}<th></th></tr></thead>
        <tbody id="itemsBody">${rows || `<tr><td colspan="${cols.length+1}" style="text-align:center;padding:1.2rem;color:#5c7a9c">No line items yet — click "Add Line".</td></tr>`}</tbody>
      </table>
    </div>
    <div style="margin-top:.6rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button type="button" class="btn btn-sm btn-ghost" data-action="add-item"><i class="fa fa-plus"></i> Add Line</button>
    </div>
    <div id="totalsBar">${totalsHtml}</div>
  </div>`;
}

function buildTotalsHtml(cfg){
  if(cfg.totals && cfg.totals.none) return '';
  const opts = {
    delivery: cfg.totals && cfg.totals.delivery ? num($('#f_deliveryCharge') ? $('#f_deliveryCharge').value : 0) : 0,
    noTax: cfg.totals && cfg.totals.noTax
  };
  const t = itemsTotal(modalItems, opts);
  let html = '<div class="items-total-bar">';
  html += `<div>Subtotal<strong>${money(t.sub)}</strong></div>`;
  if(!opts.noTax){
    html += `<div>Discount<strong>${money(t.disc)}</strong></div>`;
    html += `<div>Tax<strong>${money(t.tax)}</strong></div>`;
  }
  if(opts.delivery) html += `<div>Delivery<strong>${money(t.delivery)}</strong></div>`;
  html += `<div class="grand">TOTAL<strong>${money(t.total)}</strong></div>`;
  html += '</div>';
  return html;
}

async function openNewForm(collection){
  const cfg = COLLECTIONS[collection];
  if(!cfg){ toast('Unknown collection','err'); return; }
  let idNo = '';
  if(cfg.idField){
    try{ idNo = await nextNumber(collection); }
    catch(e){ idNo = (settings().numbering[collection]||'NGT-REF')+'-????'; }
  }
  openFormModal(collection, null, idNo);
}

function openEditForm(collection, id){
  const rec = find(collection, id);
  if(!rec){ toast('Record not found','err'); return; }
  openFormModal(collection, rec, null);
}

function openFormModal(collection, record, newId){
  const cfg = COLLECTIONS[collection];
  const isNew = !record;
  const draft = record ? Object.assign({}, record) : {};
  if(isNew && cfg.idField) draft[cfg.idField] = newId;

  modalItems = isNew ? [] : (Array.isArray(record.items) ? record.items.map(x=>Object.assign({},x)) : []);

  const body = `
    <form id="recordForm">
      <div class="modal-head">
        <h3><i class="fa ${cfg.icon}"></i> ${isNew?'New':'Edit'} ${esc(cfg.label)}${isNew&&newId?` <span class="mono" style="color:#38bdf8">${esc(newId)}</span>`:''}</h3>
        <button type="button" class="icon-btn" data-action="close-modal"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          ${renderFormFields(cfg, draft)}
          ${renderItemsEditor(cfg)}
        </div>
      </div>
      <div class="modal-foot">
        ${!isNew?`<button type="button" class="btn btn-danger btn-sm" data-action="delete-record" data-collection="${collection}" data-id="${esc(record._id)}"><i class="fa fa-trash"></i> Delete</button>`:''}
        <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa fa-floppy-disk"></i> Save ${esc(cfg.label)}</button>
      </div>
    </form>`;

  openModal(body, {size: cfg.items ? '' : 'narrow'});

  const form = $('#recordForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = serializeForm(form);
    if(cfg.items) data.items = modalItems.filter(it => Object.values(it).some(v=> v!=='' && v!==null && v!==undefined));

    /* integrity checks */
    if(collection === 'suppliers' && !data.name){ toast('Supplier name is required','err'); return; }
    if(collection === 'invoices' && !data.supplierInvoiceNo){ toast('Supplier invoice number is required','err'); return; }
    if(collection === 'payments' && num(data.amount) <= 0){ toast('Payment amount must be greater than zero','err'); return; }

    /* derived defaults */
    if(collection === 'invoices' && data.status === 'Unpaid'){
      const bal = itemsTotal(data.items,{delivery:data.deliveryCharge}).total;
      if(bal <= 0) { toast('Invoice total must be greater than zero','err'); return; }
    }
    if(collection === 'products' && num(data.supplierPrice) > 0){
      data.dateUpdated = data.dateUpdated || today();
    }

    const ok = await saveRecord(collection, data, record ? record._id : null);
    if(ok){
      toast(cfg.label + (isNew?' created':' updated'),'ok');
      /* auto price history on product price change */
      if(collection === 'products' && (!record || num(record.supplierPrice) !== num(data.supplierPrice)) && num(data.supplierPrice) > 0){
        pushPriceHistory(data);
      }
      closeModal();
    }
  });

  /* live totals when delivery charge changes */
  if(cfg.totals && cfg.totals.delivery){
    const dc = $('#f_deliveryCharge');
    if(dc) dc.addEventListener('input', ()=>{
      const bar = $('#totalsBar');
      if(bar) bar.innerHTML = buildTotalsHtml(cfg);
    });
  }
}

function pushPriceHistory(product){
  DB.ref('priceHistory').push({
    priceId:'',
    date: today(),
    productKey: product._id || '',
    productName: product.name || '',
    supplierKey: product.supplierKey || '',
    price: num(product.supplierPrice),
    condition: product.condition || '',
    source:'Product Record',
    notes:'Auto-recorded when supplier price changed'
  }).then(()=>{}).catch(()=>{});
}

function serializeForm(formEl){
  const data = {};
  formEl.querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{
    if(el.type === 'checkbox'){ data[el.name] = el.checked; }
    else if(el.type === 'number'){ data[el.name] = el.value === '' ? '' : Number(el.value); }
    else data[el.name] = el.value;
  });
  formEl.querySelectorAll('.ms-box').forEach(box=>{
    data[box.dataset.name] = Array.from(box.querySelectorAll('input:checked')).map(i=>i.value);
  });
  return data;
}

function openDetail(collection, id){

function relatedRecords(collection, rec){
  let out = '';
  const section = (title, rows, headers)=>{
    if(!rows.length) return '';
    return `<div class="form-section-title" style="margin-top:1.4rem;grid-column:1/-1">${esc(title)}</div>
      <div class="table-scroll" style="grid-column:1/-1;border:1px solid #24354b;border-radius:12px;overflow:hidden">
        <table class="data-table" style="min-width:auto">
          <thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>
      </div>`;
  };

  if(collection === 'suppliers'){
    const pos = list('purchaseOrders').filter(p=>p.supplierKey===rec._id);
    out += section('Purchase Orders', pos.slice(0,15).map(p=>`<tr>
      <td class="mono">${esc(p.poNo)}</td><td>${fmtDate(p.date)}</td>
      <td class="t-right">${money(poTotal(p))}</td><td>${badge(p.status)}</td></tr>`),
      ['PO No.','Date','Total','Status']);

    const inv = list('invoices').filter(p=>p.supplierKey===rec._id);
    out += section('Invoices', inv.slice(0,15).map(p=>`<tr>
      <td class="mono">${esc(p.supplierInvoiceNo)}</td><td>${fmtDate(p.invoiceDate)}</td>
      <td class="t-right">${money(invoiceTotal(p))}</td>
      <td class="t-right">${money(invoiceBalance(p))}</td>
      <td>${badge(invoiceStatus(p))}</td></tr>`),
      ['Invoice No.','Date','Total','Balance','Status']);

    const pays = list('payments').filter(p=>p.supplierKey===rec._id);
    out += section('Payments', pays.slice(0,15).map(p=>`<tr>
      <td class="mono">${esc(p.paymentId)}</td><td>${fmtDate(p.paymentDate)}</td>
      <td>${esc(p.method)}</td><td class="t-right">${money(p.amount)}</td></tr>`),
      ['Payment ID','Date','Method','Amount']);

    const prod = list('products').filter(p=>p.supplierKey===rec._id);
    out += section('Catalogue Items', prod.slice(0,20).map(p=>`<tr>
      <td>${esc(p.name)}</td><td>${esc(p.condition||'—')}</td>
      <td class="t-right">${money(p.supplierPrice)}</td><td>${badge(p.availability)}</td></tr>`),
      ['Product / Service','Condition','Supplier Price','Availability']);
  }

  if(collection === 'purchaseOrders'){
    const grns = list('grns').filter(g=>g.poRef === rec.poNo);
    out += section('Goods Received', grns.map(g=>`<tr>
      <td class="mono">${esc(g.grnNo)}</td><td>${fmtDate(g.deliveryDate)}</td>
      <td>${esc(g.receivedBy||'—')}</td><td>${badge(g.status)}</td></tr>`),
      ['GRN No.','Delivery Date','Received By','Status']);

    const inv = list('invoices').filter(i=>i.poRef === rec.poNo);
    out += section('Invoices', inv.map(i=>`<tr>
      <td class="mono">${esc(i.supplierInvoiceNo)}</td><td>${fmtDate(i.invoiceDate)}</td>
      <td class="t-right">${money(invoiceTotal(i))}</td><td>${badge(invoiceStatus(i))}</td></tr>`),
      ['Invoice No.','Date','Total','Status']);
  }

  if(collection === 'invoices'){
    const pays = list('payments').filter(p=>p.invoiceRef === rec._id);
    out += section('Payments Against Invoice', pays.map(p=>`<tr>
      <td class="mono">${esc(p.paymentId)}</td><td>${fmtDate(p.paymentDate)}</td>
      <td>${esc(p.method)}</td><td>${esc(p.reference||'—')}</td>
      <td class="t-right">${money(p.amount)}</td></tr>`),
      ['Payment ID','Date','Method','Reference','Amount']);
  }

  if(collection === 'rfqs'){
    out += `<div class="form-section-title" style="margin-top:1.4rem;grid-column:1/-1">Quotation Lines</div>`;
    out += itemsTable(rec.items, COLLECTIONS.rfqs.items, rec.deliveryCharge);
  }

  if(collection === 'purchaseOrders' || collection === 'purchaseRequests' || collection === 'returns'){
    out += `<div class="form-section-title" style="margin-top:1.4rem;grid-column:1/-1">Line Items</div>`;
    out += itemsTable(rec.items, COLLECTIONS[collection].items, rec.deliveryCharge);
  }

  if(collection === 'grns'){
    out += `<div class="form-section-title" style="margin-top:1.4rem;grid-column:1/-1">Received Lines</div>`;
    out += itemsTable(rec.items, COLLECTIONS.grns.items, 0);
  }

  return out;
}

function itemsTable(items, cols, delivery){
  const arr = Array.isArray(items)? items : [];
  if(!arr.length) return '<div style="grid-column:1/-1;color:#5c7a9c;font-size:.83rem;font-style:italic">No line items recorded.</div>';
  const rows = arr.map(it=>`<tr>${cols.map(c=>{
    let v = it[c.key];
    if(c.type === 'number' && (c.key||'').toLowerCase().includes('price')) v = money(v);
    return `<td class="${c.type==='number'?'t-right':''}">${esc(v===undefined||v===''?'—':v)}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="table-scroll" style="grid-column:1/-1;border:1px solid #24354b;border-radius:12px;overflow:hidden">
    <table class="data-table" style="min-width:auto">
      <thead><tr>${cols.map(c=>`<th class="${c.type==='number'?'t-right':''}">${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

/* ----------------------------------------------------------------------------
   20. GENERIC TABLE
---------------------------------------------------------------------------- */
function genericTable(collection, opts){
  opts = opts || {};
  const cfg = COLLECTIONS[collection];
  let rows = list(collection);

  if(opts.filter) rows = rows.filter(opts.filter);

  /* collection-level filters */
  const fstate = state.filters[collection] || {};
  Object.keys(fstate).forEach(k=>{
    if(fstate[k]) rows = rows.filter(r => String(r[k]||'') === fstate[k]);
  });

  /* sorting */
  const sk = state.sort[collection];
  if(sk && sk.key){
    rows.sort((a,b)=>{
      let av = a[sk.key], bv = b[sk.key];
      if(typeof av === 'number' || typeof bv === 'number'){ av = num(av); bv = num(bv); }
      else { av = String(av||'').toLowerCase(); bv = String(bv||'').toLowerCase(); }
      if(av < bv) return sk.dir === 'asc' ? -1 : 1;
      if(av > bv) return sk.dir === 'asc' ? 1 : -1;
      return 0;
    });
  } else {
    rows.sort((a,b)=> String(b._id||'').localeCompare(String(a._id||'')));
  }

  const head = cfg.columns.map(c=>{
    const arrow = (sk && sk.key === c.key) ? (sk.dir==='asc'?' ▲':' ▼') : '';
    return `<th data-action="sort" data-collection="${collection}" data-key="${esc(c.key)}" class="${c.cls||''}">${esc(c.label)}${arrow}</th>`;
  }).join('');

  const body = rows.length ? rows.map(r=>{
    const tds = cfg.columns.map(c=>{
      let val;
      if(c.fmt) val = c.fmt(r[c.key], r);
      else val = esc(r[c.key] === undefined || r[c.key] === '' ? '—' : r[c.key]);
      return `<td class="${c.cls||''}">${val}</td>`;
    }).join('');
    return `<tr data-id="${esc(r._id)}">${tds}
      <td class="t-center" style="white-space:nowrap">
        <button class="btn btn-xs btn-ghost" data-action="view-record" data-collection="${collection}" data-id="${esc(r._id)}" title="View"><i class="fa fa-eye"></i></button>
        <button class="btn btn-xs btn-ghost" data-action="edit-record" data-collection="${collection}" data-id="${esc(r._id)}" title="Edit"><i class="fa fa-pen"></i></button>
        <button class="btn btn-xs btn-danger" data-action="delete-record" data-collection="${collection}" data-id="${esc(r._id)}" title="Delete"><i class="fa fa-trash"></i></button>
      </td></tr>`;
  }).join('') : `<tr class="no-rows"><td colspan="${cfg.columns.length+1}">No ${esc(cfg.plural.toLowerCase())} recorded yet. Click “New ${esc(cfg.label)}” to begin.</td></tr>`;

  const filters = (cfg.filters||[]).map(f=>`
    <select class="filter-select" data-filter-collection="${collection}" data-filter-key="${esc(f.key)}">
      <option value="">${esc(f.label)}: All</option>
      ${f.options.map(o=>`<option value="${esc(o)}" ${fstate[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`).join('');

  return `
  <div class="table-wrap">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input type="text" placeholder="Search ${esc(cfg.plural.toLowerCase())}…" data-table-search="${collection}" oninput="filterTable('${collection}')">
      </div>
      ${filters}
      <div style="flex:1"></div>
      <button class="btn btn-sm btn-ghost" data-action="export-csv" data-collection="${collection}"><i class="fa fa-file-csv"></i> CSV</button>
      <button class="btn btn-sm btn-primary" data-action="new-record" data-collection="${collection}"><i class="fa fa-plus"></i> New ${esc(cfg.label)}</button>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="tbl_${collection}">
        <thead><tr>${head}<th class="t-center" style="width:110px">Actions</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  </div>`;
}

function filterTable(collection){
  const input = document.querySelector(`[data-table-search="${collection}"]`);
  const q = (input ? input.value : '').toLowerCase().trim();
  const tbl = document.getElementById('tbl_'+collection);
  if(!tbl) return;
  let shown = 0;
  tbl.querySelectorAll('tbody tr[data-id]').forEach(tr=>{
    const match = !q || tr.textContent.toLowerCase().includes(q);
    tr.style.display = match ? '' : 'none';
    if(match) shown++;
  });
  const empty = tbl.querySelector('.no-rows');
  if(empty) empty.style.display = (shown === 0 && q) ? '' : (empty.dataset.orig || '');
}

function renderAgingSummary(){
  const buckets = payablesBuckets();
  const total = buckets.reduce((a,b)=>a+b.amount,0);
  if(total <= 0) return '<div class="chart-empty" style="height:120px">No outstanding supplier balances. 🎉</div>';
  const colors = ['#22c55e','#facc15','#fb923c','#f87171','#dc2626'];
  const segs = buckets.map((b,i)=>{
    const pct = total ? (b.amount/total*100) : 0;
    if(pct < 1) return '';
    return `<div class="aging-seg" style="width:${pct}%;background:${colors[i]}" title="${esc(b.label)}: ${money(b.amount)}">${pct>9?Math.round(pct)+'%':''}</div>`;
  }).join('');
  return `
    <div class="aging-bar">${segs}</div>
    <ul class="mini-list">
      ${buckets.map((b,i)=>`<li><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${colors[i]};margin-right:.5rem"></span>${esc(b.label)}</span><span class="val">${money(b.amount)}</span></li>`).join('')}
      <li style="border-top:1px solid #2d3a4f;margin-top:.4rem;padding-top:.6rem"><strong>Total Payables</strong><span class="val">${money(total)}</span></li>
    </ul>`;
}

function renderAttentionList(){
  const items = [];
  list('invoices').forEach(i=>{
    const st = invoiceStatus(i);
    if(st === 'Overdue') items.push({label:`Invoice ${i.supplierInvoiceNo||i.invoiceId} — ${supLabel(i.supplierKey)}`, val: money(invoiceBalance(i)), view:'invoices'});
  });
  list('purchaseOrders').forEach(p=>{
    if(['Approved','Sent to Supplier','Partially Delivered'].includes(p.status) && p.expectedDelivery){
      const d = daysFromToday(p.expectedDelivery);
      if(d !== null && d <= 3) items.push({label:`PO ${p.poNo} delivery ${d<0?Math.abs(d)+'d overdue':'due in '+d+'d'}`, val: money(poTotal(p)), view:'purchaseOrders'});
    }
  });
  list('contracts').forEach(c=>{
    if(c.endDate){
      const d = daysFromToday(c.endDate);
      if(d !== null && d <= 30) items.push({label:`Contract ${c.contractNo} ${d<0?'expired':'expires in '+d+'d'}`, val: esc(c.title||''), view:'contracts'});
    }
  });
  list('documents').forEach(dc=>{
    if(dc.expiryDate){
      const d = daysFromToday(dc.expiryDate);
      if(d !== null && d <= 30) items.push({label:`Document "${dc.title}" ${d<0?'expired':'expires in '+d+'d'}`, val: esc(dc.docType||''), view:'documents'});
    }
  });
  list('followups').forEach(f=>{
    if(f.status === 'Open' || f.status === 'In Progress'){
      const d = daysFromToday(f.dueDate);
      if(d !== null && d <= 0) items.push({label:`Follow-up ${f.followupId} — ${f.type}`, val: d<0? Math.abs(d)+'d overdue':'Due today', view:'followups'});
    }
  });
  list('rfqs').forEach(r=>{
    if(r.validityDate && ['Sent to Supplier','Quotation Received'].includes(r.status)){
      const d = daysFromToday(r.validityDate);
      if(d !== null && d <= 3) items.push({label:`Quotation ${r.rfqNo} ${d<0?'expired':'expires in '+d+'d'}`, val: money(rfqTotal(r)), view:'rfqs'});
    }
  });
  list('disputes').forEach(d=>{
    if(d.status === 'Open' || d.status === 'In Progress') items.push({label:`Dispute ${d.disputeId} — ${d.reason}`, val: money(d.amount), view:'disputes'});
  });

  if(!items.length) return '<div class="chart-empty" style="height:120px">Nothing requires immediate attention.</div>';
  return `<ul class="mini-list">${items.slice(0,12).map(i=>`<li><span>${esc(i.label)}</span><span class="val">${i.val}</span></li>`).join('')}</ul>`;
}

/* ---------- NOTIFICATIONS ---------- */
function viewNotifications(){
  const groups = [];
  const overdue = list('invoices').filter(i=>invoiceStatus(i)==='Overdue');
  if(overdue.length) groups.push({
    title:'Overdue Supplier Invoices', icon:'fa-triangle-exclamation', color:'danger',
    items: overdue.map(i=>`${i.supplierInvoiceNo||i.invoiceId} — ${supLabel(i.supplierKey)} — ${money(invoiceBalance(i))} — due ${fmtDate(i.dueDate)}`)
  });

  const pend = list('purchaseOrders').filter(p=>['Approved','Sent to Supplier','Partially Delivered'].includes(p.status));
  if(pend.length) groups.push({
    title:'Pending / In-Transit Deliveries', icon:'fa-truck', color:'warn',
    items: pend.map(p=>`PO ${p.poNo} — ${supLabel(p.supplierKey)} — expected ${fmtDate(p.expectedDelivery)}`)
  });

  const partial = list('grns').filter(g=>{
    const it = g.items||[];
    const ord = it.reduce((a,b)=>a+num(b.qtyOrdered),0);
    const rec = it.reduce((a,b)=>a+num(b.qtyReceived),0);
    return ord > rec;
  });
  if(partial.length) groups.push({
    title:'Partially Delivered Orders', icon:'fa-boxes-packing', color:'warn',
    items: partial.map(g=>`GRN ${g.grnNo} — PO ${g.poRef||'—'} — ${supLabel(g.supplierKey)}`)
  });

  const expiring = list('contracts').filter(c=>c.endDate && daysFromToday(c.endDate) !== null && daysFromToday(c.endDate) <= 30);
  if(expiring.length) groups.push({
    title:'Contracts Expiring / Expired', icon:'fa-file-signature', color:'warn',
    items: expiring.map(c=>`${c.contractNo} — ${c.title||''} — ends ${fmtDate(c.endDate)}`)
  });

  const docs = list('documents').filter(d=>d.expiryDate && daysFromToday(d.expiryDate) !== null && daysFromToday(d.expiryDate) <= 30);
  if(docs.length) groups.push({
    title:'Supplier Documents Expiring', icon:'fa-folder-open', color:'warn',
    items: docs.map(d=>`${d.title} — ${supLabel(d.supplierKey)} — expires ${fmtDate(d.expiryDate)}`)
  });

  const quotes = list('rfqs').filter(r=>r.validityDate && daysFromToday(r.validityDate) !== null && daysFromToday(r.validityDate) <= 3 && !['Converted to PO','Cancelled'].includes(r.status));
  if(quotes.length) groups.push({
    title:'Supplier Quotations Expiring', icon:'fa-file-invoice-dollar', color:'warn',
    items: quotes.map(r=>`${r.rfqNo} — ${supLabel(r.supplierKey)} — valid until ${fmtDate(r.validityDate)}`)
  });

  const fus = list('followups').filter(f=>['Open','In Progress'].includes(f.status) && f.dueDate && daysFromToday(f.dueDate) !== null && daysFromToday(f.dueDate) <= 0);
  if(fus.length) groups.push({
    title:'Follow-ups Due', icon:'fa-list-check', color:'warn',
    items: fus.map(f=>`${f.followupId} — ${f.type} — ${supLabel(f.supplierKey)} — due ${fmtDate(f.dueDate)}`)
  });

  const disputes = list('disputes').filter(d=>['Open','In Progress'].includes(d.status));
  if(disputes.length) groups.push({
    title:'Open Disputes', icon:'fa-scale-balanced', color:'danger',
    items: disputes.map(d=>`${d.disputeId} — ${d.reason} — ${supLabel(d.supplierKey)} — ${money(d.amount)}`)
  });

  const body = groups.length ? groups.map(g=>`
    <div class="panel">
      <div class="panel-head"><div class="panel-title"><i class="fa ${g.icon}" style="color:${g.color==='danger'?'#f87171':'#fbbf24'}"></i> ${esc(g.title)} <span class="badge b-${g.color}">${g.items.length}</span></div></div>
      <ul class="mini-list">${g.items.slice(0,20).map(i=>`<li><span>${esc(i)}</span></li>`).join('')}</ul>
    </div>`).join('') : `<div class="empty-state"><i class="fa fa-circle-check"></i><h4>All clear</h4><p>There are no outstanding notifications at this time.</p></div>`;

  return `
  <div class="page-head">
    <div>
      <div class="page-title"><i class="fa fa-bell"></i> Notifications</div>
      <div class="page-sub">Automatically generated alerts across suppliers, procurement and finance</div>
    </div>
  </div>
  ${body}`;
}

/* ---------- PAYABLES ---------- */
function payablesBuckets(){
  const buckets = [
    {label:'Current (not yet due)', amount:0, min:-999999, max:0},
    {label:'1 – 30 days overdue', amount:0, min:1, max:30},
    {label:'31 – 60 days overdue', amount:0, min:31, max:60},
    {label:'61 – 90 days overdue', amount:0, min:61, max:90},
    {label:'90+ days overdue', amount:0, min:91, max:999999}
  ];
  list('invoices').forEach(i=>{
    if(i.status === 'Cancelled') return;
    const bal = invoiceBalance(i);
    if(bal <= 0.005) return;
    const overdueDays = i.dueDate ? -daysFromToday(i.dueDate) : 0;
    const d = overdueDays < 0 ? 0 : overdueDays;
    if(d === 0){ buckets[0].amount += bal; }
    else if(d <= 30){ buckets[1].amount += bal; }
    else if(d <= 60){ buckets[2].amount += bal; }
    else if(d <= 90){ buckets[3].amount += bal; }
    else { buckets[4].amount += bal; }
  });
  return buckets;
}

function viewPayables(){
  const buckets = payablesBuckets();
  const total = buckets.reduce((a,b)=>a+b.amount,0);

  /* per-supplier summary */
  const bySupplier = {};
  list('invoices').forEach(i=>{
    if(i.status === 'Cancelled') return;
    const bal = invoiceBalance(i);
    if(bal <= 0.005) return;
    const k = i.supplierKey || 'UNKNOWN';
    if(!bySupplier[k]) bySupplier[k] = {total:0, current:0, d30:0, d60:0, d90:0, d90p:0, count:0};
    bySupplier[k].total += bal;
    bySupplier[k].count++;
    const od = i.dueDate ? -daysFromToday(i.dueDate) : 0;
    const d = od < 0 ? 0 : od;
    if(d === 0) bySupplier[k].current += bal;
    else if(d <= 30) bySupplier[k].d30 += bal;
    else if(d <= 60) bySupplier[k].d60 += bal;
    else if(d <= 90) bySupplier[k].d90 += bal;
    else bySupplier[k].d90p += bal;
  });

  const rows = Object.keys(bySupplier).map(k=>{
    const s = bySupplier[k];
    return `<tr>
      <td>${esc(supLabel(k))}</td>
      <td class="t-center">${s.count}</td>
      <td class="t-right">${money(s.current)}</td>
      <td class="t-right">${money(s.d30)}</td>
      <td class="t-right">${money(s.d60)}</td>
      <td class="t-right">${money(s.d90)}</td>
      <td class="t-right">${money(s.d90p)}</td>
      <td class="t-right"><strong>${money(s.total)}</strong></td>
      <td class="t-center"><button class="btn btn-xs btn-ghost" data-action="statement" data-id="${esc(k)}"><i class="fa fa-file-lines"></i></button></td>
    </tr>`;

  const overdueList = list('invoices')
    .filter(i=>invoiceStatus(i)==='Overdue')
    .sort((a,b)=> String(a.dueDate||'').localeCompare(String(b.dueDate||'')));

  return `
  <div class="page-head">
    <div>
      <div class="page-title"><i class="fa fa-scale-unbalanced"></i> Accounts Payable</div>
      <div class="page-sub">Outstanding supplier liabilities and ageing analysis</div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card danger"><div class="kpi-label">Total Payables</div><div class="kpi-value">${money0(total)}</div><div class="kpi-foot">Outstanding to all suppliers</div></div>
    ${buckets.map((b,i)=>`<div class="kpi-card ${i===0?'ok':i<3?'warn':'danger'}"><div class="kpi-label">${esc(b.label)}</div><div class="kpi-value">${money0(b.amount)}</div><div class="kpi-foot">${total?((b.amount/total*100).toFixed(1)):0}% of payables</div></div>`).join('')}
  </div>

  <div class="panel">
    <div class="panel-head"><div class="panel-title"><i class="fa fa-table-list"></i> Payables by Supplier</div></div>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr>
          <th>Supplier</th><th class="t-center">Invoices</th>
          <th class="t-right">Current</th><th class="t-right">1–30 d</th>
          <th class="t-right">31–60 d</th><th class="t-right">61–90 d</th>
          <th class="t-right">90+ d</th><th class="t-right">Total</th><th class="t-center">Statement</th>
        </tr></thead>
        <tbody>${rows || '<tr class="no-rows"><td colspan="9">No outstanding supplier balances.</td></tr>'}</tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><div class="panel-title"><i class="fa fa-triangle-exclamation"></i> Overdue Invoices</div></div>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Invoice</th><th>Supplier</th><th>Invoice Date</th><th>Due Date</th><th class="t-right">Total</th><th class="t-right">Balance</th><th class="t-center">Days Overdue</th></tr></thead>
        <tbody>${overdueList.length ? overdueList.map(i=>`<tr>

          <td class="t-right">${money(invoiceBalance(i))}</td>

        </tr>`).join('') : '<tr class="no-rows"><td colspan="7">No overdue invoices.</td></tr>'}</tbody>

function viewStatements(){
  const suppliers = list('suppliers').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));

  const opening = 0;

    return Object.assign({}, r, {balance: running});
  });

  return `
  <div class="page-head">

  </div>

  ${!selected ? `<div class="empty-state"><i class="fa fa-file-lines"></i><h4>No supplier selected</h4><p>Select a supplier above to generate a statement of account.</p></div>` : `
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><i class="fa fa-user-tie"></i> ${esc(supLabel(selected))}</div>
      <div style="font-size:.85rem;color:#8ba0bc">Outstanding Balance: <strong style="color:#f87171">${money(supplierPayables(selected))}</strong></div>
    </div>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Reference</th><th>Description</th><th class="t-right">Debit (Purchase)</th><th class="t-right">Credit (Payment)</th><th class="t-right">Balance</th></tr></thead>
        <tbody>
          <tr><td colspan="5" style="color:#8ba0bc"><em>Opening Balance</em></td><td class="t-right"><strong>${money(opening)}</strong></td></tr>
          ${ledger.length ? ledger.map(r=>`<tr>
            <td>${fmtDate(r.date)}</td>
            <td class="mono">${esc(r.ref)}</td>

            <td class="t-right">${r.credit?money(r.credit):'—'}</td>
            <td class="t-right">${money(r.balance)}</td>
          </tr>`).join('') : '<tr class="no-rows"><td colspan="6">No transactions recorded for this supplier.</td></tr>'}
          <tr style="background:#0f1a27">
            <td colspan="3"><strong>Closing Balance</strong></td>
            <td class="t-right"><strong>${money(ledger.reduce((a,r)=>a+r.debit,0))}</strong></td>
            <td class="t-right"><strong>${money(ledger.reduce((a,r)=>a+r.credit,0))}</strong></td>
            <td class="t-right"><strong style="color:#38bdf8">${money(running)}</strong></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>`}`;
}

function buildStatement(supplierKey){
  if(!supplierKey) return [];
  const rows = [];
  list('invoices').filter(i=>i.supplierKey===supplierKey && i.status!=='Cancelled').forEach(i=>{
    rows.push({
      date: i.invoiceDate || '',
      ref: i.supplierInvoiceNo || i.invoiceId,
      desc: 'Supplier Invoice'+(i.poRef? ' (PO '+i.poRef+')':''),
      debit: invoiceTotal(i),
      credit: 0
    });
  });
  list('payments').filter(p=>p.supplierKey===supplierKey && p.status!=='Reversed').forEach(p=>{
    rows.push({
      date: p.paymentDate || '',
      ref: p.paymentId || '',
      desc: 'Payment — '+(p.method||'')+(p.reference? ' ('+p.reference+')':''),
      debit: 0,
      credit: num(p.amount)
    });
  });
  list('creditNotes').filter(c=>c.supplierKey===supplierKey && c.status==='Applied').forEach(c=>{
    rows.push({
      date: c.date || '',
      ref: c.cnNo || '',
      desc: 'Credit Note — '+(c.reason||''),
      debit: 0,
      credit: num(c.amount)
    });
  });
  return rows.sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}

/* ---------- PRICE BOARD ---------- */
function viewPriceBoard(){
  const products = list('products');
  const groups = {};
  products.forEach(p=>{
    const key = (p.name||'Unnamed').toLowerCase().trim();
    if(!groups[key]) groups[key] = {name:p.name||'Unnamed', items:[]};
    groups[key].items.push(p);
  });

  const keys = Object.keys(groups).sort();
  const cards = keys.map(k=>{
    const g = groups[k];
    g.items.sort((a,b)=> num(a.supplierPrice) - num(b.supplierPrice));
    const best = num(g.items[0].supplierPrice);
    const rows = g.items.map(p=>{
      const isBest = num(p.supplierPrice) === best && best > 0;
      return `<tr>
        <td>${esc(supLabel(p.supplierKey))}</td>
        <td>${esc(p.condition||'—')}</td>
        <td class="t-right" style="${isBest?'color:#4ade80;font-weight:700':''}">${money(p.supplierPrice)}</td>
        <td>${badge(p.availability)}</td>
        <td>${esc(p.warranty||'—')}</td>
        <td>${fmtDate(p.dateUpdated)}</td>
      </tr>`;
    }).join('');
    return `<div class="panel">
      <div class="panel-head">
        <div class="panel-title"><i class="fa fa-tag"></i> ${esc(g.name)} <span class="badge b-info">${g.items.length} supplier${g.items.length>1?'s':''}</span></div>
        ${best>0?`<div style="font-size:.8rem;color:#8ba0bc">Best price: <strong style="color:#4ade80">${money(best)}</strong></div>`:''}
      </div>
      <div class="table-scroll">
        <table class="data-table" style="min-width:auto">
          <thead><tr><th>Supplier</th><th>Condition</th><th class="t-right">Cost</th><th>Availability</th><th>Warranty</th><th>Updated</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <div class="page-title"><i class="fa fa-tags"></i> Supplier Price Board</div>
      <div class="page-sub">Brokerage comparison board — supplier costs by product, condition and availability</div>
    </div>
    <button class="btn btn-sm btn-primary" data-action="new-record" data-collection="products"><i class="fa fa-plus"></i> New Catalogue Item</button>
  </div>
  ${keys.length ? cards : `<div class="empty-state"><i class="fa fa-tags"></i><h4>No catalogue items yet</h4><p>Add products and services under “Products &amp; Services” to populate the brokerage price board.</p></div>`}`;
}

  let comparison = '';
  if(selected.length >= 2){
    const bestTotal = Math.min.apply(null, selected.map(r=>rfqTotal(r)));
    comparison = `

            <th class="t-right">Delivery</th><th class="t-right">Total</th>
            <th>Warranty</th><th>Payment Terms</th><th class="t-center">Rank</th>
          </tr></thead>
          <tbody>
            ${selected.slice().sort((a,b)=>rfqTotal(a)-rfqTotal(b)).map((r,idx)=>{
              const t = itemsTotal(r.items,{delivery:r.deliveryCharge});
              const isBest = rfqTotal(r) === bestTotal;
              return `<tr>
                <td><strong>${esc(supLabel(r.supplierKey))}</strong></td>
                <td class="mono">${esc(r.rfqNo)}</td>
                <td>${fmtDate(r.validityDate)}</td>

                <td class="t-right">${money(t.delivery)}</td>
                <td class="t-right" style="${isBest?'color:#4ade80;font-weight:700':''}">${money(t.total)}</td>
                <td>${esc(r.warranty||'—')}</td>
                <td>${esc(r.paymentTerms||'—')}</td>
                <td class="t-center">${idx===0?'<span class="badge b-ok">Lowest</span>':'#'+(idx+1)}</td>

          </tbody>
        </table>
      </div>
      <div class="note-box" style="margin-top:1rem;margin-bottom:0">
        <i class="fa fa-circle-info"></i>
        Comparison is based on the recorded figures only. Delivery reliability, warranty terms, payment terms and supplier performance should also be considered before selecting a supplier.
      </div>
    </div>`;
  }

  return `
  <div class="page-head">
    <div>
      <div class="page-title"><i class="fa fa-code-compare"></i> Quotation Comparison</div>
      <div class="page-sub">Select two or more supplier quotations to compare them side by side</div>

        <tbody>${rows || '<tr class="no-rows"><td colspan="7">No supplier quotations recorded yet.</td></tr>'}</tbody>

     rows:list('invoices').filter(i=>invoiceStatus(i)==='Overdue').map(i=>[i.supplierInvoiceNo||i.invoiceId,supLabel(i.supplierKey),i.dueDate,money(invoiceBalance(i)),Math.abs(daysFromToday(i.dueDate))])})},
  {id:'spend-supplier', title:'Spending by Supplier', group:'Financial', icon:'fa-chart-simple',
   desc:'Total purchase value per supplier.',
   run:()=>{
     const m = {};
     list('purchaseOrders').filter(p=>p.status!=='Cancelled').forEach(p=>{

     });

       rows:Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>[supLabel(k), money(m[k])])};
   }},
  {id:'spend-month', title:'Spending by Month', group:'Financial', icon:'fa-calendar',
   desc:'Monthly purchase totals.',
   run:()=>{
     const m = {};
     list('purchaseOrders').filter(p=>p.status!=='Cancelled').forEach(p=>{
       const k = monthKey(p.date);
       if(!k) return;
       m[k] = (m[k]||0) + poTotal(p);
     });
     return {columns:['Month','Total Purchases'],
       rows:Object.keys(m).sort().map(k=>[monthLabel(k), money(m[k])])};
   }},
  {id:'spend-category', title:'Spending by Division', group:'Financial', icon:'fa-layer-group',
   desc:'Purchase totals by business division.',
   run:()=>{
     const m = {};
     list('purchaseOrders').filter(p=>p.status!=='Cancelled').forEach(p=>{
       const k = p.division || '(Unassigned)';
       m[k] = (m[k]||0) + poTotal(p);
     });
     return {columns:['Division','Total Purchases'],
       rows:Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>[k, money(m[k])])};
   }},
  {id:'spend-project', title:'Spending by Project', group:'Financial', icon:'fa-diagram-project',
   desc:'Purchase totals by project / job.',
   run:()=>{
     const m = {};
     list('purchaseOrders').filter(p=>p.status!=='Cancelled').forEach(p=>{
       const k = p.project || '(No Project)';
       m[k] = (m[k]||0) + poTotal(p);
     });
     return {columns:['Project','Total Purchases'],
       rows:Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>[k, money(m[k])])};
   }},

  {id:'delivery-performance', title:'Supplier Delivery Performance', group:'Performance', icon:'fa-truck',
   desc:'Delivery accuracy based on received quantities.',
   run:()=>{
     const m = {};
     list('grns').forEach(g=>{
       const k = g.supplierKey||'UNKNOWN';
       if(!m[k]) m[k] = {orders:0, complete:0, outstanding:0};
       const it = g.items||[];
       const ord = it.reduce((a,b)=>a+num(b.qtyOrdered),0);
       const rec = it.reduce((a,b)=>a+num(b.qtyReceived),0);
       m[k].orders++;
       if(rec >= ord && ord > 0) m[k].complete++;
       m[k].outstanding += Math.max(0, ord-rec);
     });
     return {columns:['Supplier','GRNs','Complete Deliveries','Outstanding Units','Fulfilment %'],
       rows:Object.keys(m).map(k=>{
         const s = m[k];
         const pct = s.orders? ((s.complete/s.orders)*100).toFixed(1)+'%' : '—';
         return [supLabel(k), s.orders, s.complete, s.outstanding, pct];
       })};
   }},
  {id:'defect-report', title:'Defective & Returned Goods', group:'Performance', icon:'fa-bug',

   run:()=>{

     list('returns').forEach(r=>{

       m[k].count++;
       m[k].value += itemsTotal(r.items,{noTax:true}).total;
     });
     return {columns:['Supplier','Returns','Return Value'],
       rows:Object.keys(m).map(k=>[supLabel(k), m[k].count, money(m[k].value)])};
   }},
  {id:'dispute-report', title:'Supplier Disputes Report', group:'Performance', icon:'fa-scale-balanced',

  {id:'contract-report', title:'Contract Register', group:'Performance', icon:'fa-file-signature',
   desc:'All supplier contracts and expiry dates.',
   run:()=> ({columns:['Contract No.','Title','Supplier','Start','End','Renewal','Status'], rows:list('contracts').map(c=>[c.contractNo,c.title,supLabel(c.supplierKey),c.startDate,c.endDate,c.renewalDate,c.status])})},
  {id:'document-report', title:'Supplier Document Register', group:'Performance', icon:'fa-folder-open',

];

function render(){
  renderSidebar();
  renderHeaderMeta();

  const main = $('#main');
  const view = state.view;
  let html = '';

  if(VIEWS[view]) html = VIEWS[view]();
  else if(COLLECTIONS[view]) html = viewCollection(view);
  else html = viewDashboard();

  main.innerHTML = `<div class="main-inner">${html}</div>`;

  afterRender(view);
}

function renderSidebar(){
  const sb = $('#sidebar');
  let html = '';
  NAV.forEach(group=>{
    const items = group.items.filter(i => i.roles.includes(state.role));
    if(!items.length) return;
    html += `<div class="nav-group-title">${esc(group.group)}</div>`;
    items.forEach(i=>{
      let count = '';
      if(i.id === 'notifications'){
        const n = countNotifications();
        if(n) count = `<span class="nav-tag">${n}</span>`;
      }
      if(i.id === 'followups'){
        const n = list('followups').filter(f=>['Open','In Progress'].includes(f.status)).length;
        if(n) count = `<span class="nav-tag">${n}</span>`;
      }
      html += `<div class="nav-item ${state.view===i.id?'active':''}" data-action="goto" data-view="${i.id}">
        <i class="fa ${i.icon}"></i><span>${esc(i.label)}</span>${count}
      </div>`;
    });
  });
  sb.innerHTML = html;
}

function renderHeaderMeta(){
  const n = countNotifications();
  const badgeEl = $('#notifCount');
  if(n){ badgeEl.style.display = 'flex'; badgeEl.textContent = n > 99 ? '99+' : n; }
  else badgeEl.style.display = 'none';

  const roleSel = $('#roleSelect');
  if(roleSel && !roleSel.options.length){
    roleSel.innerHTML = ALL.map(r=>`<option>${r}</option>`).join('');
    roleSel.value = state.role;
  }
}

function countNotifications(){
  let n = 0;
  n += list('invoices').filter(i=>invoiceStatus(i)==='Overdue').length;
  n += list('contracts').filter(c=>c.endDate && daysFromToday(c.endDate)!==null && daysFromToday(c.endDate)<=30).length;
  n += list('documents').filter(d=>d.expiryDate && daysFromToday(d.expiryDate)!==null && daysFromToday(d.expiryDate)<=30).length;
  n += list('followups').filter(f=>['Open','In Progress'].includes(f.status) && f.dueDate && daysFromToday(f.dueDate)!==null && daysFromToday(f.dueDate)<=0).length;
  n += list('disputes').filter(d=>['Open','In Progress'].includes(d.status)).length;
  n += list('rfqs').filter(r=>r.validityDate && daysFromToday(r.validityDate)!==null && daysFromToday(r.validityDate)<=3 && !['Converted to PO','Cancelled'].includes(r.status)).length;
  return n;
}

function afterRender(view){
  if(view === 'dashboard') drawDashboardCharts();

  /* animate on view */
  requestAnimationFrame(()=>{
    $$('.animate-on-view').forEach(el=>el.classList.add('visible'));
  });

  /* settings forms */
  const sc = $('#settingsCompany');
  if(sc) sc.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(sc).entries());
    await DB.ref('settings/company').update(data);
    toast('Company profile saved','ok');
  });

  const st = $('#settingsTax');
  if(st) st.addEventListener('submit', async e=>{
    e.preventDefault();
    const d = Object.fromEntries(new FormData(st).entries());
    await DB.ref('settings/tax').update({
      currency: d.currency,
      defaultVatRate: num(d.defaultVatRate),
      vatEnabled: d.vatEnabled === 'true'
    });
    toast('Tax configuration saved','ok');
  });

  const sn = $('#settingsNumbering');
  if(sn) sn.addEventListener('submit', async e=>{
    e.preventDefault();
    const d = Object.fromEntries(new FormData(sn).entries());
    await DB.ref('settings/numbering').update(d);

  /* statement supplier selector */
  const ss = $('#statementSupplier');
  if(ss) ss.addEventListener('change', ()=>{
    state.tab.statementSupplier = ss.value;
    render();
  });
}

/* ----------------------------------------------------------------------------
   23. CHARTS (custom canvas — no external library)
---------------------------------------------------------------------------- */
function prepCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300;
  const h = canvas.clientHeight || 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}

function drawBarChart(canvas, labels, values, color){
  const {ctx, w, h} = prepCanvas(canvas);
  const padL = 62, padR = 14, padT = 16, padB = 46;
  const cw = w - padL - padR;
  const ch = h - padT - padB;

  const max = Math.max.apply(null, values.concat([0])) || 1;
  const steps = 4;

  ctx.strokeStyle = '#1e2c3a';
  ctx.fillStyle = '#6b85a6';
  ctx.font = '10px Inter, sans-serif';
  ctx.lineWidth = 1;

  for(let i=0;i<=steps;i++){
    const y = padT + ch - (ch/steps)*i;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+cw, y); ctx.stroke();
    const val = (max/steps)*i;
    ctx.textAlign = 'right';
    ctx.fillText(shortNum(val), padL-8, y+3);
  }

  const n = values.length || 1;
  const slot = cw / n;
  const barW = Math.min(38, slot*0.6);

  values.forEach((v,i)=>{
    const bh = max ? (v/max)*ch : 0;
    const x = padL + slot*i + (slot-barW)/2;
    const y = padT + ch - bh;
    const grad = ctx.createLinearGradient(0,y,0,padT+ch);
    grad.addColorStop(0, color || '#38bdf8');
    grad.addColorStop(1, 'rgba(56,189,248,.25)');
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, barW, Math.max(bh,1), 4);
    ctx.fill();

    ctx.fillStyle = '#7d93b3';
    ctx.font = '9.5px Inter, sans-serif';
    ctx.textAlign = 'center';
    const lab = String(labels[i]||'');
    ctx.fillText(lab.length>9? lab.slice(0,8)+'…' : lab, x+barW/2, padT+ch+16);
  });
}

function drawHBarChart(canvas, labels, values, color){
  const {ctx, w, h} = prepCanvas(canvas);
  const padL = 120, padR = 60, padT = 12, padB = 12;
  const cw = w - padL - padR;
  const rows = Math.max(values.length, 1);
  const rowH = Math.min(34, (h - padT - padB) / rows);
  const barH = Math.max(10, rowH * 0.55);
  const max = Math.max.apply(null, values.concat([0])) || 1;

  values.forEach((v,i)=>{
    const y = padT + i*rowH + (rowH-barH)/2;
    const bw = max ? (v/max)*cw : 0;
    ctx.fillStyle = '#16233a';
    roundRect(ctx, padL, y, cw, barH, 5); ctx.fill();
    const grad = ctx.createLinearGradient(padL,0,padL+cw,0);
    grad.addColorStop(0, color||'#38bdf8');
    grad.addColorStop(1, 'rgba(56,189,248,.35)');
    ctx.fillStyle = grad;
    roundRect(ctx, padL, y, Math.max(bw,2), barH, 5); ctx.fill();

    ctx.fillStyle = '#9fb8d6';
    ctx.font = '10.5px Inter, sans-serif';
    ctx.textAlign = 'right';
    let lab = String(labels[i]||'');
    if(lab.length > 18) lab = lab.slice(0,17)+'…';
    ctx.fillText(lab, padL-8, y + barH/2 + 3.5);

    ctx.fillStyle = '#38bdf8';
    ctx.textAlign = 'left';
    ctx.fillText(shortNum(v), padL + bw + 6, y + barH/2 + 3.5);
  });
}

function drawDoughnut(canvas, labels, values, colors){
  const {ctx, w, h} = prepCanvas(canvas);
  const cx = w/2, cy = h/2 - 6;
  const R = Math.min(w,h)/2 - 26;
  const r = R * 0.6;
  const total = values.reduce((a,b)=>a+b,0);

  if(!total){
    ctx.fillStyle = '#4f6b8c';
    ctx.font = '12px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No data available', cx, cy);
    return;
  }

  let start = -Math.PI/2;
  values.forEach((v,i)=>{
    const angle = (v/total) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,start,start+angle);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = '#111c29';
    ctx.lineWidth = 2;
    ctx.stroke();
    start += angle;
  });

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle = '#111c29';
  ctx.fill();

  ctx.fillStyle = '#e0e7ff';
  ctx.font = 'bold 15px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(String(values.reduce((a,b)=>a+b,0)), cx, cy+2);
  ctx.fillStyle = '#7d93b3';
  ctx.font = '9.5px Inter, sans-serif';
  ctx.fillText('RECORDS', cx, cy+16);

  /* legend */
  let ly = h - 4;
  ctx.textAlign = 'left';
  ctx.font = '10px Inter, sans-serif';
  let lx = 10;
  labels.forEach((l,i)=>{
    if(i > 5) return;
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(lx, ly-8, 8, 8);
    ctx.fillStyle = '#8ba0bc';
    const txt = String(l).slice(0,12);
    ctx.fillText(txt, lx+12, ly);
    lx += ctx.measureText(txt).width + 30;
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function shortNum(v){
  const n = num(v);
  if(Math.abs(n) >= 1000000) return (n/1000000).toFixed(1)+'M';
  if(Math.abs(n) >= 1000) return (n/1000).toFixed(0)+'K';
  return String(Math.round(n));
}

function drawDashboardCharts(){
  const months = lastNMonths(12);
  const monthly = months.map(m =>
    list('purchaseOrders').filter(p=> monthKey(p.date)===m && p.status!=='Cancelled')
      .reduce((a,p)=>a+poTotal(p),0)
  );
  const c1 = document.getElementById('chartMonthly');
  if(c1) drawBarChart(c1, months.map(monthLabel), monthly, '#38bdf8');

  const spend = {};
  list('purchaseOrders').filter(p=>p.status!=='Cancelled').forEach(p=>{
    const k = p.supplierKey||'UNKNOWN';
    spend[k] = (spend[k]||0) + poTotal(p);
  });
  const topKeys = Object.keys(spend).sort((a,b)=>spend[b]-spend[a]).slice(0,7);
  const c2 = document.getElementById('chartSuppliers');
  if(c2){
    if(topKeys.length) drawHBarChart(c2, topKeys.map(k=>supLabel(k)), topKeys.map(k=>spend[k]), '#22d3ee');
    else drawHBarChart(c2, [], [], '#22d3ee');
  }

  const statuses = PO_STATUSES;
  const counts = statuses.map(s => list('purchaseOrders').filter(p=>p.status===s).length);
  const active = statuses.map((s,i)=>({s, c:counts[i]})).filter(x=>x.c>0);
  const c3 = document.getElementById('chartPOStatus');
  if(c3){
    drawDoughnut(c3,
      active.map(x=>x.s),
      active.map(x=>x.c),
      ['#38bdf8','#22c55e','#f59e0b','#f87171','#818cf8','#22d3ee','#a3e635','#fb923c','#e879f9','#94a3b8']);
  }

  const divSpend = {};
  list('purchaseOrders').filter(p=>p.status!=='Cancelled').forEach(p=>{
    const k = p.division || 'Unassigned';
    divSpend[k] = (divSpend[k]||0) + poTotal(p);
  });
  const divKeys = Object.keys(divSpend).sort((a,b)=>divSpend[b]-divSpend[a]).slice(0,8);
  const c4 = document.getElementById('chartDivision');
  if(c4){
    if(divKeys.length) drawHBarChart(c4, divKeys, divKeys.map(k=>divSpend[k]), '#818cf8');
    else drawHBarChart(c4, [], [], '#818cf8');
  }
}

---------------------------------------------------------------------------- */
function toCSV(headers, rows){
  const esc_ = v => {
    const s = String(v===undefined||v===null?'':v).replace(/"/g,'""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  };
  return [headers.map(esc_).join(','), ...rows.map(r=>r.map(esc_).join(','))].join('\r\n');
}
function download(filename, content, mime){
  const blob = new Blob([content], {type: mime||'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function exportCollectionCSV(collection){
  const cfg = COLLECTIONS[collection];
  const rows = list(collection);
  if(!rows.length){ toast('No data to export','err'); return; }
  const headers = cfg.columns.map(c=>c.label);
  const data = rows.map(r=> cfg.columns.map(c=>{
    if(c.fmt){
      const v = c.fmt(r[c.key], r);
      return String(v).replace(/<[^>]*>/g,'');
    }
    return r[c.key]===undefined?'':r[c.key];
  }));
  download(collection+'-'+today()+'.csv', toCSV(headers, data));
  toast('CSV exported','ok');
}

function printRecord(collection, id){
  const rec = find(collection, id);
  if(!rec) return;
  const cfg = COLLECTIONS[collection];
  let rows = '';
  let lastGroup = null;
  cfg.fields.forEach(f=>{
    if(f.group && f.group !== lastGroup){
      lastGroup = f.group;
      rows += `<tr><th colspan="2" style="background:#dde6ef">${esc(f.group)}</th></tr>`;
    }
    let v = rec[f.key];
    if(f.type==='multiselect') v = Array.isArray(v)? v.join(', ') : '';
    if(f.type==='select' && f.key==='supplierKey') v = supLabel(v);
    if(f.type==='date') v = fmtDate(v);
    if(v===undefined||v==='') v = '—';
    rows += `<tr><td style="width:250px"><strong>${esc(f.label)}</strong></td><td>${esc(v)}</td></tr>`;
  });

  let itemsHtml = '';
  if(cfg.items && Array.isArray(rec.items) && rec.items.length){
    itemsHtml = `<table><thead><tr>${cfg.items.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${rec.items.map(it=>`<tr>${cfg.items.map(c=>`<td>${esc(it[c.key]===undefined?'':it[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    const t = itemsTotal(rec.items,{delivery:rec.deliveryCharge, noTax:cfg.totals&&cfg.totals.noTax});
    itemsHtml += `<table style="margin-top:8px"><tbody>
      <tr><td class="r"><strong>Subtotal</strong></td><td class="r" style="width:160px">${money(t.sub)}</td></tr>
      ${!(cfg.totals&&cfg.totals.noTax)?`<tr><td class="r"><strong>Discount</strong></td><td class="r">${money(t.disc)}</td></tr>
      <tr><td class="r"><strong>Tax</strong></td><td class="r">${money(t.tax)}</td></tr>`:''}
      ${t.delivery?`<tr><td class="r"><strong>Delivery</strong></td><td class="r">${money(t.delivery)}</td></tr>`:''}
      <tr><td class="r"><strong>TOTAL</strong></td><td class="r"><strong>${money(t.total)}</strong></td></tr>
    </tbody></table>`;
  }

  printHTML(cfg.label+' — '+(rec[cfg.idField]||''), `<table>${rows}</table>${itemsHtml}`);
}
function printReport(){
  const sel = state.reportSelection ? REPORTS.find(r=>r.id===state.reportSelection) : null;
  if(!sel){ toast('Open a report first','err'); return; }
  const data = sel.run();
  const html = `<table><thead><tr>${data.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${data.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c===undefined||c===null||c===''?'—':c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  printHTML(sel.title, html);
}
function printStatement(){
  const key = state.tab.statementSupplier;
  if(!key){ toast('Select a supplier first','err'); return; }
  const rows = buildStatement(key);
  let running = 0;
  const body = rows.map(r=>{
    running += r.debit - r.credit;
    return `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.ref)}</td><td>${esc(r.desc)}</td>
      <td class="r">${r.debit?money(r.debit):'—'}</td>
      <td class="r">${r.credit?money(r.credit):'—'}</td>
      <td class="r">${money(running)}</td></tr>`;
  }).join('');
  const html = `<div class="block"><strong>Supplier:</strong> ${esc(supLabel(key))}</div>
    <table><thead><tr><th>Date</th><th>Reference</th><th>Description</th><th class="r">Debit</th><th class="r">Credit</th><th class="r">Balance</th></tr></thead>
    <tbody>${body}
    <tr><td colspan="3"><strong>Closing Balance</strong></td>
    <td class="r"><strong>${money(rows.reduce((a,r)=>a+r.debit,0))}</strong></td>
    <td class="r"><strong>${money(rows.reduce((a,r)=>a+r.credit,0))}</strong></td>
    <td class="r"><strong>${money(running)}</strong></td></tr></tbody></table>`;
  printHTML('Supplier Statement — '+supLabel(key), html);
}

/* ----------------------------------------------------------------------------
   25. GLOBAL EVENT HANDLING
---------------------------------------------------------------------------- */
document.addEventListener('click', async (e)=>{

  /* overlay click closes modal */
  if(e.target.classList && e.target.classList.contains('modal-overlay')){
    closeModal();
    return;
  }

  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  switch(action){

    case 'toggle-sidebar': {
      $('#sidebar').classList.toggle('open');
      break;
    }

    case 'goto': {
      const v = t.dataset.view;
      state.view = v;
      state.reportSelection = null;
      $('#sidebar').classList.remove('open');
      window.scrollTo({top:0, behavior:'smooth'});
      render();
      break;
    }

    case 'close-modal': closeModal(); break;

    case 'new-record': {
      e.preventDefault();
      await openNewForm(t.dataset.collection);
      break;
    }

    case 'edit-record': {
      e.preventDefault();
      closeModal();
      setTimeout(()=> openEditForm(t.dataset.collection, t.dataset.id), 60);
      break;
    }

    case 'view-record': {
      e.preventDefault();
      openDetail(t.dataset.collection, t.dataset.id);
      break;
    }

    case 'delete-record': {
      e.preventDefault();
      const c = t.dataset.collection, id = t.dataset.id;
      const rec = find(c, id);
      const label = rec ? (rec[COLLECTIONS[c].idField] || rec.name || 'this record') : 'this record';
      if(confirm(`Permanently delete ${label}?\n\nThis action cannot be undone and will be recorded in the audit trail.`)){
        closeModal();
        await deleteRecord(c, id);
      }
      break;
    }

    case 'add-item': {
      e.preventDefault();
      const form = $('#recordForm');
      const collection = form.dataset.collection || state.editingCollection;
      const cfg = COLLECTIONS[currentFormCollection()];
      const blank = {};
      (cfg.items||[]).forEach(c=> blank[c.key] = '');
      modalItems.push(blank);
      refreshItemsEditor();
      break;
    }

    case 'remove-item': {
      e.preventDefault();
      const idx = parseInt(t.dataset.idx,10);
      modalItems.splice(idx,1);
      refreshItemsEditor();
      break;
    }

    case 'sort': {
      const c = t.dataset.collection, k = t.dataset.key;
      const cur = state.sort[c];
      state.sort[c] = { key:k, dir: (cur && cur.key===k && cur.dir==='asc') ? 'desc' : 'asc' };
      render();
      break;
    }

    case 'export-csv': exportCollectionCSV(t.dataset.collection); break;

    case 'run-report': {
      state.reportSelection = t.dataset.id;
      render();
      window.scrollTo({top:0,behavior:'smooth'});
      break;
    }
    case 'clear-report': state.reportSelection = null; render(); break;
    case 'print-report': printReport(); break;
    case 'print-statement': printStatement(); break;
    case 'print-record': printRecord(t.dataset.collection, t.dataset.id); break;

    case 'export-report': {
      const sel = state.reportSelection ? REPORTS.find(r=>r.id===state.reportSelection) : null;
      if(!sel){ toast('Open a report first','err'); break; }
      const data = sel.run();
      download(sel.id+'-'+today()+'.csv', toCSV(data.columns, data.rows.map(r=>r.map(c=>c===undefined?'':c))));
      toast('CSV exported','ok');
      break;
    }

    case 'export-statement': {
      const key = state.tab.statementSupplier;
      if(!key){ toast('Select a supplier first','err'); break; }
      const rows = buildStatement(key);
      let running = 0;
      const data = rows.map(r=>{
        running += r.debit - r.credit;
        return [r.date, r.ref, r.desc, r.debit||'', r.credit||'', running];
      });
      download('statement-'+today()+'.csv', toCSV(['Date','Reference','Description','Debit','Credit','Balance'], data));
      toast('CSV exported','ok');
      break;
    }

    case 'statement': {
      state.view = 'statements';
      state.tab.statementSupplier = t.dataset.id;
      render();
      break;
    }

    case 'load-default-categories': {
      if(!confirm('Load the standard supplier category set?\n\nExisting categories will not be modified.')) break;
      await loadDefaultCategories();
      break;
    }

    case 'export-all': {
      const payload = JSON.stringify(state.data, null, 2);
      download('ngt-supplier-system-'+today()+'.json', payload, 'application/json');
      toast('Full data export downloaded','ok');
      break;
    }

    case 'clear-compare': {
      state.compareSelection = [];
      render();
      break;
    }
  }
});

/* checkbox toggle for comparison */
document.addEventListener('change', (e)=>{
  const t = e.target;
  if(t.dataset && t.dataset.action === 'toggle-compare'){
    const id = t.dataset.id;
    if(t.checked){
      if(!state.compareSelection.includes(id)) state.compareSelection.push(id);
    }else{
      state.compareSelection = state.compareSelection.filter(x=>x!==id);
    }
    render();
    return;
  }

  if(t.dataset && t.dataset.filterCollection){
    const c = t.dataset.filterCollection;
    state.filters[c] = state.filters[c] || {};
    state.filters[c][t.dataset.filterKey] = t.value;
    render();
    return;
  }

  if(t.id === 'roleSelect'){
    state.role = t.value;
    const allowed = NAV.some(g=>g.items.some(i=> i.id===state.view && i.roles.includes(state.role)));
    if(!allowed) state.view = 'dashboard';
    render();
    return;
  }
});

/* live item editing */
document.addEventListener('input', (e)=>{
  const t = e.target;
  if(t.dataset && t.dataset.itemIdx !== undefined){
    const idx = parseInt(t.dataset.itemIdx, 10);
    const key = t.dataset.itemKey;
    if(!modalItems[idx]) modalItems[idx] = {};
    modalItems[idx][key] = t.value;
    updateTotalsBar();
  }
});

function currentFormCollection(){
  return window.__currentFormCollection || 'suppliers';
}

function refreshItemsEditor(){
  const cfg = COLLECTIONS[currentFormCollection()];
  const body = document.getElementById('itemsBody');
  if(!body) return;
  const cols = cfg.items || [];
  if(!modalItems.length){
    body.innerHTML = `<tr><td colspan="${cols.length+1}" style="text-align:center;padding:1.2rem;color:#5c7a9c">No line items yet — click "Add Line".</td></tr>`;
    updateTotalsBar();
    return;
  }
  body.innerHTML = modalItems.map((it, idx)=>{
    const tds = cols.map(c=>{
      const val = it[c.key] !== undefined ? it[c.key] : '';
      const step = c.type === 'number' ? 'step="0.01"' : '';
      return `<td style="width:${c.width||'auto'}"><input type="number" ${step} data-item-idx="${idx}" data-item-key="${esc(c.key)}" value="${esc(val)}"></td>`;
    }).join('');
    return `<tr>${tds}<td style="width:44px" class="t-center">
      <button type="button" class="btn btn-xs btn-danger" data-action="remove-item" data-idx="${idx}"><i class="fa fa-trash"></i></button></td></tr>`;
  }).join('');
  updateTotalsBar();
}

function updateTotalsBar(){
  const bar = document.getElementById('totalsBar');
  if(!bar) return;
  const cfg = COLLECTIONS[currentFormCollection()];
  bar.innerHTML = buildTotalsHtml(cfg);
}

/* ----------------------------------------------------------------------------
   26. DEFAULT CATEGORY LOADER
---------------------------------------------------------------------------- */
async function loadDefaultCategories(){
  try{
    const existing = list('categories');
    const existingNames = new Set(existing.map(c=>String(c.name||'').toLowerCase()));
    let order = existing.length;

    for(const group of DEFAULT_SETTINGS.defaultCategories){
      let groupRef = null;
      if(!existingNames.has(group.name.toLowerCase())){
        const ref = DB.ref('categories').push();
        await ref.set({
          categoryId: 'CAT-' + String(++order).padStart(3,'0'),
          name: group.name,
          parent: '',
          division: group.division,
          description: 'Standard category group'
        });
        existingNames.add(group.name.toLowerCase());
      }
      for(const child of (group.children||[])){
        if(existingNames.has(child.toLowerCase())) continue;
        const ref = DB.ref('categories').push();
        await ref.set({
          categoryId: 'CAT-' + String(++order).padStart(3,'0'),
          name: child,
          parent: group.name,
          division: group.division,
          description: ''
        });
        existingNames.add(child.toLowerCase());
      }
    }
    toast('Default supplier categories loaded','ok');
  }catch(err){
    toast('Failed to load categories: '+err.message,'err');
  }
}

function setConnection(stateName){
  const pill = $('#connPill');
  const txt = $('#connText');
  pill.classList.remove('online','offline');
  if(stateName === 'online'){ pill.classList.add('online'); txt.textContent = 'Live · Connected'; }
  else if(stateName === 'offline'){ pill.classList.add('offline'); txt.textContent = 'Offline'; }
  else { txt.textContent = 'Connecting…'; }
}

DB.ref('.info/connected').on('value', snap=>{
  setConnection(snap.val() ? 'online' : 'offline');
});

DB.ref('/').on('value', snap=>{
  state.data = snap.val() || {};
  if(!state.ready){
    state.ready = true;
    const suppliers = list('suppliers');
    if(suppliers.length && !state.tab.statementSupplier){
      state.tab.statementSupplier = suppliers[0]._id;
    }
  }

}, err=>{
  console.error(err);
  setConnection('offline');
  toast('Database read error: '+err.message,'err');
});

---------------------------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', ()=>{
  setConnection('connecting');

  /* default settings bootstrap — only written if missing, never overwrites */
  DB.ref('settings').once('value').then(snap=>{
    const cur = snap.val() || {};
    const patch = {};
    if(!cur.company) patch.company = DEFAULT_SETTINGS.company;
    if(!cur.tax) patch.tax = DEFAULT_SETTINGS.tax;
    if(!cur.numbering) patch.numbering = DEFAULT_SETTINGS.numbering;

  }).catch(()=>{});

  window.addEventListener('resize', ()=>{
    if(state.view === 'dashboard') drawDashboardCharts();
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeModal();
  });

  render();
});

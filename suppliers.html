<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NGT Supplier Management System | Ngure Gacheru Technologies</title>
<meta name="description" content="Ngure Gacheru Technologies — Supplier, Procurement, Accounts Payable and Supplier Performance Management System." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   NGT SUPPLIER MANAGEMENT SYSTEM — STYLESHEET
   Theme: modern tech / dark navy + cyan accent
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root{
  --bg:#0b1117;
  --bg-2:#0e1623;
  --bg-3:#0b121c;
  --panel:#1a2536;
  --panel-2:#152031;
  --panel-3:#0f172a;
  --line:#2d3a4f;
  --line-soft:#1e2c3a;
  --txt:#e0e7ff;
  --txt-2:#b0c4de;
  --txt-3:#8ba0bc;
  --accent:#38bdf8;
  --accent-2:#7dd3fc;
  --accent-dim:#2563eb;
  --ok:#34d399;
  --warn:#fbbf24;
  --bad:#f87171;
  --info:#60a5fa;
  --purple:#a78bfa;
  --radius:18px;
  --radius-sm:10px;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 24px 48px -12px rgba(0,0,0,.7);
}

html{ scroll-behavior:smooth; }

body {
  font-family:'Inter',sans-serif;
  background-color:var(--bg);
  color:var(--txt);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

.container { max-width:1280px; margin:0 auto; padding:0 2rem; }

/* ===== HEADER ===== */
.header {
  background:#0f172a;
  border-bottom:2px solid var(--line-soft);
  box-shadow:0 4px 20px rgba(0,180,255,.10);
  position:sticky; top:0; z-index:100;
  backdrop-filter:blur(6px);
  background-color:rgba(15,23,42,.96);
}
.header-container {
  display:flex; justify-content:space-between; align-items:center;
  padding:.85rem 2rem; gap:1rem; flex-wrap:wrap;
}
.brand-block{ display:flex; align-items:center; gap:1rem; }
.brand-mark{
  width:46px; height:46px; border-radius:14px; flex:none;
  display:grid; place-items:center; font-weight:800; font-size:1.05rem;
  background:linear-gradient(135deg,#0ea5e9,#2563eb);
  color:#04121f; box-shadow:0 0 22px #38bdf855;
  letter-spacing:-1px;
}
.company-name {
  font-size:1.55rem; font-weight:700;
  background:linear-gradient(135deg,#a5f3fc,#38bdf8);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:-.5px; line-height:1.15;
}
.motto {
  font-size:.82rem; color:#9ab3d8; font-style:italic;
  border-left:3px solid var(--accent); padding-left:.65rem; margin-top:.15rem;
}
.header-right{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.header-accent { display:flex; gap:8px; }
.dot { width:10px; height:10px; background-color:var(--accent); border-radius:50%; opacity:.7; animation:pulse 2s infinite; }
.dot:nth-child(2){ animation-delay:.4s; } .dot:nth-child(3){ animation-delay:.8s; }
@keyframes pulse { 0%,100%{ transform:scale(1); opacity:.7; } 50%{ transform:scale(1.3); opacity:1; } }

.conn-badge{
  display:inline-flex; align-items:center; gap:.45rem;
  font-size:.72rem; font-weight:600; letter-spacing:.4px;
  padding:.32rem .7rem; border-radius:40px;
  border:1px solid var(--line); background:#101a28; color:var(--txt-3);
}
.conn-badge .cdot{ width:8px; height:8px; border-radius:50%; background:var(--warn); box-shadow:0 0 8px currentColor; }
.conn-badge.online .cdot{ background:var(--ok); }
.conn-badge.offline .cdot{ background:var(--bad); }

.user-pick{
  background:#101a28; border:1px solid var(--line); color:var(--txt);
  border-radius:40px; padding:.35rem .8rem; font-size:.78rem; font-family:inherit; outline:none;
}

/* ===== LAYOUT SHELL ===== */
.app-shell{ display:grid; grid-template-columns:262px 1fr; min-height:calc(100vh - 76px); }

/* ===== SIDEBAR ===== */
.sidebar{
  background:linear-gradient(180deg,#0d1523 0%,#0a1119 100%);
  border-right:1px solid var(--line-soft);
  padding:1.1rem .8rem 3rem;
  overflow-y:auto; height:calc(100vh - 76px); position:sticky; top:76px;
}
.sidebar::-webkit-scrollbar{ width:8px; }
.sidebar::-webkit-scrollbar-thumb{ background:#22314a; border-radius:8px; }
.sidebar::-webkit-scrollbar-track{ background:transparent; }

.nav-group-title{
  font-size:.66rem; letter-spacing:2px; text-transform:uppercase;
  color:#5c7492; font-weight:700; margin:1.15rem .75rem .45rem;
}
.nav-item{
  display:flex; align-items:center; gap:.7rem;
  padding:.55rem .75rem; border-radius:11px; cursor:pointer;
  color:#a9bdd8; font-size:.855rem; font-weight:500;
  transition:all .16s ease; border:1px solid transparent; user-select:none;
}
.nav-item i{ width:18px; text-align:center; font-size:.88rem; color:#5f7ea3; transition:color .16s; }
.nav-item:hover{ background:#16223400; background-color:#15203180; color:#dbeafe; transform:translateX(2px); }
.nav-item:hover i{ color:var(--accent); }
.nav-item.active{
  background:linear-gradient(90deg,#0ea5e922,#38bdf80d);
  color:#e0f2fe; border-color:#38bdf840;
  box-shadow:inset 3px 0 0 var(--accent);
}
.nav-item.active i{ color:var(--accent); }
.nav-count{
  margin-left:auto; font-size:.68rem; background:#1d2b40; color:#8fb4dc;
  padding:.06rem .45rem; border-radius:20px; font-weight:700;
}

/* ===== MAIN ===== */
.main{ padding:1.6rem 2rem 4rem; min-width:0; }

.page-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:1rem; flex-wrap:wrap; margin-bottom:1.4rem;
  border-bottom:1px solid var(--line-soft); padding-bottom:1rem;
}
.page-head h1{
  font-size:1.7rem; font-weight:700; letter-spacing:-.6px;
  background:linear-gradient(135deg,#e0f2fe,#7dd3fc);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.page-head p{ color:var(--txt-3); font-size:.85rem; margin-top:.15rem; max-width:760px; }
.page-actions{ display:flex; gap:.55rem; flex-wrap:wrap; }

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  padding:.62rem 1.35rem; border-radius:40px; font-weight:600; font-size:.82rem;
  text-decoration:none; transition:all .22s ease; border:1px solid transparent;
  cursor:pointer; font-family:inherit; white-space:nowrap;
}
.btn-sm{ padding:.42rem .95rem; font-size:.75rem; }
.btn-primary{ background:var(--accent); color:#06131f; box-shadow:0 8px 16px #38bdf830; }
.btn-primary:hover{ background:var(--accent-2); transform:translateY(-2px); box-shadow:0 14px 22px #38bdf860; }
.btn-outline{ border:1.5px solid var(--accent); color:#cdeafd; background:transparent; }
.btn-outline:hover{ background:var(--accent); color:#06131f; transform:translateY(-2px); }
.btn-ghost{ border:1px solid var(--line); color:var(--txt-2); background:#131f2f; }
.btn-ghost:hover{ border-color:var(--accent); color:#dff2ff; }
.btn-danger{ border:1.5px solid #f8717155; color:#fca5a5; background:#f8717112; }
.btn-danger:hover{ background:#f87171; color:#1a0505; border-color:#f87171; }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none !important; }

.icon-btn{
  background:#182234; border:1px solid var(--line); color:var(--txt-2);
  width:28px; height:28px; border-radius:8px; cursor:pointer;
  display:inline-grid; place-items:center; font-size:.8rem; transition:.16s;
}
.icon-btn:hover{ border-color:var(--accent); color:var(--accent); }

/* ===== KPI CARDS ===== */
.kpi-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:1rem; margin-bottom:1.6rem;
}
.kpi{
  background:linear-gradient(150deg,#172335 0%,#131d2c 100%);
  border:1px solid var(--line); border-radius:var(--radius);
  padding:1.15rem 1.25rem; position:relative; overflow:hidden;
  transition:all .25s cubic-bezier(.25,.46,.45,.94);
}
.kpi::before{
  content:''; position:absolute; top:-45px; right:-45px; width:130px; height:130px;
  border-radius:50%; background:radial-gradient(circle,#38bdf828,transparent 70%);
}
.kpi:hover{ transform:translateY(-5px); border-color:#38bdf866; box-shadow:0 18px 32px -14px #000, 0 0 0 1px #38bdf830; }
.kpi .klabel{
  font-size:.68rem; text-transform:uppercase; letter-spacing:1.4px;
  color:#7b93b3; font-weight:700; display:flex; align-items:center; gap:.45rem;
}
.kpi .klabel i{ color:var(--accent); font-size:.78rem; }
.kpi .kval{ font-size:1.62rem; font-weight:800; letter-spacing:-1px; margin-top:.4rem; color:#f0f9ff; }
.kpi .ksub{ font-size:.72rem; color:#7f96b5; margin-top:.2rem; }
.kpi.ok .kval{ color:#6ee7b7; } .kpi.warn .kval{ color:#fcd34d; } .kpi.bad .kval{ color:#fca5a5; }

/* ===== CARDS / PANELS ===== */
.card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:1.3rem 1.35rem;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.card::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:100%;
  background:radial-gradient(circle at top right,#2563eb14,transparent 70%); pointer-events:none;
}
.card > *{ position:relative; z-index:1; }
.card-title{
  font-size:.98rem; font-weight:700; color:#cfe4fb; margin-bottom:.9rem;
  display:flex; align-items:center; gap:.55rem;
}
.card-title i{ color:var(--accent); }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; }
.grid-2-1{ display:grid; grid-template-columns:2fr 1fr; gap:1.1rem; }
.mb{ margin-bottom:1.1rem; }

canvas.chart{ width:100%; height:230px; display:block; }

/* ===== TOOLBAR ===== */
.toolbar{
  display:flex; gap:.65rem; flex-wrap:wrap; align-items:center;
  margin-bottom:1rem; background:#131e2e; padding:.7rem .85rem;
  border:1px solid var(--line); border-radius:14px;
}
.input, select.input, textarea.input{
  background:#0d1622; border:1px solid var(--line); color:var(--txt);
  padding:.55rem .85rem; border-radius:10px; font-size:.82rem;
  font-family:inherit; outline:none; transition:.16s; width:100%;
}
.input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px #38bdf822; }
.input::placeholder{ color:#5b7characters; color:#5b7391; }
select.input{ cursor:pointer; }
textarea.input{ resize:vertical; min-height:74px; line-height:1.5; }
.toolbar .search{ flex:1; min-width:210px; }
.toolbar select{ max-width:210px; }
.result-count{ font-size:.75rem; color:var(--txt-3); white-space:nowrap; padding:0 .3rem; }

/* ===== TABLES ===== */
.table-wrap{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); overflow:auto; box-shadow:var(--shadow);
  max-height:calc(100vh - 300px);
}
table{ width:100%; border-collapse:collapse; font-size:.815rem; min-width:640px; }
thead th{
  background:#16223440; background-color:#162234; color:#8fb0d6;
  text-align:left; padding:.72rem .85rem; font-weight:700;
  font-size:.68rem; text-transform:uppercase; letter-spacing:.9px;
  position:sticky; top:0; z-index:2; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{
  padding:.62rem .85rem; border-bottom:1px solid #1b2739;
  color:#c8d8ec; vertical-align:middle;
}
tbody tr{ transition:background .14s; }
tbody tr:hover{ background:#1c2941; }
tbody tr:last-child td{ border-bottom:none; }
td.money, th.money{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
td.actions{ white-space:nowrap; text-align:right; }
.cell-strong{ color:#eaf4ff; font-weight:600; }
.cell-sub{ font-size:.7rem; color:#7b93b3; display:block; }
.empty-row td{
  text-align:center; padding:3rem 1rem; color:#6d86a6; font-style:italic;
}
.empty-row i{ display:block; font-size:2rem; margin-bottom:.6rem; color:#2f4considered; color:#2f4763; }

/* ===== BADGES ===== */
.badge{
  display:inline-block; padding:.2rem .6rem; border-radius:30px;
  font-size:.68rem; font-weight:700; letter-spacing:.35px;
  border:1px solid; white-space:nowrap; line-height:1.5;
}
.b-green{ color:#6ee7b7; border-color:#34d39955; background:#34d3991a; }
.b-blue{ color:#93c5fd; border-color:#60a5fa55; background:#60a5fa1a; }
.b-amber{ color:#fcd34d; border-color:#fbbf2455; background:#fbbf241a; }
.b-red{ color:#fca5a5; border-color:#f8717155; background:#f871711a; }
.b-grey{ color:#a7b6cb; border-color:#64748b55; background:#64748b1a; }
.b-purple{ color:#c4b5fd; border-color:#a78bfa55; background:#a78bfa1a; }
.b-cyan{ color:#67e8f9; border-color:#22d3ee55; background:#22d3ee1a; }

/* ===== FORMS ===== */
.form-section-title{
  grid-column:1/-1; font-size:.7rem; text-transform:uppercase; letter-spacing:1.6px;
  color:var(--accent); font-weight:800; margin:1.1rem 0 .1rem;
  padding-bottom:.4rem; border-bottom:1px dashed #2b3d57;
}
.form-section-title:first-child{ margin-top:0; }
.form-grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:.85rem 1rem; }
.field{ display:flex; flex-direction:column; gap:.3rem; grid-column:span 6; }
.field.col-3{ grid-column:span 3; } .field.col-4{ grid-column:span 4; }
.field.col-6{ grid-column:span 6; } .field.col-8{ grid-column:span 8; }
.field.col-12{ grid-column:span 12; }
.field label{ font-size:.72rem; font-weight:600; color:#9db4d2; letter-spacing:.3px; }
.field label .req{ color:var(--bad); margin-left:2px; }
.field .hint{ font-size:.68rem; color:#69819f; }

/* ===== ITEMS EDITOR ===== */
.items-editor{ margin-top:.4rem; }
.items-table{ width:100%; border-collapse:collapse; font-size:.8rem; min-width:0; }
.items-table th{
  background:#131e2e; color:#8fb0d6; font-size:.66rem; text-transform:uppercase;
  letter-spacing:.8px; padding:.5rem .55rem; text-align:left; border-bottom:1px solid var(--line);
}
.items-table td{ padding:.3rem .3rem; border-bottom:1px solid #1b2739; }
.items-table input{ padding:.4rem .55rem; font-size:.78rem; }
.items-total{
  text-align:right; font-size:.85rem; color:#9db4d2; padding:.65rem .3rem 0;
  border-top:1px dashed #2b3d57; margin-top:.5rem;
}
.items-total strong{ color:#7dd3fc; font-size:1.05rem; }

/* ===== MODAL ===== */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(4,9,16,.82); backdrop-filter:blur(4px);
  display:flex; align-items:flex-start; justify-content:center; z-index:900;
  padding:2.2rem 1rem; overflow-y:auto; animation:fadeIn .18s ease;
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal{
  background:linear-gradient(160deg,#16212f,#111a26);
  border:1px solid #2f405a; border-radius:22px; width:min(960px,100%);
  box-shadow:var(--shadow-lg); animation:slideUp .24s cubic-bezier(.2,.9,.3,1.2);
  overflow:hidden;
}
@keyframes slideUp{ from{ transform:translateY(26px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
.modal-head{
  display:flex; justify-content:space-between; align-items:center;
  padding:1.05rem 1.4rem; border-bottom:1px solid var(--line); background:#131e2e;
}
.modal-head h3{ font-size:1.05rem; font-weight:700; color:#e2f2ff; letter-spacing:-.3px; }
.modal-body{ padding:1.3rem 1.4rem; max-height:66vh; overflow-y:auto; }
.modal-foot{
  display:flex; justify-content:flex-end; gap:.6rem; padding:1rem 1.4rem;
  border-top:1px solid var(--line); background:#101a27;
}
.modal-body::-webkit-scrollbar{ width:9px; }
.modal-body::-webkit-scrollbar-thumb{ background:#26364e; border-radius:9px; }

/* ===== TOASTS ===== */
.toast-wrap{ position:fixed; right:1.2rem; bottom:1.2rem; z-index:1200; display:flex; flex-direction:column; gap:.6rem; }
.toast{
  background:#16232f; border:1px solid var(--line); border-left:4px solid var(--accent);
  border-radius:12px; padding:.8rem 1.05rem; font-size:.82rem; color:#d9e9fb;
  box-shadow:var(--shadow-lg); animation:toastIn .25s ease; max-width:360px;
}
.toast.ok{ border-left-color:var(--ok); } .toast.bad{ border-left-color:var(--bad); }
.toast.warn{ border-left-color:var(--warn); }
@keyframes toastIn{ from{ transform:translateX(30px); opacity:0 } to{ transform:translateX(0); opacity:1 } }

/* ===== MISC ===== */
.empty-state{
  text-align:center; padding:3.4rem 1rem; color:#6d86a6;
  border:1px dashed #2a3a52; border-radius:18px; background:#101a27;
}
.empty-state i{ font-size:2.4rem; color:#2f4763; display:block; margin-bottom:.7rem; }
.empty-state h4{ color:#a9c2de; font-size:1rem; margin-bottom:.3rem; }
.empty-state p{ font-size:.8rem; }

.stmt-table td, .stmt-table th{ font-size:.8rem; }
.legend{ display:flex; flex-wrap:wrap; gap:.8rem; margin-top:.8rem; }
.legend-item{ display:flex; align-items:center; gap:.4rem; font-size:.74rem; color:var(--txt-2); }
.legend-swatch{ width:11px; height:11px; border-radius:3px; }

.pill-row{ display:flex; flex-wrap:wrap; gap:.45rem; margin-bottom:1rem; }
.pill{
  padding:.35rem .85rem; border-radius:30px; border:1px solid var(--line);
  background:#131e2e; font-size:.75rem; color:var(--txt-2); cursor:pointer; transition:.16s;
}
.pill:hover{ border-color:var(--accent); color:#dff2ff; }
.pill.active{ background:#38bdf81f; border-color:var(--accent); color:#bae6fd; font-weight:600; }

.animate-on-view{ opacity:0; transform:translateY(35px); transition:opacity .7s ease, transform .7s ease; }
.animate-on-view.visible{ opacity:1; transform:translateY(0); }

.spinner{
  width:16px; height:16px; border:2px solid #38bdf844; border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:-3px;
}
@keyframes spin{ to{ transform:rotate(360deg) } }

.mini-note{
  font-size:.72rem; color:#7f96b5; background:#101a27; border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:10px; padding:.6rem .85rem; margin-bottom:1rem;
}

/* ===== FOOTER ===== */
.footer{
  background:#0a111a; padding:1.6rem 0; border-top:1px solid #1e2c3c;
  text-align:center; color:#8ba0bc; font-size:.78rem;
}

/* ===== RESPONSIVE ===== */
@media (max-width:1024px){
  .app-shell{ grid-template-columns:1fr; }
  .sidebar{
    position:fixed; left:0; top:76px; width:262px; z-index:400;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:var(--shadow-lg);
  }
  .sidebar.open{ transform:translateX(0); }
  .menu-toggle{ display:inline-grid !important; }
  .grid-2, .grid-3, .grid-2-1{ grid-template-columns:1fr; }
}
@media (max-width:768px){
  .header-container{ flex-direction:column; text-align:center; gap:.5rem; padding:.8rem 1rem; }
  .brand-block{ flex-direction:column; }
  .motto{ border-left:none; border-top:2px solid var(--accent); padding-top:.3rem; padding-left:0; }
  .main{ padding:1.1rem .9rem 3rem; }
  .field{ grid-column:span 12 !important; }
  .company-name{ font-size:1.25rem; }
  .page-head h1{ font-size:1.35rem; }
  .sidebar{ top:auto; height:calc(100vh - 150px); }
}
.menu-toggle{ display:none; }
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-container">
    <div class="brand-block">
      <div class="brand-mark">NGT</div>
      <div>
        <div class="company-name">Ngure Gacheru Technologies</div>
        <div class="motto">Supplier &amp; Procurement Control Centre</div>
      </div>
    </div>
    <div class="header-right">
      <span class="conn-badge" id="connBadge"><span class="cdot"></span><span id="connText">Connecting…</span></span>
      <select class="user-pick" id="userPick" title="Active user (audit trail)">
        <option>Administrator</option>
        <option>Procurement Officer</option>
        <option>Finance Officer</option>
        <option>Inventory Officer</option>
        <option>Project Manager</option>
        <option>Technician</option>
        <option>Management</option>
      </select>
      <button class="icon-btn menu-toggle" id="menuToggle" title="Menu"><i class="fa-solid fa-bars"></i></button>
      <div class="header-accent"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </div>
</header>

<!-- ================= SHELL ================= -->
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function money(n){
  const num = Number(n || 0);
  return CURRENCY + ' ' + num.toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function num(n){ return Number(n || 0); }
function shortMoney(n){
  const v = Number(n || 0);
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return String(Math.round(v));
}
function fmtDate(d){
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return esc(d);
  const dd = String(dt.getDate()).padStart(2, '0');
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${dt.getFullYear()}`;
}
function today(){ return new Date().toISOString().slice(0, 10); }
function daysBetween(a, b){
  const d1 = new Date(a), d2 = new Date(b);
  if (isNaN(d1) || isNaN(d2)) return 0;
  return Math.round((d2 - d1) / 86400000);
}
function toast(msg, type = ''){

  $('#toastWrap').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 4200);
}

function statusClass(v){
  const s = String(v || '').toLowerCase();
  if (['active','approved','paid','fully delivered','completed','closed','resolved','accepted','credited','replaced','returned','online'].includes(s)) return 'b-green';
  if (['pending approval','pending verification','partially paid','partially delivered','under review','under inspection','submitted','expiring soon','pending supplier response','return requested','supplier approved','sent to supplier','invoiced','open'].includes(s)) return 'b-amber';
  if (['suspended','blacklisted','cancelled','rejected','overdue','expired','disputed','escalated','terminated','inactive','offline'].includes(s)) return 'b-red';
  if (['draft'].includes(s)) return 'b-grey';
  if (['received','converted to po'].includes(s)) return 'b-cyan';
  return 'b-blue';
}

/* --------------------------------------------------------------------------
   4. FIREBASE REST DATA LAYER
   -------------------------------------------------------------------------- */
async function dbGet(path){
  const res = await fetch(`${DB_URL}/${path}.json`, { cache: 'no-store' });
  if (!res.ok) throw new Error('Read failed (' + res.status + ')');
  return res.json();
}
async function dbPost(path, data){
  const res = await fetch(`${DB_URL}/${path}.json`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error('Write failed (' + res.status + ')');
  return res.json();
}
async function dbPatch(path, data){
  const res = await fetch(`${DB_URL}/${path}.json`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error('Update failed (' + res.status + ')');
  return res.json();
}
async function dbPut(path, data){
  const res = await fetch(`${DB_URL}/${path}.json`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error('Save failed (' + res.status + ')');
  return res.json();
}
async function dbDelete(path){
  const res = await fetch(`${DB_URL}/${path}.json`, { method: 'DELETE' });
  if (!res.ok) throw new Error('Delete failed (' + res.status + ')');
  return res.json();
}

function objToArray(obj){
  if (!obj || typeof obj !== 'object') return [];
  return Object.keys(obj).map(k => Object.assign({}, obj[k], { _id: k }));
}

async function loadAll(showToast){
  try{
    setConn('', 'Syncing…');
    const results = await Promise.all(
      COLLECTIONS.map(c => dbGet(c).catch(() => null))
    );
    COLLECTIONS.forEach((c, i) => { store[c] = objToArray(results[i]); });
    const settings = await dbGet('settings').catch(() => null);
    store.settings = settings || {};
    setConn('online', 'Realtime Connected');
    if (showToast) toast('<i class="fa-solid fa-rotate"></i> Data synchronised with Firebase.', 'ok');
    return true;
  }catch(err){
    console.error(err);
    setConn('offline', 'Offline / Error');
    if (showToast) toast('<i class="fa-solid fa-triangle-exclamation"></i> Could not reach the database: ' + esc(err.message), 'bad');
    return false;
  }
}

function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    const ok = await loadAll(false);
    if (ok && !$('#modalRoot').innerHTML) renderApp();
  }, 1600);
}

function startRealtime(){
  if (realtimeSource) { try { realtimeSource.close(); } catch(e){} }
  try{
    realtimeSource = new EventSource(`${DB_URL}/.json`);
    realtimeSource.addEventListener('put', scheduleReload);
    realtimeSource.addEventListener('patch', scheduleReload);
    realtimeSource.onopen = () => setConn('online', 'Realtime Connected');
    realtimeSource.onerror = () => setConn('', 'Reconnecting…');
  }catch(e){ /* EventSource unsupported — silent */ }
}

async function logAudit(entity, entityId, action, oldV, newV, reason){

    await dbPost('auditLog', {
      ts: new Date().toISOString(),
      user: state.user,
      entity: entity,
      entityId: entityId || '',
      action: action,
      oldValue: oldV ? JSON.stringify(oldV).slice(0, 1800) : '',
      newValue: newV ? JSON.stringify(newV).slice(0, 1800) : '',
      reason: reason || ''
    });
  }catch(e){ console.warn('Audit log failed', e); }
}

/* --------------------------------------------------------------------------
   6. SEQUENCE / CODE GENERATION
   -------------------------------------------------------------------------- */
function nextCode(collection, prefix, pad, key){
  key = key || 'code';
  const rows = store[collection] || [];
  let max = 0;
  rows.forEach(r => {
    const v = String(r[key] || '');
    const m = v.match(/(\d+)\s*$/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + '-' + String(max + 1).padStart(pad || 4, '0');
}

function getFilteredRows(modKey){
  const m = MODULES[modKey];
  let rows = (store[m.path] || []).slice();
  const q = (state.search[modKey] || '').toLowerCase().trim();
  const f = state.filter[modKey] || '';

  if (f && m.filterKey){
    rows = rows.filter(r => String(r[m.filterKey] || '') === f);
  }
  if (q){
    rows = rows.filter(r => {
      return m.columns.some(c => String(r[c.k] || '').toLowerCase().includes(q))
        || Object.values(r).some(v => String(v || '').toLowerCase().includes(q));
    });
  }
  return rows.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

function renderCell(row, col){
  const v = row[col.k];
  if (col.badge) return `<span class="badge ${statusClass(v)}">${esc(v || '—')}</span>`;
  if (col.date) return fmtDate(v);
  if (col.money) return money(v);
  if (col.k === 'code') return `<span class="cell-strong">${esc(v || '—')}</span>`;
  if (col.k === 'name' || col.k === 'title' || col.k === 'productName') return `<span class="cell-strong">${esc(v || '—')}</span>`;
  return esc(v === '' || v === undefined || v === null ? '—' : v);
}

function tableBodyHTML(modKey){
  const m = MODULES[modKey];
  const rows = getFilteredRows(modKey);
  if (!rows.length){
    return `<tr class="empty-row"><td colspan="${m.columns.length + 1}">
      <i class="fa-solid ${m.icon}"></i>
      No records found. Click <strong>+ New</strong> to create the first entry.
    </td></tr>`;
  }
  return rows.map(r => `
    <tr>
      ${m.columns.map(c => `<td class="${c.money ? 'money' : ''}">${renderCell(r, c)}</td>`).join('')}
      <td class="actions">
        <button class="icon-btn" data-act="edit" data-mod="${modKey}" data-id="${r._id}" title="Edit"><i class="fa-solid fa-pen"></i></button>

      </td>
    </tr>`).join('');
}

function fieldOptions(f, current){
  let opts = [];
  if (f.opts) opts = f.opts.map(o => ({ v: o, l: o }));
  else if (f.dyn && store[f.dyn]){
    opts = store[f.dyn].map(r => ({ v: r._id, l: (r.name || r.code || r._id) + (r.code && r.name ? ' (' + r.code + ')' : '') }));
  }
  return `<option value="">— Select —</option>` + opts.map(o =>
    `<option value="${esc(o.v)}" ${String(current) === String(o.v) ? 'selected' : ''}>${esc(o.l)}</option>`
  ).join('');
}

function buildField(f, rec){
  const val = rec[f.k] !== undefined && rec[f.k] !== null ? rec[f.k] : '';
  const req = f.req ? '<span class="req">*</span>' : '';
  const cls = 'field col-' + (f.col || 6);
  const dis = f.ro ? 'readonly style="opacity:.7"' : '';
  if (f.t === 'items'){
    return `<div class="${cls}">${itemsEditorHTML(f.schema, rec[f.k] || [])}</div>`;
  }
  if (f.t === 'select'){
    return `<div class="${cls}"><label>${f.l}${req}</label><select class="input" data-field="${f.k}" ${dis}>${fieldOptions(f, val)}</select></div>`;
  }
  if (f.t === 'textarea'){
    return `<div class="${cls}"><label>${f.l}${req}</label><textarea class="input" data-field="${f.k}" ${dis}>${esc(val)}</textarea></div>`;
  }
  const type = f.t === 'number' ? 'number' : (f.t === 'date' ? 'date' : (f.t === 'email' ? 'email' : (f.t === 'tel' ? 'tel' : 'text')));
  const step = f.t === 'number' ? 'step="any"' : '';
  return `<div class="${cls}"><label>${f.l}${req}</label><input class="input" type="${type}" ${step} data-field="${f.k}" value="${esc(val)}" ${dis}></div>`;
}

function buildForm(m, rec){
  let html = '<div class="form-grid">';
  let lastSec = null;
  m.fields.forEach(f => {
    if (f.sec !== lastSec){ html += `<div class="form-section-title">${esc(f.sec)}</div>`; lastSec = f.sec; }
    html += buildField(f, rec);
  });
  html += '</div>';
  return html;
}

function itemRowHTML(cols, it){

  `).join('')}<td style="width:34px"><button type="button" class="icon-btn" data-act="del-item" title="Remove"><i class="fa-solid fa-xmark"></i></button></td></tr>`;

function itemsEditorHTML(schemaKey, items){
  const cols = ITEM_SCHEMAS[schemaKey];
  const rows = (items && items.length) ? items : [{}];
  return `<div class="items-editor" data-schema="${schemaKey}">
    <label style="font-size:.72rem;font-weight:600;color:#9db4d2;letter-spacing:.3px;display:block;margin-bottom:.35rem">Line Items</label>
    <table class="items-table">
      <thead><tr>${cols.map(c => `<th>${c.l}</th>`).join('')}<th></th></tr></thead>
      <tbody data-items-body>${rows.map(r => itemRowHTML(cols, r)).join('')}</tbody>
    </table>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem">
      <button type="button" class="btn btn-outline btn-sm" data-act="add-item"><i class="fa-solid fa-plus"></i> Add Row</button>
      <div class="items-total" style="border:none;padding:0;margin:0">Line Total: <strong data-items-total>0.00</strong></div>
    </div>
  </div>`;
}

function collectItems(root){
  const editor = root.querySelector('.items-editor');
  if (!editor) return [];
  const cols = ITEM_SCHEMAS[editor.dataset.schema];
  const out = [];
  editor.querySelectorAll('[data-items-body] tr').forEach(tr => {
    const obj = {};
    let has = false;
    cols.forEach(c => {
      const inp = tr.querySelector(`[data-item-col="${c.k}"]`);
      const v = inp ? inp.value : '';
      obj[c.k] = c.t === 'number' ? (v === '' ? 0 : Number(v)) : v;
      if (v !== '' && v !== 0) has = true;
    });
    if (has) out.push(obj);
  });
  return out;
}

function recalcItems(root){
  const editor = root.querySelector('.items-editor');
  if (!editor) return;
  const schema = editor.dataset.schema;
  const cols = ITEM_SCHEMAS[schema];
  let total = 0;
  editor.querySelectorAll('[data-items-body] tr').forEach(tr => {
    const get = k => { const i = tr.querySelector(`[data-item-col="${k}"]`); return i ? Number(i.value || 0) : 0; };
    if (schema === 'quotation'){
      const gross = get('qty') * get('unitPrice');
      total += gross - (gross * get('discount') / 100);
    } else if (schema === 'po'){
      total += get('qty') * get('unitPrice');
    } else if (schema === 'pr'){
      total += get('qty') * get('estCost');
    }
  });
  const t = editor.querySelector('[data-items-total]');
  if (t) t.textContent = total.toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function saveForm(modKey, id){
  const m = MODULES[modKey];
  const root = $('.modal-body');
  const rec = {};

  // collect standard fields
  m.fields.forEach(f => {
    if (f.t === 'items') return;
    const el = root.querySelector(`[data-field="${f.k}"]`);
    if (!el) return;
    let v = el.value;
    if (f.t === 'number') v = v === '' ? 0 : Number(v);
    rec[f.k] = v;
  });

  // collect items
  m.fields.forEach(f => {
    if (f.t === 'items') rec[f.k] = collectItems(root);
  });

  // required validation
  const missing = m.fields.filter(f => f.req && f.t !== 'items' && (!rec[f.k] || String(rec[f.k]).trim() === ''));
  if (missing.length){
    toast('<i class="fa-solid fa-triangle-exclamation"></i> Please complete required field(s): ' + esc(missing.map(f => f.l).join(', ')), 'bad');
    return;
  }

  // compute derived values
  if (m.compute) rec = m.compute(rec);

  rec.updatedAt = new Date().toISOString();
  rec.updatedBy = state.user;

  const btn = $('[data-act="save-form"]');
  if (btn) btn.disabled = true;

  try{
    if (id){
      const old = (store[m.path] || []).find(r => r._id === id);
      const payload = Object.assign({}, rec);
      delete payload._id;
      await dbPatch(`${m.path}/${id}`, payload);
      await logAudit(m.path, id, 'UPDATE', old, payload, '');
      toast('<i class="fa-solid fa-circle-check"></i> Record updated successfully.', 'ok');
    } else {
      rec.createdAt = new Date().toISOString();
      rec.createdBy = state.user;
      const r = await dbPost(m.path, rec);
      await logAudit(m.path, r && r.name ? r.name : '', 'CREATE', null, rec, '');
      toast('<i class="fa-solid fa-circle-check"></i> Record created successfully.', 'ok');
    }
    closeModal();
    await loadAll(false);
    renderApp();
  }catch(err){
    console.error(err);
    toast('<i class="fa-solid fa-triangle-exclamation"></i> Save failed: ' + esc(err.message), 'bad');
    if (btn) btn.disabled = false;
  }
}

async function deleteRecord(modKey, id){
  const m = MODULES[modKey];
  const rec = (store[m.path] || []).find(r => r._id === id);
  if (!rec) return;
  if (!confirm(`Delete this ${m.label.replace(/s$/, '')} record permanently?\n\n${rec.code || ''} ${rec.name || rec.title || ''}\n\nThis action is logged in the audit trail.`)) return;
  try{
    await dbDelete(`${m.path}/${id}`);
    await logAudit(m.path, id, 'DELETE', rec, null, '');
    toast('<i class="fa-solid fa-trash"></i> Record deleted.', 'warn');
    await loadAll(false);
    renderApp();
  }catch(err){
    toast('<i class="fa-solid fa-triangle-exclamation"></i> Delete failed: ' + esc(err.message), 'bad');
  }
}

/* --------------------------------------------------------------------------
   13. CANVAS CHARTS (no external libraries)
   -------------------------------------------------------------------------- */
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  const w = rect.width || 400, h = rect.height || 220;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}

function drawBarChart(cv, labels, values, color){
  color = color || '#38bdf8';
  const c = setupCanvas(cv), ctx = c.ctx, w = c.w, h = c.h;
  const pad = { l: 52, r: 14, t: 18, b: 40 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const max = Math.max.apply(null, values.concat([1]));
  ctx.font = '11px Inter, sans-serif';
  ctx.strokeStyle = '#22314a'; ctx.fillStyle = '#7d93b0'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++){
    const y = pad.t + ch - (ch * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(shortMoney(max * i / 4), 6, y + 4);
  }
  const n = labels.length || 1;
  const slot = cw / n;
  const bw = Math.min(46, slot * 0.62);
  labels.forEach((lb, i) => {
    const v = values[i] || 0;
    const bh = (v / max) * ch;
    const x = pad.l + slot * i + (slot - bw) / 2;
    const y = pad.t + ch - bh;
    const grad = ctx.createLinearGradient(0, y, 0, y + bh);
    grad.addColorStop(0, color); grad.addColorStop(1, '#1d4ed8');
    ctx.fillStyle = grad;
    ctx.beginPath();
    const rr = Math.min(5, bh / 2);
    ctx.moveTo(x, y + bh); ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.lineTo(x + bw - rr, y); ctx.quadraticCurveTo(x + bw, y, x + bw, y + rr);
    ctx.lineTo(x + bw, y + bh); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8aa3c2';
    const txt = String(lb).slice(0, 9);
    ctx.fillText(txt, x + bw / 2 - ctx.measureText(txt).width / 2, h - pad.b + 16);
  });
}

function drawHBarChart(cv, labels, values, color){
  color = color || '#a78bfa';
  const c = setupCanvas(cv), ctx = c.ctx, w = c.w, h = c.h;
  const pad = { l: 118, r: 60, t: 12, b: 12 };
  const cw = w - pad.l - pad.r;
  const max = Math.max.apply(null, values.concat([1]));
  const n = labels.length || 1;
  const rowH = Math.min(30, (h - pad.t - pad.b) / n);
  ctx.font = '11px Inter, sans-serif';
  labels.forEach((lb, i) => {
    const y = pad.t + i * rowH + rowH * 0.18;
    const bh = rowH * 0.62;
    ctx.fillStyle = '#8aa3c2';
    const name = String(lb).length > 18 ? String(lb).slice(0, 17) + '…' : String(lb);
    ctx.fillText(name, 6, y + bh * 0.78);
    ctx.fillStyle = '#1c2942';
    ctx.fillRect(pad.l, y, cw, bh);
    const bw = (values[i] / max) * cw;
    const grad = ctx.createLinearGradient(pad.l, 0, pad.l + bw, 0);
    grad.addColorStop(0, '#2563eb'); grad.addColorStop(1, color);
    ctx.fillStyle = grad;
    ctx.fillRect(pad.l, y, bw, bh);
    ctx.fillStyle = '#cfe4fb';
    ctx.fillText(shortMoney(values[i]), pad.l + bw + 7, y + bh * 0.78);
  });
}

function drawDoughnut(cv, labels, values, colors){
  colors = colors || ['#38bdf8', '#a78bfa', '#34d399', '#fbbf24', '#f87171', '#60a5fa', '#f472b6', '#22d3ee', '#fb923c', '#4ade80'];
  const c = setupCanvas(cv), ctx = c.ctx, w = c.w, h = c.h;
  const total = values.reduce((a, b) => a + b, 0);
  const cx = w * 0.34, cy = h / 2, r = Math.min(w * 0.3, h * 0.42), ir = r * 0.6;
  if (total <= 0){
    ctx.strokeStyle = '#22314a'; ctx.lineWidth = r - ir;
    ctx.beginPath(); ctx.arc(cx, cy, (r + ir) / 2, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#6d86a6'; ctx.font = '12px Inter, sans-serif';
    ctx.fillText('No data', cx - 22, cy + 4);
    return;
  }
  let start = -Math.PI / 2;
  values.forEach((v, i) => {
    const ang = (v / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, start, start + ang);
    ctx.arc(cx, cy, ir, start + ang, start, true);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    start += ang;
  });
  ctx.font = '11px Inter, sans-serif';
  const lx = w * 0.66;
  let ly = cy - (labels.length * 9);
  labels.slice(0, 9).forEach((lb, i) => {
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(lx, ly - 8, 9, 9);
    ctx.fillStyle = '#9db4d2';
    const name = String(lb).length > 17 ? String(lb).slice(0, 16) + '…' : String(lb);
    ctx.fillText(name, lx + 14, ly);
    ly += 18;
  });
}

function drawLineChart(cv, labels, values, color){
  color = color || '#34d399';
  const c = setupCanvas(cv), ctx = c.ctx, w = c.w, h = c.h;
  const pad = { l: 52, r: 16, t: 18, b: 36 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const max = Math.max.apply(null, values.concat([1]));
  ctx.font = '11px Inter, sans-serif';
  ctx.strokeStyle = '#22314a'; ctx.fillStyle = '#7d93b0';
  for (let i = 0; i <= 4; i++){
    const y = pad.t + ch - (ch * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(shortMoney(max * i / 4), 6, y + 4);
  }
  const n = Math.max(1, values.length - 1);
  const pts = values.map((v, i) => ({
    x: pad.l + (cw * i / n),
    y: pad.t + ch - (v / max) * ch
  }));
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.lineTo(pts[pts.length - 1].x, pad.t + ch);
  ctx.lineTo(pts[0].x, pad.t + ch);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, color + '45'); grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad; ctx.fill();
  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = '#0b1117'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  });
  ctx.fillStyle = '#8aa3c2';
  labels.forEach((lb, i) => {
    const x = pad.l + (cw * i / n);
    ctx.fillText(String(lb), x - 12, h - pad.b + 17);
  });
}

function monthKey(d){ return d ? String(d).slice(0, 7) : ''; }
function lastMonths(n){
  const out = [];
  const now = new Date();
  for (let i = n - 1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push({ key: d.toISOString().slice(0, 7), label: d.toLocaleString('en', { month: 'short' }) });
  }
  return out;
}

function computeSupplierSpend(){
  const map = {};
  store.purchaseOrders.forEach(po => {
    const k = po.supplierId || po.supplierName || 'Unknown';
    map[k] = (map[k] || 0) + num(po.total);
  });
  return map;
}

function supplierName(id){
  const s = store.suppliers.find(x => x._id === id);
  return s ? s.name : (id || 'Unknown');
}

function computeBalances(){
  let owed = 0, paid = 0, overdue = 0;
  store.invoices.forEach(inv => {
    if (inv.status === 'Cancelled') return;
    owed += Math.max(0, num(inv.balance));
    paid += num(inv.amountPaid);
    if (inv.dueDate && daysBetween(today(), inv.dueDate) < 0 && num(inv.balance) > 0) overdue += num(inv.balance);
  });
  return { owed: owed, paid: paid, overdue: overdue };
}

function attentionList(){
  const items = [];
  const now = today();

  store.invoices.forEach(i => {
    if (i.status === 'Overdue') items.push({ t: 'bad', txt: `Overdue supplier invoice <strong>${esc(i.code || '')}</strong> — ${esc(i.supplierName || '')} — ${money(i.balance)}`, v: 'invoices' });
  });
  store.purchaseOrders.forEach(p => {
    if (p.expectedDelivery && ['Approved', 'Sent to Supplier', 'Partially Delivered'].includes(p.status) && daysBetween(now, p.expectedDelivery) < 0)
      items.push({ t: 'warn', txt: `Purchase order <strong>${esc(p.code || '')}</strong> delivery overdue since ${fmtDate(p.expectedDelivery)}`, v: 'purchaseOrders' });
    if (p.status === 'Partially Delivered') items.push({ t: 'warn', txt: `PO <strong>${esc(p.code || '')}</strong> is partially delivered — awaiting balance`, v: 'grns' });
  });
  store.contracts.forEach(c => {
    if (c.endDate){
      const d = daysBetween(now, c.endDate);
      if (d >= 0 && d <= 30) items.push({ t: 'warn', txt: `Contract <strong>${esc(c.code || '')}</strong> expires in ${d} day(s)`, v: 'contracts' });
      if (d < 0) items.push({ t: 'bad', txt: `Contract <strong>${esc(c.code || '')}</strong> has expired`, v: 'contracts' });
    }
  });
  store.documents.forEach(d => {
    if (d.expiryDate && daysBetween(now, d.expiryDate) < 0) items.push({ t: 'bad', txt: `Document <strong>${esc(d.title || d.code || '')}</strong> for ${esc(d.supplierName || '')} has expired`, v: 'documents' });
  });
  store.followups.forEach(f => {
    if (f.status === 'Overdue') items.push({ t: 'warn', txt: `Follow-up overdue: ${esc(f.type || '')} — ${esc(f.supplierName || '')}`, v: 'followups' });
  });
  store.disputes.forEach(d => {
    if (['Open', 'Escalated'].includes(d.status)) items.push({ t: 'bad', txt: `Open dispute <strong>${esc(d.code || '')}</strong> — ${esc(d.reason || '')} — ${money(d.amount)}`, v: 'disputes' });
  });
  store.suppliers.forEach(s => {
    if (['Pending Approval', 'Pending Verification'].includes(s.status)) items.push({ t: 'warn', txt: `Supplier <strong>${esc(s.name || '')}</strong> is awaiting approval`, v: 'suppliers' });
  });

  if (!items.length) return `<div class="empty-state"><i class="fa-solid fa-circle-check"></i><h4>Nothing requires attention</h4><p>All invoices, deliveries, contracts and documents are within acceptable limits.</p></div>`;

  return `<div style="display:flex;flex-direction:column;gap:.45rem;max-height:280px;overflow:auto">
    ${items.slice(0, 40).map(i => `
      <div style="display:flex;align-items:center;gap:.7rem;padding:.55rem .75rem;border-radius:10px;background:#101a27;border-left:3px solid ${i.t === 'bad' ? '#f87171' : '#fbbf24'}">
        <i class="fa-solid ${i.t === 'bad' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation'}" style="color:${i.t === 'bad' ? '#f87171' : '#fbbf24'}"></i>
        <span style="font-size:.82rem;color:#c8d8ec;flex:1">${i.txt}</span>
        <button class="btn btn-ghost btn-sm" data-act="go" data-view="${i.v}">Open</button>
      </div>`).join('')}
  </div>`;
}

function viewPayables(){
  const open = store.invoices.filter(i => i.status !== 'Cancelled' && num(i.balance) > 0.009);
  const buckets = { current: 0, d1: 0, d2: 0, d3: 0, d4: 0 };
  open.forEach(i => {
    const days = i.dueDate ? daysBetween(i.dueDate, today()) : 0;
    const b = num(i.balance);
    if (days <= 0) buckets.current += b;
    else if (days <= 30) buckets.d1 += b;
    else if (days <= 60) buckets.d2 += b;
    else if (days <= 90) buckets.d3 += b;
    else buckets.d4 += b;
  });
  const total = buckets.current + buckets.d1 + buckets.d2 + buckets.d3 + buckets.d4;

  const bySupplier = {};
  open.forEach(i => {
    const k = i.supplierName || supplierName(i.supplierId);
    bySupplier[k] = (bySupplier[k] || 0) + num(i.balance);
  });
  const supRows = Object.keys(bySupplier).sort((a, b) => bySupplier[b] - bySupplier[a]);

  return `
  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-scale-unbalanced" style="color:#38bdf8;margin-right:.5rem"></i>Supplier Accounts Payable</h1>
      <p>Outstanding supplier liabilities analysed by ageing bucket and by supplier.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" data-act="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button>
      <button class="btn btn-outline btn-sm" data-act="print"><i class="fa-solid fa-print"></i> Print</button>

  </div>

function afterPayables(){
  const open = store.invoices.filter(i => i.status !== 'Cancelled' && num(i.balance) > 0.009);
  const b = { current: 0, d1: 0, d2: 0, d3: 0, d4: 0 };
  open.forEach(i => {
    const days = i.dueDate ? daysBetween(i.dueDate, today()) : 0;
    const bal = num(i.balance);
    if (days <= 0) b.current += bal;
    else if (days <= 30) b.d1 += bal;
    else if (days <= 60) b.d2 += bal;
    else if (days <= 90) b.d3 += bal;
    else b.d4 += bal;
  });
  const c1 = $('#chAging');
  if (c1) drawDoughnut(c1, ['Current', '1–30 Days', '31–60 Days', '61–90 Days', '90+ Days'],
    [b.current, b.d1, b.d2, b.d3, b.d4], ['#34d399', '#fbbf24', '#fb923c', '#f87171', '#dc2626']);

  const bySupplier = {};
  open.forEach(i => { const k = i.supplierName || supplierName(i.supplierId); bySupplier[k] = (bySupplier[k] || 0) + num(i.balance); });
  const keys = Object.keys(bySupplier).sort((a, b2) => bySupplier[b2] - bySupplier[a]).slice(0, 8);
  const c2 = $('#chApSup');
  if (c2) drawHBarChart(c2, keys, keys.map(k => bySupplier[k]), '#f87171');
}

function viewStatement(){
  const sups = store.suppliers.slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const sel = state.stmtSupplier || (sups[0] ? sups[0]._id : '');
  const sup = sups.find(s => s._id === sel);

  let html = `
  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-scroll" style="color:#38bdf8;margin-right:.5rem"></i>Supplier Statement</h1>
      <p>Full transaction history for a supplier — purchases, payments and running balance.</p>
    </div>
    <div class="page-actions">
      <select class="input" data-act="pick-supplier" data-target="stmtSupplier" style="min-width:250px">
        <option value="">— Select Supplier —</option>
        ${sups.map(s => `<option value="${s._id}" ${s._id === sel ? 'selected' : ''}>${esc(s.name)} (${esc(s.code || '')})</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" data-act="print"><i class="fa-solid fa-print"></i> Print</button>
    </div>
  </div>`;

  if (!sup){
    return html + `<div class="empty-state"><i class="fa-solid fa-truck-field"></i><h4>No supplier selected</h4><p>Add suppliers and create purchase orders and payments to generate a statement.</p></div>`;
  }

  const txns = [];
  store.purchaseOrders.filter(p => p.supplierId === sel || p.supplierName === sup.name).forEach(p => {
    txns.push({ date: p.date || p.createdAt, ref: p.code, desc: 'Purchase Order' + (p.project ? ' — ' + p.project : ''), debit: num(p.total), credit: 0 });
  });
  store.invoices.filter(i => i.supplierId === sel || i.supplierName === sup.name).forEach(i => {
    if (!store.purchaseOrders.some(p => p.code === i.poRef && p.supplierId === sel)){
      txns.push({ date: i.invoiceDate || i.createdAt, ref: i.code || i.supplierInvoiceNo, desc: 'Supplier Invoice', debit: num(i.total), credit: 0 });
    }
  });
  store.payments.filter(p => p.supplierId === sel || p.supplierName === sup.name).forEach(p => {
    txns.push({ date: p.date || p.createdAt, ref: p.code, desc: 'Payment — ' + (p.method || '') + (p.reference ? ' (' + p.reference + ')' : ''), debit: 0, credit: num(p.amount) });
  });
  store.creditNotes.filter(c => c.supplierId === sel || c.supplierName === sup.name).forEach(c => {
    txns.push({ date: c.date || c.createdAt, ref: c.code, desc: 'Credit Note', debit: 0, credit: num(c.amount) });
  });

  txns.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));

  let running = 0;
  const rows = txns.map(t => {
    running += num(t.debit) - num(t.credit);
    return `<tr>
      <td>${fmtDate(t.date)}</td>
      <td class="cell-strong">${esc(t.ref || '')}</td>
      <td>${esc(t.desc || '')}</td>
      <td class="money">${t.debit ? money(t.debit) : '—'}</td>
      <td class="money">${t.credit ? money(t.credit) : '—'}</td>
      <td class="money" style="font-weight:700">${money(running)}</td>
    </tr>`;
  }).join('');

  const totalDebit = txns.reduce((a, t) => a + num(t.debit), 0);
  const totalCredit = txns.reduce((a, t) => a + num(t.credit), 0);

  return html + `
  <div class="card mb">
    <div class="card-title"><i class="fa-solid fa-building"></i> ${esc(sup.name)} <span class="badge ${statusClass(sup.status)}" style="margin-left:.5rem">${esc(sup.status || '')}</span></div>

      <div><div class="cell-sub">Contact</div><div class="cell-strong">${esc(sup.contactPerson || '—')} · ${esc(sup.phone || '—')}</div></div>
      <div><div class="cell-sub">Payment Terms</div><div class="cell-strong">${esc(sup.paymentTerms || '—')}</div></div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="klabel">Opening Balance</div><div class="kval">${money(0)}</div></div>
    <div class="kpi"><div class="klabel">Total Purchases (Debit)</div><div class="kval">${money(totalDebit)}</div></div>
    <div class="kpi ok"><div class="klabel">Total Payments / Credits</div><div class="kval ok">${money(totalCredit)}</div></div>
    <div class="kpi ${running > 0 ? 'bad' : 'ok'}"><div class="klabel">Closing Balance</div><div class="kval ${running > 0 ? 'bad' : 'ok'}">${money(running)}</div></div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fa-solid fa-list-ul"></i> Transaction History</div>
    <div class="table-wrap" style="max-height:none">
      <table class="stmt-table">
        <thead><tr><th>Date</th><th>Reference</th><th>Description</th><th class="money">Debit</th><th class="money">Credit</th><th class="money">Balance</th></tr></thead>
        <tbody>${rows || `<tr class="empty-row"><td colspan="6"><i class="fa-solid fa-file-lines"></i>No transactions recorded for this supplier yet.</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

/* --------------------------------------------------------------------------
   19. SUPPLIER PERFORMANCE
   -------------------------------------------------------------------------- */
function viewPerformance(){
  const rows = store.suppliers.map(s => {
    const pos = store.purchaseOrders.filter(p => p.supplierId === s._id);
    const spend = pos.reduce((a, p) => a + num(p.total), 0);
    const grns = store.grns.filter(g => g.supplierId === s._id);
    let ordered = 0, received = 0, damaged = 0, rejected = 0;
    grns.forEach(g => (g.__items || []).forEach(it => {
      ordered += num(it.ordered); received += num(it.received);
      damaged += num(it.damaged); rejected += num(it.rejected);
    }));
    const onTime = grns.filter(g => {
      const po = store.purchaseOrders.find(p => p.code === g.poRef);
      if (!po || !po.expectedDelivery || !g.date) return false;
      return daysBetween(po.expectedDelivery, g.date) <= 0;
    }).length;
    const returns = store.returns.filter(r => r.supplierId === s._id).length;
    const disputes = store.disputes.filter(d => d.supplierId === s._id).length;
    const accuracy = ordered ? (received / ordered) * 100 : 0;
    const defectRate = received ? ((damaged + rejected) / received) * 100 : 0;
    const onTimeRate = grns.length ? (onTime / grns.length) * 100 : 0;
    return {
      name: s.name, code: s.code, status: s.status, orders: pos.length, spend: spend,
      deliveries: grns.length, accuracy: accuracy, defectRate: defectRate,
      onTimeRate: onTimeRate, returns: returns, disputes: disputes
    };
  }).sort((a, b) => b.spend - a.spend);

  return `
  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-chart-line" style="color:#38bdf8;margin-right:.5rem"></i>Supplier Performance</h1>
      <p>Objective operational indicators derived from actual purchase orders, deliveries, returns and disputes.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" data-act="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button>
      <button class="btn btn-outline btn-sm" data-act="export-performance"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
    </div>
  </div>

  <div class="mini-note"><i class="fa-solid fa-circle-info"></i> Indicators are calculated from recorded transactions only. The more deliveries, returns and disputes you record, the more accurate the analysis becomes.</div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Supplier</th><th>Status</th><th class="money">Orders</th><th class="money">Total Spend</th>
        <th class="money">Deliveries</th><th class="money">Order Accuracy</th><th class="money">Defect Rate</th>
        <th class="money">On-Time Rate</th><th class="money">Returns</th><th class="money">Disputes</th>
      </tr></thead>
      <tbody>
        ${rows.length ? rows.map(r => `
          <tr>
            <td><span class="cell-strong">${esc(r.name)}</span><span class="cell-sub">${esc(r.code || '')}</span></td>
            <td><span class="badge ${statusClass(r.status)}">${esc(r.status || '—')}</span></td>
            <td class="money">${r.orders}</td>
            <td class="money">${money(r.spend)}</td>
            <td class="money">${r.deliveries}</td>
            <td class="money" style="color:${r.accuracy >= 98 ? '#6ee7b7' : (r.accuracy >= 90 ? '#fcd34d' : '#fca5a5')}">${r.accuracy.toFixed(1)}%</td>
            <td class="money" style="color:${r.defectRate <= 2 ? '#6ee7b7' : (r.defectRate <= 8 ? '#fcd34d' : '#fca5a5')}">${r.defectRate.toFixed(1)}%</td>
            <td class="money" style="color:${r.onTimeRate >= 85 ? '#6ee7b7' : (r.onTimeRate >= 60 ? '#fcd34d' : '#fca5a5')}">${r.onTimeRate.toFixed(0)}%</td>
            <td class="money">${r.returns}</td>
            <td class="money">${r.disputes}</td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="10"><i class="fa-solid fa-chart-line"></i>No supplier data available yet.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

        <div class="table-wrap" style="max-height:none;border:none;box-shadow:none">
          <table>
            <tbody>
              ${COLLECTIONS.map(c => `<tr><td style="text-transform:capitalize">${esc(c.replace(/([A-Z])/g, ' $1'))}</td><td class="money">${(store[c] || []).length}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

async function saveSettings(){
  const out = {};
  $$('[data-set]').forEach(el => { out[el.dataset.set] = el.value; });
  try{
    await dbPut('settings/company', out);
    await logAudit('settings', 'company', 'UPDATE', store.settings.company || {}, out, '');
    store.settings.company = out;
    toast('<i class="fa-solid fa-circle-check"></i> Settings saved.', 'ok');
  }catch(e){
    toast('<i class="fa-solid fa-triangle-exclamation"></i> Could not save settings: ' + esc(e.message), 'bad');
  }
}

/* --------------------------------------------------------------------------
   24. CSV EXPORT & DOWNLOAD
   -------------------------------------------------------------------------- */
function download(content, filename, mime){
  const blob = new Blob([content], { type: (mime || 'text/csv') + ';charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('<i class="fa-solid fa-download"></i> Downloaded <strong>' + esc(filename) + '</strong>', 'ok');
}

function toCSV(rows, cols){
  const esc2 = v => `"${String(v === undefined || v === null ? '' : v).replace(/"/g, '""')}"`;
  const head = cols.map(c => esc2(c.l || c.k)).join(',');
  const body = rows.map(r => cols.map(c => {
    const v = c.fmt ? c.fmt(r) : r[c.k];
    return esc2(v);
  }).join(',')).join('\n');
  return head + '\n' + body;
}

function exportModule(modKey){
  const m = MODULES[modKey];
  const rows = getFilteredRows(modKey);
  download(toCSV(rows, m.columns), `${modKey}-${today()}.csv`);
}

function exportCustom(name, rows, cols){
  if (!rows.length){ toast('<i class="fa-solid fa-circle-info"></i> Nothing to export — no records.', 'warn'); return; }
  download(toCSV(rows, cols), `${name}-${today()}.csv`);
}

function runReport(action){
  const C = (k, l, fmt) => ({ k: k, l: l, fmt: fmt });
  switch(action){
    case 'export-suppliers':
      exportCustom('supplier-master', store.suppliers, [
        C('code','Supplier ID'), C('name','Business Name'), C('tradingName','Trading Name'), C('type','Type'),
        C('category','Category'), C('status','Status'), C('contactPerson','Contact Person'), C('phone','Phone'),
        C('whatsapp','WhatsApp'), C('email','Email'), C('county','County'), C('town','Town'),
        C('kraPin','KRA PIN'), C('vatNo','VAT No'), C('legalEntity','Legal Entity'), C('paymentTerms','Payment Terms'),
        C('creditLimit','Credit Limit'), C('rating','Rating'), C('onboardedDate','Date Added')
      ]); break;
    case 'export-active-suppliers':
      exportCustom('active-suppliers', store.suppliers.filter(s => s.status === 'Active'), [
        C('code','Supplier ID'), C('name','Business Name'), C('category','Category'),
        C('contactPerson','Contact Person'), C('phone','Phone'), C('email','Email'), C('paymentTerms','Terms')
      ]); break;
    case 'export-categories':
      exportCustom('supplier-categories', store.suppliers, [
        C('code','Supplier ID'), C('name','Supplier'), C('category','Category'), C('division','Division'), C('status','Status')
      ]); break;
    case 'export-products':
      exportCustom('product-catalogue', store.products, [
        C('code','Product ID'), C('name','Product'), C('supplierName','Supplier'), C('brand','Brand'),
        C('model','Model'), C('category','Category'), C('condition','Condition'), C('unit','Unit'),
        C('supplierPrice','Supplier Price', r => money(r.supplierPrice)),
        C('wholesalePrice','Wholesale Price', r => money(r.wholesalePrice)),
        C('availability','Availability'), C('leadTime','Lead Time'), C('warranty','Warranty')
      ]); break;
    case 'export-pricelist':
      exportCustom('supplier-price-list', store.products, [
        C('name','Product'), C('supplierName','Supplier'), C('condition','Condition'),
        C('supplierPrice','Cost', r => money(r.supplierPrice)),
        C('wholesalePrice','Sell', r => money(r.wholesalePrice)),
        C('margin','Margin', r => money(num(r.wholesalePrice) - num(r.supplierPrice))),
        C('priceUpdated','Price Updated')
      ]); break;
    case 'export-pos':
      exportCustom('purchase-orders', store.purchaseOrders, [
        C('code','PO Number'), C('supplierName','Supplier'), C('date','Date'), C('expectedDelivery','Expected Delivery'),
        C('status','Status'), C('project','Project'), C('division','Division'),
        C('subtotal','Subtotal', r => money(r.subtotal)), C('taxAmount','Tax', r => money(r.taxAmount)),
        C('deliveryCharge','Delivery', r => money(r.deliveryCharge)), C('total','Total', r => money(r.total)),
        C('paymentTerms','Terms')
      ]); break;
    case 'export-pending-pos':
      exportCustom('pending-purchase-orders', store.purchaseOrders.filter(p => !['Closed','Cancelled','Paid'].includes(p.status)), [
        C('code','PO Number'), C('supplierName','Supplier'), C('date','Date'), C('expectedDelivery','Expected'),
        C('status','Status'), C('total','Total', r => money(r.total)), C('project','Project')
      ]); break;
    case 'export-quotes':
      exportCustom('supplier-quotations', store.quotations, [
        C('code','RFQ No'), C('supplierName','Supplier'), C('requestDate','Request Date'), C('validity','Validity'),
        C('status','Status'), C('warranty','Warranty'), C('paymentTerms','Terms'),
        C('deliveryCharge','Delivery', r => money(r.deliveryCharge)), C('total','Total', r => money(r.total)),
        C('expectedDelivery','Expected Delivery')
      ]); break;
    case 'export-grns':
      exportCustom('goods-received', store.grns, [
        C('code','GRN No'), C('poRef','PO Number'), C('supplierName','Supplier'), C('date','Delivery Date'),
        C('receivedBy','Received By'), C('deliveryNote','Delivery Note'), C('status','Status')
      ]); break;
    case 'export-returns':
      exportCustom('supplier-returns', store.returns, [
        C('code','Return No'), C('date','Date'), C('supplierName','Supplier'), C('poRef','PO'), C('grnRef','GRN'),
        C('reason','Reason'), C('amount','Value', r => money(r.amount)), C('status','Status'), C('resolution','Resolution')
      ]); break;
    case 'export-payables':
      exportCustom('supplier-payables', store.invoices.filter(i => num(i.balance) > 0.009 && i.status !== 'Cancelled'), [
        C('code','Invoice ID'), C('supplierInvoiceNo','Supplier Inv No'), C('supplierName','Supplier'),
        C('invoiceDate','Invoice Date'), C('dueDate','Due Date'),
        C('total','Total', r => money(r.total)), C('amountPaid','Paid', r => money(r.amountPaid)),
        C('balance','Balance', r => money(r.balance)),
        C('daysOverdue','Days Overdue', r => r.dueDate ? Math.max(0, daysBetween(r.dueDate, today())) : 0),
        C('status','Status')
      ]); break;
    case 'export-payments':
      exportCustom('supplier-payments', store.payments, [
        C('code','Payment ID'), C('date','Date'), C('supplierName','Supplier'), C('invoiceRef','Invoice'),
        C('poRef','PO'), C('method','Method'), C('reference','Reference'),
        C('amount','Amount', r => money(r.amount)), C('bankAccount','Bank'), C('mpesaAccount','M-Pesa'),
        C('authorizedBy','Authorised By'), C('status','Status')
      ]); break;
    case 'export-monthly': {
      const months = lastMonths(12);
      exportCustom('spending-by-month', months.map(m => ({
        month: m.label + ' ' + m.key.slice(0, 4),
        orders: store.purchaseOrders.filter(p => String(p.date || '').slice(0, 7) === m.key).length,
        value: store.purchaseOrders.filter(p => String(p.date || '').slice(0, 7) === m.key).reduce((a, p) => a + num(p.total), 0)
      })), [C('month','Month'), C('orders','Orders'), C('value','Total Spend', r => money(r.value))]);
      break;
    }
    case 'export-division': {
      const map = {};
      store.purchaseOrders.forEach(p => { const d = p.division || 'Unallocated'; map[d] = (map[d] || 0) + num(p.total); });
      exportCustom('spending-by-division', Object.keys(map).map(k => ({ division: k, value: map[k] })),
        [C('division','Division'), C('value','Total Spend', r => money(r.value))]);
      break;
    }
    case 'export-project': {
      const map = {};
      store.purchaseOrders.forEach(p => { const d = p.project || 'Unallocated'; map[d] = (map[d] || 0) + num(p.total); });
      exportCustom('spending-by-project', Object.keys(map).map(k => ({ project: k, value: map[k] })),
        [C('project','Project'), C('value','Total Spend', r => money(r.value))]);
      break;
    }
    case 'export-serials':
      exportCustom('serial-register', store.serials, [
        C('serial','Serial Number'), C('productName','Product'), C('supplierName','Supplier'), C('poRef','PO'),
        C('grnRef','GRN'), C('cost','Cost', r => money(r.cost)), C('purchaseDate','Purchase Date'),
        C('warranty','Warranty'), C('warrantyExpiry','Warranty Expiry'),
        C('customer','Customer'), C('invoiceRef','Invoice'), C('project','Project'), C('status','Status')
      ]); break;
    case 'export-audit':
      exportCustom('audit-trail', store.auditLog, [
        C('ts','Timestamp'), C('user','User'), C('entity','Entity'), C('action','Action'),
        C('entityId','Record ID'), C('oldValue','Old Value'), C('newValue','New Value'), C('reason','Reason')
      ]); break;
    case 'export-performance': {
      const rows = store.suppliers.map(s => {
        const pos = store.purchaseOrders.filter(p => p.supplierId === s._id);
        const grns = store.grns.filter(g => g.supplierId === s._id);
        let ordered = 0, received = 0, damaged = 0, rejected = 0;
        grns.forEach(g => (g.__items || []).forEach(it => {
          ordered += num(it.ordered); received += num(it.received); damaged += num(it.damaged); rejected += num(it.rejected);
        }));
        return {
          code: s.code, name: s.name, status: s.status, orders: pos.length,
          spend: pos.reduce((a, p) => a + num(p.total), 0), deliveries: grns.length,
          accuracy: ordered ? ((received / ordered) * 100).toFixed(1) + '%' : '—',
          defects: received ? (((damaged + rejected) / received) * 100).toFixed(1) + '%' : '—',
          returns: store.returns.filter(r => r.supplierId === s._id).length,
          disputes: store.disputes.filter(d => d.supplierId === s._id).length
        };
      });
      exportCustom('supplier-performance', rows, [
        C('code','Supplier ID'), C('name','Supplier'), C('status','Status'), C('orders','Orders'),
        C('spend','Total Spend', r => money(r.spend)), C('deliveries','Deliveries'),
        C('accuracy','Order Accuracy'), C('defects','Defect Rate'), C('returns','Returns'), C('disputes','Disputes')
      ]); break;
    }
    default:
      toast('<i class="fa-solid fa-circle-info"></i> Report not available.', 'warn');
  }
}

/* --------------------------------------------------------------------------
   25. EVENT HANDLING
   -------------------------------------------------------------------------- */
function onMainClick(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const mod = el.dataset.mod;
  const id = el.dataset.id;

  switch(act){
    case 'new': openForm(mod, null); break;
    case 'edit': openForm(mod, id); break;
    case 'delete': deleteRecord(mod, id); break;
    case 'export': exportModule(mod); break;
    case 'refresh':
      (async () => { await loadAll(true); renderApp(); })();
      break;
    case 'print': window.print(); break;
    case 'go': go(el.dataset.view); break;
    case 'pick-rfq': state.compareRfq = el.dataset.rfq; renderApp(); break;
    case 'save-settings': saveSettings(); break;
    default:
      if (act && act.indexOf('export-') === 0) runReport(act);
  }
}

function onMainInput(e){
  const s = e.target.closest('[data-search]');
  if (s){
    const key = s.dataset.search;
    state.search[key] = s.value;
    if (MODULES[key]){
      const tb = document.getElementById('tbody-' + key);
      if (tb) tb.innerHTML = tableBodyHTML(key);
      const cnt = document.getElementById('count-' + key);
      if (cnt) cnt.textContent = getFilteredRows(key).length + ' record(s)';
    } else {
      // custom views with search (audit)
      clearTimeout(window.__sTimer);
      window.__sTimer = setTimeout(() => renderApp(), 350);
    }
  }
}

function onMainChange(e){
  const f = e.target.closest('[data-filter]');
  if (f){
    const key = f.dataset.filter;
    state.filter[key] = f.value;
    const tb = document.getElementById('tbody-' + key);
    if (tb) tb.innerHTML = tableBodyHTML(key);
    const cnt = document.getElementById('count-' + key);
    if (cnt) cnt.textContent = getFilteredRows(key).length + ' record(s)';
    return;
  }
  const sp = e.target.closest('[data-act="pick-supplier"]');
  if (sp){
    state[sp.dataset.target] = sp.value;
    renderApp();
  }
}

function onModalClick(e){
  const el = e.target.closest('[data-act]');
  const backdrop = e.target.closest('[data-act="backdrop"]');

  if (backdrop && e.target === backdrop){ closeModal(); return; }
  if (!el) return;

  const act = el.dataset.act;
  switch(act){
    case 'close-modal': closeModal(); break;
    case 'save-form': saveForm(el.dataset.mod, el.dataset.id || null); break;
    case 'add-item': {
      const editor = el.closest('.items-editor');
      const cols = ITEM_SCHEMAS[editor.dataset.schema];
      const tbody = editor.querySelector('[data-items-body]');
      tbody.insertAdjacentHTML('beforeend', itemRowHTML(cols, {}));
      break;
    }
    case 'del-item': {
      const tr = el.closest('tr');
      const editor = el.closest('.items-editor');
      const tbody = editor.querySelector('[data-items-body]');
      if (tbody.children.length > 1){ tr.remove(); recalcItems(editor.closest('.modal-body')); }
      else tr.querySelectorAll('input').forEach(i => i.value = '');
      break;
    }
  }
}

function onModalInput(e){
  const root = e.target.closest('.modal-body');
  if (!root) return;
  if (e.target.matches('[data-item-col]')) recalcItems(root);
}

function onModalChange(e){
  // Auto-fill supplier name when a supplier is selected
  const sel = e.target.closest('[data-field="supplierId"]');
  if (sel){
    const root = sel.closest('.modal-body');
    const nameInput = root.querySelector('[data-field="supplierName"]');
    const sup = store.suppliers.find(s => s._id === sel.value);
    if (nameInput && sup) nameInput.value = sup.name;
  }
  const psel = e.target.closest('[data-field="productId"]');
  if (psel){
    const root = psel.closest('.modal-body');
    const pname = root.querySelector('[data-field="productName"]');
    const p = store.products.find(x => x._id === psel.value);
    if (pname && p) pname.value = p.name;
  }
}

/* --------------------------------------------------------------------------
   26. BOOTSTRAP
   -------------------------------------------------------------------------- */
async function boot(){
  // user selector
  const up = $('#userPick');
  up.value = state.user;
  up.addEventListener('change', () => {
    state.user = up.value;
    localStorage.setItem('ngt_user', up.value);
    toast('<i class="fa-solid fa-user"></i> Active user set to <strong>' + esc(state.user) + '</strong>', 'ok');
  });

  // sidebar navigation
  $('#sidebar').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (item) go(item.dataset.view);
  });

  // mobile menu
  $('#menuToggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

  // delegated events
  const main = $('#main');
  main.addEventListener('click', onMainClick);
  main.addEventListener('input', onMainInput);
  main.addEventListener('change', onMainChange);

  const mr = $('#modalRoot');
  mr.addEventListener('click', onModalClick);
  mr.addEventListener('input', onModalInput);
  mr.addEventListener('change', onModalChange);

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // initial render
  renderApp();

  // load data
  setConn('', 'Connecting…');
  const ok = await loadAll(false);
  if (ok) setConn('online', 'Realtime Connected');
  renderApp();

  // realtime sync
  startRealtime();
}

document.addEventListener('DOMContentLoaded', boot);
